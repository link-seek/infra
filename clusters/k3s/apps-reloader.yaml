# Flux Kustomization: reloader（stakater/reloader，SWR 重打镜像，不造轮子）。
# SOPS+Flux 终局的自动 rollout 执行器：Secret（SOPS 解密落地）一变即按注解重启 Deployment。
# 策略 annotations：只动带 reloader.stakater.com/auto=true 的 Deployment，不影响其它栈。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/reloader
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
