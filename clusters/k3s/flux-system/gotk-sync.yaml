# Gitless GitOps：从 SWR 拉 infra OCI 制品，避免 Flux 直连 github.com（DNS 污染/TLS 超时）。
# 由 flux-artifact workflow 在每次 push main 时 `flux push artifact` 到 SWR。
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m0s
  url: oci://swr.cn-north-9.myhuaweicloud.com/link-seek/infra-manifests
  ref:
    tag: latest
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/k3s
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
