# Flux Kustomization: opencode-team 部门共用实例（trial，双独立 Pod）。
# 由 flux-system（path ./clusters/k3s）收编 → 自动建对账链。
# manifest 同仓 docker-images k8s/opencode-team（#461）；tag 即行为版本，首 bake 后改 digest pin。
# Secret（opencode-team-env）不进仓不归 Flux：Flux 对账前先经 pipeline mint，缺 Secret 时 pod 报 CreateContainerConfigError，属预期。
# Secret 走 Infisical Operator（k8s/infisical-apps/opencode-team.yaml）同步，仓库不留密文。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opencode-team
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/opencode-team
  prune: true
  sourceRef:
    kind: OCIRepository
    name: docker-images
  wait: false
