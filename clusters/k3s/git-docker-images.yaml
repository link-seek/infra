# Flux source（Gitless）：从 SWR 拉 docker-images OCI 制品（应用清单跟镜像走）。
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: docker-images
  namespace: flux-system
spec:
  interval: 5m0s
  url: oci://swr.cn-north-9.myhuaweicloud.com/link-seek/docker-images-manifests
  ref:
    tag: latest
