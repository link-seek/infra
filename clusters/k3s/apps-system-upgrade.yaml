# Flux Kustomization: system-upgrade-controller + k3s 升级 Plan。
# SWR 镜像已就绪（2026-11-23），已解锁；Plan version 与现网一致，不会触发升级。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/system-upgrade
  prune: true
  suspend: false
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: false
