apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencode-xieyucheng
  namespace: flux-system
spec:
  interval: 5m0s
  chartRef:
    kind: OCIRepository
    name: opencode-chart
    namespace: flux-system
  targetNamespace: opencode-xieyucheng
  storageNamespace: opencode-xieyucheng
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFiles:
    - values-xieyucheng.yaml
  values:
    # digest pin（唯一需手动物料 bump 处；结构全部走 chart 内 values-xieyucheng.yaml）。
    image:
      digest: sha256:4334606278b024d91c654a4e2fadb4cca767a7f1d3c4c66e4208b9f573e13cd4
    browserless:
      image:
        digest: sha256:d9040011a12b23af21637e21be2b22e6ba144ad4b5f458dbc803a367aca9e92d
