apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencode-team
  namespace: flux-system
spec:
  interval: 5m0s
  chartRef:
    kind: OCIRepository
    name: opencode-chart
    namespace: flux-system
  targetNamespace: opencode-team
  storageNamespace: opencode-team
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    namespace: opencode-team
    appName: opencode
    appLabel: opencode-team
    image:
      repository: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-team
      digest: sha256:1e801ee4986eb976ece8abb35cf2b20f28cb95c6c3d9942df70ac2a5305b0350
    env:
    - name: PIPELINE_MANAGED
      value: 'true'
    - name: TMPDIR
      value: /tmp
    - name: LITELLM_BASE_URL
      value: http://litellm-gateway.litellm.svc.cluster.local:4000
    - name: SSH_TARGETS
      value: mesh-hw-21 mesh-hw-41
    - name: SMTP_HOST
      value: smtp.163.com
    - name: SMTP_PORT
      value: '465'
    - name: SMTP_USER
      value: 122306789@163.com
    - name: SMTP_FROM
      value: 122306789@163.com
    - name: MAIL_DEFAULT_TO
      value: xieyucheng@outlook.com
    - name: BROWSER_CDP_URL
      value: ws://browserless.opencode-team.svc.cluster.local:3000/chromium
    - name: OPEN_DESIGN_BROWSER_URL
      value: http://browserless.opencode-team.svc.cluster.local:3000
    - name: LITELLM_API_KEY
      secretKey: LITELLM_API_KEY
    - name: MAAS_KEY
      secretKey: MAAS_KEY
    - name: OBS_AK
      secretKey: OBS_AK
    - name: OBS_SK
      secretKey: OBS_SK
    - name: OBS_ENDPOINT
      value: https://obs.cn-north-9.myhuaweicloud.com
    - name: GH_TOKEN
      secretKey: GH_TOKEN
    - name: OPENCODE_SERVER_PASSWORD
      secretKey: OPENCODE_SERVER_PASSWORD
    - name: V100_SSH_KEY
      secretKey: V100_SSH_KEY
    - name: OPENCODE_SERVER_USERNAME
      value: team
    - name: COGNEE_BROKER_URL
      value: http://cognee-token-broker.cognee-trial.svc.cluster.local:8787
    - name: COGNEE_BROKER_TOKEN
      secretKey: COGNEE_BROKER_TOKEN
    - name: CLOUDFLARE_API_TOKEN
      secretKey: CLOUDFLARE_API_TOKEN
    - name: CF_AI_TOKEN
      secretKey: CF_AI_TOKEN
    - name: SMTP_PASS
      secretKey: SMTP_PASS
    browserless:
      enabled: true
      replicas: 1
      image:
        repository: swr.cn-north-9.myhuaweicloud.com/link-seek/browserless-chrome-cjk
        digest: sha256:d9040011a12b23af21637e21be2b22e6ba144ad4b5f458dbc803a367aca9e92d
      concurrent: 20
      queued: 20
    tmpdir: true
    rootHomeSeed: true
    privilegedSsh: true
    features:
      cognee: true
      obsutil: true
      hcloud: false
    gitUser: opencode-team
    nodeHostname: ecs-ies-euleros-jmupervm-zhangzhirui
    workHostPath: /var/lib/opencode-team/work
    dataHostPath: /var/lib/opencode-team/data
    cogneeMcpRev: 9437d3ea
    vpc:
      enabled: true
      httpPort: 44097
      sshPort: 2222
    ingress:
      enabled: true
      name: team-agent-staging-tls
      hosts:
      - team-agent.xieyucheng.top
      - team-agent.internal.linkseek.net.cn
      annotations:
        route-comment: staging DNS-01 via IngressRoute (Ingress provider can't store
          LE certs)
    rbac:
      create: true
      pvc: true
