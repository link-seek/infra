apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencode-team
  namespace: flux-system
spec:
  interval: 5m0s
  chartRef:
    kind: OCIRepository
    name: opencode-chart
    namespace: flux-system
  targetNamespace: opencode-team
  storageNamespace: opencode-team
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFiles:
    - values-team.yaml
  values:
    # digest pin（唯一需手动物料 bump 处；结构全部走 chart 内 values-team.yaml）。
    image:
      digest: sha256:40380fab65ab05cbce7fded42ed4ed2fb92a2f6f07c31cf2dd2b2539d15f9943
    browserless:
      image:
        digest: sha256:d9040011a12b23af21637e21be2b22e6ba144ad4b5f458dbc803a367aca9e92d
