# Flux Kustomization: tailscale-operator（官方 operator，SWR 镜像，不造轮子）。
# 去容器 TS 身份的前提：身份从 pod 内迁到 operator 代理。
# operator-oauth Secret 不进仓，由 k3s-operator-oauth.yml 现场签发。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/tailscale-operator
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: false
