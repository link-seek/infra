# Flux Kustomization: traefik-edge 试点 Service（kube-system 内 NodePort，infra 仓自带）。
# 由 flux-system（path ./clusters/k3s）收编。切流完成即删本文件＋k8s/traefik-edge（见上注释）。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-edge
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/traefik-edge
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: false
