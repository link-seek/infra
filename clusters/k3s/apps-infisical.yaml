# Flux Kustomization: infisical（自建密钥管理，P0 底座）。
# 由 flux-system（path ./clusters/k3s）收编。
# Secret infisical-env 不进仓（集群内一次性建）。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/infisical
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: false
