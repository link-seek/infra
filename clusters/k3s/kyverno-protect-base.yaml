---
# Backstop: nobody except the Flux controllers, the node/control-plane system
# identities and human cluster-admins may mutate base namespaces or write
# cluster-scoped objects. Agent identities have no bindings there anyway
# (RBAC default-deny); this policy survives even a leaked kubeconfig/admin
# token scoped to the wrong hands. Admission-only: never touches existing
# objects.
#
# 2026-11-27 outage hardening (#949) — do not widen without reading this:
# 1. matchConstraints is ["*"] = MAIN resources only. Subresources
#    (pods/status, nodes/status, pods/binding, ...) are structurally
#    excluded: the 2026-11-27 node-NotReady incident proved (a) Kyverno's
#    vpol engine mis-evaluates identity exemptions on subresource requests
#    (kube-controller-manager's markAllPodsNotReady was denied despite an
#    explicit exemption; CLI tests pass, live admission denies), and (b)
#    gating kubelet/node-lifecycle status writes with a fail-closed webhook
#    deadlocks the cluster when the webhook is slow/down. Runtime mechanics
#    must never depend on an admission webhook.
# 2. System identities are exempt for main resources: kubelet
#    (system:nodes group: leases, events), kube-controller-manager
#    (endpoints/endpointslices, PV/PVC protection), kube-scheduler,
#    cloud-controller-manager — both the k3s cert CN forms and the
#    system: forms, because k3s component kubeconfigs vary by version.
#    RBAC (Node authorizer, controller ClusterRoles) remains their real
#    gate; these exemptions only stop this backstop from breaking cluster
#    mechanics.
# 3. kube-system is intentionally NOT in baseNamespaces: Kyverno excludes it
#    (and its own namespace) at the webhook level; kube-system stays
#    protected by RBAC default-deny (verified: agent SAs have zero grants).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: protect-base-namespaces
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: infra
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
  variables:
    - name: baseNamespaces
      expression: "['kube-public', 'kube-node-lease', 'flux-system', 'kyverno']"
    # Storage provisioners write cluster-scoped PVs; the binder SA and the
    # kube-controller-manager (PV/PVC protection controllers) complete the set.
    - name: trustedControllers
      expression: >-
        ['system:serviceaccount:flux-system:source-controller',
         'system:serviceaccount:flux-system:kustomize-controller',
         'system:serviceaccount:flux-system:helm-controller',
         'system:serviceaccount:flux-system:notification-controller',
         'system:serviceaccount:flux-system:image-reflector-controller',
         'system:serviceaccount:flux-system:image-automation-controller',
         'system:serviceaccount:kube-system:local-path-provisioner-service-account',
         'system:serviceaccount:nfs:nfs-provisioner',
         'system:serviceaccount:kube-system:persistent-volume-binder',
         'system:kube-controller-manager',
         'kube-controller-manager',
         'system:kube-scheduler',
         'kube-scheduler',
         'k3s-cloud-controller-manager',
         'system:cloud-controller-manager']
  validations:
    # has() guard: request.namespace is absent on cluster-scoped objects;
    # absent namespace + non-exempt caller falls through to deny.
    - expression: >-
        variables.trustedControllers.exists(u, u == request.userInfo.username)
        || request.userInfo.groups.exists(g, g == 'system:masters')
        || request.userInfo.groups.exists(g, g == 'system:serviceaccounts:kyverno')
        || request.userInfo.groups.exists(g, g == 'system:nodes')
        || (has(request.namespace) && request.namespace != ''
            && !(variables.baseNamespaces.exists(ns, ns == request.namespace)))
      message: >-
        Protected namespaces (kube-public, kube-node-lease, flux-system, kyverno)
        are Flux-managed: humans change them via repo PR, agents must not touch
        them. Cluster-scoped writes are restricted to Flux, the storage
        provisioners, kyverno itself and cluster-admins. System components
        (kubelet, kube-controller-manager, scheduler, cloud-controller) are
        exempt — RBAC is their real gate.
