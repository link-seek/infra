---
# Backstop: nobody except the Flux controllers and human cluster-admins may
# mutate base namespaces. Agent identities have no bindings there anyway (RBAC
# default-deny); this policy survives even a leaked kubeconfig/admin token
# scoped to the wrong hands — only the listed controller SAs + system:masters
# pass. Admission-only: never touches existing objects.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: protect-base-namespaces
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: infra
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*/*"]
  variables:
    - name: baseNamespaces
      # NOTE: kube-system is intentionally NOT listed: Kyverno excludes it (and
      # its own namespace) at the webhook level to avoid breaking core control-plane
      # writes (leader election, GC). kube-system stays protected by RBAC default-deny
      # (verified: agent SAs have zero grants there).
      expression: "['kube-public', 'kube-node-lease', 'flux-system', 'kyverno']"
    - name: fluxControllers
      expression: >-
        ['system:serviceaccount:flux-system:source-controller',
         'system:serviceaccount:flux-system:kustomize-controller',
         'system:serviceaccount:flux-system:helm-controller',
         'system:serviceaccount:flux-system:notification-controller',
         'system:serviceaccount:flux-system:image-reflector-controller',
         'system:serviceaccount:flux-system:image-automation-controller']
  validations:
    - expression: >-
        variables.fluxControllers.exists(u, u == request.userInfo.username)
        || request.userInfo.groups.exists(g, g == 'system:masters')
        || request.userInfo.groups.exists(g, g == 'system:serviceaccounts:kyverno')
        || (request.namespace != ''
            && !(variables.baseNamespaces.exists(ns, ns == request.namespace)))
      message: >-
        Protected namespaces (kube-public, kube-node-lease, flux-system, kyverno;
        kube-system is RBAC-protected, Kyverno cannot cover it by design) are
        Flux-managed: humans change them via repo PR, agents must not touch them.
        Cluster-scoped writes are likewise restricted. Only Flux controllers,
        kyverno itself and cluster-admins may write here.
