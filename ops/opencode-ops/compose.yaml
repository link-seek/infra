# opencode-ops —— K3S 维护台（HW21 宿主机 docker，最佳实践姿势）
#
# 设计：docker-ce(华为镜像站, cgroup v2 OK) + docker compose v2 + systemd。
#   - 应用真相 = 本 compose.yaml；镜像 digest/tag 单点 pin 在 ops/opencode-ops/VERSION。
#   - 守护 = systemd 包 `docker compose up -d`；compose restart: unless-stopped 兜底。
#   - 与 k3s 共存：daemon.json 关 iptables/bridge（容器 network_mode: host）。
#   - kubeconfig 只读挂宿主 k3s.yaml；SSH 复用宿主 mesh_id；数据卷持久化。
# 下发：`.github/workflows/opencode-ops-deploy.yml`（push ops/opencode-ops/** 或手动 dispatch）。
services:
  opencode-ops:
    image: ${OPENCODE_OPS_IMAGE:-swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-ops:${OPENCODE_OPS_TAG:?set in /etc/opencode-ops/.env}}
    container_name: opencode-ops
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/opencode-ops/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:4097/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    volumes:
      - /etc/opencode-ops:/etc/opencode-ops:ro
      - /var/lib/opencode-ops:/root/.local/share/opencode
      - /var/lib/opencode-ops/workspace:/workspace
      - /etc/rancher/k3s/k3s.yaml:/etc/opencode-ops/kubeconfig:ro
      - /root/.ssh/mesh_id:/etc/opencode-ops/mesh_id:ro
