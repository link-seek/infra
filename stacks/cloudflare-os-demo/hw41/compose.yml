name: cloudflared-os-demo
services:
  app:
    # 版本 pin（digest）：升级 = 改这行发 PR，合后自动灰度。禁止改回 :latest。
    # 首版占位：bake 首构后填 digest 再合 PR。
    image: swr.cn-north-9.myhuaweicloud.com/link-seek/cloudflared-os-demo@sha256:cfe24a21570336277e462c8308681eabf9c3ff3125983cbc4c048c0ddce61286
    pull_policy: always
    container_name: cloudflared-os-demo
    hostname: cloudflared-os-demo
    init: true
    restart: unless-stopped
    networks:
      - cfos-net
    # 无 ports：Caddy 经 tailnet 直打容器身份（cfos-demo:8788），零宿主端口占用。
    # 排障走宿主机 docker exec（goss 同）。
    env_file:
      - .env
    volumes:
      # run-local 状态（.wrangler 在上游子目录）：重建不丢会话。
      - wrangler-state:/app/cloudflare-os/.wrangler
networks:
  cfos-net:
volumes:
  wrangler-state:
