# litellm_config.yaml（infra 版，无真值）
#
# 模型表与线上 /root/litellm-guard/litellm_config.yaml 逐条对账（2026-10-15 取证 run 38731186781，
# 45 条＋embedding；线上注释掉的 go-spark-b 未收）。api_key 全改 os.environ 引用，
# 密钥只活在目标机 .env（600，sops 下发）。space-bunny-free 上游已死（见 guard-rules#4），
# 此处原样保留保证 parity，删不删由切流 PR 定。
general_settings:
  drop_params: true
  forward_client_headers_to_llm_api: true  # 必开：透传 x-opencode-session 给 go 后端路由
litellm_settings:
  request_timeout: 120
  num_retries: 2
  drop_params: true  # 必开且必须放这里：general_settings 下的那份 responses 路径不认
model_list:
- model_name: go-spark
  litellm_params:
    model: openai/glm-5.1
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/GO_BACKEND_KEY
    timeout: 120
