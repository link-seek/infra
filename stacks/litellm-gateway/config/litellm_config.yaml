# 注意：不要加 model_name: "*" 通配——它会把 OpenAI 官方 200+ 模型展开进
# /v1/models 列表造成噪音（CI schema 门会拦）。
# 本地 embedding（本机 ollama 服务，无 key）：
- model_name: nomic-embed-text
  litellm_params:
    model: ollama/nomic-embed-text
    api_base: http://host.docker.internal:11434
    timeout: 120
guardrails:
- guardrail_name: vault
  litellm_params:
    guardrail: vault_guard.SecretVaultGuardrail
    mode: [pre_call, post_call]
    default_on: true
