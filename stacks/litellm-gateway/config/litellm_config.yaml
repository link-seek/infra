# litellm_config.yaml — pass-through 透明代理模式
# litellm 不验证 key、不预置 key，opencode 给什么 key 就拿什么 key 调 opencode.ai/zen/go/v1
# guardrails 保留（vault guard 检密钥泄露）
general_settings:
  drop_params: true
  forward_client_headers_to_llm_api: true
  enforce_user_api_key_auth: false
  pass_through_endpoints:
    - path: /v1/chat/completions
      target: https://opencode.ai/zen/go/v1/chat/completions
      forward_headers: true
    - path: /v1/models
      target: https://opencode.ai/zen/go/v1/models
      forward_headers: true
guardrails:
- guardrail_name: vault
  litellm_params:
    guardrail: vault_guard.SecretVaultGuardrail
    mode: [pre_call, post_call]
    default_on: true
litellm_settings:
  request_timeout: 120
  num_retries: 2
  drop_params: true
