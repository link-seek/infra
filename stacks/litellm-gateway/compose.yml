name: litellm-gateway
# litellm 网关收编栈（PR1：纯文件收编＋校验，不 up）。
# 现网运行体是 HW21 本机 /root/litellm-guard（黑户启动），本栈是它的 git 版。
# 切流（停旧起新）在后续 PR，另配窗口；本栈合后只同步文件到 /root/stacks/litellm-gateway，不碰现网容器。
services:
  litellm-guard:
    # 版本 pin（digest）：升级 = 改这行发 PR，合后按 README 切流步骤执行。禁止改回 :latest。
    # 2026-10-15：沿用 guard-rules e2e 已验证的上游 digest；切流 PR 用线上 docker inspect 对账。
    image: ghcr.io/berriai/litellm@sha256:3def0387871a732a6d18b009576c4bf4313c54d448fa938a58f51cf189d1fa33
    pull_policy: always
    container_name: litellm-guard
    # PID 1 僵尸回收：与 opencode-prod 同一解法（旧栈 380+ 僵尸教训）。
    init: true
    # 4000 绑宿主机回环 + docker 网桥 IP：opencode-prod 等容器经 host.docker.internal
    # （→172.17.0.1）可达；172.19.0.1 覆盖自定义网段。LAN 经 tailscale serve，公网经隧道。
    ports:
      - "127.0.0.1:4000:4000"
      - "172.17.0.1:4000:4000"
      - "172.19.0.1:4000:4000"
    # embedding 走宿主机 ollama：容器内 host.docker.internal 必须可达（网关 500 教训）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DISABLE_ADMIN_UI: "True"
      RULES_FILE: /app/guard-rules.json
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
      - ./guard/vault_guard.py:/app/vault_guard.py:ro
      - ./guard/always_allow_auth.py:/app/always_allow_auth.py:ro
      - ./guard/passthrough_key.py:/app/passthrough_key.py:ro
      - ./guard/guard-rules.json:/app/guard-rules.json:ro
      - ./guard/models-denied.json:/app/models-denied.json:ro
    command: --config /app/config.yaml --port 4000 --host 0.0.0.0
    restart: unless-stopped
    networks:
      # 沿用现网网络名：live 容器在 litellm-guard_default 上，换网会让按容器名连它的服务断
      - gw-net
  # ollama 已退役（2026-10-17：记忆走 ModelArts bge-m3 1024 维，本地 3 天 0 调用；5.57GB 镜像＋数据卷一并清）。
  # 残留卷 infra_ollama-data 由 deploy workflow 显式删除（不用 down -v 避免误伤）。
volumes: {}
  #（占位：ollama-data 已随退役删除，见上）
networks:
  gw-net:
    name: litellm-guard_default   # 与现网同网：容器名解析不变（按 litellm-guard 名可达）
