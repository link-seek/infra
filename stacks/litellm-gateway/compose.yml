name: litellm-gateway
# litellm 网关收编栈（PR1：纯文件收编＋校验，不 up）。
# 现网运行体是 HW21 本机 /root/litellm-guard（黑户启动），本栈是它的 git 版。
# 切流（停旧起新）在后续 PR，另配窗口；本栈合后只同步文件到 /root/stacks/litellm-gateway，不碰现网容器。
services:
  litellm-guard:
    # 版本 pin（digest）：升级 = 改这行发 PR，合后按 README 切流步骤执行。禁止改回 :latest。
    # 2026-10-15：沿用 guard-rules e2e 已验证的上游 digest；切流 PR 用线上 docker inspect 对账。
    # 2026-10-18：自建镜像（guard bake 进镜像，行为=digest）。来源：link-seek/docker-images docker-gateway.yml。
    # 上游 GHCR 无版本 tag，必须 digest pin；升级 = 改这行发 PR。
    image: swr.cn-north-9.myhuaweicloud.com/linkseed/litellm-gateway@sha256:61b9d25475f201995eb75dd0151a852fddc7949eb85bf714f3c52d1f8e7783ff
    pull_policy: always
    container_name: litellm-guard
    # PID 1 僵尸回收：与 opencode-prod 同一解法（旧栈 380+ 僵尸教训）。
    init: true
    # 4000 绑宿主机回环 + docker 网桥 IP：opencode-prod 等容器经 host.docker.internal
    # （→172.17.0.1）可达；172.19.0.1 覆盖自定义网段。LAN 经 tailscale serve，公网经隧道。
    ports:
      - "127.0.0.1:4000:4000"
      - "172.17.0.1:4000:4000"
      - "172.19.0.1:4000:4000"
    # embedding 走宿主机 ollama：容器内 host.docker.internal 必须可达（网关 500 教训）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DISABLE_ADMIN_UI: "True"
      RULES_FILE: /app/guard-rules.json
    # guard/config 全 bake 进镜像（行为=digest），不挂载防漂移。
    command: --config /app/config.yaml --port 4000 --host 0.0.0.0
    restart: unless-stopped
    networks:
      # 沿用现网网络名：live 容器在 litellm-guard_default 上，换网会让按容器名连它的服务断
      - gw-net
  ollama:
    # 本地 embedding（nomic-embed-text，768 维，供记忆/RAG 共用）。
    # 2026-10-15：ollama/ollama 0.40.3 manifest digest；模型第一次 up 后另行 pull（见 README）。
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    pull_policy: always
    container_name: ollama
    # 只绑回环：宿主机用，容器网段经网桥网关 IP（见 docs 说明），不暴露 LAN。
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
volumes:
  ollama-data:
  # 注意：模型可重拉，本卷不进备份（与 trial-* 数据卷不同，见 README）。
networks:
  gw-net:
    name: litellm-guard_default   # 与现网同网：容器名解析不变（按 litellm-guard 名可达）
