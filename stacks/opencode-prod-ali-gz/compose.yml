name: opencode-prod-ali-gz
services:
  opencode-prod:
    # 版本 pin（digest）：升级 = 改这行发 PR，合后自动灰度。禁止改回 :latest。
    image: swr.cn-north-9.myhuaweicloud.com/linkseed/opencode-tools@sha256:5e20e232caf75a42ce030821dc2d5ec2b1de55fd11d7d1e55c87388eecea8a17
    pull_policy: always
    container_name: opencode-prod-ali-gz
    hostname: opencode-prod-ali-gz
    # PID 1 僵尸回收：opencode serve 自身是 PID 1（entrypoint 末尾 exec），不收 git/gh/sleep 孤儿；
    # 旧栈实测堆到 380+ 拖慢新会话。与 browser 服务同一解法。
    init: true
    networks:
      - opencode-net
    # bridge 下容器 localhost 不再是宿主机：宿主机本地服务（如 LiteLLM 网关跑在宿主机上）
    # 请把 LITELLM_BASE_URL 写成 http://host.docker.internal:<port>，不要写 127.0.0.1。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4097:4097"
    env_file:
      - .env
    volumes:
      - prod-work:/workspace
      - prod-data:/root/.local/share/opencode
      # 持久化 tailscaled 状态：容器重建仍复用同一 node key，避免常驻节点被改成 opencode-prod-1。
      - tailscale-state:/var/lib/tailscale
      - ./config/home/.aliyun:/root/.aliyun:ro
      - ./config/home/.oci:/root/.oci:ro
      # 宿主机业务目录映射（无此目录的机器会自动建空目录，老会话缺目录会降级显示）：
      - /root/workspace:/old-workspace
    # 容器自带 userspace tailscaled（不碰 tun / NET_ADMIN），是独立 tailnet 节点：
    #   - 生产节点名 opencode-prod（canary 用 opencode-prod-canary），身份 tag:opencode，
    #     入口 key 由 deliver 现场 mint 后写入 .env 的 TS_JOIN_KEY；
    #   - tailscale up --ssh：人可 tailscale ssh 进容器排障，容器内也可 tailscale ssh 出去；
    #   - --accept-dns=false：保留 Docker 内置 DNS（browser 服务名等），tailscale ssh 仍走 MagicDNS 解析；
    #   - 不再安装 SSH 私钥、不再 ssh-keyscan（SSH_TARGETS 仅文档保留，语义=tailnet hostname）。
    # 注意：entrypoint 里 shell 变量必须写 $$（单个 $ 会被 compose 当插值吃掉）。
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$$PIPELINE_MANAGED" != "true" ]; then
          echo "FATAL: .env not pipeline-managed (PIPELINE_MANAGED!=true). Refusing to start." >&2
          exit 1
        fi
        yes | hcloud configure set --cli-access-key="$$HCLOUD_AK" --cli-secret-key="$$HCLOUD_SK" --cli-region=cn-north-4 >/dev/null 2>&1 || true
        sed -i 's/"agreePrivacy": "false"/"agreePrivacy": "true"/' /root/.hcloud/config.json 2>/dev/null || true
        mkdir -p /var/lib/tailscale /var/run/tailscale
        tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock >/var/log/tailscaled.log 2>&1 &
        i=0
        while [ ! -S /var/run/tailscale/tailscaled.sock ] && [ $$i -lt 30 ]; do
          i=$$((i+1))
          sleep 1
        done
        if [ ! -S /var/run/tailscale/tailscaled.sock ]; then
          echo "FATAL: tailscaled did not start" >&2
          tail -n 50 /var/log/tailscaled.log >&2 || true
          exit 1
        fi
        # 持久化 node key 已进网（Running 且有 IP）时跳过 up：join key 90 天过期后重启仍能起。
        # 状态查不到/不完整则按老逻辑 up（fail-closed）。
        ts_status="$$(tailscale --socket=/var/run/tailscale/tailscaled.sock status --json 2>/dev/null || true)"
        ts_ip="$$(tailscale --socket=/var/run/tailscale/tailscaled.sock ip -4 2>/dev/null | head -n 1 || true)"
        if printf '%s' "$$ts_status" | grep -q '"BackendState"[[:space:]]*:[[:space:]]*"Running"' && [ -n "$$ts_ip" ]; then
          echo "tailscale already Running ($$ts_ip), skip up"
        else
          if [ -z "$${TS_JOIN_KEY:-}" ]; then
            echo "FATAL: TS_JOIN_KEY missing (.env must be rendered by deliver line)." >&2
            exit 1
          fi
          # TS_HOSTNAME 默认 opencode-prod；canary 覆盖成 opencode-prod-canary，避免先占正式节点名。
          if ! timeout 120 tailscale --socket=/var/run/tailscale/tailscaled.sock up --authkey="$$TS_JOIN_KEY" --hostname="$${TS_HOSTNAME:-opencode-prod-ali-gz}" --ssh --accept-routes=false --accept-dns=false; then
            echo "FATAL: tailscale up failed" >&2
            tail -n 50 /var/log/tailscaled.log >&2 || true
            exit 1
          fi
          echo "tailscale up: $$(tailscale --socket=/var/run/tailscale/tailscaled.sock ip -4 2>/dev/null || echo no-ip)"
        fi
        unset TS_JOIN_KEY # key 只在启动 join 时需要，不留在 opencode 进程环境里
        if [ ! -d /workspace/.git ]; then
          git init -b main /workspace >/dev/null 2>&1
          git -C /workspace config user.name opencode-prod
          git -C /workspace config user.email opencode-prod@local
          git -C /workspace commit --allow-empty -m init >/dev/null 2>&1
        fi
        exec opencode "$$@"
      - --
    command: serve --port 4097 --hostname 0.0.0.0
    restart: unless-stopped
    depends_on:
      - browser
  browser:
    # 独立浏览器 sidecar（CDP 协议，opencode-prod 经 agent-browser --cdp 连它）。
    # 默认 north-9 的自研 chrome-cjk（chromedp/headless-shell + 中文字体，中/日/韩截图不乱码），
    # 由 https://github.com/xieyucheng123/chrome-cjk-docker 双推（north-4/north-9），部署机只登 north-9。
    # 备选：chromedp/headless-shell:latest（Docker Hub 公开，但缺 CJK 字体）。
    # 要锁版本就在 .env 写 digest pin，compose 文件无需再改。
    # 版本 pin（digest）：与 tools 同流程，PR 改、合后自动发。
    image: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/chrome-cjk@sha256:4ffc5390fc0df74b80ca44d688b8e5a26dd5da648afd796a0e9a6a57e3a64a27
    pull_policy: always
    container_name: opencode-browser-ali-gz
    networks:
      - opencode-net
    # 9222 只绑宿主机回环：宿主机 curl http://127.0.0.1:9222/json/version 调试用；
    # 容器间走服务名，见 BROWSER_CDP_URL（默认 http://browser:9222）。
    ports:
      - "127.0.0.1:9222:9222"
      # docker0 网关 IP 全版本稳定；headless-shell 拒绝非 IP Host 头，容器内必须用此 IP 直连（见 BROWSER_CDP_URL）
      - "172.17.0.1:9222:9222"
    # headless-shell 官方要求：shm 太小会 BUS_ADRERR 崩溃；init 回收僵尸进程。
    # 来源：https://github.com/chromedp/docker-headless-shell
    shm_size: 2gb
    init: true
    restart: unless-stopped
networks:
  opencode-net:
volumes:
  prod-data:
  prod-work:
  tailscale-state:
