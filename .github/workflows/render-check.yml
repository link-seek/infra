name: render-check

# dotenv 现场 render 的门：map 键集合必须 == .env.example 键集合，
# map 里每个 secret: 后缀必须在对应 workflow 有 S_ 导出。只核键名，不碰值。
# 加 key 三处同改：env-sources.conf → workflow S_ 导出块 → caller secrets 透传。

on:
  pull_request:
    paths: ['stacks/**', 'scripts/render-dotenv.sh', '.github/workflows/deploy-opencode-*.yml', '.github/workflows/cutover-*.yml', '.github/workflows/render-check.yml']
  push:
    branches: [main]
    paths: ['stacks/**', 'scripts/render-dotenv.sh', '.github/workflows/deploy-opencode-*.yml', '.github/workflows/cutover-*.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 键集合对齐（prod）
        run: bash scripts/render-dotenv.sh --map stacks/opencode-prod/env-sources.conf --example stacks/opencode-prod/.env.example --check-only

      - name: 键集合对齐（gateway）
        run: bash scripts/render-dotenv.sh --map stacks/litellm-gateway/env-sources.conf --example stacks/litellm-gateway/.env.example --check-only

      - name: map secret 后缀 ↔ 复用线 secrets + 薄调用透传对齐
        run: |
          set -euo pipefail
          fail=0
          # 约定：map 里 KEY=secret:SUFFIX 要求两处同改——deploy-stack.yml 的 secrets: 声明 SUFFIX，
          # 对应薄调用（deploy-<name>.yml）透传 SUFFIX: ${{ secrets.… }}。只核键名，不碰值。
          for pair in "stacks/opencode-prod/env-sources.conf:.github/workflows/deploy-opencode-prod.yml" "stacks/litellm-gateway/env-sources.conf:.github/workflows/deploy-litellm-gateway.yml"; do
            map="${pair%%:*}"; caller="${pair##*:}"
            suffixes="$(grep -oP '^[^#\s=]+=secret:\K[A-Z_0-9]+' "$map" | sort -u || true)"
            for s in $suffixes; do
              grep -q "^      $s:" .github/workflows/deploy-stack.yml || { echo "EXPORT_MISSING: deploy-stack.yml 的 secrets: 缺 $s（map $map 要它）"; fail=1; }
              grep -q "^      $s:" "$caller" || { echo "EXPORT_MISSING: $caller 缺 $s: 透传（map $map 要它）"; fail=1; }
            done
          done
          [ "$fail" = 0 ] && echo "EXPORT OK" || exit 1
