name: k3s-etcd-obs-backup
# etcd 异机备份（OBS north-9，同 region）：k3s 原生 S3 直传，零中转。
# 链路：k3s 定时快照（6h）→ server 读 kube-system Secret（三元组临时钥匙）→ 直传 OBS。
# 钥匙：CronJob（k8s/etcd-backup）每 6h 从 metadata 取 24h 临时钥匙刷 Secret；HW21 已出局。
# 用法：dispatch mode=deploy（全量下发+验证）；每天定时只跑 verify（新增对象 30h 内必须有）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy=下发+验证；verify=只验"
        required: false
        default: "deploy"
  schedule:
    - cron: "0 1 * * *"
concurrency:
  group: k3s-etcd-obs
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: runner 进 tailnet（ephemeral CI 身份）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:guest"]}}},"expirySeconds":21600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: CI key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-etcd-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
      - name: 下发 RBAC+CronJob（digest 现取现钉）
        if: inputs.mode == 'deploy'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          tar czf /tmp/etcd-bak.tgz k8s/etcd-backup
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          J="ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69"
          $J 'rm -rf /tmp/etcd-bak && mkdir -p /tmp/etcd-bak'
          EOF
          scp -P 2244 -i ~/.ssh/ci_key /tmp/etcd-bak.tgz root@100.91.222.51:/tmp/etcd-bak.tgz
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<EOF
          set -euo pipefail
          echo STAGE-fwd
          scp -o BatchMode=yes -o StrictHostKeyChecking=no /tmp/etcd-bak.tgz root@192.168.1.69:/tmp/etcd-bak.tgz < /dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69 bash -s <<'INNEREOF'
          set -euo pipefail
          rm -rf /tmp/etcd-bak && mkdir -p /tmp/etcd-bak && tar xzf /tmp/etcd-bak.tgz -C /tmp/etcd-bak
          cd /tmp/etcd-bak
          echo STAGE-verify-image
          WANT="\$(grep -oE 'opencode-tools@sha256:[0-9a-f]+' k8s/etcd-backup/cronjob.yaml | head -1 | cut -d: -f2 | cut -c1-12)"
          [ -n "\$WANT" ] || { echo "FAIL: 取不到 cronjob digest"; exit 1; }
          crictl images --digests 2>/dev/null | grep -q "\$WANT" || { echo "FAIL: digest \$WANT 未在 .69 缓存（先 crictl pull 或换节点）"; exit 1; }
          echo "image cached: \$WANT"
          echo STAGE-apply
          kubectl create secret docker-registry swr-pull -n kube-system \
            --docker-server=swr.cn-north-9.myhuaweicloud.com \
            --docker-username="$SWR_LOGIN_USER" --docker-password="$SWR_LOGIN_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/etcd-backup/rbac.yaml
          kubectl apply -f k8s/etcd-backup/refresh-script.yaml
          kubectl apply -f k8s/etcd-backup/cronjob.yaml
          echo RBAC-CRONJOB-OK
          INNEREOF
          EOF
      - name: 首刷 + config 下发 + 滚动重启 + 实传验证
        if: inputs.mode == 'deploy'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          echo STAGE-remote-start
          set -x
          K69="ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69"
          K41="ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.41"
          kexec() { $K69 "kubectl $*" 2>/dev/null || $K41 "kubectl $*"; }
          echo "== 首刷（Secret 先由管理面预建，refresher 只要 get/patch） =="
          $K69 "kubectl create secret generic k3s-etcd-snapshot-s3-config -n kube-system --type=etcd.k3s.cattle.io/s3-config-secret --dry-run=client -o yaml | kubectl apply -f -"
          $K69 "JOB=etcd-s3-refresh-manual-$(date +%s); kubectl create job --from=cronjob/etcd-s3-refresh -n kube-system \$JOB >/dev/null && echo \$JOB > /tmp/refresh-job-name && kubectl wait --for=condition=complete -n kube-system job/\$JOB --timeout=180s"
          LOG="$($K69 "kubectl logs -n kube-system job/\$(cat /tmp/refresh-job-name) --tail=5" | tr -d '\r')"
          echo "$LOG" | grep -q REFRESH-OK || { echo "FAIL: 首刷没过"; echo "$LOG"; exit 1; }
          echo "首刷 OK"
          wait_ready() {
            for i in $(seq 1 20); do
              sleep 15
              READY="$(kexec "get nodes --no-headers" | grep -c ' Ready' || true)"
              READY="$(printf '%s' "$READY" | head -1 | tr -cd '0-9')"; [ -n "$READY" ] || READY=0
              echo "ready=$READY"
              [ "$READY" -ge 2 ] && return 0
            done
            echo "FAIL: quorum 未恢复"; return 1
          }
          apply_config() {
            # $1=IP $2=schedule cron。只用 sed 单引号写文件（不经过 python/argv/heredoc 传值，杜绝截断），写完必验。
            local IP="$1" CRON="$2"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@"$IP" "sed -i 's#^etcd-snapshot-schedule-cron:.*#etcd-snapshot-schedule-cron: \"$CRON\"#' /etc/rancher/k3s/config.yaml"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@"$IP" "grep -q '^etcd-s3: true$' /etc/rancher/k3s/config.yaml || printf 'etcd-s3: true\netcd-s3-config-secret: k3s-etcd-snapshot-s3-config\netcd-s3-retention: 28\n' >> /etc/rancher/k3s/config.yaml"
            LINE="$(ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@"$IP" "grep '^etcd-snapshot-schedule-cron:' /etc/rancher/k3s/config.yaml")"
            [ "$LINE" = "etcd-snapshot-schedule-cron: \"$CRON\"" ] || { echo "FAIL: config 落盘不对: [$LINE]"; exit 1; }
            echo "config ok: $LINE"
            ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@"$IP" "chmod 600 /etc/rancher/k3s/config.yaml && systemctl restart k3s"
          }
          echo "== 测试节拍（*/7）+ S3 开：先 .41 再 .69 =="
          apply_config 192.168.1.41 "*/7 * * * *"
          wait_ready
          apply_config 192.168.1.69 "*/7 * * * *"
          wait_ready
          echo "== 等 S3 client 就绪 =="
          for i in $(seq 1 12); do
            sleep 10
            if $K69 "journalctl -u k3s --since '15 min ago' --no-pager 2>/dev/null | grep -q 'S3 bucket linkseek-k3s-etcd exists'"; then
              echo "S3-CLIENT-OK"; break
            fi
            [ "$i" = 12 ] && { echo "FAIL: S3 client 没起来"; exit 1; }
          done
          echo "== 等一次实传（CR 为证） =="
          for i in $(seq 1 12); do
            sleep 60
            if kexec "get etcdsnapshotfile -o json" 2>/dev/null | python3 -c "
          import json,sys,datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          for it in json.load(sys.stdin).get('items', []):
              loc = ((it.get('spec') or {}).get('location')) or ''
              ts = ((it.get('status') or {}).get('creationTime')) or ((it.get('metadata') or {}).get('creationTimestamp')) or ''
              if loc.startswith('s3://'):
                  try:
                      age = (now - datetime.datetime.fromisoformat(ts.replace('Z','+00:00'))).total_seconds()
                  except Exception:
                      continue
                  if age < 1800:
                      print('fresh-s3-snapshot: ' + loc); sys.exit(0)
          sys.exit(1)"; then
              echo "S3-UPLOAD-OK"; break
            fi
            echo "wait upload... $i/12"
            [ "$i" = 12 ] && { echo "FAIL: 12 分钟没等到 S3 实传"; exit 1; }
          done
          echo "== 切回正式节拍（0 */6 * * *） =="
          apply_config 192.168.1.41 "0 */6 * * *"
          wait_ready
          apply_config 192.168.1.69 "0 */6 * * *"
          wait_ready
          echo "== 清 HW21 旧链 =="
          rm -f /usr/local/bin/k3s-etcd-fetch-upload.sh /etc/cron.d/k3s-etcd-fetch-upload /tmp/k3s-etcd-fetch-upload.sh /tmp/etcd-bak.tgz
          echo DEPLOY-OK
          EOF
      - name: 验（CR + 刷新新鲜度，不碰钥匙值）
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          K69="ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69"
          kexec() { $K69 "kubectl $*" 2>/dev/null || ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.41 "kubectl $*"; }
          echo "== Secret 刷新新鲜度（<12h） =="
          kexec "get secret -n kube-system k3s-etcd-snapshot-s3-config -o jsonpath='{.metadata.annotations.refreshed-at}'" | python3 -c "
          import sys,datetime
          ts = sys.stdin.read().strip()
          age = (datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(ts.replace('Z','+00:00'))).total_seconds()
          print('refreshed-at=' + ts + ' age_h=%.1f' % (age/3600))
          sys.exit(0 if age < 43200 else 1)" || { echo "FAIL: Secret 超 12h 没刷"; exit 1; }
          echo "== S3 快照新鲜度（<30h） =="
          kexec "get etcdsnapshotfile -o json" | python3 -c "
          import json,sys,datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          best = None
          for it in json.load(sys.stdin).get('items', []):
              loc = ((it.get('spec') or {}).get('location')) or ''
              if not loc.startswith('s3://'):
                  continue
              ts = ((it.get('status') or {}).get('creationTime')) or ((it.get('metadata') or {}).get('creationTimestamp')) or ''
              try:
                  age = (now - datetime.datetime.fromisoformat(ts.replace('Z','+00:00'))).total_seconds()
              except Exception:
                  continue
              if best is None or age < best[0]:
                  best = (age, loc)
          if best is None:
              print('FAIL: 没有 S3 快照 CR'); sys.exit(1)
          print('newest s3 snapshot age_h=%.1f %s' % (best[0]/3600, best[1]))
          sys.exit(0 if best[0] < 108000 else 1)" || { echo "FAIL: 30h 内无 S3 快照"; exit 1; }
          echo VERIFY-DONE
          EOF
