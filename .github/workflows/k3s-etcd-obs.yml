name: k3s-etcd-obs-backup
# etcd 异机备份（OBS north-9，同 region）。
# 链路：k3s 定时本地快照（6h，保留 28）→ HW21 每小时拉取→传 OBS（每节点保留 14）。
# 凭证只在 HW21（其 obsutil 已验证 north-9 可写）；k3s 节点不碰云凭证。
# 用法：dispatch 一次 mode=deploy（下发+验证）；之后全自动。mode=verify 只验桶。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy=下发+验证；verify=只验桶"
        required: false
        default: "deploy"
concurrency:
  group: k3s-etcd-obs
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: runner 进 tailnet（ephemeral CI 身份）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:guest"]}}},"expirySeconds":21600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: CI key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-etcd-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
      - name: 下发（清 S3 段 + HW21 拉取脚本 + cron）
        if: inputs.mode == 'deploy'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          scp -P 2244 -i ~/.ssh/ci_key scripts/k3s-etcd-fetch-upload.sh root@100.91.222.51:/tmp/k3s-etcd-fetch-upload.sh
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          for IP in 192.168.1.69 192.168.1.41; do
            echo "== $IP =="
            R="ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@$IP"
            # S3 段已证伪（minio 与 obsutil 钥匙体系不通）：摘掉，只留定时+保留
            $R "grep -v '^etcd-s3' /etc/rancher/k3s/config.yaml > /tmp/k3s.yaml.new && mv /tmp/k3s.yaml.new /etc/rancher/k3s/config.yaml; chmod 600 /etc/rancher/k3s/config.yaml; grep -c '^etcd-' /etc/rancher/k3s/config.yaml"
            # 服务端 obs 残留清理（凭证只留 HW21）
            $R "rm -f /root/.obsutilconfig; ls /usr/local/bin/obsutil >/dev/null 2>&1 && echo obs-bin-keep || true"
            $R "grep -q 'etcd-snapshot-schedule-cron' /etc/rancher/k3s/config.yaml || printf '\netcd-snapshot-schedule-cron: \"0 */6 * * *\"\netcd-snapshot-retention: 28\n' >> /etc/rancher/k3s/config.yaml"
            $R "systemctl restart k3s"
            echo "等 quorum>=2..."
            for i in $(seq 1 20); do
              sleep 15
              READY=$(ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69 "kubectl get nodes --no-headers 2>/dev/null" | grep -c ' Ready' || true)
              READY="$(printf '%s' "$READY" | head -1 | tr -cd '0-9')"; [ -n "$READY" ] || READY=0
              echo "ready=$READY"
              [ "$READY" -ge 2 ] && break
              [ "$i" = 20 ] && { echo "FAIL: quorum 未恢复"; exit 1; }
            done
          done
          echo "== HW21 拉取脚本 + cron =="
          cp /tmp/k3s-etcd-fetch-upload.sh /usr/local/bin/k3s-etcd-fetch-upload.sh
          chmod +x /usr/local/bin/k3s-etcd-fetch-upload.sh
          printf 'SHELL=/bin/bash\nPATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n17 * * * * root /usr/local/bin/k3s-etcd-fetch-upload.sh\n' > /etc/cron.d/k3s-etcd-fetch-upload
          chmod 644 /etc/cron.d/k3s-etcd-fetch-upload
          echo "== 立刻跑一遍验证 =="
          /usr/local/bin/k3s-etcd-fetch-upload.sh
          echo DEPLOY-OK
          EOF
      - name: 验桶（HW21 上验，endpoint 已是 north-4？改走 north-9 视角）
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          cp /root/.obsutilconfig /tmp/oc.bak
          sed -i s#obs.cn-north-4.myhuaweicloud.com#obs.cn-north-9.myhuaweicloud.com# /root/.obsutilconfig
          echo "== 桶里 etcd-auto 下的对象 =="
          OUT="$(obsutil ls obs://linkseek-k3s-etcd/etcd-auto/ 2>/dev/null | grep -E 'etcd-snapshot|on-demand|obs://' || true)"
          cp /tmp/oc.bak /root/.obsutilconfig; rm -f /tmp/oc.bak
          [ -n "$OUT" ] || { echo "FAIL: 桶里没东西"; exit 1; }
          printf '%s\n' "$OUT" | tail -8
          echo VERIFY-DONE
          EOF
