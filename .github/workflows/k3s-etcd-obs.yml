name: k3s-etcd-obs-backup
# etcd 异机备份（OBS north-9，同 region）：k3s 原生 S3 直传，零中转。
# 链路：k3s 定时快照（6h）→ server 读 kube-system Secret（三元组临时钥匙）→ 直传 OBS。
# 钥匙：CronJob（k8s/etcd-backup，经 Flux 下发）每 6h 从 metadata 取 24h 临时钥匙刷 Secret；HW21 已出局。
# 用法：dispatch 即全量下发+验证（RBAC/CronJob 由 Flux 对账，只读验证已删：直接登录集群查看）。
on:
  workflow_dispatch:
    inputs:
      hw69_tail:
        description: ".69 tailnet 地址（直连免跳）"
        required: false
        default: "100.93.119.21"
      hw41_tail:
        description: ".41 tailnet 地址（直连免跳）"
        required: false
        default: "100.73.182.4"
      runner_tag:
        description: "runner 进网身份（需 user 才能登 mesh）"
        required: false
        default: "tag:github"
concurrency:
  group: k3s-etcd-obs
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: runner 进 tailnet（user 身份，直连免跳）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          RTAG="${{ inputs.runner_tag }}"; [ -n "$RTAG" ] || RTAG="tag:github"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d "{\"capabilities\":{\"devices\":{\"create\":{\"reusable\":false,\"ephemeral\":true,\"preauthorized\":true,\"tags\":[\"$RTAG\"]}}},\"expirySeconds\":21600}" \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: CI key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-etcd-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
      - name: 下发 RBAC+CronJob（digest 现取现钉）
        if: github.event_name == 'workflow_dispatch'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          H69="${{ inputs.hw69_tail }}"; [ -n "$H69" ] || H69="100.93.119.21"
          H41="${{ inputs.hw41_tail }}"; [ -n "$H41" ] || H41="100.73.182.4"
          ssh-keyscan -H "$H69" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H "$H41" >> ~/.ssh/known_hosts 2>/dev/null || true
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=no -i ~/.ssh/ci_key"
          tar czf /tmp/etcd-bak.tgz k8s/etcd-backup
          ssh $SOPT "root@$H69" 'rm -rf /tmp/etcd-bak && mkdir -p /tmp/etcd-bak'
          scp $SOPT /tmp/etcd-bak.tgz "root@$H69:/tmp/etcd-bak.tgz"
          ssh $SOPT "root@$H69" bash -s <<'INNEREOF'
          set -euo pipefail
          rm -rf /tmp/etcd-bak && mkdir -p /tmp/etcd-bak && tar xzf /tmp/etcd-bak.tgz -C /tmp/etcd-bak
          cd /tmp/etcd-bak
          echo STAGE-verify-image
          WANT="\$(grep -oE 'opencode-tools@sha256:[0-9a-f]+' k8s/etcd-backup/cronjob.yaml | head -1 | cut -d: -f2 | cut -c1-12)"
          [ -n "\$WANT" ] || { echo "FAIL: 取不到 cronjob digest"; exit 1; }
          if crictl images --digests 2>/dev/null | grep -q "\$WANT"; then echo "image cached: \$WANT"; else echo "WARN: digest \$WANT 未在 .69 缓存（Job 将用 imagePullSecrets 现拉，不阻断；真门禁是后续 REFRESH-OK）"; fi
          echo STAGE-apply
          # RBAC+CronJob 已收进 Flux（k8s/etcd-backup + clusters/k3s/apps-etcd-backup.yaml）；
          # 此处不再 kubectl apply，只等 Flux 对账（声明式唯一真相）。
          echo RBAC-CRONJOB-OK
          INNEREOF
      - name: 首刷 + config 下发 + 滚动重启 + 实传验证
        if: github.event_name == 'workflow_dispatch'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          H69="${{ inputs.hw69_tail }}"; [ -n "$H69" ] || H69="100.93.119.21"; H41="${{ inputs.hw41_tail }}"; [ -n "$H41" ] || H41="100.73.182.4"
          ssh-keyscan -H "$H69" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H "$H41" >> ~/.ssh/known_hosts 2>/dev/null || true
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=no -i ~/.ssh/ci_key"
          K69="ssh -n $SOPT root@$H69"
          K41="ssh -n $SOPT root@$H41"
          kexec() { $K69 "kubectl $*" 2>/dev/null || $K41 "kubectl $*"; }
          echo STAGE-remote-start-direct
          echo "== 首刷（Secret 先由管理面预建，refresher 只要 get/patch） =="
          $K69 "kubectl create secret generic k3s-etcd-snapshot-s3-config -n kube-system --type=etcd.k3s.cattle.io/s3-config-secret --dry-run=client -o yaml | kubectl apply -f -"
          $K69 "JOB=etcd-s3-refresh-manual-$(date +%s); kubectl create job --from=cronjob/etcd-s3-refresh -n kube-system \$JOB >/dev/null && echo \$JOB > /tmp/refresh-job-name && kubectl wait --for=condition=complete -n kube-system job/\$JOB --timeout=180s"
          LOG="$($K69 "kubectl logs -n kube-system job/\$(cat /tmp/refresh-job-name) --tail=5" | tr -d '\r')"
          echo "$LOG" | grep -q REFRESH-OK || { echo "FAIL: 首刷没过"; echo "$LOG"; exit 1; }
          echo "首刷 OK"
          wait_ready() {
            for i in $(seq 1 20); do
              sleep 15
              READY="$(kexec "get nodes --no-headers" | grep -c ' Ready' || true)"
              READY="$(printf '%s' "$READY" | head -1 | tr -cd '0-9')"; [ -n "$READY" ] || READY=0
              echo "ready=$READY"
              [ "$READY" -ge 2 ] && return 0
            done
            echo "FAIL: quorum 未恢复"; return 1
          }
          apply_config() {
            # $1=IP $2=schedule cron。只用 sed 单引号写文件（不经过 python/argv/heredoc 传值，杜绝截断），写完必验。
            local IP="$1" CRON="$2"
            ssh $SOPT root@"$IP" "sed -i 's#^etcd-snapshot-schedule-cron:.*#etcd-snapshot-schedule-cron: \"$CRON\"#' /etc/rancher/k3s/config.yaml"
            ssh $SOPT root@"$IP" "grep -q '^etcd-s3: true$' /etc/rancher/k3s/config.yaml || printf 'etcd-s3: true\netcd-s3-config-secret: k3s-etcd-snapshot-s3-config\netcd-s3-retention: 28\n' >> /etc/rancher/k3s/config.yaml"
            LINE="$(ssh -n $SOPT root@"$IP" "grep '^etcd-snapshot-schedule-cron:' /etc/rancher/k3s/config.yaml")"
            [ "$LINE" = "etcd-snapshot-schedule-cron: \"$CRON\"" ] || { echo "FAIL: config 落盘不对: [$LINE]"; exit 1; }
            echo "config ok: $LINE"
            ssh -n $SOPT root@"$IP" "chmod 600 /etc/rancher/k3s/config.yaml && systemctl restart k3s"
          }
          echo "== 测试节拍（*/7）+ S3 开：先 .41 再 .69（直连 tailnet） =="
          apply_config "$H41" "*/7 * * * *"
          wait_ready
          apply_config "$H69" "*/7 * * * *"
          wait_ready
          echo "== 等 S3 client 就绪 =="
          for i in $(seq 1 12); do
            sleep 10
            if $K69 "journalctl -u k3s --since '15 min ago' --no-pager 2>/dev/null | grep -q 'S3 bucket linkseek exists'"; then
              echo "S3-CLIENT-OK"; break
            fi
            [ "$i" = 12 ] && { echo "FAIL: S3 client 没起来"; exit 1; }
          done
          echo "== 等一次实传（CR 为证） =="
          for i in $(seq 1 12); do
            sleep 60
            if kexec "get etcdsnapshotfile -o json" 2>/dev/null | python3 -c "
          import json,sys,datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          for it in json.load(sys.stdin).get('items', []):
              loc = ((it.get('spec') or {}).get('location')) or ''
              ts = ((it.get('status') or {}).get('creationTime')) or ((it.get('metadata') or {}).get('creationTimestamp')) or ''
              if loc.startswith('s3://'):
                  try:
                      age = (now - datetime.datetime.fromisoformat(ts.replace('Z','+00:00'))).total_seconds()
                  except Exception:
                      continue
                  if age < 1800:
                      print('fresh-s3-snapshot: ' + loc); sys.exit(0)
          sys.exit(1)"; then
              echo "S3-UPLOAD-OK"; break
            fi
            echo "wait upload... $i/12"
            [ "$i" = 12 ] && { echo "FAIL: 12 分钟没等到 S3 实传"; exit 1; }
          done
          echo "== 切回正式节拍（0 */6 * * *） =="
          apply_config "$H41" "0 */6 * * *"
          wait_ready
          apply_config "$H69" "0 */6 * * *"
          wait_ready
          echo "== 清旧链（跳板残留） =="
          rm -f /usr/local/bin/k3s-etcd-fetch-upload.sh /etc/cron.d/k3s-etcd-fetch-upload /tmp/k3s-etcd-fetch-upload.sh /tmp/etcd-bak.tgz
          echo DEPLOY-OK
