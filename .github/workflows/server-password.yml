name: server-password
# 3 台 k3s server 开 root 密码登录（组织 secret PROD_SSH_PASSWORD 是唯一口令源）。
# 背景：排障要直上机看，总图已改（密码SSH放行，钥匙不断，双轨）。
# manual dispatch＋全程盯，一次一台（默认 hw69），幂等：
# 设口令（stdin 进 chpasswd，不落命令行）＋开 PasswordAuthentication＋reload＋双验（钥匙仍通＋口令能登）。
# 口令要求：组织 secrets 建强口令，不要复用聊天里出现过的弱口令。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "目标机（一次一台）"
        required: false
        default: "hw69"
        type: choice
        options: [hw69, hw21, hw41]

permissions:
  contents: read

concurrency:
  group: server-password
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSH_PW: ${{ secrets.PROD_SSH_PASSWORD }}
    steps:
      - name: runner 进 tailnet（user 身份）
        timeout-minutes: 6
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: user key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-sshpw-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false

      - name: 开密码登录＋双验
        run: |
          set -euo pipefail
          [ -n "${SSH_PW:-}" ] || { echo "FAIL: PROD_SSH_PASSWORD 未配（组织 secrets 建强口令）"; exit 1; }
          echo "::add-mask::$SSH_PW"
          case "${{ inputs.target }}" in
            hw69) H="100.93.119.21";; hw21) H="100.100.246.95";; hw41) H="100.73.182.4";;
            *) echo "FAIL: 未知目标"; exit 1;;
          esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          echo "== 设口令（stdin 进 chpasswd） =="
          printf 'root:%s\n' "$SSH_PW" | ssh $SOPT "root@$H" 'chpasswd && echo CHPASSWD-OK'
          echo "== 开 PasswordAuthentication＋reload =="
          ssh $SOPT "root@$H" "grep -q '^PasswordAuthentication yes' /etc/ssh/sshd_config || { sed -i 's/^[#]*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config; grep -q '^PasswordAuthentication' /etc/ssh/sshd_config || echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config; }; grep -q '^PermitRootLogin' /etc/ssh/sshd_config || echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config; sshd -T 2>/dev/null | grep -i '^passwordauthentication' || true; systemctl reload sshd && echo SSHD-RELOADED"
          echo "== 双验：钥匙仍通＋口令能登 =="
          ssh $SOPT "root@$H" 'echo KEY-OK'
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          sshpass -p "$SSH_PW" ssh -o BatchMode=no -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no "root@$H" 'echo PW-OK'
          shred -u ~/.ssh/ci_key || true
          echo PW-LOGIN-OK

      - name: 退出 tailnet（焚毁节点）
        if: always()
        run: sudo tailscale logout || true
