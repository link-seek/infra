name: probe-tunnel-health
on:
  push:
    paths: ['.github/workflows/probe-tunnel-diagnose.yml']
  workflow_dispatch:
concurrency:
  group: probe-tunnel
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 进 tailnet
        timeout-minutes: 6
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_PROD }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TS_AUTHKEY="$(printf '%s' "$TS_AUTHKEY" | tr -d '\r\n ')"
          timeout 120 sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ci-probe-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
      - name: 诊断 HW21 tunnel（只读）
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -p 2244 -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          echo "===== cloudflared.service 状态 ====="
          systemctl is-active cloudflared; systemctl show cloudflared -p ActiveEnterTimestamp --value
          echo "===== 当前 ingress 段 ====="
          sed -n '/^ingress:/,$p' /etc/cloudflared/config.yml
          echo "===== tunnel 连接（用系统内 cloudflared 诊断） ====="
          timeout 20 /usr/bin/cloudflared tunnel info 2>/dev/null | head -20 || echo "tunnel info 不可用"
          echo "===== 本机直连网关（排除应用层） ====="
          curl -s -m 5 -o /dev/null -w "local-4000:%{http_code}\n" http://127.0.0.1:4000/v1/models || echo "local-4000:000"
          echo "===== systemd 日志尾（最近 30 行，找 1033/重复 hostname 报错） ====="
          journalctl -u cloudflared -n 30 --no-pager 2>/dev/null | tail -30 || echo "no journal"
          EOF
      - name: CF token 现签（DNS 读写，2h，fail-closed）
        if: always()
        env:
          CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
        run: |
          set -euo pipefail
          PARENT="$(printf '%s' "${CF_PARENT_TOKEN:-}" | tr -d '\r\n ')"
          [ -n "$PARENT" ] || { echo "FAIL: CF_PARENT_TOKEN 为空"; exit 1; }
          echo "::add-mask::$PARENT"
          MINTED="$(CF_PARENT_TOKEN_SANITIZED="$PARENT" \
            CF_TOKEN_NAME="cf-dns-${{ github.run_id }}" \
            CF_TOKEN_TTL_HOURS=2 \
            CF_PERM_GROUPS="dns read,dns write,zone read" \
            python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          BASE = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ["CF_PARENT_TOKEN_SANITIZED"]
          print("::add-mask::%s" % TOKEN)
          def call(method, path, body=None):
              headers = {"Authorization": "Bearer " + TOKEN}
              data = None
              if body is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(body).encode()
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  try:
                      return exc.code, json.loads(exc.read() or b"{}")
                  except Exception:
                      return exc.code, {}
              except Exception as exc:
                  return 0, {"success": False, "errors": [{"message": str(exc)[:200]}]}
          zone_name = "xieyucheng.top"
          st, r = call("GET", "/zones?name=" + urllib.parse.quote(zone_name))
          if not (isinstance(r, dict) and r.get("success") and r.get("result")):
              print("FAIL: 取 zone/account 失败 status=%s" % st)
              raise SystemExit(1)
          account_id = (r["result"][0].get("account") or {}).get("id")
          if not account_id:
              account_id = os.environ.get("CF_ACCOUNT_ID", "47ce24ced58f17c9fb15351adcbe67d4")
          st, r = call("GET", "/accounts/%s/tokens/permission_groups?per_page=100" % account_id)
          groups = r.get("result") if isinstance(r.get("result"), list) else []
          by_name = {str(g.get("name", "")).lower(): g for g in groups}
          wanted = [x.strip().lower() for x in os.environ["CF_PERM_GROUPS"].split(",") if x.strip()]
          zone_ids = []
          acct_ids = []
          for w in wanted:
              g = by_name.get(w)
              if not g:
                  print("FAIL: permission group 不存在: %s" % w)
                  raise SystemExit(1)
              scopes = g.get("scopes") or []
              if any("account.zone" in str(s) for s in scopes):
                  zone_ids.append(str(g["id"]))
              elif any(str(s) == "com.cloudflare.api.account" for s in scopes):
                  acct_ids.append(str(g["id"]))
              else:
                  zone_ids.append(str(g["id"]))
          policies = []
          if zone_ids:
              policies.append({"effect": "allow",
                  "resources": {"com.cloudflare.api.account.%s" % account_id: {"com.cloudflare.api.account.zone.*": "*"}},
                  "permission_groups": [{"id": i} for i in zone_ids]})
          if acct_ids:
              policies.append({"effect": "allow",
                  "resources": {"com.cloudflare.api.account.%s" % account_id: "*"},
                  "permission_groups": [{"id": i} for i in acct_ids]})
          if not policies:
              print("FAIL: 无可用 policy")
              raise SystemExit(1)
          ttl = int(os.environ.get("CF_TOKEN_TTL_HOURS", "2"))
          expires = (datetime.now(timezone.utc) + timedelta(hours=ttl)).strftime("%Y-%m-%dT%H:%M:%SZ")
          st, r = call("POST", "/accounts/%s/tokens" % account_id, {
              "name": os.environ["CF_TOKEN_NAME"],
              "policies": policies,
              "expires_on": expires,
          })
          if not (isinstance(r, dict) and r.get("success")):
              print("FAIL: CF 现签失败 status=%s errors=%s" % (st, json.dumps(r.get("errors"))[:300] if isinstance(r, dict) else ""))
              raise SystemExit(1)
          value = str((r.get("result") or {}).get("value") or "")
          if not value:
              print("FAIL: CF 现签无值")
              raise SystemExit(1)
          print("::add-mask::%s" % value)
          print("CF_MINTED_VALUE=%s" % value)
          PY
          )"
          CHILD="$(printf '%s' "$MINTED" | grep '^CF_MINTED_VALUE=' | tail -1 | cut -d= -f2-)"
          [ -n "$CHILD" ] || { echo "FAIL: CF 现签未拿到值"; printf '%s\n' "$MINTED"; exit 1; }
          echo "::add-mask::$CHILD"
          echo "CFTOK=$CHILD" >> "$GITHUB_ENV"
          echo "CF 现签 OK（cf-dns-${{ github.run_id }}，2h）"

      - name: CF API 拉 zone DNS 记录
        if: always()
        run: |
          ZID="$(curl -s -H "Authorization: Bearer $CFTOK" 'https://api.cloudflare.com/client/v4/zones?name=xieyucheng.top' | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else 'NONE')")"
          echo "zid=$ZID"
          curl -s -H "Authorization: Bearer $CFTOK" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=50" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['type'], r['name'], 'proxied='+str(r['proxied']), r['content'][:55]) for r in d.get('result',[])]" || echo 'CF API FAIL'
      - name: cloudflared 托管模式判定
        run: |
          echo '(本地诊断；systemd 单元是否远程托管看 ExecStart 是否带 --config)'
          systemctl cat cloudflared 2>/dev/null | grep -E 'ExecStart|Environment' | head -5 || true
