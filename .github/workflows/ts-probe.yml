name: ts-probe

# 一次性探针（用完即删）：在 runner 上验证三件事，全部结果只在本 run 日志。
# 1. 组织级 TS_API_KEY 能否读 ACL（acl:read 能力）
# 2. 设备/tag 现状（顺便数僵尸节点）
# 3. CI 身份（untagged ephemeral）能否直接用 tailscale ssh 登目标机

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ACL 可读性 + 导出
        env:
          TSKEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -uo pipefail
          echo "::add-mask::$TSKEY"
          CODE="$(curl -sS -m 30 -o /tmp/acl.json -w '%{http_code}' \
            -u "$TSKEY:" "https://api.tailscale.com/api/v2/tailnet/-/acl" || echo 000)"
          echo "ACL HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "=== ACL BEGIN ==="
            cat /tmp/acl.json
            echo ""
            echo "=== ACL END ==="
          else
            echo "ACL body: $(head -c 300 /tmp/acl.json 2>/dev/null)"
          fi

      - name: 设备与 tag 现状
        env:
          TSKEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -uo pipefail
          echo "::add-mask::$TSKEY"
          CODE="$(curl -sS -m 30 -o /tmp/dev.json -w '%{http_code}' \
            -u "$TSKEY:" "https://api.tailscale.com/api/v2/tailnet/-/devices" || echo 000)"
          echo "DEVICES HTTP: $CODE"
          [ "$CODE" = "200" ] || { head -c 300 /tmp/dev.json; exit 0; }
          python3 - <<'PY'
          import json, datetime
          d = json.load(open('/tmp/dev.json'))
          devs = d.get('devices', [])
          now = datetime.datetime.now(datetime.timezone.utc)
          print(f"total devices: {len(devs)}")
          online = [x for x in devs if x.get('connectedToControl')]
          print(f"online: {len(online)}")
          print("--- per-device ---")
          for x in devs:
              tags = ",".join(x.get('tags') or []) or "-"
              last = x.get('lastSeen') or ''
              name = x.get('hostname') or x.get('name') or '?'
              ips = ",".join(x.get('addresses') or [])
              print(f"{name:30} {ips:18} online={str(bool(x.get('connectedToControl'))):5} tags={tags:14} lastSeen={last}")
          PY

      - name: CI 身份能否 tailscale ssh
        env:
          TSKEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -uo pipefail
          echo "::add-mask::$TSKEY"
          curl -fsSL https://tailscale.com/install.sh | sh
          MINT_BODY='{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true}}},"expirySeconds":1800}'
          CODE="$(curl -sS -m 30 -o /tmp/mint.json -w '%{http_code}' -X POST \
            -u "$TSKEY:" -H 'Content-Type: application/json' -d "$MINT_BODY" \
            "https://api.tailscale.com/api/v2/tailnet/-/keys" || echo 000)"
          echo "MINT HTTP: $CODE"
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "mint body: $(head -c 300 /tmp/mint.json)"; exit 0
          fi
          KEY="$(python3 -c "import json;print(json.load(open('/tmp/mint.json')).get('key',''))")"
          [ -n "$KEY" ] && echo "::add-mask::$KEY"
          KEYID="$(python3 -c "import json;print(json.load(open('/tmp/mint.json')).get('id',''))")"
          echo "minted key id: $KEYID"
          timeout 120 sudo tailscale up --authkey="$KEY" --hostname="ts-probe-$GITHUB_RUN_ID" \
            --accept-routes=false --accept-dns=false || { echo "TS-UP-FAILED"; exit 0; }
          echo "joined as: $(tailscale status --json | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["Self"]["HostName"], d["Self"].get("Tags"))')"

          echo "=== 试 tailscale ssh 到各目标（每个 20s 超时） ==="
          for T in "100.111.231.85:hw-41-trial" "100.91.222.51:hw-21-prod" "100.85.128.116:ali-gz-caddy"; do
            IP="${T%%:*}"; NAME="${T##*:}"
            OUT="$(timeout 20 tailscale ssh -o BatchMode=yes root@$IP "hostname; id -un" 2>&1 | tail -3)"
            RC=$?
            echo "--- $NAME ($IP) rc=$RC ---"
            echo "$OUT"
          done

          echo "=== 清理 ==="
          sudo tailscale logout || true
          curl -sS -m 20 -X DELETE -u "$TSKEY:" "https://api.tailscale.com/api/v2/tailnet/-/keys/$KEYID" -o /dev/null -w 'delete key: %{http_code}\n' || true
