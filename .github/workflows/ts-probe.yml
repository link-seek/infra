name: ts-probe

# 一次性探针（用完即删）。
# 测：CI 身份能否 tailscale ssh 进目标机，untagged（=member）与带 tag 两种身份对照。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 安装 tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: A. untagged 身份（= autogroup:member）
        env:
          TSKEY: ${{ secrets.TS_API_KEY }}
        run: |
          set +e
          echo "::add-mask::$TSKEY"
          mint() {
            curl -sS -m 30 -X POST -u "$TSKEY:" -H 'Content-Type: application/json' \
              -d "$1" "https://api.tailscale.com/api/v2/tailnet/-/keys"
          }
          R="$(mint '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true}}},"expirySeconds":1800}')"
          KEY="$(echo "$R" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("key",""))')"
          KID="$(echo "$R" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')"
          [ -n "$KEY" ] && echo "::add-mask::$KEY"
          sudo tailscale up --authkey="$KEY" --hostname="probe-untagged-$GITHUB_RUN_ID" \
            --accept-routes=false --accept-dns=false >/dev/null 2>&1
          echo "identity: $(tailscale status --json | python3 -c 'import json,sys;d=json.load(sys.stdin);s=d["Self"];print(s["HostName"], "tags=", s.get("Tags"))')"
          for IP in 100.111.231.85 100.91.222.51; do
            OUT="$(timeout 25 tailscale ssh root@$IP 'hostname; id -un' 2>&1)"; RC=$?
            echo "--- untagged -> $IP : rc=$RC"
            echo "$OUT" | tail -3
          done
          sudo tailscale logout >/dev/null 2>&1
          curl -sS -m 20 -X DELETE -u "$TSKEY:" "https://api.tailscale.com/api/v2/tailnet/-/keys/$KID" -o /dev/null

      - name: B. 带 tag:ci-prod 身份
        env:
          TSKEY: ${{ secrets.TS_API_KEY }}
        run: |
          set +e
          echo "::add-mask::$TSKEY"
          R="$(curl -sS -m 30 -X POST -u "$TSKEY:" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci-prod"]}}},"expirySeconds":1800}' \
            "https://api.tailscale.com/api/v2/tailnet/-/keys")"
          KEY="$(echo "$R" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("key",""))')"
          KID="$(echo "$R" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')"
          if [ -z "$KEY" ]; then echo "mint-with-tag FAILED: $(echo "$R" | head -c 300)"; exit 0; fi
          echo "::add-mask::$KEY"
          sudo tailscale up --authkey="$KEY" --hostname="probe-ciprod-$GITHUB_RUN_ID" \
            --accept-routes=false --accept-dns=false >/dev/null 2>&1
          echo "identity: $(tailscale status --json | python3 -c 'import json,sys;d=json.load(sys.stdin);s=d["Self"];print(s["HostName"], "tags=", s.get("Tags"))')"
          for IP in 100.111.231.85 100.91.222.51; do
            OUT="$(timeout 25 tailscale ssh root@$IP 'hostname; id -un' 2>&1)"; RC=$?
            echo "--- tag:ci-prod -> $IP : rc=$RC"
            echo "$OUT" | tail -3
            OUT2="$(timeout 25 ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@$IP 'hostname' 2>&1)"; RC2=$?
            echo "--- tag:ci-prod OpenSSH:22 -> $IP : rc=$RC2 : $(echo "$OUT2" | tail -1)"
          done
          sudo tailscale logout >/dev/null 2>&1
          curl -sS -m 20 -X DELETE -u "$TSKEY:" "https://api.tailscale.com/api/v2/tailnet/-/keys/$KID" -o /dev/null
