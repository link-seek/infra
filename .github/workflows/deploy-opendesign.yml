name: deploy-opendesign

# OD 切流（dispatch 专属，无 push 触发；合 PR 不上机）。
# 执行条件：用户给了切流窗口 + 目标机 .env 已按 sops 落盘 600（缺失直接 abort，不猜密钥）。
# 顺序：备份旧目录 → 同步文件 → .env 门禁 → up -d → 部署后验证 → 失败回滚旧目录。
# 永不 down -v（卷里是 OD 全量数据）。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 CUTOVER 才执行"
        required: true
        default: "NO"

concurrency:
  group: deploy-opendesign
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'CUTOVER'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 加入 tailnet（一次性节点，用完即焚）
        timeout-minutes: 6
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_PROD }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TS_AUTHKEY="$(printf '%s' "$TS_AUTHKEY" | tr -d '\r\n ')"
          [ -n "$TS_AUTHKEY" ] || { echo "TS key missing"; exit 1; }
          timeout 120 sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ci-od-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          timeout 15 bash -c "</dev/tcp/100.91.222.51/2244" || { echo "target unreachable"; exit 1; }
          echo "target reachable"
          for f in 100.111.231.85:trial 100.85.128.116:entry; do
            ip="${f%%:*}"; label="${f#*:}"
            timeout 12 bash -c "</dev/tcp/$ip/2244" && { echo "CONTAINMENT FAIL: 摸到了 $label"; exit 1; } || echo "containment ok ($label unreachable)"
          done

      - name: 切流（备份→同步→门禁→up→验证→失败回滚）
        timeout-minutes: 18
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          NODE="100.91.222.51"; PORT="2244"
          ssh-keyscan -p "$PORT" -H "$NODE" >> ~/.ssh/known_hosts 2>/dev/null
          tar -czf - -C stacks/opendesign compose.yml README.md .env.example | \
            ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE \
            "mkdir -p /root/stacks/opendesign && tar -xzf - -C /root/stacks/opendesign && echo synced"
          ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE bash -s <<'EOF'
          set -euo pipefail
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          # 0. 门禁：.env 必须已落盘（sops，600），缺失直接 abort，不猜密钥
          [ -f /root/stacks/opendesign/.env ] || { echo "ABORT: /root/stacks/opendesign/.env 缺失（先按 sops 落盘 600）"; exit 1; }
          [ -f /root/opendesign/compose.yml ] || { echo "ABORT: 旧目录不在，回滚无依"; exit 1; }
          # 1. 备份旧目录（compose＋.env＋home 引用不断，只备文件）
          mkdir -p /root/backups
          tar -czf "/root/backups/opendesign-precut-$TS.tar.gz" -C /root opendesign
          echo "backup-ok: /root/backups/opendesign-precut-$TS.tar.gz"
          # 2. up（卷名显式复用，不断数据；端口只绑回环，与现网一致）
          cd /root/stacks/opendesign && docker compose pull --quiet opendesign
          cd /root/opendesign && docker compose stop opendesign || true
          docker rm -f opendesign || true
          cd /root/stacks/opendesign && docker compose up -d --force-recreate opendesign
          # 3. 等 ready（最多 3 分钟）
          READY=""
          for i in $(seq 1 18); do
            sleep 10
            C="$(curl -s -m 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:7456/ || echo 000)"
            echo "ready-probe#$i -> $C"
            if [ "$C" = "401" ]; then READY=1; break; fi
          done
          echo "container: $(docker ps --filter name=opendesign --format '{{.Image}} {{.Status}}')"
          # 4. 部署后验证（用户要求项；密钥不出日志）
          PASS=1
          [ -n "$READY" ] || PASS=0
          C1="$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:7456/ || echo 000)"
          echo "verify: od-root=$C1 (expect 401)"; [ "$C1" = "401" ] || PASS=0
          MK="$(cat /root/litellm-guard/.master 2>/dev/null || echo MISSING)"
          C2="$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/v1/models || echo 000)"
          echo "verify: gw-no-key=$C2 (expect 401)"; [ "$C2" = "401" ] || PASS=0
          if [ "$MK" != "MISSING" ]; then
            MC="$(curl -s -m 10 -H "Authorization: Bearer $MK" http://127.0.0.1:4000/v1/models | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["data"]))' 2>/dev/null || echo -1)"
            echo "verify: gw-models=$MC (expect 45)"; [ "$MC" = "45" ] || PASS=0
          fi
          if docker logs opendesign --tail 100 2>&1 | grep -qi -E "ECONNREFUSED|ETIMEDOUT|model_not_found"; then
            echo "verify: OD 日志见网关报错"; PASS=0
          else
            echo "verify: OD 日志无网关报错"
          fi
          if [ "$PASS" = "1" ]; then
            echo "DEPLOY OK"
          else
            echo "VERIFY FAIL: 容器日志（定位用）"
            docker logs opendesign --tail 60 || true
            echo "VERIFY FAIL: 回滚旧目录"
            cd /root/stacks/opendesign && docker compose stop opendesign || true
            docker rm -f opendesign || true
            cd /root/opendesign && docker compose up -d
            sleep 15
            echo "rolled-back: $(docker ps --filter name=opendesign --format '{{.Image}} {{.Status}}')"
            exit 1
          fi
          EOF
