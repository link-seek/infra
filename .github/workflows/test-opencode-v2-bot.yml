name: test-opencode-v2-bot

# Temporary test workflow for link-seek/opencode-github-bot.
# Remove once v0.1.0 is validated.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run OpenCode v2 bot (review)
        uses: link-seek/opencode-github-bot@v0.1.3
        with:
          model: ${{ vars.OPENCODE_REVIEW_MODEL }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: review
          pr-number: ${{ github.event.pull_request.number }}
          require-evidence: "false"
          require-pinned-actions: "true"
          collect-feedback: "true"