name: deliver-litellm-gateway
# 快递线（deliver）：只管送达到目标机；镜像内容由商家（docker-images bake-*）负责，不管内容。

# 薄调用：网关栈部署 = 复用线 + prod 标签 + stable。只手动 dispatch（合 pin 不自动发）。
on:
  workflow_dispatch:
    inputs:
      digest_or_tag:
        description: "digest（sha256:…）或 tag，默认 stable"
        required: false
        default: stable
      action:
        description: "up 部署 / down 下线"
        required: false
        default: up
        type: choice
        options: [up, down]

jobs:
  deploy:
    uses: ./.github/workflows/deliver-stack.yml
    with:
      node_tag: prod
      digest_or_tag: ${{ inputs.digest_or_tag || 'stable' }}
      stack_dir: stacks/litellm-gateway
      action: ${{ inputs.action || 'up' }}
    secrets:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
