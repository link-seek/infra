name: tmp-ali-reg
# 一次性：registries.yaml 落 ali-gz＋重启 agent（admin 只读+写，用完即删）。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-ali-reg
  cancel-in-progress: false
jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.CADDY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 进网＋下发＋重启 agent
        run: |
          set -euo pipefail
          python3 -c "import yaml; yaml.safe_load(open('edge/registries/registries.yaml'))"
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:admin"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || exit 1
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-alireg-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          scp $SOPT edge/registries/registries.yaml root@100.85.128.116:/etc/rancher/k3s/registries.yaml && echo SHIPPED
          ssh $SOPT root@100.85.128.116 'systemctl restart k3s-agent && sleep 15 && systemctl is-active k3s-agent'
          ssh $SOPT root@100.85.128.116 'k3s crictl images 2>/dev/null | grep -c -i traefik || echo "no traefik yet (expected, pulls on schedule)"'
          shred -u ~/.ssh/ci_key
          echo REG-DONE
