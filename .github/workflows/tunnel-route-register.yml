name: tunnel-route-register

# Cloudflare Tunnel Public Hostname 的代码化登记（替代 Dashboard 手点）。
# 本地 config.yml 在这条远程托管隧道上不参与路由，hostname 必须经 API 注册才生效。
# 默认只读：dispatch 时 apply=true 才写。写前必 GET 打印现状，写后必验 401。
# 密钥用 org CF_PARENT_TOKEN 现签短效 token。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true=登记 llm-trial（读后写）；false=只读"
        required: false
        default: 'false'

concurrency:
  group: tunnel-route
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: CF token 现签（DNS+Tunnel 读写，2h，fail-closed）
        env:
          CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
        run: |
          set -euo pipefail
          PARENT="$(printf '%s' "${CF_PARENT_TOKEN:-}" | tr -d '\r\n ')"
          [ -n "$PARENT" ] || { echo "FAIL: CF_PARENT_TOKEN 为空"; exit 1; }
          echo "::add-mask::$PARENT"
          MINTED="$(CF_PARENT_TOKEN_SANITIZED="$PARENT" \
            CF_TOKEN_NAME="cf-dns-${{ github.run_id }}" \
            CF_TOKEN_TTL_HOURS=2 \
            CF_PERM_GROUPS="dns read,dns write,zone read,cloudflare tunnel read,cloudflare tunnel edit" \
            python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          BASE = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ["CF_PARENT_TOKEN_SANITIZED"]
          print("::add-mask::%s" % TOKEN)
          def call(method, path, body=None):
              headers = {"Authorization": "Bearer " + TOKEN}
              data = None
              if body is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(body).encode()
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  try:
                      return exc.code, json.loads(exc.read() or b"{}")
                  except Exception:
                      return exc.code, {}
              except Exception as exc:
                  return 0, {"success": False, "errors": [{"message": str(exc)[:200]}]}
          zone_name = "xieyucheng.top"
          st, r = call("GET", "/zones?name=" + urllib.parse.quote(zone_name))
          if not (isinstance(r, dict) and r.get("success") and r.get("result")):
              print("FAIL: 取 zone/account 失败 status=%s" % st)
              raise SystemExit(1)
          account_id = (r["result"][0].get("account") or {}).get("id")
          if not account_id:
              account_id = os.environ.get("CF_ACCOUNT_ID", "47ce24ced58f17c9fb15351adcbe67d4")
          st, r = call("GET", "/accounts/%s/tokens/permission_groups?per_page=100" % account_id)
          groups = r.get("result") if isinstance(r.get("result"), list) else []
          by_name = {str(g.get("name", "")).lower(): g for g in groups}
          wanted = [x.strip().lower() for x in os.environ["CF_PERM_GROUPS"].split(",") if x.strip()]
          zone_ids = []
          acct_ids = []
          for w in wanted:
              g = by_name.get(w)
              if not g:
                  print("FAIL: permission group 不存在: %s" % w)
                  raise SystemExit(1)
              scopes = g.get("scopes") or []
              if any("account.zone" in str(s) for s in scopes):
                  zone_ids.append(str(g["id"]))
              elif any(str(s) == "com.cloudflare.api.account" for s in scopes):
                  acct_ids.append(str(g["id"]))
              else:
                  zone_ids.append(str(g["id"]))
          policies = []
          if zone_ids:
              policies.append({"effect": "allow",
                  "resources": {"com.cloudflare.api.account.%s" % account_id: {"com.cloudflare.api.account.zone.*": "*"}},
                  "permission_groups": [{"id": i} for i in zone_ids]})
          if acct_ids:
              policies.append({"effect": "allow",
                  "resources": {"com.cloudflare.api.account.%s" % account_id: "*"},
                  "permission_groups": [{"id": i} for i in acct_ids]})
          if not policies:
              print("FAIL: 无可用 policy")
              raise SystemExit(1)
          ttl = int(os.environ.get("CF_TOKEN_TTL_HOURS", "2"))
          expires = (datetime.now(timezone.utc) + timedelta(hours=ttl)).strftime("%Y-%m-%dT%H:%M:%SZ")
          st, r = call("POST", "/accounts/%s/tokens" % account_id, {
              "name": os.environ["CF_TOKEN_NAME"],
              "policies": policies,
              "expires_on": expires,
          })
          if not (isinstance(r, dict) and r.get("success")):
              print("FAIL: CF 现签失败 status=%s errors=%s" % (st, json.dumps(r.get("errors"))[:300] if isinstance(r, dict) else ""))
              raise SystemExit(1)
          value = str((r.get("result") or {}).get("value") or "")
          if not value:
              print("FAIL: CF 现签无值")
              raise SystemExit(1)
          print("::add-mask::%s" % value)
          print("CF_MINTED_VALUE=%s" % value)
          PY
          )"
          CHILD="$(printf '%s' "$MINTED" | grep '^CF_MINTED_VALUE=' | tail -1 | cut -d= -f2-)"
          [ -n "$CHILD" ] || { echo "FAIL: CF 现签未拿到值"; printf '%s\n' "$MINTED"; exit 1; }
          echo "::add-mask::$CHILD"
          echo "CFTOK=$CHILD" >> "$GITHUB_ENV"
          echo "CF 现签 OK（cf-dns-${{ github.run_id }}，2h）"

      - name: 取 account_id（zone 属主）
        id: acct
        run: |
          ACC="$(curl -s -H "Authorization: Bearer $CFTOK" \
            "https://api.cloudflare.com/client/v4/zones/f46e66f694af4a9e8f8830d0673822b9" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result']['account']['id'] if d.get('result') else 'NONE')")"
          echo "account=$ACC"
          echo "account=$ACC" >> "$GITHUB_OUTPUT"
          [ "$ACC" != "NONE" ] || { echo "FAIL: 取不到 account_id（token scope?）"; exit 1; }

      - name: GET 隧道当前配置（只读）
        id: get
        run: |
          curl -s -H "Authorization: Bearer $CFTOK" \
            "https://api.cloudflare.com/client/v4/accounts/${{ steps.acct.outputs.account }}/cfd_tunnel/b759dba6-b698-4a4f-a019-0d6b2d08cf99" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d.get('success'):
              print('FAIL:', json.dumps(d.get('errors'))[:400]); sys.exit(1)
          t=d['result']
          print('name:', t.get('name'), '| status:', t.get('status'))
          cfg=t.get('config') or {}
          src=cfg.get('config-src'); print('config-src:', src)
          ing=(cfg.get('ingress') or [])
          print('ingress 条数:', len(ing))
          for r in ing:
              print(' -', r.get('hostname','(catch-all)'), '->', r.get('service'))
          json.dump(t, open('/tmp/tunnel.json','w'))
          "

      - name: 登记 llm-trial（apply=true 时）
        if: inputs.apply == 'true'
        env:
          ACC: ${{ steps.acct.outputs.account }}
        run: |
          python3 - <<'EOF'
          import json, yaml
          t = json.load(open('/tmp/tunnel.json'))
          # 正本 = 仓里声明的 ingress.yaml（代码即代码，不在这拼）
          want = yaml.safe_load(open('edge/cloudflared/hw21-opencode/ingress.yaml'))['ingress']
          assert isinstance(want, list) and all('hostname' in r and 'service' in r for r in want), 'ingress 声明格式错'
          # Cloudflare 强制最后一条 catch-all
          if any('hostname' not in r for r in want):
              catch = [r for r in want if 'hostname' not in r][0]
              rest = [r for r in want if 'hostname' in r]
              want = rest + [catch]
          else:
              want = want + [{'service': 'http_status:404'}]
          json.dump({'config': {'ingress': want}}, open('/tmp/newcfg.json', 'w'))
          hosts = [r.get('hostname', '(catch-all)') for r in want]
          print('declared ingress:', hosts)
          EOF
          curl -s -X PUT -H "Authorization: Bearer $CFTOK" \
            -H "Content-Type: application/json" \
            --data @/tmp/newcfg.json \
            "https://api.cloudflare.com/client/v4/accounts/${{ steps.acct.outputs.account }}/cfd_tunnel/b759dba6-b698-4a4f-a019-0d6b2d08cf99/configurations" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('PUT success:', d.get('success'), json.dumps(d.get('errors'))[:300] if not d.get('success') else '')"

      - name: 验证 llm-trial（401 = TLS+ingress+路由全通）
        if: always()
        run: |
          for i in $(seq 1 20); do
            CODE="$(curl -s -m 10 -o /dev/null -w '%{http_code}' https://llm-trial.xieyucheng.top/v1/models || echo 000)"
            echo "probe#$i -> $CODE"
            [ "$CODE" = "401" ] && { echo "REGISTERED OK: 401（无 key 符合预期）"; exit 0; }
            sleep 15
          done
          echo "STILL BLOCKED: $CODE（未登记或 token 无 Tunnel 写权限）"
          exit 1
