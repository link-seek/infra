name: tmp-edge-recon
# 一次性只读：Traefik 切流前置摸底（server 配置/端口占用/RBAC）。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-edge-recon
  cancel-in-progress: false
jobs:
  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 标准进网＋组 kubeconfig
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: k8s 侧只读
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          echo "=== nodes taints ==="
          kubectl get nodes -o jsonpath='{range .items}{.metadata.name} taints={.spec.taints}{"\n"}{end}'
          echo "=== CI can-i ingress ==="
          kubectl auth can-i list ingresses -A 2>&1 | head -5 || true
          kubectl auth can-i create ingresses -n opencode-team 2>&1 || true
          kubectl auth can-i list middlewares.traefik.io -A 2>&1 | head -3 || echo "no traefik CRD (expected)"
          echo "=== app svcs (backends for ingress) ==="
          kubectl get svc -A | grep -E "opencode|litellm|erpnext|browserless|NAMESPACE" | head -20
          echo K8S-DONE
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
    steps:
      - name: 进网＋SSH 只读
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || exit 1
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-recon-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          echo "=== .69 k3s config (disable?) ==="
          ssh $SOPT root@100.93.119.21 'cat /etc/rancher/k3s/config.yaml 2>/dev/null; echo ---; ls /var/lib/rancher/k3s/server/manifests/ 2>/dev/null' || echo ".69 SSH-FAIL"
          echo "=== ali-gz 80/443 + caddy ==="
          ssh $SOPT root@100.85.128.116 'ss -tlnp | grep -E ":80 |:443 " ; echo ---; systemctl is-active caddy; caddy version 2>/dev/null | head -1' || echo "ali SSH-FAIL"
          shred -u ~/.ssh/ci_key
          echo HOSTS-DONE
