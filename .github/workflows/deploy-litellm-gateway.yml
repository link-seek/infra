name: deploy-litellm-gateway

# 网关收编栈：stacks/litellm-gateway/** 进 main 即同步到 HW21（PR1：只同步＋校验，不 up）。
# 不复用 deploy-opencode-stack：新目录首次无 compose（复用会 ABORT），且本阶段禁 up
#（4000/11434 已被现网 /root/litellm-guard 占用，up 即端口冲突）。切流 PR 另写 up＋回滚。
# 铁律：.env 永不经手；目标机缺 .env 仅告警（现网不依赖本栈 .env，不 abort）。

on:
  push:
    branches: [main]
    paths: ['stacks/litellm-gateway/**']
  workflow_dispatch:

concurrency:
  group: deploy-litellm-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 加入 tailnet（一次性节点，用完即焚）
        timeout-minutes: 6
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_PROD }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TS_AUTHKEY="$(printf '%s' "$TS_AUTHKEY" | tr -d '\r\n ')"
          [ -n "$TS_AUTHKEY" ] || { echo "TS key missing"; exit 1; }
          timeout 120 sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ci-llm-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          timeout 15 bash -c "</dev/tcp/100.91.222.51/2244" || { echo "target unreachable"; exit 1; }
          echo "target reachable"
          for f in 100.111.231.85:trial 100.85.128.116:entry; do
            ip="${f%%:*}"; label="${f#*:}"
            timeout 12 bash -c "</dev/tcp/$ip/2244" && { echo "CONTAINMENT FAIL: 摸到了 $label"; exit 1; } || echo "containment ok ($label unreachable)"
          done

      - name: 下发 + 校验（经 tailnet，不走公网；不 up）
        timeout-minutes: 12
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          NODE="100.91.222.51"; PORT="2244"
          ssh-keyscan -p "$PORT" -H "$NODE" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE "mkdir -p /root/stacks/litellm-gateway"
          # 有旧文件才备份（首发无文件不 abort，与复用流程的差异点）
          ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE \
            "test -f /root/stacks/litellm-gateway/compose.yml && cp /root/stacks/litellm-gateway/compose.yml /root/stacks/litellm-gateway/compose.yml.prev-$(date -u +%Y%m%dT%H%M%SZ) && echo backup-ok || echo first-sync"
          tar -czf - -C stacks/litellm-gateway compose.yml README.md .env.example config/litellm_config.yaml guard/vault_guard.py guard/models-denied.json guard/rules.json | \
            ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE \
            "mkdir -p /root/stacks/litellm-gateway && tar -xzf - -C /root/stacks/litellm-gateway && echo synced"
          ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE bash -s <<'VERIFY_EOF'
          set -euo pipefail
          cd /root/stacks/litellm-gateway
          docker compose config >/dev/null && echo "VERIFY OK: compose 合法"
          python3 -c "import yaml; d=yaml.safe_load(open('config/litellm_config.yaml')); print(f\"VERIFY OK: config 合法，models={len(d['model_list'])}\")"
          # 漂移报告（告警级，不红：现网是黑户启动，本栈是目标态）
          for f in guard/vault_guard.py guard/models-denied.json; do
            if [ -f "/root/litellm-guard/$(basename $f)" ]; then
              cmp -s "$f" "/root/litellm-guard/$(basename $f)" && echo "DRIFT: $f 与现网一致" || echo "DRIFT-WARN: $f 与现网不一致（切流前对账）"
            else
              echo "DRIFT-WARN: 现网无 $(basename $f)（路径假设待切流确认）"
            fi
          done
          # .env 缺失仅告警：现网不依赖本栈 .env（禁 up，无引用方）
          test -f .env && echo "ENV: .env 存在" || echo "ENV-WARN: 本栈 .env 缺失（切流前按 sops 落盘 600）"
          # 现网容器必须还在（本 workflow 禁 up 的自证）
          docker ps --format '{{.Names}}' | grep -q litellm && echo "VERIFY OK: 现网网关仍在（未被触碰）" || echo "VERIFY-WARN: 未发现现网网关容器（容器名假设待确认）"
          VERIFY_EOF
