name: deploy-litellm-gateway

# 薄调用：网关栈部署 = 复用线 + prod 标签 + stable。日常改 pin 即 push compose.yml。
on:
  push:
    branches: [main]
    paths:
      - stacks/litellm-gateway/compose.yml
      - stacks/litellm-gateway/config/**
      - stacks/litellm-gateway/guard/vault_guard.py
      - stacks/litellm-gateway/guard/models-denied.json
      - stacks/litellm-gateway/guard/rules.json
      - stacks/litellm-gateway/env-sources.conf
      - stacks/litellm-gateway/canary-*.sh
      - stacks/litellm-gateway/deploy.manifest
  workflow_dispatch:
    inputs:
      digest_or_tag:
        description: "digest（sha256:…）或 tag，默认 stable"
        required: false
        default: stable
      action:
        description: "up 部署 / down 下线"
        required: false
        default: up
        type: choice
        options: [up, down]

jobs:
  deploy:
    uses: ./.github/workflows/deploy-stack.yml
    with:
      node_tag: prod
      digest_or_tag: ${{ inputs.digest_or_tag || 'stable' }}
      stack_dir: stacks/litellm-gateway
      action: ${{ inputs.action || 'up' }}
    secrets:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_PROD }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
