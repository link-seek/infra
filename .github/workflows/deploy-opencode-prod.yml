name: deploy-opencode-prod

# 薄调用：opencode 栈部署 = 复用线 + prod 标签 + stable。日常改 pin 即 push compose.yml。
on:
  push:
    branches: [main]
    paths:
      - stacks/opencode-prod/compose.yml
      - stacks/opencode-prod/env-sources.conf
      - stacks/opencode-prod/canary-*.sh
      - stacks/opencode-prod/deploy.manifest
  workflow_dispatch:
    inputs:
      digest_or_tag:
        description: "tools 镜像 digest（sha256:…）或 tag，默认 stable"
        required: false
        default: stable
      action:
        description: "up 部署 / down 下线"
        required: false
        default: up
        type: choice
        options: [up, down]

jobs:
  deploy:
    uses: ./.github/workflows/deploy-stack.yml
    with:
      node_tag: prod
      digest_or_tag: ${{ inputs.digest_or_tag || 'stable' }}
      stack_dir: stacks/opencode-prod
      action: ${{ inputs.action || 'up' }}
    secrets:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_PROD }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      ENV_GH_TOKEN: ${{ secrets.PROD_GH_TOKEN }}
      ENV_LITELLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      ENV_OPENCODE_SERVER_PASSWORD: ${{ secrets.PROD_OPENCODE_SERVER_PASSWORD }}
      ENV_CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
      ENV_CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      ENV_HCLOUD_AK: ${{ secrets.PROD_HCLOUD_AK }}
      ENV_HCLOUD_SK: ${{ secrets.PROD_HCLOUD_SK }}
      ENV_SSH_PRIVATE_KEY_B64: ${{ secrets.PROD_SSH_PRIVATE_KEY_B64 }}
      ENV_SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
