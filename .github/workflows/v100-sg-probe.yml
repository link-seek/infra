name: v100-sg-probe
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
    steps:
      - name: install hcloud
        run: |
          set -e
          ok=0
          for u in https://obs.cn-north-4.myhuaweicloud.com/koocli/cli/latest/huaweicloud-cli-linux-amd64.tar.gz https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz ; do
            curl -fsSL --retry 4 "$u" -o /tmp/hc.tgz && { ok=1; break; } || true
          done
          [ "$ok" = 1 ] || { echo FAIL; exit 1; }
          mkdir -p /tmp/hc && tar xzf /tmp/hc.tgz -C /tmp/hc
          install -m755 "$(find /tmp/hc -type f -name hcloud|head -1)" /usr/local/bin/hcloud
      - name: probe
        run: |
          set +e
          hcloud configure set --cli-access-key="$AK" --cli-secret-key="$SK" --cli-region=cn-north-4 --cli-mode=AKSK --cli-agree-privacy-statement=true
          for SID in c5b805bd-5e8d-4ba5-a5ab-7523244da0fa 7f39cb83-1a5c-4792-b65e-e578d7ddb88d; do
            echo "===== server $SID ====="
            hcloud ECS ShowServer --server_id "$SID" --cli-region=cn-north-4 > /tmp/sv.json 2>/tmp/e; head -c 200 /tmp/e; echo
            python3 -c "import json;d=json.load(open('/tmp/sv.json'));s=d.get('server') or d;print('name:',s.get('name'));print('sg:',s.get('security_groups'))"
          done
          echo "===== 各安全组入站规则 ====="
          python3 - <<'PY' > /tmp/sgids.txt
          import json
          ids=set()
          for SID in ["c5b805bd-5e8d-4ba5-a5ab-7523244da0fa","7f39cb83-1a5c-4792-b65e-e578d7ddb88d"]:
              import subprocess
              o=subprocess.run(["hcloud","ECS","ShowServer","--server_id",SID,"--cli-region=cn-north-4"],capture_output=True,text=True).stdout
              try:
                  d=json.loads(o); s=d.get('server') or d
                  for g in (s.get('security_groups') or []): ids.add((g.get('id'),g.get('name')))
              except Exception as e: pass
          for i,n in ids: print(i,n)
          PY
          cat /tmp/sgids.txt
          while read -r gid gname; do
            [ -z "$gid" ] && continue
            echo "----- SG $gname ($gid) rules -----"
            hcloud VPC ListSecurityGroupRules/v3 --security_group_id "$gid" --cli-region=cn-north-4 > /tmp/r.json 2>/tmp/re; head -c 200 /tmp/re
            python3 - "$gname" <<'PY'
          import json,sys
          try:
            d=json.load(open('/tmp/r.json'))
            for r in (d.get('security_group_rules') or []):
              print(sys.argv[1], r.get('direction'), r.get('protocol'), r.get('port_range_min'),'-',r.get('port_range_max'), 'remote=',r.get('remote_ip_prefix'), 'ether=',r.get('ethertype'))
          except Exception as e: print("parse-fail",e,open('/tmp/r.json').read()[:200])
          PY
          done < /tmp/sgids.txt
