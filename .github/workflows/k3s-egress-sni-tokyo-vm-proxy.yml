name: k3s-egress-sni-tokyo-vm-proxy
# 东京 vm-proxy 薄触发层：只 preset 参数，逻辑全在 _sni-egress-node。
# 同域另一节点见 k3s-egress-sni-tokyo-edge；广州见 k3s-egress-sni-ali-gz。三者独立点火互不触发。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy=下发+验证；verify=只验"
        required: false
        default: "deploy"
        type: choice
        options: [deploy, verify]
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: k3s-egress-sni-tokyo-vm-proxy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  node:
    uses: ./.github/workflows/_sni-egress-node.yml
    with:
      node_hostname: vm-proxy
      ds_file: k8s/egress/daemonset.yaml
      ds_name: sni-egress
      mode: ${{ inputs.mode || 'deploy' }}
    secrets: inherit
