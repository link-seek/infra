name: cutover-litellm-gateway

# 网关切流（社区通用切法）：dispatch 即执行 pull + up + 存活探。
# 前置：目标机 /root/stacks/litellm-gateway 已由 deploy-litellm-gateway 同步（本 workflow 自带同步，重复执行无害）。
# 版本 = compose.yml 里一行 digest pin；回退 = pin 改回去再 dispatch 一次（SWR 老 tag 保留可重拉）。
# 同 project 原地重建：不用 stop/rm/network rm，不备 tar，不回滚分支。

on:
  workflow_dispatch:

concurrency:
  group: cutover-litellm
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 加入 tailnet
        timeout-minutes: 6
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_PROD }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TS_AUTHKEY="$(printf '%s' "$TS_AUTHKEY" | tr -d '\r\n ')"
          timeout 120 sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ci-cut-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          timeout 15 bash -c "</dev/tcp/100.91.222.51/2244" || { echo "target unreachable"; exit 1; }
          for f in 100.111.231.85:trial 100.85.128.116:entry; do
            ip="${f%%:*}"; label="${f##*:}"
            timeout 12 bash -c "</dev/tcp/$ip/2244" && { echo "CONTAINMENT FAIL: 摸到了 $label"; exit 1; } || echo "containment ok ($label unreachable)"
          done

      - name: 切流（同步→env→pull→up→存活探）
        timeout-minutes: 10
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -p 2244 -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          # .env 现场 render（终态：包只活内存；存量 LITELLM_DOTENV_B64 待绿切流后删除）
          bash scripts/render-dotenv.sh --map stacks/litellm-gateway/env-sources.conf --example stacks/litellm-gateway/.env.example --out /tmp/ci-litellm-dotenv
          scp -o BatchMode=yes -P 2244 -i ~/.ssh/ci_key /tmp/ci-litellm-dotenv root@100.91.222.51:/root/stacks/litellm-gateway/.env
          rm -f /tmp/ci-litellm-dotenv
          tar -czf - -C stacks/litellm-gateway compose.yml config/litellm_config.yaml guard/vault_guard.py guard/models-denied.json guard/rules.json | \
            ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 \
            "mkdir -p /root/stacks/litellm-gateway && tar -xzf - -C /root/stacks/litellm-gateway && chmod 600 /root/stacks/litellm-gateway/.env && echo synced"
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          cd /root/stacks/litellm-gateway
          export LITELLM_MASTER_KEY="sk-$(openssl rand -hex 32)"
          docker compose pull --quiet litellm-guard
          docker compose up -d --force-recreate litellm-guard
          READY=""
          for i in $(seq 1 18); do
            sleep 10
            C0="$(curl -s -m 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/v1/models || echo 000)"
            echo "ready-probe#$i -> $C0"
            if [ "$C0" = "200" ] || [ "$C0" = "401" ]; then READY=1; break; fi
          done
          echo "container: $(docker ps --filter name=litellm-guard --format '{{.Image}} {{.Status}}')"
          [ -n "$READY" ] || { echo "FAIL: 网关 3 分钟未起"; docker logs litellm-guard --tail 60 || true; exit 1; }
          PASS=1
          C1="$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/v1/models || echo 000)"
          echo "verify: models=$C1 (expect 200)"; [ "$C1" = "200" ] || PASS=0
          CC="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.OPENCODE_API_KEY }}" -H 'Content-Type: application/json' -d '{"model":"glm-5.2","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' http://127.0.0.1:4000/v1/chat/completions || echo 000)"
          echo "verify: chat-valid-key=$CC (expect 200，即后端链路＋.env 都通)"
          [ "$CC" = "200" ] || PASS=0
          IC="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer sk-invalid-test" -H 'Content-Type: application/json' -d '{"model":"glm-5.2","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' http://127.0.0.1:4000/v1/chat/completions || echo 000)"
          echo "verify: chat-invalid-key=$IC (expect 401 上游鉴权，即透明代理未拦截)"
          [ "$IC" = "401" ] || PASS=0
          if [ "$PASS" = "1" ]; then
            echo "CUTOVER OK"
          else
            docker logs litellm-guard --tail 60 || true
            exit 1
          fi
          EOF
