name: kamal-spike

# Phase 1 spike（#277）：ephemeral runner 自举为靶机，验证 Kamal(net-ssh) 走 Tailscale SSH。
# 不动生产，不部署应用。成功标准：kamal server exec 回显 + SWR 登录成功。

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: install kamal
        run: gem install kamal -v 2.12.0 --no-document

      - name: dual tailscaled (client A + server B)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          mint() {
            curl -sS -m 30 -X POST -H "Authorization: Bearer $(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')" \
              -H 'Content-Type: application/json' \
              -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:guest"]}}},"expirySeconds":3600}' \
              https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))"
          }
          KEY_A="$(mint)"; KEY_B="$(mint)"
          [ -n "$KEY_A" ] && [ -n "$KEY_B" ] || { echo "FAIL: mint"; exit 1; }
          # A: default socket, pure client (for tailscale nc pipes)
          timeout 120 sudo tailscale up --authkey="$KEY_A" --hostname="kspike-cli-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          # B: second daemon, userspace (no TUN clash), serves TSSH
          timeout 120 sudo tailscaled --tun=userspace-networking --state=/tmp/ts2.state --socket=/tmp/ts2.sock >/tmp/ts2.log 2>&1 &
          sleep 3
          timeout 120 sudo tailscale --socket=/tmp/ts2.sock up --authkey="$KEY_B" --hostname="kspike-srv-$GITHUB_RUN_ID" --ssh --accept-routes=false --accept-dns=false
          SRV_IP="$(sudo tailscale --socket=/tmp/ts2.sock ip -4)"
          echo "SRV_IP=$SRV_IP" >> "$GITHUB_ENV"
          sudo tailscale --socket=/tmp/ts2.sock status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("srv tags:", d["Self"].get("Tags"))'

      - name: baseline plain ssh to server daemon
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@"$SRV_IP" 'echo PLAIN-SSH-OK; whoami' || true
          echo "--- official client ---"
          timeout 30 tailscale ssh root@"$SRV_IP" 'echo TAILSCALE-SSH-OK; whoami' || true

      - name: baseline plain ssh over tailnet
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@"$SRV_IP" 'echo PLAIN-SSH-OK; whoami' || true
          echo "--- official client ---"
          timeout 30 tailscale ssh root@"$SRV_IP" 'echo TAILSCALE-SSH-OK; whoami' || true

      - name: kamal server exec over TSSH
        working-directory: kamal/cfos-spike
        env:
          SWR_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          sed -i "s/SERVER_PLACEHOLDER/$SRV_IP/" config/deploy.yml
          grep -q "$SRV_IP" config/deploy.yml || { echo "FAIL: server IP not wired"; exit 1; }
          mkdir -p .kamal
          {
            echo "KAMAL_REGISTRY_USER=$SWR_USER"
            echo "KAMAL_REGISTRY_PASSWORD=$SWR_PASS"
          } > .kamal/secrets
          chmod 600 .kamal/secrets
          timeout 120 kamal server exec "echo KAMAL-TSSH-OK; whoami" 2>&1 | tail -n 15

      - name: kamal deploy v1 + verify + v2 + rollback
        working-directory: kamal/cfos-spike
        env:
          SWR_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_PASS: ${{ secrets.SWR_LOGIN_PASS }}
          CF_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "KAMAL_REGISTRY_USER=$SWR_USER"
            echo "KAMAL_REGISTRY_PASSWORD=$SWR_PASS"
            echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN"
          } > .kamal/secrets
          chmod 600 .kamal/secrets
          D1="sha256:f4795016f273720927865024c14e28523b145583b02317c1bd6317277eadc799"
          D2="sha256:cfe24a21570336277e462c8308681eabf9c3ff3125983cbc4c048c0ddce61286"
          sed -i "s|^ARG CFOS_DIGEST=.*|ARG CFOS_DIGEST=$D1|" Dockerfile.cfos-spike
          timeout 1500 kamal deploy 2>&1 | tail -n 8
          echo "== v1 serving =="
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://$SRV_IP/") && [ "$code" = "200" ] && break || sleep 20
          done
          echo "v1 http=$code"; test "$code" = "200"
          sed -i "s|^ARG CFOS_DIGEST=.*|ARG CFOS_DIGEST=$D2|" Dockerfile.cfos-spike
          timeout 1500 kamal deploy 2>&1 | tail -n 5
          echo "== v2 serving =="
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://$SRV_IP/") && [ "$code" = "200" ] && break || sleep 20
          done
          echo "v2 http=$code"; test "$code" = "200"
          echo "== rollback =="
          timeout 600 kamal rollback 2>&1 | tail -n 8
          kamal app containers 2>&1 | tail -n 8
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://$SRV_IP/") && [ "$code" = "200" ] && break || sleep 20
          done
          echo "post-rollback http=$code"; test "$code" = "200"

      - name: leave tailnet
        if: always()
        run: sudo tailscale logout || true; sudo pkill -f "tailscaled.*ts2.sock" || true
