name: tmp-ali-kp
# 一次性：ali-gz kube-proxy/监听状态（admin 只读）。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-ali-kp
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.CADDY_SSH_KEY }}
    steps:
      - name: 进网（admin）＋取证
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:admin"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || exit 1
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-alikp-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          ssh $SOPT root@100.85.128.116 'echo "== agent =="; systemctl is-active k3s-agent || systemctl is-active k3s; echo "== listen all =="; ss -tlnp | head -25; echo "== kube-proxy =="; ps aux | grep -a "[k]ube-proxy" | head -3; echo "== kp log =="; journalctl -u k3s-agent --since "60 min ago" --no-pager 2>/dev/null | grep -a -i -E "nodeport|30080|proxy.*error|failed" | tail -5; echo done'
          shred -u ~/.ssh/ci_key
          echo PROBE-DONE
