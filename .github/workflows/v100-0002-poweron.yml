name: v100-0002-poweron
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, options: [discover, poweron], default: discover}
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: install hcloud
        run: |
          set -e
          ok=0
          for u in \
            https://obs.cn-north-4.myhuaweicloud.com/koocli/cli/latest/huaweicloud-cli-linux-amd64.tar.gz \
            https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz ; do
            curl -fsSL --retry 4 "$u" -o /tmp/hc.tgz && { ok=1; break; } || true
          done
          [ "$ok" = 1 ] || { echo FAIL; exit 1; }
          mkdir -p /tmp/hc && tar xzf /tmp/hc.tgz -C /tmp/hc
          install -m755 "$(find /tmp/hc -type f -name hcloud|head -1)" /usr/local/bin/hcloud
      - name: run
        run: |
          set +e
          hcloud configure set --cli-access-key="$AK" --cli-secret-key="$SK" --cli-region=cn-north-4 --cli-mode=AKSK --cli-agree-privacy-statement=true
          echo "=== ECS cn-north-4 ==="
          hcloud ECS ListServersDetails --cli-region=cn-north-4 --limit=100 > /tmp/s.json 2>/tmp/e; head -c 200 /tmp/e
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/s.json'))
          for s in d.get('servers',[]):
              ips=[]
              a=s.get('addresses') or {}
              for k,v in a.items():
                  for x in (v or []):
                      if x.get('addr'): ips.append(x['addr'])
              if s.get('accessIPv4'): ips.append('A4:'+s['accessIPv4'])
              print(s.get('id'), '|', s.get('name'), '|', s.get('status'), '|', ','.join(sorted(set(ips))))
          PY
          if [ "$MODE" != "poweron" ]; then echo DISCOVER_ONLY; exit 0; fi
          echo "=== 定位 0002 并开机 ==="
          ID=$(python3 -c "import json;d=json.load(open('/tmp/s.json'));print(next((s['id'] for s in d['servers'] if '0002' in (s.get('name') or '') or 'jushen' in (s.get('name') or '').lower() and '0002' in (s.get('name') or '')),''))")
          [ -z "$ID" ] && ID=$(python3 -c "import json;d=json.load(open('/tmp/s.json'));print(next((s['id'] for s in d['servers'] if '0002' in (s.get('name') or '')),''))")
          echo "0002 ID=$ID"
          [ -z "$ID" ] && { echo "FAIL: 未找到 0002"; exit 0; }
          echo y | hcloud ECS BatchStartServers --cli-region=cn-north-4 --os-start.servers.1.id="$ID" 2>&1 | tail -3
          for i in $(seq 1 15); do sleep 30; ST=$(hcloud ECS ListServersDetails --cli-region=cn-north-4 --limit=100 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((s['status'] for s in d['servers'] if s['id']=='$ID'),'?'))"); echo "poll$i $ST"; [ "$ST" = ACTIVE ] && break; done
          echo "=== 最终 0002 详情 ==="
          hcloud ECS ListServersDetails --cli-region=cn-north-4 --limit=100 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);s=next(x for x in d['servers'] if x['id']=='$ID');ips=[];[ips.append(y['addr']) for v in (s.get('addresses') or {}).values() for y in (v or []) if y.get('addr')];print(s['id'],s['name'],s['status'],s.get('accessIPv4'),ips)"
