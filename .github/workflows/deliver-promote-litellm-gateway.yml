name: deliver-promote-litellm-gateway
# 快递手续（deliver-promote）：只办 tag 晋升手续（retag 不 rebuild），不管镜像内容，不管目标机。
# 薄调用 promote-stack.yml；stable 可覆盖（reason 必填），pin 走 PR，合入后再手动 dispatch deliver。

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "已测 digest（sha256:64位hex）"
        required: true
      tag:
        description: "要覆盖的 tag（可移动指针，默认 stable）"
        required: false
        default: "stable"
      reason:
        description: "覆盖 tag 的原因（必填非空）"
        required: true

concurrency:
  group: deliver-promote-litellm-gateway
  cancel-in-progress: false

jobs:
  promote:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/promote-stack.yml
    with:
      images: swr.cn-north-9.myhuaweicloud.com/linkseed/litellm-gateway
      pin_file: stacks/litellm-gateway/compose.yml
      digest: ${{ inputs.digest }}
      tag: ${{ inputs.tag }}
      reason: ${{ inputs.reason }}
    secrets:
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
