name: rejoin-node-tailnet
# 重装/新机器经 HW21 跳板拉回 tailnet（一次性流程，41/.69 通用）。
# 本 workflow：现签 persistent 非 ephemeral 一次性 key（10 分钟过期）→ HW21 跳 → 目标机装 tailscale 上线。
# 目标机需已绑定 hw21-jump 密钥对（重装时选），全程 key 直连，无密码。
on:
  workflow_dispatch:
    inputs:
      fresh_ip:
        description: "目标机内网 IP"
        required: false
        default: "192.168.1.41"
      ts_hostname:
        description: "tailnet hostname（如 mesh-hw-41 / mesh-hw-69）"
        required: false
        default: "mesh-hw-41"
      ts_tags:
        description: "逗号分隔（如 tag:mesh,tag:prod；签不出时自动降级无 tag 进网）"
        required: false
        default: "tag:mesh,tag:opencode-hw41,tag:prod"
concurrency:
  group: rejoin-node
  cancel-in-progress: false
jobs:
  rejoin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 现签上线 key（persistent，非 ephemeral，一次性 600s）
        id: mint
        run: |
          set -euo pipefail
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"; [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          mint() { curl -sS -m 30 -o /tmp/mint.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TSKEY" \
            -H 'Content-Type: application/json' -d "$1" https://api.tailscale.com/api/v2/tailnet/-/keys; }
          TAGS_JSON="$(printf '%s' "${{ inputs.ts_tags }}" | python3 -c "import json,sys; print(json.dumps([t.strip() for t in sys.stdin.read().split(',') if t.strip()]))")"
          BODY_TAGGED="$(python3 -c "import json; print(json.dumps({'capabilities':{'devices':{'create':{'reusable':False,'ephemeral':False,'preauthorized':True,'tags':json.loads('$TAGS_JSON')}}},'expirySeconds':600}))")"
          CODE="$(mint "$BODY_TAGGED")"
          KEY="$(python3 -c "import json; print(json.load(open('/tmp/mint.json')).get('key',''))" 2>/dev/null || true)"
          if [ -n "$KEY" ]; then
            echo "tagged key minted (HTTP $CODE)"
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "tagged mint 拒 (HTTP $CODE)：降级无 tag 进网，进网后去 admin 台手动拖 tag"
            BODY_BARE='{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":false,"preauthorized":true}}},"expirySeconds":600}'
            CODE2="$(mint "$BODY_BARE")"
            KEY="$(python3 -c "import json; print(json.load(open('/tmp/mint.json')).get('key',''))" 2>/dev/null || true)"
            [ -n "$KEY" ] || { echo "FAIL: 无 tag 也签不出 (HTTP $CODE2)"; head -c 300 /tmp/mint.json; exit 1; }
            echo "bare key minted (HTTP $CODE2)"
            echo "needs_tag=true" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$KEY" ] && echo "::add-mask::$KEY"
          printf '%s' "$KEY" > /tmp/join.key; chmod 600 /tmp/join.key
          rm -f /tmp/mint.json
      - name: runner 进 tailnet（ephemeral CI 身份，老套路）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:guest"]}}},"expirySeconds":21600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: CI key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-rejoin41-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
      - name: 经 HW21 跳到目标机，装 tailscale 上线（key 直连，无密码）
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          JOINKEY="$(cat /tmp/join.key)"; echo "::add-mask::$JOINKEY"
          FRESH_IP="${{ inputs.fresh_ip }}"
          TS_HOST="${{ inputs.ts_hostname }}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          # 安装脚本走仓里文件（scripts/ts-static-install.sh），只传文件+调，不 inline 拼。
          scp -P 2244 -i ~/.ssh/ci_key scripts/ts-static-install.sh root@100.91.222.51:/tmp/ts-install.sh
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<EOF
          set -euo pipefail
          ssh-keygen -R "$FRESH_IP" 2>/dev/null || true
          scp -o BatchMode=yes -o StrictHostKeyChecking=no /tmp/ts-install.sh root@$FRESH_IP:/tmp/ts-install.sh
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@$FRESH_IP "bash /tmp/ts-install.sh \"$JOINKEY\" $TS_HOST"
          echo "--- $TS_HOST 已在网，对端自报 ---"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@$FRESH_IP "tailscale status --self | head -2"
          shred -u /tmp/ts-install.sh
          EOF
          shred -u /tmp/join.key
      - name: 收尾提醒
        run: |
          echo "NEEDS_TAG=${{ steps.mint.outputs.needs_tag }}"
          echo "1) 去 tailscale admin 台删掉旧 ${{ inputs.ts_hostname }} 残留节点（同名会加数字后缀）。"
          echo "2) needs_tag=true 时给新节点拖回 ${{ inputs.ts_tags }}。"
