name: opencode-sops-reencrypt
# 常驻：opencode 系主 Secret 重加密（app 参数：yingxin / opencode-team，xieyucheng 后加）。
# 手动 dispatch → 读 org 新值＋现签 CF 子 token → 内存组装 → sops 加密 → 自动向 dimgs 开密文 PR。
# 人只做一件事：合 PR（= 放行发版）。合后 Flux ≤5m 同步＋Reloader 重启。
# 适用：org key 手动更新后同步、90 天 CF 轮换。 relays on: 无。
on:
  workflow_dispatch:
    inputs:
      app:
        description: "目标 app（Secret 名/ns/key 表内置映射）"
        required: false
        default: "yingxin"
        type: choice
        options: [yingxin, opencode-team]
      reason:
        description: "key-updated=org 换 key 后同步；rotation-90d=定期轮换"
        required: false
        default: "key-updated"
        type: choice
        options: [key-updated, rotation-90d, other]
permissions:
  contents: read
concurrency:
  group: sops-reencrypt-${{ inputs.app }}
  cancel-in-progress: true
jobs:
  reencrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S_LITELLM: ${{ secrets.OPENCODE_API_KEY }}
      S_GH: ${{ secrets.PROD_GH_TOKEN }}
      S_PWD: ${{ secrets.PROD_OPENCODE_SERVER_PASSWORD }}
      S_AK: ${{ secrets.PROD_HCLOUD_AK }}
      S_SK: ${{ secrets.PROD_HCLOUD_SK }}
      S_SMTP: ${{ secrets.PROD_SMTP_PASS }}
      CF_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
      S_BROWSERLESS: ${{ secrets.PROD_BROWSERLESS_TOKEN }}
      S_MAAS: ${{ secrets.MAAS_KEY }}
      S_OBS_AK: ${{ secrets.PROD_HCLOUD_AK }}
      S_OBS_SK: ${{ secrets.PROD_HCLOUD_SK }}
    steps:
      - uses: actions/checkout@v4
      - name: 组装＋加密（明文只活 runner 内存）
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"
          case "$APP" in
            yingxin) SECRET_NAME=opencode-yingxin-env; NS=opencode-yingxin; APPDIR=opencode-yingxin;
              KEYS="LITELLM_API_KEY GH_TOKEN OPENCODE_SERVER_PASSWORD CLOUDFLARE_API_TOKEN CF_AI_TOKEN HCLOUD_AK HCLOUD_SK SMTP_PASS";
              REQ="S_LITELLM S_GH S_PWD S_AK S_SK S_SMTP CF_TOKEN" ;;
            opencode-team) SECRET_NAME=opencode-team-env; NS=opencode-team; APPDIR=opencode-team;
              KEYS="LITELLM_API_KEY GH_TOKEN OPENCODE_SERVER_PASSWORD CLOUDFLARE_API_TOKEN CF_AI_TOKEN BROWSERLESS_TOKEN MAAS_KEY OBS_AK OBS_SK SMTP_PASS";
              REQ="S_LITELLM S_GH S_PWD S_BROWSERLESS S_MAAS S_OBS_AK S_OBS_SK S_SMTP CF_TOKEN" ;;
            *) echo "FAIL: unknown app"; exit 1 ;;
          esac
          for v in $REQ; do
            [ -n "${!v:-}" ] || { echo "FAIL: $v missing (fail-closed)"; exit 1; }
            echo "::add-mask::${!v}"
          done
          SOPS_VER=v3.13.3
          curl -fsSL --retry 3 -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VER}/sops-${SOPS_VER}.linux.amd64"
          chmod +x /tmp/sops && /tmp/sops --version
          CF_CHILD="$(CF_PARENT_TOKEN_SANITIZED="$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-child.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          CF_AI="$(CF_PARENT_TOKEN_SANITIZED="$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-ai.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          [ -n "$CF_CHILD" ] && [ -n "$CF_AI" ] || { echo "FAIL: CF mint"; exit 1; }
          echo "::add-mask::$CF_CHILD"; echo "::add-mask::$CF_AI"
          MINT_DAY="$(date -u +%F)"
          export CF_CHILD CF_AI MINT_DAY RUN_ID="$GITHUB_RUN_ID" KEYS SECRET_NAME NS
          python3 <<'EOF'
          import os
          keys = os.environ["KEYS"].split()
          src = {"LITELLM_API_KEY": "S_LITELLM", "GH_TOKEN": "S_GH",
                 "OPENCODE_SERVER_PASSWORD": "S_PWD", "CLOUDFLARE_API_TOKEN": "CF_CHILD",
                 "CF_AI_TOKEN": "CF_AI", "HCLOUD_AK": "S_AK", "HCLOUD_SK": "S_SK",
                 "BROWSERLESS_TOKEN": "S_BROWSERLESS", "MAAS_KEY": "S_MAAS",
                 "OBS_AK": "S_OBS_AK", "OBS_SK": "S_OBS_SK", "SMTP_PASS": "S_SMTP"}
          vals = {}
          for k in keys:
              v = os.environ[src[k]] if not src[k].startswith("CF_") else os.environ[src[k]]
              assert v, "empty %s" % k
              vals[k] = v
          L = ["# 主 Secret（SOPS 密文）：仅 Flux 解密，明文只活过加密当次的 runner 内存。",
               "# CF 子 token 现签 90 天：cf-minted-at 见注解，到期重跑本 workflow 轮换。",
               "# 生成源：opencode-sops-reencrypt run %s。" % os.environ["RUN_ID"],
               "apiVersion: v1", "kind: Secret",
               "metadata:", "  name: %s" % os.environ["SECRET_NAME"], "  namespace: %s" % os.environ["NS"],
               "  annotations:", '    sops-cutover: "%s"' % os.environ["MINT_DAY"],
               '    cf-minted-at: "%s"' % os.environ["MINT_DAY"],
               "type: Opaque", "stringData:"]
          for k in keys:
              v = vals[k].replace("\\", "\\\\").replace('"', '\\"').replace("\n", "")
              L.append('  %s: "%s"' % (k, v))
          open("/tmp/app-env-plain.yaml", "w").write("\n".join(L) + "\n")
          print("plain assembled keys=%d" % len(keys))
          EOF
          # 只加密 data|stringData（与各仓 .sops.yaml 同规矩；kind/metadata 明文 Flux 才认）。
          /tmp/sops --encrypt --age age1xa3yp8xdquu3v0wlg3n2gmlmah7z60uz8m9e0py7xx30ct4vlu8sjhd87z \
            --encrypted-regex '^(data|stringData)$' \
            --output /tmp/app-env.enc.yaml /tmp/app-env-plain.yaml
          shred -u /tmp/app-env-plain.yaml /tmp/sops
          python3 <<'EOF'
          import re, hashlib
          import yaml
          d = yaml.safe_load(open("/tmp/app-env.enc.yaml"))
          import os
          assert d["kind"] == "Secret" and d["metadata"]["name"] == os.environ["SECRET_NAME"], "name mismatch"
          assert d["metadata"]["namespace"] == os.environ["NS"], "ns mismatch"
          sd = d.get("stringData", {})
          assert set(sd) == set(os.environ["KEYS"].split()), "keys mismatch: %s" % sorted(set(sd) ^ set(os.environ["KEYS"].split()))
          assert all(re.fullmatch(r"ENC\[AES256_GCM,data:[A-Za-z0-9+/=]+,.*", v) for v in sd.values()), "non-ciphertext value!"
          assert [x.get("recipient") for x in d["sops"]["age"]] == ["age1xa3yp8xdquu3v0wlg3n2gmlmah7z60uz8m9e0py7xx30ct4vlu8sjhd87z"]
          print("ENC-OK keys=%s" % sorted(sd))
          print("sha256=%s" % hashlib.sha256(open("/tmp/app-env.enc.yaml", "rb").read()).hexdigest())
          EOF
          echo "MINT_DAY=$MINT_DAY" >> "$GITHUB_ENV"
          echo "SECRET_NAME=$SECRET_NAME" >> "$GITHUB_ENV"
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"
          echo "encrypt done (ciphertext only, plaintext shredded)"
      - name: 向 dimgs 开密文 PR（只碰目标 app）
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "opencode-sops-reencrypt"
          git config --global user.email "opencode-sops-reencrypt@local"
          rm -rf /tmp/dimgs && git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/link-seek/docker-images.git" /tmp/dimgs
          ENC_NAME="${SECRET_NAME}.enc.yaml"
          cp /tmp/app-env.enc.yaml "/tmp/dimgs/k8s/$APPDIR/$ENC_NAME"
          cd /tmp/dimgs
          # team 例外：browserless 拆独立 Secret（同值单键），与主 Secret 同跑同 PR，不断层。
          EXTRA_FILES=()
          if [ "$APPDIR" = "opencode-team" ]; then
            python3 <<'EOF'
          import re
          import yaml
          d = yaml.safe_load(open("/tmp/app-env.enc.yaml"))
          tok = d["stringData"]["BROWSERLESS_TOKEN"]
          assert re.fullmatch(r"ENC\[AES256_GCM,data:[A-Za-z0-9+/=]+,.*", tok), "token not ciphertext!"
          b = {"apiVersion": "v1", "kind": "Secret",
               "metadata": {"name": "browserless-env", "namespace": "opencode-team",
                            "annotations": dict(d["metadata"].get("annotations", {}))},
               "type": "Opaque", "stringData": {"BROWSERLESS_TOKEN": tok},
               "sops": d["sops"]}
          open("/tmp/browserless-env.enc.yaml", "w").write(yaml.safe_dump(b, default_flow_style=False, sort_keys=False))
          print("browserless enc assembled")
          EOF
            cp /tmp/browserless-env.enc.yaml "/tmp/dimgs/k8s/$APPDIR/browserless-env.enc.yaml"
            EXTRA_FILES+=("k8s/$APPDIR/browserless-env.enc.yaml")
          fi
          if [ -z "$(git status --porcelain -- "k8s/$APPDIR/$ENC_NAME")" ]; then echo "NO-CHANGE: 密文无变化，不开 PR"; exit 0; fi
          BR="chore/$APPDIR-reencrypt-$(date -u +%F)-$GITHUB_RUN_ID"
          git checkout -b "$BR"
          git add "k8s/$APPDIR/$ENC_NAME" "${EXTRA_FILES[@]}"
          git commit -m "chore($APPDIR): 重加密主 Secret（${{ inputs.reason }}，cf-minted-at $MINT_DAY）"
          git push -u origin "$BR"
          SHA="$(sha256sum "k8s/$APPDIR/$ENC_NAME" | cut -d' ' -f1)"
          URL="$(gh pr create --repo link-seek/docker-images --base main --head "$BR" \
            --title "chore($APPDIR): 重加密主 Secret（${{ inputs.reason }}）" \
            --body "由 opencode-sops-reencrypt run $GITHUB_RUN_ID 生成（app=${{ inputs.app }}）。密文-only，明文未进仓。sha256=$SHA，cf-minted-at=$MINT_DAY。合后 Flux ≤5m 同步＋Reloader 重启。只碰 $APPDIR。")"
          echo "PR=$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PR opened: $URL"
