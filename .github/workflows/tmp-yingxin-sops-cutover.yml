name: tmp-yingxin-sops-cutover
# 一次性：yingxin 主 Secret 转 SOPS（只做 yingxin，不碰其它栈）。用完即删，不合长期。
# mode=encrypt：无集群，读 org secrets＋现签 CF 子 token，内存组装→sops 加密→artifact 只落密文。
# mode=activate：只读，验 Flux 落地＋pod 就绪＋xieyucheng 未动。写操作只有 dimgs 密文 PR（另走）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "encrypt=加密出密文；activate=只读验收"
        required: false
        default: "encrypt"
        type: choice
        options: [encrypt, activate]
permissions:
  contents: read
concurrency:
  group: tmp-yingxin-sops-cutover
  cancel-in-progress: false
jobs:
  encrypt:
    if: inputs.mode == 'encrypt'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S_LITELLM: ${{ secrets.OPENCODE_API_KEY }}
      S_GH: ${{ secrets.PROD_GH_TOKEN }}
      S_PWD: ${{ secrets.PROD_OPENCODE_SERVER_PASSWORD }}
      S_AK: ${{ secrets.PROD_HCLOUD_AK }}
      S_SK: ${{ secrets.PROD_HCLOUD_SK }}
      S_SMTP: ${{ secrets.PROD_SMTP_PASS }}
      CF_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 组装＋加密（明文只活 runner 内存）
        run: |
          set -euo pipefail
          for v in S_LITELLM S_GH S_PWD S_AK S_SK S_SMTP CF_TOKEN; do
            [ -n "${!v:-}" ] || { echo "FAIL: $v missing (fail-closed)"; exit 1; }
            echo "::add-mask::${!v}"
          done
          SOPS_VER=v3.13.3
          curl -fsSL --retry 3 -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VER}/sops-${SOPS_VER}.linux.amd64"
          chmod +x /tmp/sops && /tmp/sops --version
          CF_CHILD="$(CF_PARENT_TOKEN_SANITIZED="$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-child.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          CF_AI="$(CF_PARENT_TOKEN_SANITIZED="$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-ai.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          [ -n "$CF_CHILD" ] && [ -n "$CF_AI" ] || { echo "FAIL: CF mint"; exit 1; }
          echo "::add-mask::$CF_CHILD"; echo "::add-mask::$CF_AI"
          MINT_DAY="$(date -u +%F)"
          export CF_CHILD CF_AI MINT_DAY RUN_ID="$GITHUB_RUN_ID"
          python3 <<'EOF'
          import os
          keys = ["LITELLM_API_KEY", "GH_TOKEN", "OPENCODE_SERVER_PASSWORD",
                  "CLOUDFLARE_API_TOKEN", "CF_AI_TOKEN", "HCLOUD_AK", "HCLOUD_SK", "SMTP_PASS"]
          vals = {"LITELLM_API_KEY": os.environ["S_LITELLM"], "GH_TOKEN": os.environ["S_GH"],
                  "OPENCODE_SERVER_PASSWORD": os.environ["S_PWD"], "CLOUDFLARE_API_TOKEN": os.environ["CF_CHILD"],
                  "CF_AI_TOKEN": os.environ["CF_AI"], "HCLOUD_AK": os.environ["S_AK"],
                  "HCLOUD_SK": os.environ["S_SK"], "SMTP_PASS": os.environ["S_SMTP"]}
          assert all(vals[k] for k in keys), "empty value (fail-closed)"
          assert len(keys) == 8
          L = ["# yingxin 主 Secret（SOPS 密文）：仅 Flux 解密，明文只活过加密当次的 runner 内存。",
               "# CF 子 token 现签 90 天：cf-minted-at 见注解，到期重跑本 workflow（mode=encrypt）轮换。",
               "# 生成源：tmp-yingxin-sops-cutover run %s（用完即删）。" % os.environ["RUN_ID"],
               "apiVersion: v1", "kind: Secret",
               "metadata:", "  name: opencode-yingxin-env", "  namespace: opencode-yingxin",
               "  annotations:", '    sops-cutover: "%s"' % os.environ["MINT_DAY"],
               '    cf-minted-at: "%s"' % os.environ["MINT_DAY"],
               "type: Opaque", "stringData:"]
          for k in keys:
              v = vals[k].replace("\\", "\\\\").replace('"', '\\"').replace("\n", "")
              L.append('  %s: "%s"' % (k, v))
          open("/tmp/yingxin-env-plain.yaml", "w").write("\n".join(L) + "\n")
          print("plain assembled keys=%d" % len(keys))
          EOF
          # 只加密 data|stringData（与 docker-images/.sops.yaml 同规矩；kind/metadata 保持明文 Flux 才能认）。
          /tmp/sops --encrypt --age age1xa3yp8xdquu3v0wlg3n2gmlmah7z60uz8m9e0py7xx30ct4vlu8sjhd87z \
            --encrypted-regex '^(data|stringData)$' \
            --output /tmp/opencode-yingxin-env.enc.yaml /tmp/yingxin-env-plain.yaml
          shred -u /tmp/yingxin-env-plain.yaml /tmp/sops
          python3 <<'EOF'
          import re, hashlib
          import yaml
          d = yaml.safe_load(open("/tmp/opencode-yingxin-env.enc.yaml"))
          print("DIAG topkeys=%s kind=%r" % (sorted(d.keys()), d.get("kind")))
          print("DIAG metadata=%r" % (d.get("metadata"),))
          sd = d.get("stringData", {})
          print("DIAG stringkeys=%s" % sorted(sd.keys()))
          assert d["kind"] == "Secret" and d["metadata"]["name"] == "opencode-yingxin-env", "name mismatch"
          assert d["metadata"]["namespace"] == "opencode-yingxin", "ns mismatch"
          sd = d.get("stringData", {})
          exp = {"LITELLM_API_KEY", "GH_TOKEN", "OPENCODE_SERVER_PASSWORD", "CLOUDFLARE_API_TOKEN",
                 "CF_AI_TOKEN", "HCLOUD_AK", "HCLOUD_SK", "SMTP_PASS"}
          assert set(sd) == exp, "keys mismatch: %s" % sorted(set(sd) ^ exp)
          assert all(re.fullmatch(r"ENC\[AES256_GCM,data:[A-Za-z0-9+/=]+,.*", v) for v in sd.values()), "non-ciphertext value!"
          recips = [x.get("recipient") for x in d["sops"]["age"]]
          assert recips == ["age1xa3yp8xdquu3v0wlg3n2gmlmah7z60uz8m9e0py7xx30ct4vlu8sjhd87z"], recips
          print("ENC-OK keys=%s" % sorted(sd))
          print("sha256=%s" % hashlib.sha256(open("/tmp/opencode-yingxin-env.enc.yaml", "rb").read()).hexdigest())
          EOF
          echo "MINT_DAY=$MINT_DAY" >> "$GITHUB_STEP_SUMMARY"
          echo "encrypt done (ciphertext only, plaintext shredded)"
      - name: 上传密文 artifact
        uses: actions/upload-artifact@v4
        with:
          name: yingxin-env-enc
          path: /tmp/opencode-yingxin-env.enc.yaml
          retention-days: 1
  activate:
    if: inputs.mode == 'activate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 标准进网＋组 kubeconfig
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: 只读验收（yingxin 落地＋xieyucheng 未动）
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          echo "== 等 Flux 应用新 deployment（annotation 出现即同步到位，最长 15min） =="
          for i in $(seq 1 30); do
            ANN="$(kubectl -n opencode-yingxin get deploy opencode-yingxin -o jsonpath='{.metadata.annotations.reloader\.stakater\.com/auto}' 2>/dev/null || true)"
            [ "$ANN" = "true" ] && { echo "flux-synced try=$i"; break; }
            sleep 30
            [ "$i" = 30 ] && { echo "FAIL: Flux 未同步"; exit 1; }
          done
          echo "== Secret 8 键（只打键名） =="
          kubectl -n opencode-yingxin get secret opencode-yingxin-env -o json | python3 -c "import json,sys; print(sorted(json.load(sys.stdin)['data'].keys()))"
          echo "== rollout＋pods =="
          kubectl -n opencode-yingxin rollout status deploy/opencode-yingxin --timeout=600s
          kubectl -n opencode-yingxin get pods -o jsonpath='{range .items[*]}{.metadata.name} ready={.status.conditions[?(@.type=="Ready")].status} start={.status.startTime}{"\n"}{end}'
          echo "== xieyucheng 快照（应无重启：startTime 应早于本次切换） =="
          kubectl -n opencode-xieyucheng get deploy opencode -o jsonpath='observedGeneration={.status.observedGeneration}{"\n"}'
          kubectl -n opencode-xieyucheng get pods -o jsonpath='{range .items[*]}{.metadata.name} start={.status.startTime}{"\n"}{end}'
          echo "== 公网 =="
          curl -sS -m 20 -o /dev/null -w "yingxin http=%{http_code}\n" https://opencode.yingxin.net.cn/
          echo ACTIVATE-OK
