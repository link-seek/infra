name: ts-acl-apply

# Tailscale 策略下发/核对（唯一入口）。
#
# 规矩：
#   - 正本是 acl/policy.hujson；本 workflow 只推仓里的文件，不接受自由输入。
#   - mode=verify     只读核对：控制台 ACL 与仓里是否一致，顺便列设备 tag。
#   - mode=apply      覆盖控制台 ACL（必须 confirm=yes）；推完立刻读回逐字段比对。
#   - mode=tag-device 改单台设备的 tag 集合（必须 confirm=yes；覆盖式，要写全）。
#   - mode=delete-device 按 tailnet IP 删离线旧条目（必须 confirm=yes；只删离线且唯一匹配）。
#   - mode=approve-routes 给设备批准 subnet 路由（必须 confirm=yes；device=广播机器，routes 默认 192.168.1.0/24）：读回核对。
# 手动触发，不挂任何自动事件。逻辑都在 acl/ts-acl.py（可在本地直接跑）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify | apply | tag-device | delete-device | approve-routes"
        required: true
        default: verify
        type: choice
        options: [verify, apply, tag-device, delete-device, approve-routes]
      device:
        description: "tag-device/device 用：设备 hostname（如 mesh-hw-21）或 tailnet IP（delete-device 用 IP 精确删离线旧条目）"
        required: false
        default: ""
      tags:
        description: "tag-device 用：完整 tag 集合，逗号分隔（覆盖式，如 tag:mesh,tag:prod）"
        required: false
        default: ""
      confirm:
        description: 'apply / tag-device / approve-routes 必须填 yes'
        required: false
        default: ""
      routes:
        description: "approve-routes 用：逗号分隔的路由（默认 192.168.1.0/24）"
        required: false
        default: "192.168.1.0/24"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TSKEY: ${{ secrets.TS_API_KEY }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      DEVICE: ${{ inputs.device }}
      ROUTES: ${{ inputs.routes }}
      TAGS: ${{ inputs.tags }}
      API: https://api.tailscale.com/api/v2
    steps:
      - uses: actions/checkout@v4

      - name: 执行
        run: |
          set -euo pipefail
          echo "::add-mask::$TSKEY"
          api() { curl -sS -m 30 -H 'Accept: application/json' -u "$TSKEY:" -H 'Content-Type: application/json' "$@"; }
          api_out() { curl -sS -m 30 -o /tmp/out.json -w '%{http_code}' -H 'Accept: application/json' -u "$TSKEY:" -H 'Content-Type: application/json' "$@"; }

          case "$MODE" in
            verify)
              CODE="$(api_out "$API/tailnet/-/acl")"
              [ "$CODE" = 200 ] || { echo "GET ACL HTTP $CODE: $(head -c 200 /tmp/out.json)"; exit 1; }
              cp /tmp/out.json /tmp/remote.json
              python3 acl/ts-acl.py norm acl/policy.hujson > /tmp/local.norm
              python3 acl/ts-acl.py norm /tmp/remote.json > /tmp/remote.norm
              if diff -q /tmp/local.norm /tmp/remote.norm >/dev/null; then
                echo "RESULT: 仓里的 policy.hujson 与控制台一致（in sync）"
              else
                echo "RESULT: 有漂移（控制台 ≠ 仓），下面 仓 → 控制台"
                diff -u /tmp/local.norm /tmp/remote.norm | head -60 || true
              fi
              echo "--- 设备 tag 现状 ---"
              api "$API/tailnet/-/devices" | python3 acl/ts-acl.py devices-table
              ;;

            apply)
              [ "$CONFIRM" = yes ] || { echo "拒绝：apply 需要 confirm=yes"; exit 1; }
              python3 acl/ts-acl.py norm acl/policy.hujson > /tmp/policy.norm
              cp /tmp/policy.norm /tmp/policy.json
              CODE="$(api_out "$API/tailnet/-/acl")"
              [ "$CODE" = 200 ] || { echo "读现状 HTTP $CODE"; exit 1; }
              cp /tmp/out.json /tmp/acl-before.json
              echo "--- 变更规模 ---"
              python3 acl/ts-acl.py change-summary /tmp/acl-before.json /tmp/policy.json
              CODE="$(api_out -X POST --data-binary @/tmp/policy.json "$API/tailnet/-/acl")"
              echo "POST ACL HTTP: $CODE"
              [ "$CODE" = 200 ] || { echo "失败：$(head -c 500 /tmp/out.json)"; exit 1; }
              CODE="$(api_out "$API/tailnet/-/acl")"
              [ "$CODE" = 200 ] || { echo "读回失败 HTTP $CODE"; exit 1; }
              python3 acl/ts-acl.py norm /tmp/out.json > /tmp/remote.norm
              diff -u /tmp/policy.norm /tmp/remote.norm && echo "RESULT: 已生效，控制台 = 仓（逐字段一致）"
              ;;

            tag-device)
              [ "$CONFIRM" = yes ] || { echo "拒绝：tag-device 需要 confirm=yes"; exit 1; }
              [ -n "$DEVICE" ] && [ -n "$TAGS" ] || { echo "拒绝：tag-device 需要 device 与 tags"; exit 1; }
              CODE="$(api_out "$API/tailnet/-/devices")"; mv /tmp/out.json /tmp/dev.json
              echo "GET devices HTTP: $CODE"; [ "$CODE" = 200 ] || exit 1
              DID="$(python3 acl/ts-acl.py device-id "$DEVICE" < /tmp/dev.json)"
              BODY="$(python3 acl/ts-acl.py tags-json "$TAGS")"
              echo "设置 $DEVICE ($DID) tags = $BODY"
              CODE="$(api_out -X POST -d "$BODY" "$API/device/$DID/tags")"
              echo "POST tags HTTP: $CODE  body: $(head -c 300 /tmp/out.json)"
              [ "$CODE" = 200 ] || exit 1
              CODE="$(api_out "$API/tailnet/-/devices")"; mv /tmp/out.json /tmp/dev-after.json
              echo "GET devices HTTP: $CODE"; [ "$CODE" = 200 ] || exit 1
              DEVICE="$DEVICE" python3 -c "import json,os; [print(d.get('hostname'), d.get('addresses')) for d in (json.load(open('/tmp/dev-after.json')).get('devices') or []) if isinstance(d, dict) and d.get('hostname') == os.environ['DEVICE']]"
              ;;

            approve-routes)
              [ "$CONFIRM" = yes ] || { echo "拒绝：approve-routes 需要 confirm=yes"; exit 1; }
              [ -n "${ROUTES:-}" ] || { echo "拒绝：approve-routes 需要 routes"; exit 1; }
              [ -n "${DEVICE:-}" ] || { echo "拒绝：approve-routes 需要 device（广播路由的机器 hostname）"; exit 1; }
              CODE="$(api_out "$API/tailnet/-/devices")"; mv /tmp/out.json /tmp/dev.json
              echo "GET devices HTTP: $CODE"; [ "$CODE" = 200 ] || exit 1
              DID="$(python3 acl/ts-acl.py device-id "$DEVICE" < /tmp/dev.json)"
              echo "设备 $DEVICE -> $DID"
              CODE="$(api_out "$API/device/$DID/routes")"
              echo "GET routes HTTP: $CODE"; [ "$CODE" = 200 ] || exit 1
              python3 -c "import json; d=json.load(open('/tmp/out.json')); print('advertised:', d.get('advertisedRoutes')); print('enabled:', d.get('enabledRoutes'))"
              BODY="$(python3 -c "import json,os; print(json.dumps({'routes': [r.strip() for r in os.environ['ROUTES'].split(',') if r.strip()], 'enabled': True}))")"
              echo "批准: $BODY"
              CODE="$(api_out -X POST -d "$BODY" "$API/device/$DID/routes")"
              echo "POST routes HTTP: $CODE  body: $(head -c 300 /tmp/out.json)"
              [ "$CODE" = 200 ] || [ "$CODE" = 201 ] || exit 1
              CODE="$(api_out "$API/device/$DID/routes")"
              echo "GET routes HTTP: $CODE"; [ "$CODE" = 200 ] || exit 1
              ROUTES="$ROUTES" python3 -c "import json,os,sys; want=set(r.strip() for r in os.environ['ROUTES'].split(',') if r.strip()); got=set((json.load(open('/tmp/out.json')) or {}).get('enabledRoutes') or []); missing=want-got; print('enabled:',sorted(got)); print('RESULT: 路由已批准') if not missing else (print('FAIL:',sorted(missing)), sys.exit(1))"
              ;;

            delete-device)
              [ "$CONFIRM" = yes ] || { echo "拒绝：delete-device 需要 confirm=yes"; exit 1; }
              [ -n "$DEVICE" ] || { echo "拒绝：delete-device 需要 device（tailnet IP，如 100.91.222.51）"; exit 1; }
              CODE="$(api_out "$API/tailnet/-/devices")"; mv /tmp/out.json /tmp/dev.json
              echo "GET devices HTTP: $CODE"; [ "$CODE" = 200 ] || exit 1
              echo "--- 删除前（下行 gate 精确匹配离线唯一；此行仅回显精确命中，永不挂，不做判定） ---"
              DEVICE="$DEVICE" python3 -c "import json,os; [print(d.get('hostname') if isinstance(d, dict) else d, d.get('addresses') if isinstance(d, dict) else '') for d in (json.load(open('/tmp/dev.json')).get('devices') or []) if isinstance(d, dict) and os.environ['DEVICE'] in (d.get('addresses') or [])]" || true
              DID="$(python3 acl/ts-acl.py device-id-by-ip "$DEVICE" < /tmp/dev.json)" || exit 1
              echo "删除设备 id=$DID（ip=$DEVICE）..."
              CODE="$(curl -sS -m 30 -o /tmp/out.json -w '%{http_code}' -H 'Accept: application/json' -u "$TSKEY:" -X DELETE "$API/device/$DID")"
              echo "DELETE HTTP: $CODE  body: $(head -c 300 /tmp/out.json)"
              [ "$CODE" = 200 ] || exit 1
              echo "--- 删除后复核（取数验 HTTP 200 且 devices 为 list；精确匹配判定，fail-closed） ---"
              CODE="$(api_out "$API/tailnet/-/devices")"; mv /tmp/out.json /tmp/dev-after.json
              echo "GET devices HTTP: $CODE"; [ "$CODE" = 200 ] || exit 1
              DEVICE="$DEVICE" python3 -c "import json,os,sys; devs=json.load(open('/tmp/dev-after.json')).get('devices'); assert isinstance(devs, list), '取数异常（devices 非 list）'; ip=os.environ['DEVICE']; print('STILL' if [d for d in devs if ip in (d.get('addresses') or [])] else 'GONE')" > /tmp/del-check.txt || { echo "FAIL: 取数异常"; exit 1; }
              grep -qx GONE /tmp/del-check.txt && echo "DELETED-OK: $DEVICE 已清" || { echo "FAIL: 仍在"; exit 1; }
              ;;

            *) echo "未知 mode: $MODE"; exit 1 ;;
          esac
