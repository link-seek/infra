name: deploy-opencode-trial

# 试用栈：stacks/opencode-trial/** 进 main 即发 1.41。机制与生产共用 deploy-opencode-stack。

on:
  push:
    branches: [main]
    paths: ['stacks/opencode-trial/**']
  workflow_dispatch:

concurrency:
  group: deploy-opencode-trial
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-opencode-stack.yml
    with:
      role: trial
      target: 100.111.231.85
      ssh_port: "2244"
      stack_dir: stacks/opencode-trial
      remote_dir: /root/stacks/opencode-trial
      tar_files: compose.yml README.md .env.example config/opencode.jsonc config/opencode-mem.jsonc
      forbid: "100.91.222.51:prod 100.85.128.116:entry"
      hostname_prefix: ci-infra
      verify_cmd: cd /root/stacks/opencode-trial && docker compose pull --quiet && docker compose up -d && sleep 15 && curl -s -m 10 -o /dev/null -w "4097:%{http_code}\n" http://127.0.0.1:4097/ && (curl -s -m 10 http://127.0.0.1:4747/api/health || echo "plugin-idle (session-activated, expected)")
    secrets:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_TRIAL }}
      SSH_KEY: ${{ secrets.TRIAL_SSH_KEY }}
