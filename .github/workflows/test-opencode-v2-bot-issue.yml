name: test-opencode-v2-bot-issue

# Temporary test workflow for issue-fix mode.
# Triggered when an issue is assigned to AI_ASSIGNEES.

on:
  issues:
    types: [assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    if: contains(format(',{0},', vars.AI_ASSIGNEES), format(',{0},', github.event.assignee.login))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Run OpenCode v2 bot (fix-issue)
        uses: link-seek/opencode-github-bot@v0.1.4
        with:
          model: ${{ vars.OPENCODE_REVIEW_MODEL }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          mode: fix-issue
          issue-number: ${{ github.event.issue.number }}
        env:
          GIT_AUTHOR_NAME: opencode-bot
          GIT_AUTHOR_EMAIL: opencode-bot@users.noreply.github.com