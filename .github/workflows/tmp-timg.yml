name: tmp-timg
# 一次性只读：Traefik pod 镜像＋事件。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-timg
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 标准进网＋组 kubeconfig
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: 取证
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          kubectl -n kube-system get pods -o wide | grep -i -E "traefik|coredns|metrics|local-path|NAME" || true
          kubectl -n kube-system get pod -l app.kubernetes.io/name=traefik -o jsonpath='{range .items[*]}{.metadata.name} image={.spec.containers[0].image} phase={.status.phase}{"\n"}{end}'
          kubectl -n kube-system describe pod -l app.kubernetes.io/name=traefik 2>&1 | grep -a -E "Failed|Back-off|ErrImage|image:|Message" | head -8
          echo DONE
