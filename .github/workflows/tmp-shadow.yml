name: tmp-shadow
# 一次性：影子验证 team-agent 经 Traefik 路由（port-forward + Host 头，零公网影响）。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-shadow
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 标准进网＋组 kubeconfig
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: 影子验证
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          kubectl -n opencode-team get ingress team-agent -o wide || echo "no ingress yet"
          kubectl -n kube-system get svc traefik-edge -o wide || echo "no nodeport yet"
          for T in 100.93.119.21 100.85.128.116; do
            echo "== via $T:30080 =="
            for i in $(seq 1 3); do curl -sS -m 10 -o /dev/null -w "shadow $T try$i http=%{http_code} time=%{time_total}s\n" -H "Host: team-agent.xieyucheng.top" http://$T:30080/ || true; sleep 2; done
          done
          echo SHADOW-DONE
