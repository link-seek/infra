name: tmp-shadow
# 一次性：影子验证 team-agent 经 Traefik 路由（port-forward + Host 头，零公网影响）。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-shadow
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 标准进网＋组 kubeconfig
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: 影子验证
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          kubectl -n opencode-team get ingress team-agent -o wide || echo "no ingress yet"
          kubectl -n kube-system get svc traefik-edge -o wide || echo "no nodeport yet"
          kubectl port-forward -n kube-system svc/traefik 8080:80 >/tmp/pf.log 2>&1 &
          PF=$!
          sleep 8
          for i in $(seq 1 5); do curl -sS -m 10 -o /dev/null -w "shadow try$i http=%{http_code}\n" -H "Host: team-agent.xieyucheng.top" http://127.0.0.1:8080/ || true; sleep 3; done
          kill $PF || true
          echo SHADOW-DONE
