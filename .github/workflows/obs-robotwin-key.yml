name: obs-robotwin-key
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
    steps:
      - name: install hcloud
        run: |
          set -e
          ok=0
          for u in https://obs.cn-north-4.myhuaweicloud.com/koocli/cli/latest/huaweicloud-cli-linux-amd64.tar.gz https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz ; do
            curl -fsSL --retry 4 "$u" -o /tmp/hc.tgz && { ok=1; break; } || true
          done
          [ "$ok" = 1 ] || { echo FAIL; exit 1; }
          mkdir -p /tmp/hc && tar xzf /tmp/hc.tgz -C /tmp/hc
          install -m755 "$(find /tmp/hc -type f -name hcloud|head -1)" /usr/local/bin/hcloud
      - name: run
        run: |
          set +e
          ENDP=https://obs.cn-north-4.myhuaweicloud.com
          hcloud configure set --cli-access-key="$AK" --cli-secret-key="$SK" --cli-region=cn-north-4 --cli-mode=AKSK --cli-agree-privacy-statement=true 2>&1|tail -1
          OBS(){ hcloud OBS "$@" -i="$AK" -k="$SK" -e="$ENDP" 2>&1; }
          mkdir -p /tmp/kd; OBS cp obs://robotwin-assets/key/ /tmp/kd -r -f >/dev/null 2>&1
          echo "== downloaded =="; ls /tmp/kd/key 2>/dev/null
          echo "== SG of 0001/0002 (PROD ECS) =="
          for SID in c5b805bd-5e8d-4ba5-a5ab-7523244da0fa 7f39cb83-1a5c-4792-b65e-e578d7ddb88d; do
            echo "-- $SID --"
            hcloud ECS ShowServer --server_id "$SID" --cli-region=cn-north-4 > /tmp/sv.json 2>/tmp/sve
            echo "rc=$? bytes=$(wc -c </tmp/sv.json)"; head -c 120 /tmp/sve; echo
            python3 -c "import json;d=json.load(open('/tmp/sv.json'));s=d.get('server') or d;print('name=',s.get('name'),'SG=',s.get('security_groups'))" 2>&1 | head -3
          done
          echo "== parse credentials*.csv AK/SK and test perms =="
          python3 - "$AK" "$SK" <<'PY'
          import sys,glob,re,os,subprocess,json
          prod_ak,prod_sk=sys.argv[1],sys.argv[2]
          def run(args,env_ak,env_sk):
              subprocess.run(["hcloud","configure","set","--cli-access-key="+env_ak,"--cli-secret-key="+env_sk,"--cli-region=cn-north-4","--cli-mode=AKSK","--cli-agree-privacy-statement=true"],capture_output=True)
              r=subprocess.run(args,capture_output=True,text=True)
              return r.returncode, len(r.stdout or ""), (r.stderr or "")[:160]
          for f in sorted(glob.glob('/tmp/kd/key/credentials*.csv')):
              t=open(f,errors='ignore').read()
              ak=None;sk=None
              for line in t.splitlines():
                  cells=[c.strip().strip('"') for c in line.split(',')]
                  for c in cells:
                      if re.fullmatch(r'[A-Z0-9]{20}',c): ak=c; break
                  if ak: 
                      for c in cells:
                          if re.fullmatch(r'[A-Za-z0-9/+]{40,64}',c) and c!=ak: sk=c; break
                      if sk: break
              if not ak or not sk: print(os.path.basename(f),"=> parse FAIL"); continue
              print("::add-mask::"+sk)
              r1,s1,e1=run(["hcloud","VPC","ListSecurityGroups/v3","--cli-region=cn-north-4"],ak,sk)
              r2,s2,e2=run(["hcloud","ECS","ListServersDetails","--cli-region=cn-north-4","--limit=1"],ak,sk)
              print("%-26s AK=%s**** VPC_rc=%s VPC_bytes=%s %s | ECS_rc=%s bytes=%s %s"%(os.path.basename(f),ak[:6],r1,s1,e1,r2,s2,e2))
          PY
