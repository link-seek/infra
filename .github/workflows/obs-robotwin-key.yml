name: obs-robotwin-key
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
    steps:
      - name: install hcloud
        run: |
          set -e
          ok=0
          for u in https://obs.cn-north-4.myhuaweicloud.com/koocli/cli/latest/huaweicloud-cli-linux-amd64.tar.gz https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz ; do
            curl -fsSL --retry 4 "$u" -o /tmp/hc.tgz && { ok=1; break; } || true
          done
          [ "$ok" = 1 ] || { echo FAIL; exit 1; }
          mkdir -p /tmp/hc && tar xzf /tmp/hc.tgz -C /tmp/hc
          install -m755 "$(find /tmp/hc -type f -name hcloud|head -1)" /usr/local/bin/hcloud
      - name: run
        run: |
          set +e
          ENDP=https://obs.cn-north-4.myhuaweicloud.com
          hcloud configure set --cli-access-key="$AK" --cli-secret-key="$SK" --cli-region=cn-north-4 --cli-mode=AKSK --cli-agree-privacy-statement=true 2>&1|tail -1
          OBS(){ hcloud OBS "$@" -i="$AK" -k="$SK" -e="$ENDP" 2>&1; }
          mkdir -p /tmp/kd; OBS cp obs://robotwin-assets/key/ /tmp/kd -r -f >/dev/null 2>&1
          python3 - <<'PY' > /tmp/ck.env
          import re
          t=open('/tmp/kd/key/credentials.csv',errors='ignore').read(); ak=sk=None
          for line in t.splitlines():
              cells=[c.strip().strip('"') for c in line.split(',')]
              for c in cells:
                  if re.fullmatch(r'[A-Z0-9]{20}',c): ak=c;break
              if ak:
                  for c in cells:
                      if re.fullmatch(r'[A-Za-z0-9/+]{40,64}',c) and c!=ak: sk=c;break
                  if sk:break
          print("AK2='%s'"%(ak or "")); print("SK2='%s'"%(sk or ""))
          PY
          . /tmp/ck.env
          echo "::add-mask::$AK2"; echo "::add-mask::$SK2"
          hcloud configure set --cli-access-key="$AK2" --cli-secret-key="$SK2" --cli-region=cn-north-4 --cli-mode=AKSK --cli-agree-privacy-statement=true >/dev/null 2>&1
          hcloud ECS ListServersDetails --cli-region=cn-north-4 --limit=100 > /tmp/sl.json 2>/dev/null
          PID=$(python3 -c "import json;d=json.load(open('/tmp/sl.json'));print(next((s.get('tenant_id') for s in d.get('servers',[]) if s.get('id')=='c5b805bd-5e8d-4ba5-a5ab-7523244da0fa'),''))")
          echo "PROJECT_ID=$PID"
          SG=ab0adda4-9bfc-49d7-8dd6-0958bb4d3416
          echo "== current SG rules =="
          hcloud VPC ShowSecurityGroup/v3 --security_group_id="$SG" --project_id="$PID" --cli-region=cn-north-4 > /tmp/sg.json 2>/tmp/sge; head -c150 /tmp/sge
          python3 - <<'PY'
          import json
          try:
           d=json.load(open('/tmp/sg.json')); sg=d.get('security_group') or d
           for r in (sg.get('security_group_rules') or []):
             print('rule',r.get('direction'),r.get('protocol'),r.get('multiport'),r.get('port_range_min'),'-',r.get('port_range_max'),r.get('remote_ip_prefix'),r.get('ethertype'),r.get('description'))
          except Exception as e: print('parse-fail',e,open('/tmp/sg.json').read()[:200])
          PY
          echo "== create rule 121.37.127.185/32 tcp 22 =="
          hcloud VPC CreateSecurityGroupRule/v3 --project_id="$PID" --cli-region=cn-north-4 \
            --security_group_rule.security_group_id=$SG \
            --security_group_rule.direction=ingress \
            --security_group_rule.ethertype=IPv4 \
            --security_group_rule.protocol=tcp \
            --security_group_rule.multiport=22 \
            --security_group_rule.remote_ip_prefix=121.37.127.185/32 \
            --security_group_rule.description=opencode-team-69-egress > /tmp/cr.json 2>/tmp/cre; echo "rc=$?"; head -c 400 /tmp/cre; echo; head -c 400 /tmp/cr.json; echo
          echo "== after rules (22) =="
          hcloud VPC ShowSecurityGroup/v3 --security_group_id="$SG" --project_id="$PID" --cli-region=cn-north-4 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);sg=d.get('security_group') or d;[print('rul',r.get('direction'),r.get('protocol'),r.get('multiport'),r.get('port_range_min'),r.get('remote_ip_prefix')) for r in (sg.get('security_group_rules') or []) if str(r.get('multiport'))=='22' or str(r.get('port_range_min'))=='22' or '121.37.127.185' in str(r.get('remote_ip_prefix'))]"
