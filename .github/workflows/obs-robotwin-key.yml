name: obs-robotwin-key
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
    steps:
      - name: install hcloud
        run: |
          set -e
          ok=0
          for u in https://obs.cn-north-4.myhuaweicloud.com/koocli/cli/latest/huaweicloud-cli-linux-amd64.tar.gz https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz ; do
            curl -fsSL --retry 4 "$u" -o /tmp/hc.tgz && { ok=1; break; } || true
          done
          [ "$ok" = 1 ] || { echo FAIL; exit 1; }
          mkdir -p /tmp/hc && tar xzf /tmp/hc.tgz -C /tmp/hc
          install -m755 "$(find /tmp/hc -type f -name hcloud|head -1)" /usr/local/bin/hcloud
      - name: list
        run: |
          set +e
          hcloud configure set --cli-access-key="$AK" --cli-secret-key="$SK" --cli-region=cn-north-4 --cli-mode=AKSK --cli-agree-privacy-statement=true 2>&1 | tail -1
          ENDP=https://obs.cn-north-4.myhuaweicloud.com
          OBS(){ hcloud OBS "$@" -i="$AK" -k="$SK" -e="$ENDP" 2>&1; }
          echo "== buckets =="; OBS ls | head -20
          echo "== robotwin dirs =="; OBS ls obs://so101-sim-pipeline/assets/robotwin/ -d | head -40
          echo "== robotwin brief =="; OBS ls obs://so101-sim-pipeline/assets/robotwin/ -s | tail -50
          for d in assets/robotwin/key assets/robotwin/keys assets/robotwin/.key assets/robotwin/aksk assets/robotwin/credentials; do
            echo "== $d =="; OBS ls "obs://so101-sim-pipeline/$d" -s | head -15
          done
