name: iac-adopt-cloudflare

# 用官方 cf-terraforming 把现有 Cloudflare DNS 记录生成 Terraform 配置（只读生成，不改线上）。
# 产物作为 artifact 供审核后入 iac/terraform/cloudflare 并 terraform import。
# 需要 org secret CF_PARENT_TOKEN（具备 zone/dns 读权限）。
on:
  workflow_dispatch:
    inputs:
      resource_type:
        description: "cf-terraforming 资源类型（v5 provider）"
        required: false
        default: "cloudflare_dns_record"
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_API_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: install cf-terraforming
        run: |
          set -euo pipefail
          V=0.31.0
          curl -fsSL --retry 5 --retry-delay 3 \
            "https://github.com/cloudflare/cf-terraforming/releases/download/v${V}/cf-terraforming_${V}_linux_amd64.tar.gz" \
            -o /tmp/cft.tgz
          mkdir -p /tmp/cft && tar xzf /tmp/cft.tgz -C /tmp/cft
          install -m755 /tmp/cft/cf-terraforming /usr/local/bin/cf-terraforming
          cf-terraforming version

      - name: terraform init (for provider schema)
        working-directory: iac/terraform/cloudflare
        run: terraform init -backend=false -input=false

      - name: list zones (token diagnostics)
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('success=',d.get('success'));print('errors=',d.get('errors'));print('zones=',[ (z['name'],z['id']) for z in d.get('result') or [] ])"

      - name: generate per zone
        run: |
          set -euo pipefail
          mkdir -p adopt
          TFPLUGIN="${{ github.workspace }}/iac/terraform/cloudflare"
          for Z in xieyucheng.top linkseek.net.cn yingxin.net.cn; do
            ZID=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$Z" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
            if [ -z "$ZID" ]; then echo "skip $Z (no zone id / token perms)"; continue; fi
            echo "== generating $Z ($ZID) =="
            # provider v5 下必须用 env CLOUDFLARE_API_TOKEN 认证，不能 --token 传参（cf-terraforming #790）
            cf-terraforming generate \
              --resource-type "${{ inputs.resource_type }}" \
              --zone "$ZID" \
              --terraform-install-path "$TFPLUGIN" \
              --terraform-binary-path "$(command -v terraform)" \
              > "adopt/${Z}.tf" || echo "GEN-FAIL $Z"
            echo "lines=$(wc -l < adopt/${Z}.tf)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-adopt-tf
          path: adopt/
