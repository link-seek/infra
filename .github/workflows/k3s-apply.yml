name: k3s-apply

# k3s 通用应用骨架（对标 deliver-stack；旧线一行不动）。
# 链路：runner 取 tag:user 入 tailnet（配送身份，user→mesh 有 accept）→ TS SSH 上 HW41（零钥匙）
#   → ssh .69（HW41 key 已种）→ kubectl apply。runner 直达 .69 无路由，.69 不进 tailnet
#  （出入全走 Pod 内 userspace tailscaled，身份 opencode-k3s，Caddy 沿用现成 grant）。
# Secret 全现场 render（组织 Secrets + CF/TS 现签），真值不进仓、不进日志。
# trial verify 只认簇内 200（runner 无 grant 直打 tag:opencode:4097，E2E 在 P4 经 Caddy 验）。

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "k8s/<stack> 目录"
        required: false
        default: "k8s/opencode"
      action:
        description: "apply trial | verify | rollback"
        required: false
        default: "apply"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: resolve stack (NS/APP/DEPLOY/PORT/HEALTH/JOIN_TAG)
        run: |
          APP="$(basename "${{ inputs.stack }}")"
          case "$APP" in
            litellm) DEPLOY=litellm-gateway; PORT=4000; HEALTH=/v1/models; JT=tag:gateway; LBL=litellm-gateway;;
            *) DEPLOY=opencode; PORT=4097; HEALTH=/; JT=tag:opencode; LBL=opencode;;
          esac
          { echo "K3S_NS=$APP"; echo "K3S_DEPLOY=$DEPLOY"; echo "K3S_PORT=$PORT"; echo "K3S_HEALTH=$HEALTH"; echo "K3S_JOIN_TAG=$JT"; echo "K3S_LABEL=$LBL"; echo "K3S_SECRET=${APP}-env"; } >> "$GITHUB_ENV"
          echo "stack=$APP deploy=$DEPLOY port=$PORT join=$JT"

      - name: join tailnet (guest, mint-only)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')" \
            -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: mint"; exit 1; }
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="k3s-applier-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          tailscale ip -4

      - name: render Secret (fail-closed, masked)
        id: secret
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          CF_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
          S_LITELLM: ${{ secrets.OPENCODE_API_KEY }}
          S_GH: ${{ secrets.PROD_GH_TOKEN }}
          S_PWD: ${{ secrets.PROD_OPENCODE_SERVER_PASSWORD }}
          S_AK: ${{ secrets.PROD_HCLOUD_AK }}
          S_SK: ${{ secrets.PROD_HCLOUD_SK }}
          S_SMTP: ${{ secrets.PROD_SMTP_PASS }}
        run: |
          set -euo pipefail
          if [ "$K3S_NS" = "litellm" ]; then
            # 网关：隻要 TS key（tag:gateway）+ 现场随机 master key；无状态，不吃业务 secret。
            [ -n "${TS_API_KEY:-}" ] || { echo "FAIL: TS_API_KEY missing"; exit 1; }
            BODY="$(printf '{"capabilities":{"devices":{"create":{"reusable":true,"ephemeral":true,"preauthorized":true,"tags":["%s"]}}},"expirySeconds":7776000}' "$K3S_JOIN_TAG")"
            TS_JOIN="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')" \
              -H 'Content-Type: application/json' -d "$BODY" \
              https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
            [ -n "$TS_JOIN" ] || { echo "FAIL: TS mint"; exit 1; }
            MASTER="sk-$(python3 -c 'import secrets;print(secrets.token_hex(16))')"
            { echo "TS_JOIN_KEY=$TS_JOIN"; echo "LITELLM_MASTER_KEY=$MASTER"; } > /tmp/opencode-env.txt
            echo "litellm identity: $K3S_JOIN_TAG (TS_HOSTNAME 由 manifest 定)"
            exit 0
          fi
          for v in S_LITELLM S_GH S_PWD S_AK S_SK S_SMTP CF_TOKEN TS_API_KEY; do
            [ -n "${!v:-}" ] || { echo "FAIL: $v missing (fail-closed)"; exit 1; }
          done
          BODY="$(printf '{"capabilities":{"devices":{"create":{"reusable":true,"ephemeral":true,"preauthorized":true,"tags":["%s"]}}},"expirySeconds":7776000}' "$K3S_JOIN_TAG")"
          TS_JOIN="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')" \
            -H 'Content-Type: application/json' -d "$BODY" \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$TS_JOIN" ] || { echo "FAIL: TS mint"; exit 1; }
          CF_CHILD="$(CF_PARENT_TOKEN_SANITIZED="$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-child.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          CF_AI="$(CF_PARENT_TOKEN_SANITIZED="$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-ai.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          [ -n "$CF_CHILD" ] && [ -n "$CF_AI" ] || { echo "FAIL: CF mint"; exit 1; }
          {
            echo "LITELLM_API_KEY=$S_LITELLM"; echo "GH_TOKEN=$S_GH"
            echo "OPENCODE_SERVER_PASSWORD=$S_PWD"; echo "CLOUDFLARE_API_TOKEN=$CF_CHILD"
            echo "CF_AI_TOKEN=$CF_AI"; echo "HCLOUD_AK=$S_AK"; echo "HCLOUD_SK=$S_SK"
            echo "TS_JOIN_KEY=$TS_JOIN"; echo "SMTP_PASS=$S_SMTP"
          } > /tmp/opencode-env.txt
          chmod 600 /tmp/opencode-env.txt
          echo "secret-render-ok: $(grep -c '' /tmp/opencode-env.txt) entries (values masked)"

      - name: ship + apply via HW41 jump（ephemeral key，现生现种）
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          # 现生现种：runner 生 ed25519，经 HW21 跳板种进 41（jump-41 只活这一轮，不进 GH secrets）。
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/jump-41 -q
          PUB="$(cat ~/.ssh/jump-41.pub)"
          SEEDFILE="$(mktemp)"; printf "%s\\n" "$PUB" > "$SEEDFILE"; scp -o BatchMode=yes -P 2244 -i ~/.ssh/ci_key -o StrictHostKeyChecking=no "$SEEDFILE" root@100.91.222.51:/tmp/seed.pub < /dev/null; rm -f "$SEEDFILE"
          # 注意：此处的三层引号是刻意设计（runner→HW21→41），改动前先数清脱衣层数。
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key -o StrictHostKeyChecking=no root@100.91.222.51 "cat /tmp/seed.pub | ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.41 'mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && rm -f /tmp/seed.pub'"
          # runner 为 tag:user（user→mesh 有 accept）；2244 key 路已死（43063036641 实锤）。
          SSH41="ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/jump-41 root@192.168.1.41"
          if [ "${{ inputs.action }}" = "rollback" ]; then
            $SSH41 "ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69 'kubectl -n $K3S_NS rollout undo deploy/$K3S_DEPLOY && kubectl -n $K3S_NS rollout status deploy/$K3S_DEPLOY --timeout=600s'"
          else
            tar czf /tmp/stack.tgz "${{ inputs.stack }}"
            $SSH41 "cat > /tmp/stack.tgz" < /tmp/stack.tgz
            $SSH41 "cat > /tmp/opencode-env.txt && chmod 600 /tmp/opencode-env.txt" < /tmp/opencode-env.txt
            $SSH41 "scp -o BatchMode=yes -o StrictHostKeyChecking=no /tmp/stack.tgz /tmp/opencode-env.txt root@192.168.1.69:/tmp/ && ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69 \
              'set -e; mkdir -p /tmp/k3s-apply && tar xzf /tmp/stack.tgz -C /tmp/k3s-apply && cd /tmp/k3s-apply && kubectl apply -f ${{ inputs.stack }}/namespace.yaml && \
               kubectl create secret docker-registry swr-pull -n $K3S_NS --docker-server=swr.cn-north-9.myhuaweicloud.com --docker-username=\"$SWR_LOGIN_USER\" --docker-password=\"$SWR_LOGIN_PASS\" --dry-run=client -o yaml | kubectl apply -f - && \
               kubectl create secret generic $K3S_SECRET -n $K3S_NS --from-env-file=/tmp/opencode-env.txt --dry-run=client -o yaml | kubectl apply -f - && rm -f /tmp/opencode-env.txt && \
               kubectl apply -R -f ${{ inputs.stack }} && kubectl -n $K3S_NS rollout status deploy/$K3S_DEPLOY --timeout=900s'"
          fi
      - name: verify in-cluster (fail-closed)
        if: inputs.action != 'rollback'
        run: |
          set -euo pipefail
          # 远端整段必须整体非零即红：禁止尾随 ; echo 吞退出码。
          # $ 须转义：外层双引号，否则 $(...) 被 runner 本地展开（kubectl 连 localhost:8080 实锤）。
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/jump-41 root@192.168.1.41 \
            "ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69 \
            'set -euo pipefail; \
            # 探针用 python3（网关/browser 镜像里无 curl；opencode-tools 有 python3 实锤）。
            code=\$(kubectl -n $K3S_NS exec deploy/$K3S_DEPLOY -c $K3S_NS -- python3 -c \"import urllib.request,sys;print(urllib.request.urlopen(sys.argv[1],timeout=15).getcode())\" \"http://127.0.0.1:$K3S_PORT$K3S_HEALTH\" 2>/dev/null || echo FAIL); \
            [ \"\$code\" = \"200\" ] || { echo \"FAIL: app http=\$code\"; exit 1; }; \
            kubectl -n $K3S_NS wait --for=condition=Ready pod -l app=$K3S_LABEL --timeout=180s'"
          echo V-SERVING
      - name: probe tailnet ingress (Caddy视角, fail-closed)
        if: inputs.action != 'rollback' && inputs.stack == 'k8s/opencode'
        run: |
          set -euo pipefail
          # runner 与 Caddy 同为 tailnet 普通节点：直连 pod 身份，验证切流前可达。
          # 先 pod 侧自报（只读诊断，放门前，红了也能看）。
          sudo tailscale ssh root@100.73.182.4 "ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69 'kubectl -n opencode exec deploy/opencode -c opencode -- sh -c \"tailscale --socket=/var/run/tailscale/tailscaled.sock status --json 2>/dev/null | head -c 600; echo; tailscale --socket=/var/run/tailscale/tailscaled.sock ip -4 2>/dev/null || echo no-ip\"'"
          # L3 可见性：netmap 里有没有这个 peer（ACL 过滤的真相；tailscale ping 走系统 DNS，
          # --accept-dns=false 的 runner 上必挂，不能当门，43067087861 系误判已修正）。
          IP=$(sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; print(next((p['TailscaleIPs'][0] for p in peers.values() if 'opencode-k3s' in str(p.get('DNSName','')) or 'opencode-k3s' in str(p.get('HostName',''))),''))")
          [ -n "$IP" ] || { echo INGRESS-NOT-VISIBLE-FAIL; exit 1; }
          # L7：直调 pod IP:4097（Host 头对 opencode 无意义，走 IP 即可；数据面 grant 实测）。
          echo "pod tailnet ip=$IP"
          CODE=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "http://$IP:4097/" || true)
          [ "$CODE" = 200 ] || { echo "INGRESS-HTTP-FAIL http=$CODE"; exit 1; }
          echo INGRESS-OK
          # 附带打印卷位置，给数据同步步骤用（只读）。
          sudo tailscale ssh root@100.73.182.4 "ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69 'kubectl -n opencode get pvc && kubectl get pv'"
      - name: gateway POST 诊断（runner 直调，只 WARN 不拦门）
        if: inputs.action != 'rollback' && inputs.stack == 'k8s/opencode'
        env:
          S_LITELLM: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          # 二分网关 vs pod 路径：runner 经公网 POST（stream:false），只打码不拦门。
          echo "::add-mask::$S_LITELLM"
          CODE=$(curl -s -m 90 -o /tmp/gw-post.out -w '%{http_code}' -X POST https://litellm.linkseek.net.cn/v1/chat/completions \
            -H "Authorization: Bearer $S_LITELLM" -H 'Content-Type: application/json' \
            -d '{"model":"big-pickle","messages":[{"role":"user","content":"1+1=?"}],"max_tokens":5,"stream":false}' || true)
          echo "GW-POST http=$CODE"
          head -c 300 /tmp/gw-post.out; echo
          rm -f /tmp/gw-post.out
          true
      - name: e2e memory recall（内容级门，#338 健康门，fail-closed）
        if: inputs.action != 'rollback' && inputs.stack == 'k8s/opencode'
        run: |
          set -euo pipefail
          # A 写 marker → B 新会话召回。模型走容器内网关，数据走 .69 卷。
          MARK="k3s$(echo "$GITHUB_RUN_ID" | tr -cd '0-9' | tail -c 6)"
          SSH41="ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/jump-41 root@192.168.1.41"
          $SSH41 "cat > /tmp/k3s-e2e-recall.sh" < "$GITHUB_WORKSPACE/scripts/k3s-e2e-recall.sh"
          $SSH41 "chmod +x /tmp/k3s-e2e-recall.sh && /tmp/k3s-e2e-recall.sh '$MARK' && rm -f /tmp/k3s-e2e-recall.sh"
      - name: litellm verify（网关内容门，对标 goss 黑名单 400，fail-closed）
        if: inputs.action != 'rollback' && inputs.stack == 'k8s/litellm'
        run: |
          set -euo pipefail
          # runner（tag:user→tag:gateway:4000 已放行）直连 pod 身份：models 200 + 黑名单模型 400。
          IP=$(sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; print(next((p['TailscaleIPs'][0] for p in peers.values() if 'litellm-gateway-k3s' in str(p.get('DNSName','')) or 'litellm-gateway-k3s' in str(p.get('HostName',''))),''))")
          [ -n "$IP" ] || { echo LITELLM-NOT-VISIBLE-FAIL; exit 1; }
          echo "gateway-k3s tailnet ip=$IP"
          CODE=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "http://$IP:4000/v1/models" || true)
          [ "$CODE" = 200 ] || { echo "LITELLM-MODELS-FAIL http=$CODE"; exit 1; }
          BCODE=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST "http://$IP:4000/v1/chat/completions" -H 'Content-Type: application/json' -d '{"model":"kimi-k3","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' || true)
          [ "$BCODE" = "400" ] || { echo "LITELLM-BLACKLIST-FAIL http=$BCODE"; exit 1; }
          echo LITELLM-OK
