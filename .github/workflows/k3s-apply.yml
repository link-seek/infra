name: k3s-apply

# DEPRECATED（2026-11-14）：manifest 配送已走 Flux pull（#450）。
# 本链仅留应急：Secret 轮换（90天现签）手动 dispatch；平时勿点。
# 下线条件：Secret 改走外部方案后删本文件。

# k3s 通用应用骨架（对标 deliver-stack；旧线一行不动）。
# 链路：runner 取 tag:user 入 tailnet（配送身份）→ 直登 mesh-hw-69
#   (100.93.119.21, tag:mesh+tag:prod) TS SSH（零钥匙）→ kubectl apply。
# 直连实测 DIRECT-OK（tmp-direct-69，runner→.69 hostname+kubectl 通）；
# 旧 HW41/HW21 跳板链路已删，PROD_SSH_KEY/2244 不再需要。
# （Pod 出入仍走 Pod 内 userspace tailscaled，身份 opencode-k3s，Caddy 沿用现成 grant）。
# Secret 全现场 render（组织 Secrets + CF/TS 现签），真值不进仓、不进日志。
# trial verify 只认簇内 200（runner 无 grant 直打 tag:opencode:4097，E2E 在 P4 经 Caddy 验）。

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "k8s/<stack> 目录"
        required: false
        default: "k8s/opencode"
      action:
        description: "apply trial | verify | rollback | secret-only（只建 ns+swr-pull+env Secret，不碰 manifest，Flux 侧用）"
        required: false
        default: "apply"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: resolve stack (NS/APP/DEPLOY/PORT/HEALTH/JOIN_TAG)
        run: |
          APP="$(basename "${{ inputs.stack }}")"
          case "$APP" in
            litellm) DEPLOY=litellm-gateway; PORT=4000; HEALTH=/v1/models; JT=tag:gateway; LBL=litellm-gateway; CONT=litellm; TSHOST=litellm-gateway-k3s;;
            opencode) DEPLOY=opencode; PORT=4097; HEALTH=/; JT=tag:opencode; LBL=opencode; CONT=opencode; TSHOST=opencode-k3s;;
            opencode-team) DEPLOY=opencode; PORT=4097; HEALTH=/; JT=tag:opencode; LBL=opencode-team; CONT=opencode; TSHOST=opencode-team;;
            erpnext) DEPLOY=erpnext-nginx; PORT=8080; HEALTH=/login; JT=tag:k8s; LBL=erpnext-nginx; CONT=nginx; TSHOST=erpnext; HOST=erp.xieyucheng.top;;
          *) DEPLOY=opencode; PORT=4097; HEALTH=/; JT=tag:opencode; LBL=opencode; CONT=opencode; TSHOST=$APP;;
          esac
          { echo "K3S_NS=$APP"; echo "K3S_DEPLOY=$DEPLOY"; echo "K3S_PORT=$PORT"; echo "K3S_HEALTH=$HEALTH"; echo "K3S_JOIN_TAG=$JT"; echo "K3S_LABEL=$LBL"; echo "K3S_SECRET=${APP}-env"; echo "K3S_CONTAINER=$CONT"; echo "K3S_TSHOST=$TSHOST"; echo "K3S_HOST=${HOST:-}"; } >> "$GITHUB_ENV"
          # erpnext 例外：chart secret 名 = fullname（erpnext），不用 -env 后缀（manifest 写死 secretKeyRef name: erpnext）。
          if [ "$APP" = "erpnext" ]; then echo "K3S_SECRET=erpnext" >> "$GITHUB_ENV"; fi
          echo "stack=$APP deploy=$DEPLOY port=$PORT join=$JT"

      - name: join tailnet (guest, mint-only)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')" \
            -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: mint"; exit 1; }
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="k3s-applier-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          tailscale ip -4

      - name: render Secret (fail-closed, masked)
        id: secret
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          CF_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
          S_LITELLM: ${{ secrets.OPENCODE_API_KEY }}
          S_GH: ${{ secrets.PROD_GH_TOKEN }}
          S_PWD: ${{ secrets.PROD_OPENCODE_SERVER_PASSWORD }}
          S_AK: ${{ secrets.PROD_HCLOUD_AK }}
          S_SK: ${{ secrets.PROD_HCLOUD_SK }}
          S_SMTP: ${{ secrets.PROD_SMTP_PASS }}
          S_OK: ${{ secrets.OCI_API_PRIVATE_KEY }}
          S_ALI_AK: ${{ secrets.ALI_AK }}
          S_ALI_SK: ${{ secrets.ALI_SK }}
          S_MAAS: ${{ secrets.MAAS_KEY }}
        run: |
          set -euo pipefail
          if [ "$K3S_NS" = "erpnext" ]; then
            # erpnext trial：只要 db-root + admin 两个 key（chart 写死 secret 名 erpnext）。
            # trial 约定：两值均复用 PROD_OPENCODE_SERVER_PASSWORD（用户确认，不新增 org secret；转正前轮换）。
            [ -n "${S_PWD:-}" ] || { echo "FAIL: S_PWD missing"; exit 1; }
            { echo "mariadb-root-password=$S_PWD"; echo "admin-password=$S_PWD"; } > /tmp/opencode-env.txt
            chmod 600 /tmp/opencode-env.txt
            echo "secret-render-ok: erpnext (2 entries, values masked)"
            exit 0
          fi
          if [ "$K3S_NS" = "litellm" ]; then
            # 网关：隻要 TS key（tag:gateway）+ 现场随机 master key；无状态，不吃业务 secret。
            [ -n "${TS_API_KEY:-}" ] || { echo "FAIL: TS_API_KEY missing"; exit 1; }
            BODY="$(printf '{"capabilities":{"devices":{"create":{"reusable":true,"ephemeral":true,"preauthorized":true,"tags":["%s"]}}},"expirySeconds":7776000}' "$K3S_JOIN_TAG")"
            TS_JOIN="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')" \
              -H 'Content-Type: application/json' -d "$BODY" \
              https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
            [ -n "$TS_JOIN" ] || { echo "FAIL: TS mint"; exit 1; }
            MASTER="sk-$(python3 -c 'import secrets;print(secrets.token_hex(16))')"
            { echo "TS_JOIN_KEY=$TS_JOIN"; echo "LITELLM_MASTER_KEY=$MASTER"; } > /tmp/opencode-env.txt
            echo "litellm identity: $K3S_JOIN_TAG (TS_HOSTNAME 由 manifest 定)"
            exit 0
          fi
          for v in S_LITELLM S_GH S_PWD S_AK S_SK S_SMTP CF_TOKEN TS_API_KEY; do
            [ -n "${!v:-}" ] || { echo "FAIL: $v missing (fail-closed)"; exit 1; }
          done
          BODY="$(printf '{"capabilities":{"devices":{"create":{"reusable":true,"ephemeral":true,"preauthorized":true,"tags":["%s"]}}},"expirySeconds":7776000}' "$K3S_JOIN_TAG")"
          TS_JOIN="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')" \
            -H 'Content-Type: application/json' -d "$BODY" \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$TS_JOIN" ] || { echo "FAIL: TS mint"; exit 1; }
          CF_CHILD="$(CF_PARENT_TOKEN_SANITIZED="$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-child.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          CF_AI="$(CF_PARENT_TOKEN_SANITIZED="$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-ai.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          [ -n "$CF_CHILD" ] && [ -n "$CF_AI" ] || { echo "FAIL: CF mint"; exit 1; }
          {
            echo "LITELLM_API_KEY=$S_LITELLM"; echo "GH_TOKEN=$S_GH"
            echo "OPENCODE_SERVER_PASSWORD=$S_PWD"; echo "CLOUDFLARE_API_TOKEN=$CF_CHILD"
            echo "CF_AI_TOKEN=$CF_AI"; echo "HCLOUD_AK=$S_AK"; echo "HCLOUD_SK=$S_SK"
            echo "TS_JOIN_KEY=$TS_JOIN"; echo "SMTP_PASS=$S_SMTP"
          } > /tmp/opencode-env.txt
          if [ "$K3S_NS" = "opencode-team" ]; then
            echo "BROWSERLESS_TOKEN=$(python3 -c 'import secrets;print(secrets.token_hex(24))')" >> /tmp/opencode-env.txt
          fi
          if [ "$K3S_NS" = "opencode-team" ]; then
            [ -n "${S_MAAS:-}" ] || { echo "FAIL: S_MAAS missing (MAAS_KEY)"; exit 1; }
            echo "MAAS_KEY=$S_MAAS" >> /tmp/opencode-env.txt
          fi
          if [ "$K3S_NS" = "opencode-xieyucheng" ]; then
            # 阿里云身份（pilot 专用；单行键，env-file 直装；CLI 读原生 env 名）
            for v in S_ALI_AK S_ALI_SK; do
              [ -n "${!v:-}" ] || { echo "FAIL: $v missing (ALI identity)"; exit 1; }
            done
            {
              echo "ALIBABACLOUD_ACCESS_KEY_ID=$S_ALI_AK"
              echo "ALIBABACLOUD_ACCESS_KEY_SECRET=$S_ALI_SK"
            } >> /tmp/opencode-env.txt
            echo "ali identity staged (xieyucheng only)"
          fi
          if [ "$K3S_NS" = "opencode-xieyucheng" ]; then
            # OCI 身份（pilot 专用；PEM 多行走 --from-file，不进 env-file）
            [ -n "${S_OK:-}" ] || { echo "FAIL: S_OK missing (OCI private key)"; exit 1; }
            printf '%s' "$S_OK" > /tmp/oci-key.pem && chmod 600 /tmp/oci-key.pem
            echo "oci identity staged (xieyucheng only)"
          fi
          chmod 600 /tmp/opencode-env.txt
          echo "secret-render-ok: $(grep -c '' /tmp/opencode-env.txt) entries (values masked)"

      - name: ship + apply direct to .69 (TS SSH, 零钥匙)
        if: inputs.action != 'secret-only'
        env:
          SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          # runner 是 tag:user，直登 mesh-hw-69（100.93.119.21，tag:prod+tag:mesh，
          # grants+ssh 双放行，DIRECT-OK 实锤）。单跳，无钥匙，不经 HW21/HW41。
          SSH69="sudo tailscale ssh root@100.93.119.21"
          if [ "${{ inputs.action }}" = "rollback" ]; then
            $SSH69 "kubectl -n $K3S_NS rollout undo deploy/$K3S_DEPLOY && kubectl -n $K3S_NS rollout status deploy/$K3S_DEPLOY --timeout=600s"
          elif [ ! -d "${{ inputs.stack }}" ]; then
            echo "VERIFY-ONLY: 本地无 ${{ inputs.stack }}（manifest 已搬商家仓，归 Flux），跳过直装，只验活"
          else
            tar czf /tmp/stack.tgz "${{ inputs.stack }}"
            $SSH69 "cat > /tmp/stack.tgz" < /tmp/stack.tgz
            $SSH69 "cat > /tmp/opencode-env.txt && chmod 600 /tmp/opencode-env.txt" < /tmp/opencode-env.txt
            $SSH69 "set -e; mkdir -p /tmp/k3s-apply && tar xzf /tmp/stack.tgz -C /tmp/k3s-apply && cd /tmp/k3s-apply && kubectl apply -f ${{ inputs.stack }}/namespace.yaml && \
               kubectl create secret docker-registry swr-pull -n $K3S_NS --docker-server=swr.cn-north-9.myhuaweicloud.com --docker-username=\"$SWR_LOGIN_USER\" --docker-password=\"$SWR_LOGIN_PASS\" --dry-run=client -o yaml | kubectl apply -f - && \
               kubectl create secret generic $K3S_SECRET -n $K3S_NS --from-env-file=/tmp/opencode-env.txt --dry-run=client -o yaml | kubectl apply -f - && rm -f /tmp/opencode-env.txt && \
               kubectl apply -R -f ${{ inputs.stack }} && kubectl -n $K3S_NS rollout status deploy/$K3S_DEPLOY --timeout=900s"
          fi
      - name: secret-only（ns + swr-pull + env Secret，不碰 manifest）
        if: inputs.action == 'secret-only'
        env:
          SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          SSH69="sudo tailscale ssh root@100.93.119.21"
          $SSH69 "cat > /tmp/opencode-env.txt && chmod 600 /tmp/opencode-env.txt" < /tmp/opencode-env.txt
          # kubectl 禁止 from-env-file 混 from-file：key 改 patch 追加（merge 不剪枝；下次 apply 若剪掉本步照补，幂等）
          OCI_PATCH_NEED="no"
          [ -f /tmp/oci-key.pem ] && OCI_PATCH_NEED="yes"
          $SSH69 "set -e; kubectl create namespace $K3S_NS --dry-run=client -o yaml | kubectl apply -f - && \
             kubectl create secret docker-registry swr-pull -n $K3S_NS --docker-server=swr.cn-north-9.myhuaweicloud.com --docker-username=\"$SWR_LOGIN_USER\" --docker-password=\"$SWR_LOGIN_PASS\" --dry-run=client -o yaml | kubectl apply -f - && \
             kubectl create secret generic $K3S_SECRET -n $K3S_NS --from-env-file=/tmp/opencode-env.txt --dry-run=client -o yaml | kubectl apply -f - && rm -f /tmp/opencode-env.txt"
          if [ "$OCI_PATCH_NEED" = "yes" ]; then
            OCI_B64="$(base64 -w0 /tmp/oci-key.pem)"
            [ -n "$OCI_B64" ] || { echo "FAIL: oci-key.pem 为空"; exit 1; }
            $SSH69 "kubectl patch secret $K3S_SECRET -n $K3S_NS -p '{\"data\":{\"OCI_CLI_KEY_CONTENT\":\"$OCI_B64\"}}'"
            echo "OCI KEY PATCHED: secret=$K3S_SECRET"
          fi
          echo "SECRET-ONLY OK: ns=$K3S_NS secret=$K3S_SECRET"
      - name: verify in-cluster (fail-closed)
        if: inputs.action == 'apply' || inputs.action == 'trial' || inputs.action == 'verify'
        run: |
          set -euo pipefail
          # 远端整段必须整体非零即红：禁止尾随 ; echo 吞退出码。
          # $ 须转义：外层双引号，否则 $(...) 被 runner 本地展开（kubectl 连 localhost:8080 实锤）。
          # 直登 .69 单跳（旧 HW21 双跳已删）。
          sudo tailscale ssh root@100.93.119.21 \
            "set -euo pipefail; \
            # 探针用 python3（网关/browser 镜像里无 curl；opencode-tools 有 python3 实锤）。
            for ATTEMPT in 1 2 3; do code=\$(kubectl -n $K3S_NS exec deploy/$K3S_DEPLOY -c $K3S_CONTAINER -- env K3S_HOST=\"$K3S_HOST\" python3 -c \"import urllib.request,os,sys;h={'Host':os.environ['K3S_HOST']} if os.environ.get('K3S_HOST') else {};print(urllib.request.urlopen(urllib.request.Request(sys.argv[1],headers=h),timeout=15).getcode())\" \"http://127.0.0.1:$K3S_PORT$K3S_HEALTH\" 2>&1); echo \"attempt \$ATTEMPT rc=\$? out=\$code\"; echo \"\$code\" | grep -aqE \"^[0-9]{3}$\" && break || sleep 10; done; code=\$(echo \"\$code\" | grep -aoE \"[0-9]{3}\" | tail -n 1); \
            [ \"\$code\" = \"200\" ] || { echo \"FAIL: app http=\$code\"; exit 1; }; \
            kubectl -n $K3S_NS wait --for=condition=Ready pod -l app=$K3S_LABEL --timeout=180s"
          echo V-SERVING
      - name: 失败诊断（只读 dump，对标 bake-stack 预检诊断）
        if: failure() && (inputs.action == 'apply' || inputs.action == 'trial' || inputs.action == 'verify')
        run: |
          set -euo pipefail
          sudo tailscale ssh root@100.93.119.21             "kubectl -n flux-system get kustomization 2>&1 | tail -12; echo ---; kubectl -n flux-system get kustomization $K3S_NS -o jsonpath='{.status.conditions}' 2>&1 | head -c 1500; echo; echo ---; kubectl -n $K3S_NS get deploy -o jsonpath='{range .items[*]}{.metadata.name} {.spec.template.spec.nodeSelector} images={range .spec.template.spec.containers[*]}{.image} {end}{\"\n\"}{end}' 2>&1 | head -15; echo ---; kubectl -n $K3S_NS get sts erpnext-mariadb-sts -o jsonpath='sts-template-nodeselector={.spec.template.spec.nodeSelector} updaterev={.status.updateRevision} currentrev={.status.currentRevision} ready={.status.readyReplicas}' 2>&1; echo; echo ---; kubectl -n $K3S_NS describe pod erpnext-mariadb-sts-0 2>&1 | grep -aE 'Status:|Reason:|Message:|Failed|Warning|node' | head -20; echo ---; kubectl -n $K3S_NS get events --sort-by=.lastTimestamp 2>&1 | grep -aiE 'schedul|provision|provisioner|failed|unschedulable|affinity|taint|volume' | tail -15" || true
          sudo tailscale ssh root@100.93.119.21             "kubectl -n $K3S_NS get sts erpnext-mariadb-sts -o jsonpath='updaterev={.status.updateRevision} currentrev={.status.currentRevision} observedgen={.status.observedGeneration} gen={.metadata.generation} strategy={.spec.updateStrategy} replicas={.status.replicas}' 2>&1; echo; echo ---; journalctl -u k3s --since '30 min ago' 2>/dev/null | grep -aiE 'statefulset|erpnext-mariadb' | tail -15; echo ---; kubectl -n $K3S_NS get events --sort-by=.lastTimestamp 2>&1 | tail -25" || true
          sudo tailscale ssh root@100.93.119.21             "kubectl -n $K3S_NS get job 2>&1 | tail -8; echo ---; kubectl -n $K3S_NS logs job/erpnext-conf-bench-r3 --all-containers=true --tail=30 2>&1 | tail -35; echo ---; kubectl -n $K3S_NS logs deploy/erpnext-socketio --tail=20 2>&1 | tail -23" || true
          sudo tailscale ssh root@100.93.119.21             "kubectl -n $K3S_NS get pods 2>&1 | tail -20; echo ---; kubectl -n $K3S_NS get endpoints 2>&1 | tail -12; echo ---; kubectl -n $K3S_NS logs deploy/erpnext-nginx --tail=30 2>&1 | tail -35; echo ---; kubectl -n $K3S_NS logs deploy/erpnext-gunicorn --tail=30 2>&1 | tail -35" || true
      - name: probe tailnet ingress (Caddy视角, fail-closed)
        if: (inputs.action == 'apply' || inputs.action == 'trial' || inputs.action == 'verify') && startsWith(inputs.stack, 'k8s/opencode')
        run: |
          set -euo pipefail
          # runner 与 Caddy 同为 tailnet 普通节点：直连 pod 身份，验证切流前可达。
          # 先 pod 侧自报（只读诊断，放门前，红了也能看）。直登 .69 单跳。
          sudo tailscale ssh root@100.93.119.21 "kubectl -n $K3S_NS exec deploy/$K3S_DEPLOY -c $K3S_CONTAINER -- sh -c 'tailscale --socket=/var/run/tailscale/tailscaled.sock status --json 2>/dev/null | head -c 600; echo; tailscale --socket=/var/run/tailscale/tailscaled.sock ip -4 2>/dev/null || echo no-ip'"
          # L3 可见性：netmap 里有没有这个 peer（ACL 过滤的真相；tailscale ping 走系统 DNS，
          # --accept-dns=false 的 runner 上必挂，不能当门，43067087861 系误判已修正）。
          # L3 可见性：netmap 里有没有这个 peer。
          # team 例外：operator 代理设备（tag:k8s）只在常驻节点 netmap 可见，
          # ephemeral runner 天生失明——探针主体跑 .69（脚本正本见 scripts/k3s-team-probe.py，
          # 现场 base64 编码喂过去，彻底避开多层引号）。其它栈沿用 runner 直连（历史行为，不动）。
          if [ "$K3S_NS" = "opencode-team" ]; then
            PROBE_B64="$(base64 -w0 "$GITHUB_WORKSPACE/scripts/k3s-team-probe.py")"
            OUT="$(sudo tailscale ssh root@100.93.119.21 "echo $PROBE_B64 | base64 -d | python3 - $K3S_NS")"
            echo "$OUT"
            IP="$(echo "$OUT" | grep '^IP=' | cut -d= -f2-)"
            CODE="$(echo "$OUT" | grep '^HTTP=' | cut -d= -f2-)"
          else
          IP=$(sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; print(next((p['TailscaleIPs'][0] for p in peers.values() if '$K3S_TSHOST' in str(p.get('DNSName','')) or '$K3S_TSHOST' in str(p.get('HostName',''))),''))")
            sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; rows=[(p.get('HostName'),(p.get('TailscaleIPs') or ['?'])[0]) for p in peers.values()]; print('PEERS-TOTAL', len(rows)); [print('PEER', h, ip) for h,ip in rows if any(k in str(h) for k in ('opencode','xieyucheng','mesh-hw','litellm','gateway'))]" || true
          echo "pod tailnet ip=$IP"
          CODE=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "http://$IP:$K3S_PORT/" || true)
          fi
          [ "$CODE" = 200 ] || { echo "INGRESS-HTTP-FAIL http=$CODE"; exit 1; }
          echo INGRESS-OK
          # 附带打印卷位置，给数据同步步骤用（只读）。直登 .69 单跳。
          sudo tailscale ssh root@100.93.119.21 "kubectl -n $K3S_NS get pvc && kubectl get pv"
      - name: gateway POST 诊断（runner 直调，只 WARN 不拦门）
        if: inputs.action != 'rollback' && inputs.stack == 'k8s/opencode'
        env:
          S_LITELLM: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          # 二分网关 vs pod 路径：runner 经公网 POST（stream:false），只打码不拦门。
          echo "::add-mask::$S_LITELLM"
          CODE=$(curl -s -m 90 -o /tmp/gw-post.out -w '%{http_code}' -X POST https://litellm.linkseek.net.cn/v1/chat/completions \
            -H "Authorization: Bearer $S_LITELLM" -H 'Content-Type: application/json' \
            -d '{"model":"big-pickle","messages":[{"role":"user","content":"1+1=?"}],"max_tokens":5,"stream":false}' || true)
          echo "GW-POST http=$CODE"
          head -c 300 /tmp/gw-post.out; echo
          rm -f /tmp/gw-post.out
          true
      - name: e2e memory recall（内容级门，#338 健康门，fail-closed）
        if: (inputs.action == 'apply' || inputs.action == 'trial' || inputs.action == 'verify') && startsWith(inputs.stack, 'k8s/opencode')
        run: |
          set -euo pipefail
          # A 写 marker → B 新会话召回。模型走容器内网关，数据走本栈卷。直登 .69 单跳。
          MARK="k3s$(echo "$GITHUB_RUN_ID" | tr -cd '0-9' | tail -c 6)"
          SSH69="sudo tailscale ssh root@100.93.119.21"
          $SSH69 "cat > /tmp/k3s-e2e-recall.sh" < "$GITHUB_WORKSPACE/scripts/k3s-e2e-recall.sh"
          $SSH69 "chmod +x /tmp/k3s-e2e-recall.sh && K3S_NS='$K3S_NS' K3S_DEPLOY='$K3S_DEPLOY' /tmp/k3s-e2e-recall.sh '$MARK' && rm -f /tmp/k3s-e2e-recall.sh"
      - name: litellm verify（网关内容门，对标 goss 黑名单 400，fail-closed）
        if: inputs.action != 'rollback' && inputs.stack == 'k8s/litellm'
        run: |
          set -euo pipefail
          # runner（tag:user→tag:gateway:4000 已放行）直连 pod 身份：models 200 + 黑名单模型 400。
          IP=$(sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; print(next((p['TailscaleIPs'][0] for p in peers.values() if 'litellm-gateway-k3s' in str(p.get('DNSName','')) or 'litellm-gateway-k3s' in str(p.get('HostName',''))),''))")
          [ -n "$IP" ] || { echo LITELLM-NOT-VISIBLE-FAIL; exit 1; }
          echo "gateway-k3s tailnet ip=$IP"
          CODE=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "http://$IP:4000/v1/models" || true)
          [ "$CODE" = 200 ] || { echo "LITELLM-MODELS-FAIL http=$CODE"; exit 1; }
          BCODE=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST "http://$IP:4000/v1/chat/completions" -H 'Content-Type: application/json' -d '{"model":"kimi-k3","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' || true)
          [ "$BCODE" = "400" ] || { echo "LITELLM-BLACKLIST-FAIL http=$BCODE"; exit 1; }
          echo LITELLM-OK
