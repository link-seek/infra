name: deliver-stack
# 快递线（deliver）：只管送达到目标机；镜像内容由商家（docker-images bake-*）负责，不管内容。

# 复用快递线：唯一会动目标机的线。调用方=各栈薄调用 / img-preflight / 人类 dispatch。
# 输入只有：节点标签、digest-or-tag（默认 stable，进门即冻结为 digest）、栈目录、up/down/preflight。
# 铁律：正常发走 stable（已祝福）；指名 digest 只用于回滚/救火，且必须在记录里写清原因。
# action=preflight 只到探针（img 场景，canary 留给调用方处置）；up 的探针级别看栈 manifest 的 UP_PROBE_LEVEL。
# TS-only：远端一律经 Tailscale SSH；无 local 执行器、无 role、无 bypass、无审批、无 teardown。
# 蓝绿：同 env 同网络起 canary 探针，绿才切流（留下 canary），红删 canary 旧容器不动。

on:
  workflow_call:
    inputs:
      node_tag:
        required: false
        type: string
        default: prod
      digest_or_tag:
        required: false
        type: string
        default: stable
      stack_dir:
        required: true
        type: string
      action:
        required: false
        type: string
        default: up
      ssh_key_b64:
        required: false
        type: string
        default: ""
      ssh_transport:
        required: false
        type: string
        default: tailscale   # tailscale（TS SSH 22）为主；key（2244 + 私钥）只留手动回退。
    secrets:
      TS_API_KEY:
        required: true
      SSH_KEY:
        required: false
      SWR_LOGIN_USER:
        required: false
      SWR_LOGIN_PASS:
        required: false
      OPENCODE_API_KEY:
        required: false
      ENV_GH_TOKEN:
        required: false
      ENV_LITELLM_API_KEY:
        required: false
      ENV_OPENCODE_SERVER_PASSWORD:
        required: false
      ENV_CLOUDFLARE_API_TOKEN:
        required: false
      ENV_HCLOUD_AK:
        required: false
      ENV_HCLOUD_SK:
        required: false
      ENV_SMTP_PASS:
        required: false
      CF_PARENT_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      node_tag:
        description: "TS 标签（tag:xxx）或主机名（host:yyy），默认 prod"
        required: false
        default: prod
      digest_or_tag:
        description: "digest（sha256:…）或 tag，默认 stable，进门即冻结"
        required: false
        default: stable
      stack_dir:
        description: "栈目录，如 stacks/opencode-prod"
        required: true
        type: choice
        options:
          - stacks/litellm-gateway
          - stacks/opencode-prod
      action:
        description: "up 部署 / down 下线 / preflight 只到探针（img 场景）"
        required: false
        default: up
        type: choice
        options:
          - up
          - down
          - preflight
      ssh_key_b64:
        description: "临时 SSH 私钥（base64，img 等临机场景；留空则用仓库 SSH_KEY）"
        required: false
        default: ""
      ssh_transport:
        description: "tailscale（TS SSH 22）或 key（2244+私钥，仅回退）"
        required: false
        default: tailscale
        type: choice
        options:
          - key
          - tailscale

concurrency:
  group: deliver-stack-${{ inputs.stack_dir }}-${{ inputs.node_tag }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 门禁（digest 存在性，fail-closed）
        id: gate
        env:
          SWR_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          DIGEST="$(STACK_DIR="${{ inputs.stack_dir }}" SWR_USER="${SWR_USER:-}" SWR_PASS="${SWR_PASS:-}" bash scripts/freeze-digest.sh "${{ inputs.digest_or_tag }}")"
          echo "frozen digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: 加网 + 解析节点（TS-only；API token 现场 mint，mint-only）
        id: target
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          [ -z "$TSKEY" ] || echo "::add-mask::$TSKEY"
          MINTED=""
          if [ -n "$TSKEY" ]; then
            MINT_BODY="{\"capabilities\":{\"devices\":{\"create\":{\"reusable\":false,\"ephemeral\":true,\"preauthorized\":true,\"tags\":[\"tag:ci\"]}}},\"expirySeconds\":21600}"
            # tag:ci 必须在 ACL tagOwners 里先定义（PR #90）；加上后节点身份=taged，不再是 autogroup:member。
            MINT_RESP="$(mktemp)"
            MINT_CODE="$(curl -sS -m 30 -o "$MINT_RESP" -w '%{http_code}' -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
              -d "$MINT_BODY" \
              https://api.tailscale.com/api/v2/tailnet/-/keys 2>/tmp/mint.err || true)"
            if [ "$MINT_CODE" = "200" ] || [ "$MINT_CODE" = "201" ]; then
              echo "mint-bearer: HTTP $MINT_CODE（包体已遮蔽，内含 key）"
              MINTED="$(python3 -c "import json; print(json.load(open('$MINT_RESP')).get('key',''))" || true)"
              [ -n "$MINTED" ] && echo "::add-mask::$MINTED"
            else
              echo "mint-bearer: HTTP $MINT_CODE body: $(head -c 400 "$MINT_RESP")"
            fi
            if [ -z "$MINTED" ]; then
              MINT_CODE2="$(curl -sS -m 30 -o "$MINT_RESP" -w '%{http_code}' -X POST -u "$TSKEY:" -H 'Content-Type: application/json' \
                -d "$MINT_BODY" \
                https://api.tailscale.com/api/v2/tailnet/-/keys 2>/tmp/mint.err || true)"
              if [ "$MINT_CODE2" = "200" ] || [ "$MINT_CODE2" = "201" ]; then
                echo "mint-basic: HTTP $MINT_CODE2（包体已遮蔽，内含 key）"
                MINTED="$(python3 -c "import json; print(json.load(open('$MINT_RESP')).get('key',''))" || true)"
                [ -n "$MINTED" ] && echo "::add-mask::$MINTED"
              else
                echo "mint-basic: HTTP $MINT_CODE2 body: $(head -c 400 "$MINT_RESP")"
              fi
            fi
            rm -f "$MINT_RESP"
          fi
          if [ -n "$MINTED" ]; then
            echo "ephemeral key minted（无 tag + preauthorized，有效期 21600s）"
            timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-deploy-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false \
              || { echo "TS-UP-FAILED"; sudo tailscale status 2>&1 | head -n 5; exit 1; }
          else
            echo "FAIL: 现场 mint 未成功（无 TS_API_KEY 或 Bearer/Basic 双试皆拒，见上）；本线 mint-only，不回退任何直连 key（含已退役的 TAILSCALE_AUTH_KEY_PROD）"
            exit 1
          fi
          set -x
          TAG="${{ inputs.node_tag }}"
          if [[ "$TAG" == host:* ]]; then
            HN="${TAG#host:}"; IP="$(tailscale status --json | python3 -c "import json,sys; ps=json.load(sys.stdin)['Peer']; ms=[p['TailscaleIPs'][0] for p in ps.values() if p.get('HostName')=='$HN']; print(ms[0] if ms else 'NO-MATCH')")"
          else
            TG="${TAG#tag:}"; [ "$TG" = "$TAG" ] && TG="$TAG"; TG="${TG#tag:}"
            IP="$(tailscale status --json | python3 -c "import json,sys; ps=json.load(sys.stdin)['Peer']; ms=[p['TailscaleIPs'][0] for p in ps.values() if 'tag:$TG' in (p.get('Tags') or [])]; print(ms[0] if ms else 'NO-MATCH')")"
          fi
          [ "$IP" != "NO-MATCH" ] || { echo "FAIL: 标签/主机 $TAG 在 tailnet 无匹配（tag 需后台先贴好）"; tailscale status --json | python3 -c "import json,sys; d=json.load(sys.stdin); print('self:', d.get('Self',{}).get('HostName')); [print(p.get('HostName'), p.get('Tags')) for p in d['Peer'].values()]"; exit 1; }
          echo "target $TAG -> $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          # 脆弱点已删：旧 forbid 名单（trial 下线期在线即误杀全部 deploy，见 2026-10-23 containment 开火事件）。
          # 现只留 entry 探测（entry 是跳板机，部署流量绝不该碰它；trial 已退役，不再探测）。
          for f in 100.85.128.116:entry; do
            ip="${f%%:*}"; label="${f##*:}"
            timeout 12 bash -c "</dev/tcp/$ip/2244" && { echo "CONTAINMENT FAIL: 摸到了 $label"; exit 1; } || echo "containment ok ($label unreachable)"
          done

      - name: 双侧证据②：infra 侧网络面转储（仅 preflight，只记录不判死）
        if: inputs.action == 'preflight'
        env:
          TARGET_IP: ${{ steps.target.outputs.ip }}
        run: |
          set -uo pipefail
          echo "=== SELF+TARGET-PEER ==="
          tailscale status --json | python3 -c "import json,os,sys; d=json.load(sys.stdin); s=d.get('Self',{}); t=os.environ['TARGET_IP']; print('self:', s.get('HostName'), s.get('TailscaleIPs')); print('target-peer:', [(p.get('HostName'),p.get('TailscaleIPs')) for p in d.get('Peer',{}).values() if (p.get('TailscaleIPs') or [''])[0]==t])" || true
          echo "=== NETCHECK FULL ==="
          tailscale netcheck --format=json > /tmp/infra_netcheck.json 2>/tmp/infra_netcheck.err || echo "netcheck rc=$?"
          python3 - <<'EOF' || true
          import json
          try:
              d = json.load(open('/tmp/infra_netcheck.json'))
          except Exception as e:
              print('netcheck 无 JSON:', e); raise SystemExit(0)
          print('UDP:', d.get('UDP'), 'MappingVariesByDestIP:', d.get('MappingVariesByDestIP'))
          print('DERP_latency:', json.dumps(d.get('DERP_latency', {})))
          print('PreferredDERP:', d.get('PreferredDERP'))
          EOF
          echo "=== DERP 443 直探（取自 DERPMap） ==="
          python3 -c "import json; d=json.load(open('/tmp/infra_netcheck.json')); print('\n'.join(sorted({v.get('Hostname','') for r in d.get('DERPMap',{}).get('Regions',{}).values() for v in r.get('Nodes',[])}) - {''}))" 2>/dev/null | head -n 8 | while read -r h; do (timeout 10 bash -c "</dev/tcp/$h/443" && echo "DERP-OK $h" || echo "DERP-FAIL $h"); done || true
          echo "=== PING TARGET x10（定 direct/relay，只记录） ==="
          tailscale ping -c 10 "$TARGET_IP" || echo "ping 非绿（记录）"
          echo "EVIDENCE-INFRA-OK"

      - name: 部署（同步→canary→探针→切流/丢弃）
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_B64: ${{ inputs.ssh_key_b64 }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          SWR_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_PASS: ${{ secrets.SWR_LOGIN_PASS }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ENV_GH_TOKEN: ${{ secrets.ENV_GH_TOKEN }}
          ENV_LITELLM_API_KEY: ${{ secrets.ENV_LITELLM_API_KEY }}
          ENV_OPENCODE_SERVER_PASSWORD: ${{ secrets.ENV_OPENCODE_SERVER_PASSWORD }}
          ENV_CLOUDFLARE_API_TOKEN: ${{ secrets.ENV_CLOUDFLARE_API_TOKEN }}
          ENV_HCLOUD_AK: ${{ secrets.ENV_HCLOUD_AK }}
          ENV_HCLOUD_SK: ${{ secrets.ENV_HCLOUD_SK }}
          ENV_SMTP_PASS: ${{ secrets.ENV_SMTP_PASS }}
          CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
        run: |
          set -euo pipefail
          set -x
          TRANSPORT="${{ inputs.ssh_transport }}"
          if [ "$TRANSPORT" = "tailscale" ]; then
            # TS SSH：身份=tag:ci，目标侧 tailscaled 接管 22；不需要私钥、不需要 known_hosts、不支持 scp
            echo "transport: tailscale ssh（无 key、无 2244）"
            tailscale status --json | python3 -c 'import json,sys;d=json.load(sys.stdin);print("self tags:",d["Self"].get("Tags"))'
          else
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            if [ -n "$SSH_KEY_B64" ]; then printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/ci_key;
            else printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key; fi
            [ -s ~/.ssh/ci_key ] || { echo "SSH key missing (SSH_KEY secret 与 ssh_key_b64 输入都空)"; exit 1; }
            chmod 600 ~/.ssh/ci_key
            # keyscan 失败必须大声死：旧写法 2>/dev/null + set -e 会在 5 秒内零输出退出（preflight-39712410423 教训）
            # 判死放宽到约 3 分钟：Tailscale 官方称新 peer 首次连通要等（eventual consistency），15 秒判死太急
            for i in $(seq 1 12); do
              ssh-keyscan -p 2244 -H "${{ steps.target.outputs.ip }}" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err && break
              echo "keyscan 第 $i 次失败："; head -c 500 /tmp/keyscan.err; echo
              [ "$i" = 12 ] && { echo "FAIL: keyscan 12 次（约 3 分钟）连不上 ${{ steps.target.outputs.ip }}:2244（sshd 未起或网络不通）"; exit 1; }
              sleep 15
            done
          fi
          STACK_DIR="${{ inputs.stack_dir }}" TARGET_IP="${{ steps.target.outputs.ip }}" \
            SSH_KEY_FILE="$HOME/.ssh/ci_key" SSH_PORT=2244 SSH_TRANSPORT="$TRANSPORT" \
            ACTION_MODE="${{ inputs.action }}" \
            CANDIDATE_DIGEST="${{ steps.gate.outputs.digest }}" \
            SWR_USER="${SWR_USER:-}" SWR_PASS="${SWR_PASS:-}" \
            bash scripts/deliver-remote-core.sh
