name: tmp-ali-probe
# 一次性：ali-gz 本机 30080 监听＋回环验证（admin 通道，只读）。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-ali-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.CADDY_SSH_KEY }}
    steps:
      - name: 进网（admin）＋本机取证
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:admin"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || exit 1
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-alip-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          ssh $SOPT root@100.85.128.116 'echo "== listen =="; ss -tlnp | grep -E "30080|80 " | head -5; echo "== loopback =="; for i in 1 2 3; do curl -sS -m 10 -o /dev/null -w "lo try$i http=%{http_code} time=%{time_total}s\n" -H "Host: team-agent.xieyucheng.top" http://127.0.0.1:30080/ || true; done; echo "== caddy =="; systemctl is-active caddy; caddy validate --config /etc/caddy/Caddyfile 2>&1 | tail -2'
          shred -u ~/.ssh/ci_key
          echo PROBE-DONE
