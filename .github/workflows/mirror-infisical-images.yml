name: mirror-infisical-images

# 把 Infisical 自建所需镜像（docker.io）mirror 进 SWR cn-north-9，供华为节点拉取。
# 原因：华为节点直连 docker.io 实测不通（registry-1.docker.io = timeout），集群镜像只能走 SWR。
# 用法：dispatch 一次即可；镜像更新时改 tag 再 dispatch。产出 SWR digest 写进 run summary。
on:
  workflow_dispatch:
    inputs:
      infisical_tag:
        description: "infisical/infisical 的 tag（默认 latest；需要可换版本号）"
        required: false
        default: "latest"
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REG: swr.cn-north-9.myhuaweicloud.com/link-seek
    steps:
      - name: login SWR
        env:
          U: ${{ secrets.SWR_LOGIN_USER }}
          P: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          printf '%s' "$P" | docker login swr.cn-north-9.myhuaweicloud.com -u "$U" --password-stdin
      - name: mirror images
        env:
          INFISICAL_TAG: ${{ inputs.infisical_tag }}
        run: |
          set -euo pipefail
          mirror() {
            src="$1"; dst="$2"
            echo "::group::mirror $src -> $REG/$dst"
            docker pull "$src"
            docker tag "$src" "$REG/$dst"
            docker push "$REG/$dst"
            dg="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REG/$dst" 2>/dev/null | head -1)"
            echo "$REG/$dst -> ${dg:-<no-digest>}"
            echo "::endgroup::"
          }
          mirror "infisical/infisical:${INFISICAL_TAG}" "infisical:${INFISICAL_TAG}"
          mirror "postgres:14-alpine" "postgres:14-alpine"
          mirror "redis:7-alpine" "redis:7-alpine"
      - name: summary
        run: echo "done: $REG/infisical / postgres:14-alpine / redis:7-alpine (见上面 digest)" >> "$GITHUB_STEP_SUMMARY"
