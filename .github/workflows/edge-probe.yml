name: edge-probe
# 只读探针：edge 双节点（vm-proxy/ali-gz）状态＋SNI 中继逐个打。
# 双身份（ACL 现实）：user 看得到 .69/vm-proxy（看不见 ali-gz）；
#   admin 看得到 ali-gz（看不见 .69）。都是 ephemeral，用完焚毁。
# 用途：vm-proxy 健康判定、ali-gz 中继验收。不做任何变更。

on:
  workflow_dispatch:

concurrency:
  group: edge-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - name: 进网（user 身份）＋ 簇视角 ＋ vm-proxy 中继
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: user key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-edgeprobe-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          echo "== user netmap（hostname 列表） =="
          sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; print(sorted(set([str(p.get('HostName','')) for p in peers.values()])))"
          echo "== 簇节点（.69 视角） =="
          sudo tailscale ssh root@100.93.119.21 'kubectl get nodes -o wide'
          echo "== egress DaemonSet（.69 视角） =="
          sudo tailscale ssh root@100.93.119.21 'kubectl -n egress get ds sni-egress -o wide 2>/dev/null; kubectl -n egress get pods -o wide 2>/dev/null'
          echo "== vm-proxy 中继直打 =="
          VIP=$(sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; print(next((p['TailscaleIPs'][0] for p in peers.values() if 'mesh-oci-proxy' in str(p.get('HostName','')) or 'vm-proxy' in str(p.get('HostName',''))),''))")
          [ -n "$VIP" ] || { echo "WARN: user 看不见 vm-proxy（只记现象，不拦门）"; }
          if [ -n "$VIP" ]; then
            CODE=$(curl -sk -m 20 -o /dev/null -w '%{http_code}' --resolve opencode.ai:14443:"$VIP" https://opencode.ai:14443/ || true)
            echo "vm-proxy relay https => http=$CODE"
            [ "$CODE" = 200 ] && echo VM-RELAY-OK || echo VM-RELAY-FAIL
          fi
          sudo tailscale logout || true

      - name: 进网（admin 身份）＋ ali-gz 中继直打
        run: |
          set -euo pipefail
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          echo "::add-mask::$TSKEY"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:admin"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: admin key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-edgeprobe-adm-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          echo "== admin netmap（hostname 列表） =="
          sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; print(sorted(set([str(p.get('HostName','')) for p in peers.values()])))"
          AIP="100.85.128.116"
          CODE=$(curl -sk -m 20 -o /dev/null -w '%{http_code}' --resolve opencode.ai:14443:"$AIP" https://opencode.ai:14443/ || true)
          echo "ali-gz relay https => http=$CODE"
          [ "$CODE" = 200 ] && echo ALI-RELAY-OK || echo "ALI-RELAY-NOT-YET（预期：中继还没部署）"
          sudo tailscale logout || true
