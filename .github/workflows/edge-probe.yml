name: edge-probe
# 只读探针：集群节点 + egress L7 出口代理（东京 vm-proxy）健康。不做任何变更。
# 注：SNI relay 已于 2026-11-22 退役，改用 L7 CONNECT 代理（egress/egress-proxy），出口=vm-proxy。
on:
  workflow_dispatch:

concurrency:
  group: edge-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 签 key（user 身份，ephemeral 1h）
        id: mint
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: user key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          echo "key=$MINTED" >> "$GITHUB_OUTPUT"
          unset MINTED
      - name: 进网（声明式 conffile 试点）
        uses: ./.github/actions/ts-bringup
        with:
          auth_key: ${{ steps.mint.outputs.key }}
          hostname: ci-edgeprobe-${{ github.run_id }}
          mode: conffile
      - name: 簇视角 ＋ egress 代理探测
        run: |
          echo "== 簇节点（.69 视角） =="
          sudo tailscale ssh root@100.93.119.21 'kubectl get nodes -o wide'
          echo "== egress 出口代理（.69 视角） =="
          sudo tailscale ssh root@100.93.119.21 'kubectl -n egress get deploy egress-proxy -o wide; kubectl -n egress get pods -o wide'
          echo "== 经代理 CONNECT opencode.ai（403 可能为 opencode bot 拦截；隧道成功即可，详见 squid 访问日志） =="
          VIP=$(sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); peers=d.get('Peer') or {}; print(next((p['TailscaleIPs'][0] for p in peers.values() if 'vm-proxy' in str(p.get('HostName',''))),''))")
          [ -n "$VIP" ] || { echo "WARN: user 看不见 vm-proxy（只记现象，不拦门）"; }
          if [ -n "$VIP" ]; then
            CODE=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -x "http://$VIP:3128" https://opencode.ai/ || true)
            echo "egress-proxy CONNECT opencode.ai => http=$CODE"
          fi
          sudo tailscale logout || true
