name: swr-cleanup-chrome-cjk
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [discover, apply]
        default: discover
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: install hcloud (KooCLI)
        run: |
          set -e
          ok=0
          for u in \
            https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz \
            https://obs.cn-north-4.myhuaweicloud.com/koocli/cli/latest/huaweicloud-cli-linux-amd64.tar.gz ; do
            curl -fsSL --retry 4 --retry-delay 3 "$u" -o /tmp/hc.tgz && { ok=1; break; } || true
          done
          [ "$ok" = 1 ] || { echo "FAIL: KooCLI 下载失败"; exit 1; }
          mkdir -p /tmp/hc && tar xzf /tmp/hc.tgz -C /tmp/hc
          install -m755 "$(find /tmp/hc -type f -name hcloud | head -1)" /usr/local/bin/hcloud
          hcloud version
      - name: discover / apply
        run: |
          set +e
          hcloud configure set --cli-access-key="$AK" --cli-secret-key="$SK" --cli-region=cn-north-9 --cli-mode=AKSK --cli-agree-privacy-statement=true
          echo "=== ListNamespaces cn-north-9 ==="
          hcloud SWR ListNamespaces --cli-region=cn-north-9 2>&1 | head -c 1500; echo
          echo "=== probe link-seek/opencode-tools (cn-north-9) ==="
          hcloud SWR ShowRepository --namespace=link-seek --repository=opencode-tools --cli-region=cn-north-9 2>&1 | head -c 400; echo
          echo "=== probe xieyucheng123/chrome-cjk (cn-north-9) ==="
          hcloud SWR ShowRepository --namespace=xieyucheng123 --repository=chrome-cjk --cli-region=cn-north-9 2>&1 | head -c 400; echo
          echo "=== probe xieyucheng123/chrome-cjk (cn-north-4) ==="
          hcloud SWR ShowRepository --namespace=xieyucheng123 --repository=chrome-cjk --cli-region=cn-north-4 2>&1 | head -c 400; echo
          echo "=== list repos in xieyucheng123 (cn-north-9) ==="
          hcloud SWR ListNamespaceRepositories --namespace=xieyucheng123 --cli-region=cn-north-9 2>&1 | head -c 800; echo
          if [ "$MODE" != "apply" ]; then echo DISCOVER_ONLY_DONE; exit 0; fi
          NS=xieyucheng123; REPO=chrome-cjk
          echo "=== APPLY: delete tags then repo ==="
          hcloud SWR ListRepositoryTags --namespace=$NS --repository=$REPO --cli-region=cn-north-9 > /tmp/tags.json 2>/tmp/tags.err
          head -c 200 /tmp/tags.err
          for t in $(python3 -c "import json;d=json.load(open('/tmp/tags.json'));print('\n'.join([str(x.get('name') or x.get('tag')) for x in (d.get('tags') or []) if (x.get('name') or x.get('tag'))]))" 2>/dev/null); do
            echo "-- delete tag $t --"; hcloud SWR DeleteRepoTag --namespace=$NS --repository=$REPO --tag="$t" --cli-region=cn-north-9 2>&1 | tail -c 150; echo
          done
          echo "=== DeleteRepo ==="; hcloud SWR DeleteRepo --namespace=$NS --repository=$REPO --cli-region=cn-north-9 2>&1 | tail -c 250; echo "DELETE_RC=$?"
          echo "=== verify ==="; hcloud SWR ShowRepository --namespace=$NS --repository=$REPO --cli-region=cn-north-9 2>&1 | head -c 300; echo
