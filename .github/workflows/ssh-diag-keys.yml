name: ssh-diag-keys
# 临时诊断：经 tailnet（user 身份，Tailscale SSH accept，无需 key）读三机 authorized_keys 公钥部分。
# 只打印公钥（完整公钥可日志，私钥不出 runner），不写任何机器。用完即删。
on:
  workflow_dispatch:
    inputs:
      runner_tag:
        description: "runner 进网身份"
        required: false
        default: "tag:user"
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - name: runner 进 tailnet
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          RTAG="${{ inputs.runner_tag }}"; [ -n "$RTAG" ] || RTAG="tag:user"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d "{\"capabilities\":{\"devices\":{\"create\":{\"reusable\":false,\"ephemeral\":true,\"preauthorized\":true,\"tags\":[\"$RTAG\"]}}},\"expirySeconds\":3600}" \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: mint"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-diag-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          tailscale status --self | head -2
      - name: 读 .41/.69 authorized_keys（只读）
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          echo "=== PROD_SSH_KEY 对应公钥（公钥可日志，私钥不出 runner） ==="
          ssh-keygen -y -f ~/.ssh/ci_key
          for H in 100.93.119.21 100.73.182.4; do
            echo "=== $H authorized_keys ==="
            ssh -o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key "root@$H" "cat ~/.ssh/authorized_keys 2>/dev/null | awk '{print \$1, substr(\$2,1,40), \$3}' | head -n 5" 2>&1 | head -n 8 || echo "$H SSH-FAIL"
          done
          shred -u ~/.ssh/ci_key
