name: tmp-traefik-check
# 一次性只读：看 Traefik + ServiceLB 在不在。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-traefik-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 标准进网＋组 kubeconfig
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: 只读巡检
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          echo "=== nodes (lb labels) ==="
          kubectl get nodes -o custom-columns=NAME:.metadata.name,READY:.status.conditions[?(@.type==\"Ready\")].status,ENABLELB:.metadata.labels.svccontroller\\.k3s\\.cattle\\.io/enablelb,LBPOOL:.metadata.labels.svccontroller\\.k3s\\.cattle\\.io/lbpool || true
          echo "=== kube-system: traefik/svclb ==="
          kubectl -n kube-system get deploy,svc,daemonset 2>&1 | grep -i -E "traefik|svclb|servicelb|loadbalancer|NAME" || echo "no match"
          echo "=== traefik svc detail ==="
          kubectl -n kube-system get svc traefik -o jsonpath='type={.spec.type} ports={.spec.ports[*].port} nodePorts={.spec.ports[*].nodePort}{"\n"}' 2>&1 || echo "no svc traefik"
          echo "=== HelmChartConfig ==="
          kubectl -n kube-system get helmchartconfig 2>&1 | head -10 || echo "no helmchartconfig CRD"
          echo "=== ingress all ns ==="
          kubectl get ingress -A 2>&1 | head -20 || echo "no ingress"
          echo "=== LoadBalancer svc all ns ==="
          kubectl get svc -A --field-selector spec.type=LoadBalancer 2>&1 | head -20 || kubectl get svc -A 2>&1 | grep -i LoadBalancer | head -20 || echo "none LB"
          echo CHECK-DONE
