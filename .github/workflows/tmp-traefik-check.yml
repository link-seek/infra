name: tmp-traefik-check
# 一次性只读：看 Traefik + ServiceLB 在不在。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-traefik-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 标准进网＋组 kubeconfig
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: 只读巡检
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          echo "=== nodes wide ==="
          kubectl get nodes -o wide
          echo "=== nodes lb labels ==="
          kubectl get nodes -o jsonpath='LBLABELS {range .items}{.metadata.name}={.metadata.labels}{"\n"}{end}' | tr ',' '\n' | grep -i -E "NAME|enablelb|lbpool|hostname" || kubectl describe nodes | grep -i -E "Name:|enablelb|lbpool" | head -20
          echo "=== kube-system traefik/svclb ==="
          kubectl -n kube-system get deploy,svc,daemonset | grep -i -E "traefik|svclb|NAME" || echo "no match"
          echo "=== traefik svc wide ==="
          kubectl -n kube-system get svc traefik -o wide || echo "no svc traefik"
          echo "=== HelmChartConfig ==="
          kubectl -n kube-system get helmchartconfig 2>&1 | head -10 || echo "no helmchartconfig CRD"
          echo "=== ingress all ns ==="
          kubectl get ingress -A 2>&1 | head -20 || echo "no ingress"
          echo "=== LB svc ==="
          kubectl get svc -A 2>&1 | awk '$4 ~ /LoadBalancer/ || NR==1' | head -20
          echo CHECK-DONE
