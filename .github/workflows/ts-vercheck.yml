name: ts-vercheck

# 一次性（用完即删）：读 hw-21 的 docker/compose 版本，给 canary !override 方案做版本门控。
# 只读：两条 version 命令，不碰任何容器/配置。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 进 tailnet + 读版本
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_PROD }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          timeout 120 sudo tailscale up --authkey="$(printf '%s' "$TS_AUTHKEY" | tr -d '\r\n ')" \
            --hostname="ci-vercheck-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -p 2244 -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 \
            'docker --version; docker compose version; cat /etc/os-release | head -2'
          sudo tailscale logout || true
