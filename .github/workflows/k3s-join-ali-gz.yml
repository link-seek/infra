name: k3s-join-ali-gz
# DEPRECATED（已转调）：薄垫片，只转发统一链 k3s-join-edge（node_hostname 钉死 mesh-ali-gz）。
# 原 bespoke 逻辑已归档统一链；广州节点已 Ready，join 幂等跳过。转调稳定后删除本文件。
# verify=true 沿旧链行为（旧 join 恒跑全套验证）；新链默认轻门禁，首跑/排障才全套。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon=只读巡检（默认）；join=装 agent 入簇（幂等）"
        required: false
        default: "recon"
        type: choice
        options: [recon, join]
      server_tail:
        description: "server tailnet IP（默认 .69）"
        required: false
        default: "100.93.119.21"
      agent_ip:
        description: "ali-gz tailnet IP（默认 100.85.128.116）"
        required: false
        default: "100.85.128.116"
      k3s_bin_url:
        description: "k3s 二进制国内中转 URL（url2hc download-to-obs 预签名，过期重转）"
        required: false
        default: "https://xieyucheng.obs.cn-north-9.myhuaweicloud.com/%E4%B8%8B%E8%BD%BD/k3s/v1.37.2%2Bk3s1/k3s?Expires=1795504324&AccessKeyId=HPUAIBICHVRQWFEP6HXC&Signature=az4IutRXGVzhonWH8vfNMUgtTds%3D"
      k3s_sha_url:
        description: "k3s sha256 国内中转 URL（同上）"
        required: false
        default: "https://xieyucheng.obs.cn-north-9.myhuaweicloud.com/%E4%B8%8B%E8%BD%BD/k3s/v1.37.2%2Bk3s1/sha256sum-amd64.txt?Expires=1795504328&AccessKeyId=HPUAIBICHVRQWFEP6HXC&Signature=hs0Y3DheEzxIHYUWv2fk%3D"

concurrency:
  group: k3s-join-ali-gz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  join:
    uses: ./.github/workflows/k3s-join-edge.yml
    with:
      mode: ${{ inputs.mode }}
      node_hostname: mesh-ali-gz
      agent_ip: ${{ inputs.agent_ip }}
      server_tail: ${{ inputs.server_tail }}
      verify: true
      k3s_bin_url: ${{ inputs.k3s_bin_url }}
      k3s_sha_url: ${{ inputs.k3s_sha_url }}
    secrets: inherit
