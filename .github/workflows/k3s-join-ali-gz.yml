name: k3s-join-ali-gz
# DEPRECATED：统一链 k3s-join-edge 落定前保留可跑；runner 进网跑通＋旧链切转调后删除。
# mesh-ali-gz（阿里广州，公网入口机）以 tainted agent 入簇（v2）。
# dedicated=edge，只跑 SNI 出海中继；Caddy 生产入口不动。
# 单身份单跳板：runner 只以 tag:user 进 tailnet，一切经 .69 办
# （kubectl 在 .69 本地；ali-gz 经 .69 跳 ssh，CADDY_SSH_KEY 中转、用完即焚）。
# 流程：recon（默认，只读）→ mode=join：装 agent（OBS 二进制＋SWR pause，flannel 走 tailscale0，
# taint edge）→ .69 视角验 Ready → 金丝雀（SWR busybox，overlay 双向）→ 入口回验 → 焚毁。
# 需手动 dispatch＋全程盯。SNI 中继见 k8s/egress/daemonset-ali-gz.yaml（另链 k3s-egress-ali-gz）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon=只读巡检（默认）；join=装 agent 入簇"
        required: false
        default: "recon"
        type: choice
        options: [recon, join]
      server_tail:
        description: "server tailnet IP（默认 .69）"
        required: false
        default: "100.93.119.21"
      agent_ip:
        description: "ali-gz tailnet IP（默认 100.85.128.116）"
        required: false
        default: "100.85.128.116"
      k3s_bin_url:
        description: "k3s 二进制国内中转 URL（url2hc download-to-obs 预签名，过期重转）"
        required: false
        default: "https://xieyucheng.obs.cn-north-9.myhuaweicloud.com/%E4%B8%8B%E8%BD%BD/k3s/v1.37.2%2Bk3s1/k3s?Expires=1795504324&AccessKeyId=HPUAIBICHVRQWFEP6HXC&Signature=az4IutRXGVzhonWH8vfNMUgtTds%3D"
      k3s_sha_url:
        description: "k3s sha256 国内中转 URL（同上）"
        required: false
        default: "https://xieyucheng.obs.cn-north-9.myhuaweicloud.com/%E4%B8%8B%E8%BD%BD/k3s/v1.37.2%2Bk3s1/sha256sum-amd64.txt?Expires=1795504328&AccessKeyId=HPUAIBICHVRQWFEP6HXC&Signature=hs0Y3DheEzxIHYUWv2fk%3D"

concurrency:
  group: k3s-join-ali-gz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.CADDY_SSH_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: 进网＋递钥匙（单 user 身份，全程只此一次）
        timeout-minutes: 8
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          echo "::add-mask::$TSKEY"
          echo "::add-mask::$SSH_KEY"
          echo "::add-mask::$SWR_LOGIN_PASS"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: user key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-joinali-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          S69() { sudo tailscale ssh root@"${{ inputs.server_tail }}" "$@"; }
          S69 'echo JUMP-OK; hostname'
          # 取 server 版本＋token（只读 .69）
          VER="$(S69 'k3s --version | head -1' | awk '{print $3}')"
          [ -n "$VER" ] || { echo "FAIL: 取不到 server 版本"; exit 1; }
          echo "server k3s: $VER"
          TOKEN="$(S69 'cat /var/lib/rancher/k3s/server/node-token')"
          [ -n "$TOKEN" ] || { echo "FAIL: 取不到 token"; exit 1; }
          echo "::add-mask::$TOKEN"
          printf '%s' "$VER" > /tmp/ali-ver
          printf '%s' "$TOKEN" > /tmp/ali-token && chmod 600 /tmp/ali-token
          unset TOKEN MINTED
          # 递钥匙到跳板（ephemeral，用完即焚）
          printf '%s\n' "$SSH_KEY" | S69 'cat > /tmp/ci-ali-gz.key && chmod 600 /tmp/ci-ali-gz.key && echo KEY-SHIPPED'
          echo NETMAP-OK

      - name: recon（只读，不碰线上）
        env:
          A69: "root@${{ inputs.server_tail }}"
          A: "root@${{ inputs.agent_ip }}"
        run: |
          set -euo pipefail
          S69() { sudo tailscale ssh "$A69" "$@"; }
          echo "== ali-gz 基本面（经 .69 跳） =="
          S69 "ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i /tmp/ci-ali-gz.key $A 'hostname; cat /etc/os-release 2>/dev/null | head -2; uname -m; free -g | head -2; df -h / | tail -1; if test -f /sys/fs/cgroup/cgroup.controllers; then echo CGROUPV2; else echo CGROUPV1; fi'"
          echo "== 14443/关键端口＋Caddy＋k3s 有无 =="
          S69 "ssh -o BatchMode=yes -i /tmp/ci-ali-gz.key $A 'ss -ltnp 2>/dev/null | grep -E \":(14443|10250|6443) \" || echo PORTS-FREE; systemctl is-active caddy 2>/dev/null || echo CADDY-UNKNOWN; command -v k3s >/dev/null && k3s --version | head -1 || echo K3S-NOT-INSTALLED'"
          echo "== 簇节点（.69 视角） =="
          S69 'kubectl get nodes -o wide'
          echo "server k3s: $(cat /tmp/ali-ver)"
          echo RECON-OK

      - name: join（仅 mode=join）
        if: inputs.mode == 'join'
        env:
          A69: "root@${{ inputs.server_tail }}"
          A: "root@${{ inputs.agent_ip }}"
        run: |
          set -euo pipefail
          S69() { sudo tailscale ssh "$A69" "$@"; }
          VER="$(cat /tmp/ali-ver)"; TOKEN="$(cat /tmp/ali-token)"
          [ -n "$VER" ] && [ -n "$TOKEN" ] || { echo "FAIL: token 缺失"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "== 下二进制（OBS 国内）＋验签＋装 agent（900s 门） =="
          timeout 900 S69 "ssh -o BatchMode=yes -i /tmp/ci-ali-gz.key $A \"mkdir -p /tmp/k3s-bin && curl -sfL --retry 3 -o /tmp/k3s-bin/k3s '${{ inputs.k3s_bin_url }}' && curl -sfL -o /tmp/k3s-bin/sha256sum-amd64.txt '${{ inputs.k3s_sha_url }}' && cd /tmp/k3s-bin && grep -E ' +k3s\$' sha256sum-amd64.txt | sha256sum -c - && install -m 0755 /tmp/k3s-bin/k3s /usr/local/bin/k3s && rm -rf /tmp/k3s-bin\""
          timeout 900 S69 "ssh -o BatchMode=yes -i /tmp/ci-ali-gz.key $A \"curl -sfL https://get.k3s.io | INSTALL_K3S_SKIP_DOWNLOAD=true INSTALL_K3S_VERSION=$VER INSTALL_K3S_EXEC='agent --server https://${{ inputs.server_tail }}:6443 --token \\\"$TOKEN\\\" --node-ip ${{ inputs.agent_ip }} --flannel-iface tailscale0 --node-label dedicated=edge --node-taint dedicated=edge:NoSchedule --pause-image=swr.cn-north-9.myhuaweicloud.com/link-seek/edge-pause:3.10.2' sh -\""
          unset TOKEN; shred -u /tmp/ali-token || true
          echo "== 等 agent Ready（.69 视角） =="
          for i in $(seq 1 24); do
            sleep 15
            NODES="$(S69 'kubectl get nodes --no-headers 2>/dev/null' 2>/dev/null | wc -l || true)"
            READY="$(S69 'kubectl get nodes --no-headers 2>/dev/null' 2>/dev/null | grep -c ' Ready' || true)"
            echo "nodes=${NODES:-0} ready=${READY:-0} ($i/24)"
            [ "${NODES:-0}" -ge 5 ] && [ "${READY:-0}" -ge 5 ] && break
            [ "$i" = 24 ] && { echo "FAIL: ali-gz 未入簇"; S69 'kubectl get nodes -o wide'; exit 1; }
          done
          echo AGENT-JOINED

      - name: 金丝雀（仅 mode=join，.69 视角建＋验，overlay 双向）
        if: inputs.mode == 'join'
        env:
          A69: "root@${{ inputs.server_tail }}"
        run: |
          set -euo pipefail
          S69() { sudo tailscale ssh "$A69" "$@"; }
          echo "::add-mask::$SWR_LOGIN_PASS"
          S69 "kubectl create secret docker-registry swr-pull -n default --docker-server=swr.cn-north-9.myhuaweicloud.com --docker-username='$SWR_LOGIN_USER' --docker-password='$SWR_LOGIN_PASS' --dry-run=client -o yaml | kubectl apply -f -"
          S69 'kubectl delete pod canary-edge-ali --wait=false --ignore-not-found 2>&1 | head -1'
          S69 "kubectl run canary-edge-ali --image=swr.cn-north-9.myhuaweicloud.com/link-seek/edge-busybox:1.36 --overrides='{\"spec\":{\"nodeName\":\"mesh-ali-gz\",\"tolerations\":[{\"key\":\"dedicated\",\"operator\":\"Equal\",\"value\":\"edge\",\"effect\":\"NoSchedule\"}],\"imagePullSecrets\":[{\"name\":\"swr-pull\"}]}}' -- sleep 3600 2>&1 | head -2"
          S69 "kubectl wait --for=condition=Ready pod/canary-edge-ali --timeout=300s 2>&1 | tail -1"
          OPODIP=$(S69 "kubectl get pod -n opencode -o jsonpath='{.items[0].status.podIP}'")
          echo "opencode pod IP（脱敏）: ${OPODIP%.*.*}.x.x"
          S69 "kubectl exec canary-edge-ali -- ping -c2 $OPODIP 2>&1 | tail -2"
          S69 "kubectl exec canary-edge-ali -- wget -q -O- http://$OPODIP:4097/ 2>&1 | head -c 120; echo"
          echo OVERLAY-L7-OK

      - name: 入口回验（仅 mode=join，只读打流量）
        if: inputs.mode == 'join'
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            A=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://opencode.xieyucheng.top/ || true)
            B=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://opencode.yingxin.net.cn/ || true)
            echo "try$i xieyucheng=$A yingxin=$B"
            [ "$A" = 200 ] && [ "$B" = 200 ] && break
            sleep 30
            [ "$i" = 10 ] && { echo "FAIL: 入口回验不通"; exit 1; }
          done
          echo INGRESS-OK

      - name: 收尾（焚毁身份＋碎钥匙，跳板＋runner）
        if: always()
        env:
          A69: "root@${{ inputs.server_tail }}"
        run: |
          sudo tailscale ssh "$A69" 'shred -u /tmp/ci-ali-gz.key /tmp/egress-ali.tgz 2>/dev/null; echo KEY-BURNED' || true
          shred -u ~/.ssh/ci_key /tmp/ali-token /tmp/opencode-pod-ip 2>/dev/null || true
          sudo tailscale logout || true
