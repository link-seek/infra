name: k3s-join-ali-gz
# mesh-ali-gz（阿里广州 120.77.76.20 / 100.85.128.116，公网入口机）以 tainted agent 入簇。
# dedicated=edge，只跑 SNI 出海中继；Caddy 生产入口不动。
# 双身份（ACL 现实）：tag:user 看得到 .69（取 token）但看不到 ali-gz；
#   tag:admin 看得到 ali-gz（干活）但看不到 .69。两个都是 ephemeral，用完焚毁。
# 需手动 dispatch＋全程盯。流程：取 token（user）→ 进网（admin）→ recon（默认，只读）
#   → mode=join：装 k3s agent（版本跟 server 对齐，flannel 走 tailscale0，taint edge）
#   → 金丝雀验跨节点（ali-gz 本机 k3s kubectl）→ 入口双域名回验 → logout 焚毁。
# SNI 横扩见 k8s/egress/daemonset.yaml（edge label 亲和；生效需另 dispatch k3s-egress deploy）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon=只读巡检（默认）；join=装 agent 入簇"
        required: false
        default: "recon"
        type: choice
        options: [recon, join]
      server_tail:
        description: "取 token 的 server tailnet IP（默认 .69）"
        required: false
        default: "100.93.119.21"
      agent_ip:
        description: "ali-gz tailnet IP（默认 100.85.128.116）"
        required: false
        default: "100.85.128.116"

concurrency:
  group: k3s-join-ali-gz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 取 token（user 身份，只读 .69）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: user key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-ali-token-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          S="${{ inputs.server_tail }}"
          VER="$(sudo tailscale ssh "root@$S" 'k3s --version | head -1' | awk '{print $3}')"
          [ -n "$VER" ] || { echo "FAIL: 取不到 server 版本"; exit 1; }
          echo "server k3s: $VER"
          TOKEN="$(sudo tailscale ssh "root@$S" 'cat /var/lib/rancher/k3s/server/node-token')"
          [ -n "$TOKEN" ] || { echo "FAIL: 取不到 token"; exit 1; }
          echo "::add-mask::$TOKEN"
          mkdir -p /tmp/ali-join && chmod 700 /tmp/ali-join
          printf '%s' "$VER" > /tmp/ali-join/ver
          printf '%s' "$TOKEN" > /tmp/ali-join/token && chmod 600 /tmp/ali-join/token
          unset TOKEN MINTED
          sudo tailscale logout || true
          echo TOKEN-SAVED

      - name: runner 进 tailnet（admin 身份）
        timeout-minutes: 10
        run: |
          set -euo pipefail
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          echo "::add-mask::$TSKEY"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:admin"]}}},"expirySeconds":21600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: admin key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-joinali-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          T="${{ inputs.agent_ip }}"
          OK=0
          for i in $(seq 1 12); do
            if sudo tailscale status --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); peers=d.get("Peer") or {}; flat=[ip for p in peers.values() for ip in (p.get("TailscaleIPs") or [])]; sys.exit(0 if sys.argv[1] in flat else 1)' "$T"; then OK=1; break; fi
            sleep 15
          done
          [ "$OK" = 1 ] || { echo "FAIL: $T 不在 netmap"; exit 1; }
          timeout 90 sudo tailscale ping --timeout=30s --c=2 "$T" || { echo "FAIL: $T ping 不通"; exit 1; }
          echo NETMAP-OK

      - name: recon（只读，不碰线上）
        env:
          SSH_KEY: ${{ secrets.CADDY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          A="${{ inputs.agent_ip }}"
          echo "== ali-gz 基本面 =="
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key "root@$A" \
            'hostname; cat /etc/os-release 2>/dev/null | head -2; uname -m; free -g | head -2; df -h / | tail -1; if test -f /sys/fs/cgroup/cgroup.controllers; then echo CGROUPV2; else echo CGROUPV1; fi'
          echo "== 14443/关键端口占用 =="
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" \
            'ss -ltnp 2>/dev/null | grep -E ":(14443|10250|6443) " || echo PORTS-FREE; systemctl is-active caddy 2>/dev/null || echo CADDY-UNKNOWN'
          echo "== k3s 是否已装 =="
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" \
            'command -v k3s >/dev/null && k3s --version | head -1 || echo K3S-NOT-INSTALLED'
          echo "== token 已就位（只验长度） =="
          [ "$(wc -c < /tmp/ali-join/token)" -gt 20 ] || { echo "FAIL: token 缺失"; exit 1; }
          echo "server k3s: $(cat /tmp/ali-join/ver)"
          echo RECON-OK

      - name: join（仅 mode=join）
        if: inputs.mode == 'join'
        env:
          SSH_KEY: ${{ secrets.CADDY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          A="${{ inputs.agent_ip }}"
          S="${{ inputs.server_tail }}"
          VER="$(cat /tmp/ali-join/ver)"
          TOKEN="$(cat /tmp/ali-join/token)"
          [ -n "$VER" ] && [ -n "$TOKEN" ] || { echo "FAIL: token 缺失"; exit 1; }
          echo "::add-mask::$TOKEN"
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" \
            "curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=$VER INSTALL_K3S_EXEC='agent --server https://$S:6443 --token \"$TOKEN\" --node-ip $A --flannel-iface tailscale0 --node-label dedicated=edge --node-taint dedicated=edge:NoSchedule' sh -"
          unset TOKEN
          shred -u /tmp/ali-join/token || true
          echo "== 等 agent Ready（ali-gz 本机 k3s kubectl 视角） =="
          for i in $(seq 1 24); do
            sleep 15
            STAT="$(ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" 'k3s kubectl get nodes --no-headers 2>/dev/null' | awk '{print $2}' | sort | uniq -c)"
            echo "$STAT ($i/24)"
            NODES="$(ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" 'k3s kubectl get nodes --no-headers 2>/dev/null' | wc -l)"
            READY="$(ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" 'k3s kubectl get nodes --no-headers 2>/dev/null' | grep -c ' Ready' || true)"
            [ "$NODES" -ge 5 ] && [ "$READY" -ge 5 ] && break
            [ "$i" = 24 ] && { echo "FAIL: ali-gz 未入簇"; ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" 'k3s kubectl get nodes -o wide'; exit 1; }
          done
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" 'k3s kubectl get nodes -o wide'
          echo "== 金丝雀：edge 上起 busybox，双向打 overlay + L7 =="
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" "k3s kubectl run canary-edge-ali --image=busybox:1.36 --overrides='{\"spec\":{\"nodeSelector\":{\"dedicated\":\"edge\"},\"tolerations\":[{\"key\":\"dedicated\",\"operator\":\"Equal\",\"value\":\"edge\",\"effect\":\"NoSchedule\"}]}}' -- sleep 3600 2>&1 | head -2"
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" "k3s kubectl wait --for=condition=Ready pod/canary-edge-ali --timeout=180s 2>&1 | tail -1"
          OPODIP=$(ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" "k3s kubectl get pod -n opencode -o jsonpath='{.items[0].status.podIP}'")
          echo "opencode pod IP（脱敏）: ${OPODIP%.*.*}.x.x"
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" "k3s kubectl exec canary-edge-ali -- ping -c2 $OPODIP 2>&1 | tail -2"
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" "k3s kubectl exec canary-edge-ali -- wget -q -O- http://$OPODIP:4097/ 2>&1 | head -c 120; echo"
          ssh -o BatchMode=yes -i ~/.ssh/ci_key "root@$A" 'k3s kubectl delete pod canary-edge-ali --wait=false 2>&1 | head -1'
          shred -u ~/.ssh/ci_key || true
          echo ALI-JOIN-OK

      - name: 入口回验（仅 mode=join，只读打流量）
        if: inputs.mode == 'join'
        run: |
          set -euo pipefail
          # ali-gz 是现网入口：join 后确认两域名仍 200，否则即红（回滚见 PR）。
          for i in $(seq 1 10); do
            A=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://opencode.xieyucheng.top/ || true)
            B=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://opencode.yingxin.net.cn/ || true)
            echo "try$i xieyucheng=$A yingxin=$B"
            [ "$A" = 200 ] && [ "$B" = 200 ] && break
            sleep 30
            [ "$i" = 10 ] && { echo "FAIL: 入口回验不通"; exit 1; }
          done
          echo INGRESS-OK

      - name: 收尾（焚毁身份＋碎 key）
        if: always()
        run: |
          shred -u /tmp/ali-join/token 2>/dev/null || true
          shred -u ~/.ssh/ci_key 2>/dev/null || true
          sudo tailscale logout || true
