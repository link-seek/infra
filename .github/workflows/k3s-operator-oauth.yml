name: k3s-operator-oauth
# operator-oauth Secret 现场签发（真值不进仓）：读组织 Secret TS_K3S_OPERATOR_OAUTH
#（JSON：{"client_id":"..","client_secret":".."}，控制台 Trust credentials 建，
# 写权限：General/Services + Devices/Core + Keys/Auth Keys，均带 tag:k8s-operator），
# 直登 mesh-hw-69 单跳 kubectl 写入 ns tailscale。flux 只管 manifest，不管 Secret。
# 手动 dispatch；平时勿点（OAuth secret 无过期，轮换才用）。

on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: join tailnet (guest, mint-only)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')" \
            -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":true,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}},"expires":"2026-11-16T00:00:00Z"}}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c 'import json,sys;print(json.load(sys.stdin)["key"])')"
          [ -n "$MINTED" ] || { echo "FAIL: mint"; exit 1; }
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="k3s-oauth-mint-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false

      - name: render + ship operator-oauth
        env:
          OAUTH_JSON: ${{ secrets.TS_K3S_OPERATOR_OAUTH }}
        run: |
          set -euo pipefail
          [ -n "$OAUTH_JSON" ] || { echo "FAIL: TS_K3S_OPERATOR_OAUTH 未配（先在组织 Secrets 建，再点）"; exit 1; }
          CID="$(printf '%s' "$OAUTH_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["client_id"])')"
          CSEC="$(printf '%s' "$OAUTH_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["client_secret"])')"
          [ -n "$CID" ] && [ -n "$CSEC" ] || { echo "FAIL: JSON 缺 client_id/secret"; exit 1; }
          { echo "client_id=$CID"; echo "client_secret=$CSEC"; } > /tmp/operator-oauth.env
          chmod 600 /tmp/operator-oauth.env
          sudo tailscale ssh root@100.93.119.21 "cat > /tmp/operator-oauth.env && chmod 600 /tmp/operator-oauth.env" < /tmp/operator-oauth.env
          sudo tailscale ssh root@100.93.119.21 \
            "set -euo pipefail; kubectl create namespace tailscale --dry-run=client -o yaml | kubectl apply -f - >/dev/null && kubectl create secret generic operator-oauth -n tailscale --from-env-file=/tmp/operator-oauth.env --dry-run=client -o yaml | kubectl apply -f - && rm -f /tmp/operator-oauth.env && kubectl -n tailscale get secret operator-oauth -o jsonpath='{.metadata.name} ok'"
          rm -f /tmp/operator-oauth.env
          echo OAUTH-MINTED
