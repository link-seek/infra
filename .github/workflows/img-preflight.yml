name: deliver-preflight

# img 预检入口：被镜像线跨仓触发（gh workflow run + 轮询），只做「部署到镜像 runner 的标签 + 启动自测」。
# 文件名冻结为跨仓契约（docker-images bake-* 按文件名调用），只改 name 显示为 deliver-preflight。
# 细致测试在镜像 runner 本地跑（镜像仓的步骤，直连 canary）；本线成功只代表装上且 boot 通过。
# 内部转调 deliver-stack（复用线，action=preflight：同 env 同网络起 canary，boot 探针，停 canary 不切流）。
on:
  workflow_dispatch:
    inputs:
      digest_or_tag:
        description: "temp tag 的 digest（sha256:…），img 入参"
        required: true
      stack_dir:
        description: "栈目录"
        required: true
        type: choice
        options:
          - stacks/litellm-gateway
          - stacks/opencode-prod
      node_tag:
        description: "镜像 runner 的 TS 标签（镜像线生成，如 img-<run号>），防并发"
        required: true
      ssh_key_b64:
        description: "镜像 runner 现生成的单次 SSH 私钥（base64，仅本 run 有效；留空则用仓库 SSH_KEY）"
        required: false
        default: ""
      ssh_transport:
        description: "tailscale 或 key（仅回退）"
        required: false
        default: tailscale
        type: choice
        options:
          - key
          - tailscale
  workflow_call:
    inputs:
      digest_or_tag:
        required: true
        type: string
      stack_dir:
        required: true
        type: string
      node_tag:
        required: true
        type: string
      ssh_key_b64:
        required: false
        type: string
        default: ""
      ssh_transport:
        required: false
        type: string
        default: tailscale
    secrets:
      TS_API_KEY:
        required: true
      SSH_KEY:
        required: false
      SWR_LOGIN_USER:
        required: false
      SWR_LOGIN_PASS:
        required: false
      OPENCODE_API_KEY:
        required: false
      ENV_GH_TOKEN:
        required: false
      ENV_LITELLM_API_KEY:
        required: false
      ENV_OPENCODE_SERVER_PASSWORD:
        required: false
      ENV_HCLOUD_AK:
        required: false
      ENV_HCLOUD_SK:
        required: false
      ENV_SMTP_PASS:
        required: false
      CF_PARENT_TOKEN:
        required: false

concurrency:
  group: deliver-preflight-${{ inputs.node_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/deliver-stack.yml
    with:
      node_tag: ${{ inputs.node_tag }}
      digest_or_tag: ${{ inputs.digest_or_tag }}
      stack_dir: ${{ inputs.stack_dir }}
      action: preflight
      ssh_key_b64: ${{ inputs.ssh_key_b64 }}
      ssh_transport: ${{ inputs.ssh_transport }}
    secrets:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      ENV_GH_TOKEN: ${{ secrets.PROD_GH_TOKEN }}
      ENV_LITELLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      ENV_OPENCODE_SERVER_PASSWORD: ${{ secrets.PROD_OPENCODE_SERVER_PASSWORD }}
      CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
      ENV_HCLOUD_AK: ${{ secrets.PROD_HCLOUD_AK }}
      ENV_HCLOUD_SK: ${{ secrets.PROD_HCLOUD_SK }}
      ENV_SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
