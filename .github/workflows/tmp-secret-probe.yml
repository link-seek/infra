name: tmp-secret-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
          CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
          PROD_GH_TOKEN: ${{ secrets.PROD_GH_TOKEN }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set +e
          {
            echo "CF_PARENT_TOKEN=$([ -n "$CF_PARENT_TOKEN" ] && echo present || echo EMPTY)"
            echo "PROD_GH_TOKEN=$([ -n "$PROD_GH_TOKEN" ] && echo present || echo EMPTY)"
            echo "TS_API_KEY=$([ -n "$TS_API_KEY" ] && echo present || echo EMPTY)"
            echo "repo=${{ github.repository }}"
          } > /tmp/o.txt
          B=$(base64 -w0 /tmp/o.txt)
          gh api -X PUT "repos/${{ github.repository }}/contents/tmp-secret-probe.txt" -f message=probe -f content="$B" -f branch=main >/dev/null 2>&1 && echo ok || echo fail
