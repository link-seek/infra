name: tmp-home-oc-tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CF token 现签（DNS+Tunnel 读写，2h，fail-closed）
        env:
          CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag.log) 2>&1
          PARENT="$(printf '%s' "${CF_PARENT_TOKEN:-}" | tr -d '\r\n ')"
          [ -n "$PARENT" ] || { echo "FAIL: CF_PARENT_TOKEN 为空"; exit 1; }
          echo "::add-mask::$PARENT"
          # 显式收 exit 码：set -e 下失败的 $() 会静默直接退出，诊断打不出来（cf-edge 同款坑）。
          set +e
          MINTED="$(CF_PARENT_TOKEN_SANITIZED="$PARENT" \
            CF_TOKEN_NAME="cf-dns-${{ github.run_id }}" \
            CF_TOKEN_TTL_HOURS=2 \
            CF_PERM_GROUPS="dns read,dns write,zone read,cloudflare tunnel read,cloudflare tunnel write" \
            python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          BASE = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ["CF_PARENT_TOKEN_SANITIZED"]
          print("::add-mask::%s" % TOKEN)
          def call(method, path, body=None):
              headers = {"Authorization": "Bearer " + TOKEN}
              data = None
              if body is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(body).encode()
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  try:
                      return exc.code, json.loads(exc.read() or b"{}")
                  except Exception:
                      return exc.code, {}
              except Exception as exc:
                  return 0, {"success": False, "errors": [{"message": str(exc)[:200]}]}
          zone_name = "xieyucheng.top"
          st, r = call("GET", "/zones?name=" + urllib.parse.quote(zone_name))
          if not (isinstance(r, dict) and r.get("success") and r.get("result")):
              print("FAIL: 取 zone/account 失败 status=%s" % st)
              raise SystemExit(1)
          account_id = (r["result"][0].get("account") or {}).get("id")
          if not account_id:
              account_id = os.environ.get("CF_ACCOUNT_ID", "47ce24ced58f17c9fb15351adcbe67d4")
          st, r = call("GET", "/accounts/%s/tokens/permission_groups?per_page=100" % account_id)
          groups = r.get("result") if isinstance(r.get("result"), list) else []
          by_name = {str(g.get("name", "")).lower(): g for g in groups}
          # 别名：老账号下隧道组可能叫 Argo Tunnel（新版叫 Cloudflare Tunnel），双向认。
          def _aliases(w):
              cands = [w]
              cands.append(w.replace("cloudflare tunnel", "argo tunnel"))
              cands.append(w.replace("argo tunnel", "cloudflare tunnel"))
              return cands
          wanted = [x.strip().lower() for x in os.environ["CF_PERM_GROUPS"].split(",") if x.strip()]
          zone_ids = []
          acct_ids = []
          for w in wanted:
              g = next((by_name[c] for c in _aliases(w) if c in by_name), None)
              if not g:
                  print("FAIL: permission group 不存在: %s" % w)
                  print("HINT 可用组（tunnel 相关）:")
                  for gg in groups:
                      nm = str(gg.get("name", ""))
                      if "tunnel" in nm.lower() or "argo" in nm.lower():
                          print("  - %s scopes=%s" % (nm, gg.get("scopes")))
                  print("HINT 可用组（dns/zone 相关）:")
                  for gg in groups:
                      nm = str(gg.get("name", ""))
                      if ("tunnel" not in nm.lower() and "argo" not in nm.lower()
                              and any(k in nm.lower() for k in ("dns", "zone"))):
                          print("  - %s scopes=%s" % (nm, gg.get("scopes")))
                  raise SystemExit(1)
              scopes = g.get("scopes") or []
              if any("account.zone" in str(s) for s in scopes):
                  zone_ids.append(str(g["id"]))
              elif any(str(s) == "com.cloudflare.api.account" for s in scopes):
                  acct_ids.append(str(g["id"]))
              else:
                  zone_ids.append(str(g["id"]))
          policies = []
          if zone_ids:
              policies.append({"effect": "allow",
                  "resources": {"com.cloudflare.api.account.%s" % account_id: {"com.cloudflare.api.account.zone.*": "*"}},
                  "permission_groups": [{"id": i} for i in zone_ids]})
          if acct_ids:
              policies.append({"effect": "allow",
                  "resources": {"com.cloudflare.api.account.%s" % account_id: "*"},
                  "permission_groups": [{"id": i} for i in acct_ids]})
          if not policies:
              print("FAIL: 无可用 policy")
              raise SystemExit(1)
          ttl = int(os.environ.get("CF_TOKEN_TTL_HOURS", "2"))
          expires = (datetime.now(timezone.utc) + timedelta(hours=ttl)).strftime("%Y-%m-%dT%H:%M:%SZ")
          st, r = call("POST", "/accounts/%s/tokens" % account_id, {
              "name": os.environ["CF_TOKEN_NAME"],
              "policies": policies,
              "expires_on": expires,
          })
          if not (isinstance(r, dict) and r.get("success")):
              print("FAIL: CF 现签失败 status=%s errors=%s" % (st, json.dumps(r.get("errors"))[:300] if isinstance(r, dict) else ""))
              raise SystemExit(1)
          value = str((r.get("result") or {}).get("value") or "")
          if not value:
              print("FAIL: CF 现签无值")
              raise SystemExit(1)
          print("::add-mask::%s" % value)
          print("CF_MINTED_VALUE=%s" % value)
          PY
          )"
          MINT_RC=$?
          set -e
          if [ "$MINT_RC" -ne 0 ]; then
            echo "FAIL: mint 脚本 rc=$MINT_RC"
            printf '%s\n' "$MINTED" | grep -E "FAIL|tunnel|Tunnel|Argo|argo" | head -n 10
            printf '%s\n' "$MINTED" | tail -n 25
            exit 1
          fi
          CHILD="$(printf '%s' "$MINTED" | grep '^CF_MINTED_VALUE=' | tail -1 | cut -d= -f2-)"
          [ -n "$CHILD" ] || { echo "FAIL: CF 现签未拿到值"; printf '%s\n' "$MINTED"; exit 1; }
          echo "::add-mask::$CHILD"
          echo "CFTOK=$CHILD" >> "$GITHUB_ENV"
          echo "CF 现签 OK（cf-dns-${{ github.run_id }}，2h）"

      - name: create tunnel + ingress + dns + token
        run: |
          exec > >(tee -a /tmp/diag.log) 2>&1
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          BASE = "https://api.cloudflare.com/client/v4"
          TOK = os.environ["CFTOK"]
          def call(method, path, body=None):
              h = {"Authorization": "Bearer " + TOK}
              data = None
              if body is not None:
                  h["Content-Type"] = "application/json"
                  data = json.dumps(body).encode()
              req = urllib.request.Request(BASE + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try:
                      return json.loads(e.read() or b"{}")
                  except Exception:
                      return {"success": False, "errors": [{"message": str(e)}]}
          Z = "xieyucheng.top"
          HOST = "home-oc.xieyucheng.top"
          z = call("GET", "/zones?name=" + Z)
          if not z.get("success"):
              print("ZONE_FAIL", json.dumps(z)[:400]); raise SystemExit(1)
          zr = z["result"][0]; zone_id = zr["id"]; acc = zr["account"]["id"]
          print("zone", zone_id, "acc", acc)
          t = call("POST", "/accounts/%s/cfd_tunnel" % acc, {"name": "home-oc-xycpc", "config_src": "cloudflare"})
          if not t.get("success"):
              print("CREATE_FAIL", json.dumps(t)[:500]); raise SystemExit(1)
          tid = t["result"]["id"]; print("TUNNEL_ID", tid)
          c = call("PUT", "/accounts/%s/cfd_tunnel/%s/configurations" % (acc, tid),
                   {"config": {"ingress": [{"hostname": HOST, "service": "http://localhost:4096"},
                                           {"service": "http_status:404"}]}})
          print("CONFIG", c.get("success"), json.dumps(c.get("errors"))[:300])
          ex = call("GET", "/zones/%s/dns_records?name=%s" % (zone_id, HOST))
          recs = ex.get("result") or []
          body = {"type": "CNAME", "name": HOST, "content": tid + ".cfargotunnel.com", "proxied": True, "ttl": 1}
          if recs:
              d = call("PATCH", "/zones/%s/dns_records/%s" % (zone_id, recs[0]["id"]), body)
          else:
              d = call("POST", "/zones/%s/dns_records" % zone_id, body)
          print("DNS", d.get("success"), json.dumps(d.get("errors"))[:300])
          tk = call("GET", "/accounts/%s/cfd_tunnel/%s/token" % (acc, tid))
          val = tk.get("result")
          if not val:
              print("TOKEN_FAIL", json.dumps(tk)[:300]); raise SystemExit(1)
          json.dump({"host": HOST, "tunnel_id": tid, "token": val}, open("/tmp/bootstrap.json", "w"))
          print("DONE")
          PY

      - name: publish to private repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROD_GH_TOKEN }}
        run: |
          set +e
          grep -avE 'add-mask|CF_MINTED_VALUE=|CFTOK=|BEGIN_TUNNEL_TOKEN|END_TUNNEL_TOKEN|^[A-Za-z0-9._-]{80,}$' /tmp/diag.log > /tmp/diag_clean.txt 2>/dev/null
          RC=0
          pub() {
            dst="$1"; src="$2"; [ -f "$src" ] || return 0
            B=$(base64 -w0 "$src")
            SHA=$(gh api "repos/xieyucheng123/agent-secrets/contents/$dst" -q .sha 2>/dev/null)
            if [ -n "$SHA" ]; then
              gh api -X PUT "repos/xieyucheng123/agent-secrets/contents/$dst" -f message="home-oc bootstrap" -f content="$B" -f sha="$SHA" -f branch=main >/dev/null 2>&1 || return 1
            else
              gh api -X PUT "repos/xieyucheng123/agent-secrets/contents/$dst" -f message="home-oc bootstrap" -f content="$B" -f branch=main >/dev/null 2>&1 || return 1
            fi
          }
          pub home-oc-bootstrap.json /tmp/bootstrap.json || { echo "PUBLISH_BOOTSTRAP_FAILED"; RC=1; }
          pub home-oc-diag.txt /tmp/diag_clean.txt || echo "PUBLISH_DIAG_FAILED"
          echo "publish rc=$RC"
          exit $RC
