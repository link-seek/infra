name: opencode-fix-review

# Review 对线机器人：review bot 留 findings → 本 job 按未解决 threads 逐条修 → 推回 PR 分支。
# 人只管三件事：争议判定、--admin 破例、破坏性操作确认；合并永远人工。
# 护栏：同仓 PR 才跑；每 PR 最多 max-rounds 轮自动修（默认 3，超了留言转人工）；
#   只改 PR 分支，不碰 main；不合并、不关 PR、不 dismiss review；
#   禁止 destructive（删设备/下发 ACL/部署/转流量）——这类 findings 只回 comment 说明，等人工。
# 密钥：只走 secrets，绝不进日志；改完本地必验（yaml/py_compile/相关 norm）。

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR 号（手动触发用）"
        required: false
        default: ""
      max-rounds:
        description: "单 PR 自动修上限轮数"
        required: false
        default: "3"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fix-review-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - name: 解析 PR 号与分支
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then PR="${{ inputs.pr-number }}"; else PR="${{ github.event.pull_request.number }}"; fi
          [ -n "$PR" ] || { echo "FAIL: 取不到 PR 号"; exit 1; }
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            PR_REPO="${{ github.event.pull_request.head.repo.full_name }}"
            if [ "$PR_REPO" != "$GITHUB_REPOSITORY" ]; then echo "非同仓 PR，跳过"; echo "open=no" >> "$GITHUB_OUTPUT"; echo "branch=" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "max=${{ inputs.max-rounds || '3' }}" >> "$GITHUB_OUTPUT"
          INFO="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefName --jq '{s:.state, b:.headRefName}')"
          echo "pr-info: $INFO"
          S="$(echo "$INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['s'])")"
          B="$(echo "$INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['b'])")"
          if [ "$S" = OPEN ] && [ -n "$B" ]; then echo "open=yes" >> "$GITHUB_OUTPUT"; else echo "open=no" >> "$GITHUB_OUTPUT"; fi
          echo "branch=$B" >> "$GITHUB_OUTPUT"

      - name: 轮数护栏（超限转人工）
        id: gate
        if: steps.cfg.outputs.open == 'yes'
        run: |
          set -euo pipefail
          PR="${{ steps.cfg.outputs.pr }}"; MAX="${{ steps.cfg.outputs.max }}"
          RESP="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '[.[] | select((.commit.message // "") | test("\\[auto-fix\\]"))] | length')" || { echo "FAIL: 取 commits 失败"; exit 1; }
          N="$(printf '%s' "$RESP" | tr -cd '0-9')"; [ -n "$N" ] || { echo "FAIL: 轮数解析失败"; exit 1; }
          echo "auto-fix 已推 $N 轮，上限 $MAX"
          if [ "$N" -ge "$MAX" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "fix-review：自动修已达上限（$N/$MAX），转人工。请人看一眼未解决 threads，手动改或关闭。"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出 PR 分支
        if: steps.gate.outputs.skip == 'no'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: 收集未解决 review threads
        if: steps.gate.outputs.skip == 'no'
        run: |
          set -euo pipefail
          PR="${{ steps.cfg.outputs.pr }}"
          gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(last:50){nodes{id isResolved path line originalLine comments(first:20){nodes{author{login}body}}}}}}}' -f o="${GITHUB_REPOSITORY%%/*}" -f r="${GITHUB_REPOSITORY##*/}" -F n="$PR" --jq 'if (.errors // []) | length > 0 then error((.errors[0].message // "graphql error")) else ([(((.data.repository.pullRequest // {}).reviewThreads.nodes // []))[] | select(.isResolved == false)] | .[] | "### " + ((.path | if . == null or . == "" then "?" else . end)) + ":" + (((.line | if . == null then (.originalLine | if . == null then "?" else . end) else . end)) | tostring) + "\n" + ([((.comments.nodes // [])[] | "- @" + ((.author.login // "?")) + ": " + ((.body // ""))) ] | join("\n"))) end' > /tmp/threads.md
          if [ ! -s /tmp/threads.md ]; then echo "无未解决 threads，退出"; echo "EMPTY=yes" >> "$GITHUB_ENV"; exit 0; fi
          wc -l /tmp/threads.md

      - name: 取 bot 插件/skills（与 review 同一套 agent）
        if: steps.gate.outputs.skip == 'no' && env.EMPTY != 'yes'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/fixbot && mkdir -p /tmp/fixbot
          git clone --depth 1 --filter=blob:none --sparse "https://x-access-token:$GH_TOKEN@github.com/link-seek/opencode-github-bot.git" /tmp/fixbot
          git -C /tmp/fixbot sparse-checkout set .opencode scripts
          for d in plugins skills agents; do
            [ -d "/tmp/fixbot/.opencode/$d" ] || { echo "FAIL: 缺 /tmp/fixbot/.opencode/$d"; exit 1; }
            mkdir -p ".opencode/$d"
            cp -r "/tmp/fixbot/.opencode/$d/." ".opencode/$d/"
          done
          cp /tmp/fixbot/scripts/model-cli.py /tmp/model-cli.py

      - name: 装 opencode 并修
        if: steps.gate.outputs.skip == 'no' && env.EMPTY != 'yes'
        env:
          MODEL: ${{ vars.OPENCODE_MODEL }}
          LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_BULK: ${{ secrets.OPENCODE_API_KEY_BULK }}
          KEY_FAST: ${{ secrets.KEY_FAST }}
          KEY_BULK: ${{ secrets.KEY_BULK }}
          OPENCODE_CONFIG_CONTENT: '{"permission":"allow"}'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/v2/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          PR="${{ steps.cfg.outputs.pr }}"
          THREADS="$(head -c 20000 /tmp/threads.md)"
          CLI_MODEL="$(python3 /tmp/model-cli.py "$MODEL")"
          BULK="${KEY_BULK:-$OPENCODE_API_KEY_BULK}"
          FAST="${KEY_FAST:-${OPENCODE_API_KEY:-$LLM_API_KEY}}"
          if [ -n "$BULK" ]; then AGENT_KEY="$BULK"; else AGENT_KEY="$FAST"; fi
          export OPENCODE_API_KEY="$AGENT_KEY" LLM_API_KEY="$AGENT_KEY"
          opencode run --agent github-bot --model "${CLI_MODEL}" "你是 link-seek/infra 仓的 fix-review 机器人。任务：逐条修复 PR #$PR 的未解决 review findings（见下文），推回 PR 分支。
          铁律（违反即失败）：fail-closed，有疑问先停；只改 findings 涉及的文件；绝不合并/关 PR/dismiss review；绝不 destructive（删设备、下发 ACL、部署、转流量、改保护分支）——这类只回 comment 说明等人工；密钥只走 \${VAR}/GitHub Secrets，绝不进日志与聊天；commit 信息前缀 [auto-fix]；改完必须本地验证（yaml.safe_load、py_compile、相关 norm 脚本）；验证不过不许 push。
          findings 如下：
          $THREADS"

      - name: 验改动并推回 PR 分支
        if: steps.gate.outputs.skip == 'no' && env.EMPTY != 'yes'
        run: |
          set -euo pipefail
          STATUS="$(git status -sb)"
          mapfile -t _status_lines <<< "$STATUS"
          printf '%s\n' "${_status_lines[@]:0:10}"
          PORCELAIN="$(git status --porcelain)"
          [ -n "$PORCELAIN" ] || { echo "无改动，退出"; exit 0; }
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml'):
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  print('YAML-FAIL:', f, e); bad = 1
          sys.exit(bad)
          EOF
          git add -A
          git -c user.name="opencode-fix-bot" -c user.email="opencode-fix-bot@users.noreply.github.com" commit -m "[auto-fix] 回应 review findings（未解决 threads）"
          git push origin "HEAD:${{ steps.cfg.outputs.branch }}"
          PR="${{ steps.cfg.outputs.pr }}"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "fix-review：已按未解决 threads 推一轮修复（[auto-fix]），CI 与复检请继续。破坏性 findings（如有）未动，等人工。"
