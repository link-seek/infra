name: k3s-server-component
# 通用能力：管 server packaged component（disable 开关 + registries 下发 + 逐台滚动重启 + 一次性清理节点 manifests 残留）。
#
# ⚠️ 单一写入者原则：packaged component 的 HelmChartConfig 一律由 Flux 下发（k8s/**），本链**不再** scp 任何
#    manifest 到 /var/lib/rancher/k3s/server/manifests/。历史上本链会把 k8s/traefik-edge/k3s-traefik-config.yaml
#    同时塞进 manifests 目录，和 Flux 形成"双写"（改仓被旧副本回滚 / prune 复活 / ownership 互踩）。
#
# 注：HelmChartConfig 当前仍由现有 Flux Kustomization `traefik-edge` 管理（本 PR 不迁移 ownership，避免
#     两 Kustomization 争抢同一对象的时序问题）。仅去掉 scp + 提供 mode=purge 清节点残留，双写即消除。
#     后续若要把它从"试点目录 k8s/traefik-edge"迁出，需单开 PR 并按"先建新 Kustomization 接管→再删旧"
#     的顺序做，避免迁移瞬间对象被旧 Kustomization prune 掉。
#
# 阶段一用法：component=traefik（Flux 已管 HelmChartConfig）→ 本链只需 remove disable + 滚动重启。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon=只读；apply=去/加disable＋registries＋滚动重启；restart=仅滚动重启；ship=只改disable/registries不重启；purge=删除节点 manifests 残留（一次性去双写）"
        required: false
        default: "recon"
        type: choice
        options: [recon, apply, restart, ship, purge]
      component:
        description: "packaged component 名（traefik/coredns/servicelb…）"
        required: false
        default: "traefik"
      manifest_path:
        description: "仅 purge 用：要清理的节点 manifests 文件名（相对路径，取其 basename）"
        required: false
        default: "k8s/traefik-edge/k3s-traefik-config.yaml"
      disable:
        description: "config.yaml+unit 内 disable 条目：remove=去掉；add=加上；keep=不动"
        required: false
        default: "remove"
        type: choice
        options: [remove, add, keep]
      reg_src:
        description: "registries.yaml 声明路径（空=跳过下发）"
        required: false
        default: "edge/registries/registries.yaml"
      reg_dest:
        description: "registries.yaml 落点"
        required: false
        default: "/etc/rancher/k3s/registries.yaml"
      hw69_tail:
        required: false
        default: "100.93.119.21"
      hw21_tail:
        required: false
        default: "100.100.246.95"
      hw41_tail:
        required: false
        default: "100.73.182.4"
permissions:
  contents: read
concurrency:
  group: k3s-server-component
  cancel-in-progress: false
jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 进网（user 身份，HW 足够）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:github"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: mint"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-srvcomp-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
      - name: recon 三处抓现状
        if: inputs.mode == 'recon' || inputs.mode == 'apply' || inputs.mode == 'ship' || inputs.mode == 'purge'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          for H in ${{ inputs.hw69_tail }} ${{ inputs.hw21_tail }} ${{ inputs.hw41_tail }}; do
            echo "===== $H ====="
            ssh $SOPT "root@$H" 'echo "-- config.yaml (token 脱敏) --"; sed "s/^\(token:\)\s.*$/\1 ***/" /etc/rancher/k3s/config.yaml 2>/dev/null; echo "-- unit disable? --"; systemctl cat k3s 2>/dev/null | grep -i -E "disable|ExecStart=" || echo "unit: no disable"; echo "-- manifests ${{ inputs.component }}? --"; ls /var/lib/rancher/k3s/server/manifests/ | grep -i "${{ inputs.component }}" || echo "manifests: absent"' || echo "$H SSH-FAIL"
          done
          shred -u ~/.ssh/ci_key
          echo RECON-DONE
      - name: disable 开关（apply/ship；不再下发任何 manifest）
        if: inputs.mode == 'apply' || inputs.mode == 'ship'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          for H in ${{ inputs.hw69_tail }} ${{ inputs.hw21_tail }} ${{ inputs.hw41_tail }}; do
            scp $SOPT scripts/k3s-unit-disable.py "root@$H:/tmp/k3s-unit-disable.py"
          done
          for H in ${{ inputs.hw69_tail }} ${{ inputs.hw21_tail }} ${{ inputs.hw41_tail }}; do
            echo "===== disable $H ====="
            ssh $SOPT "root@$H" 'set -euo pipefail; C=/etc/rancher/k3s/config.yaml; M="${{ inputs.component }}";
              case "${{ inputs.disable }}" in
                remove)
                  if [ -f "$C" ]; then sed -i "/^[[:space:]]*-[[:space:]]*$M[[:space:]]*$/d" "$C"; fi
                  U=/etc/systemd/system/k3s.service
                  if [ -f "$U" ]; then python3 /tmp/k3s-unit-disable.py "$U" "$M" remove; fi
                  systemctl daemon-reload
                  echo "disable removed" ;;
                add) grep -q "disable:" "$C" 2>/dev/null || printf "disable:\n" >> "$C"; grep -q "$M" "$C" || sed -i "/disable:/a\\  - $M" "$C"; echo "disable added" ;;
                keep) echo "disable kept" ;;
              esac; grep -i -A3 "disable" "$C" 2>/dev/null || echo "config: no disable stanza"'
          done
          shred -u ~/.ssh/ci_key
          echo DISABLE-DONE
      - name: 清理节点 manifests 残留（mode=purge，一次性去双写）
        if: inputs.mode == 'purge'
        run: |
          set -euo pipefail
          FNAME="$(basename "${{ inputs.manifest_path }}")"
          [ -n "$FNAME" ] && [ "$FNAME" != "." ] && [ "$FNAME" != "/" ] || { echo "FAIL: manifest_path 无效（得到 '$FNAME'）"; exit 1; }
          echo "将删除三台 server 上 /var/lib/rancher/k3s/server/manifests/$FNAME（Flux 已是唯一写入者）"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          for H in ${{ inputs.hw69_tail }} ${{ inputs.hw21_tail }} ${{ inputs.hw41_tail }}; do
            echo "===== purge $H ====="
            ssh $SOPT "root@$H" "M=\"/var/lib/rancher/k3s/server/manifests/$FNAME\"; if [ -f \"\$M\" ]; then rm -f \"\$M\" && echo PURGED \$M; else echo ABSENT \$M; fi; ls /var/lib/rancher/k3s/server/manifests/ | grep -i traefik || echo 'manifests: traefik.yaml only'"
          done
          shred -u ~/.ssh/ci_key
          echo PURGE-DONE
      - name: ship registries.yaml（空即跳过）
        if: (inputs.mode == 'apply' || inputs.mode == 'ship') && inputs.reg_src != ''
        run: |
          set -euo pipefail
          [ -f "${{ inputs.reg_src }}" ] || { echo "FAIL: 声明不在仓：${{ inputs.reg_src }}"; exit 1; }
          python3 -c "import yaml; yaml.safe_load(open('${{ inputs.reg_src }}'))"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          for H in ${{ inputs.hw69_tail }} ${{ inputs.hw21_tail }} ${{ inputs.hw41_tail }}; do
            scp $SOPT "${{ inputs.reg_src }}" "root@$H:${{ inputs.reg_dest }}" && echo "shipped $H"
          done
          shred -u ~/.ssh/ci_key
          echo REGISTRIES-DONE
      - name: rolling restart（逐台＋quorum 门）
        if: inputs.mode == 'apply' || inputs.mode == 'restart'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          H69="${{ inputs.hw69_tail }}"
          for H in ${{ inputs.hw21_tail }} ${{ inputs.hw41_tail }} $H69; do
            echo "===== restart $H ====="
            ssh $SOPT "root@$H" 'systemctl restart k3s && sleep 20 && systemctl is-active k3s'
            for i in $(seq 1 20); do
              sleep 15
              READY=$(ssh $SOPT "root@$H69" "kubectl get nodes --no-headers 2>/dev/null | grep -c ' Ready'" || echo 0)
              echo "ready=$READY ($i/20)"
              [ "$READY" = 5 ] && break
              [ "$i" = 20 ] && { echo "FAIL: $H 重启后未全 Ready，原地停，不再往下滚"; exit 1; }
            done
          done
          ssh $SOPT "root@$H69" 'kubectl -n kube-system get pods -l app.kubernetes.io/name=${{ inputs.component }} 2>/dev/null || kubectl -n kube-system get pods | grep -i "${{ inputs.component }}" || echo "no ${{ inputs.component }} pods yet"; kubectl -n kube-system get svc ${{ inputs.component }} -o wide 2>/dev/null || echo "no svc ${{ inputs.component }} yet"'
          shred -u ~/.ssh/ci_key
          echo ROLLING-DONE
