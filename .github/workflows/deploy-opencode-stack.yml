name: deploy-opencode-stack

# 通用部署（试用/生产同一套机制，只换参数）：
# tailnet 进网 → 笼子自证 → keyscan → tar+ssh 同步 → 远端 verify_cmd。
# .env 永不经手；调用方只传参，不写步骤。

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      target:
        required: true
        type: string
      ssh_port:
        required: true
        type: string
      stack_dir:
        required: true
        type: string
      remote_dir:
        required: true
        type: string
      tar_files:
        required: true
        type: string
      verify_cmd:
        required: true
        type: string
      forbid:
        required: true
        type: string
      hostname_prefix:
        required: true
        type: string
    secrets:
      TS_AUTHKEY:
        required: true
      SSH_KEY:
        required: true
      UNIFIED_API_KEY:
        required: false
      # 终态 dotenv 现场 render：调用方按 env-sources.conf 把单 key 透传进来，
      # S_ 导出块见下 render 步骤；加 key 三处同改（map/env块/caller），render-check 强制对齐。
      # 存量 DOTENV_B64 已退役（删 org secret 前先等一次绿部署验证）。
      ENV_GH_TOKEN:
        required: false
      ENV_LITELLM_API_KEY:
        required: false
      ENV_OPENCODE_SERVER_PASSWORD:
        required: false
      ENV_CLOUDFLARE_API_TOKEN:
        required: false
      ENV_HCLOUD_AK:
        required: false
      ENV_HCLOUD_SK:
        required: false
      ENV_SSH_PRIVATE_KEY_B64:
        required: false
      ENV_SMTP_PASS:
        required: false
      ENV_CF_AI_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: secret 预检（只验存在，不打值）
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          SSHKEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$TS_AUTHKEY" ] || { echo "TS key missing"; exit 1; }
          [ -n "$SSHKEY" ] || { echo "SSH key missing"; exit 1; }
          echo "secrets present"

      - name: 加入 tailnet（一次性节点，用完即焚）
        timeout-minutes: 6
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TS_AUTHKEY="$(printf '%s' "$TS_AUTHKEY" | tr -d '\r\n ')"
          timeout 120 sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="${{ inputs.hostname_prefix }}-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          # 笼子自证：目标必须通，forbid 列表必须不通
          timeout 15 bash -c "</dev/tcp/${{ inputs.target }}/${{ inputs.ssh_port }}" || { echo "target unreachable"; exit 1; }
          echo "target reachable"
          for f in ${{ inputs.forbid }}; do
            ip="${f%%:*}"; label="${f#*:}"
            timeout 12 bash -c "</dev/tcp/$ip/${{ inputs.ssh_port }}" && { echo "CONTAINMENT FAIL: 摸到了 $label"; exit 1; } || echo "containment ok ($label unreachable)"
          done

      - name: 现场 render .env（终态：包只活内存）
        env:
          S_ENV_GH_TOKEN: ${{ secrets.ENV_GH_TOKEN }}
          S_ENV_LITELLM_API_KEY: ${{ secrets.ENV_LITELLM_API_KEY }}
          S_ENV_OPENCODE_SERVER_PASSWORD: ${{ secrets.ENV_OPENCODE_SERVER_PASSWORD }}
          S_ENV_CLOUDFLARE_API_TOKEN: ${{ secrets.ENV_CLOUDFLARE_API_TOKEN }}
          S_ENV_HCLOUD_AK: ${{ secrets.ENV_HCLOUD_AK }}
          S_ENV_HCLOUD_SK: ${{ secrets.ENV_HCLOUD_SK }}
          S_ENV_SSH_PRIVATE_KEY_B64: ${{ secrets.ENV_SSH_PRIVATE_KEY_B64 }}
          S_ENV_SMTP_PASS: ${{ secrets.ENV_SMTP_PASS }}
          S_ENV_CF_AI_TOKEN: ${{ secrets.ENV_CF_AI_TOKEN }}
        run: |
          set -euo pipefail
          # 日志只列键名（脚本保证不打值）；键集合与 .env.example 对不上直接失败
          bash scripts/render-dotenv.sh --map "${{ inputs.stack_dir }}/env-sources.conf" --example "${{ inputs.stack_dir }}/.env.example" --out /tmp/ci-dotenv

      - name: 下发 + verify（经 tailnet，不走公网）
        timeout-minutes: 12
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          UNIFIED_KEY: ${{ secrets.UNIFIED_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          NODE="${{ inputs.target }}"
          PORT="${{ inputs.ssh_port }}"
          ssh-keyscan -p "$PORT" -H "$NODE" >> ~/.ssh/known_hosts 2>/dev/null
          # 先备份线上 compose（必须在同步之前，否则备的是新文件——生产灰度教训）
          ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE \
            "test -f ${{ inputs.remote_dir }}/compose.yml && cp ${{ inputs.remote_dir }}/compose.yml ${{ inputs.remote_dir }}/compose.yml.prev-$(date -u +%Y%m%dT%H%M%SZ) && echo backup-ok || { echo 'ABORT: 线上无 compose.yml'; exit 1; }"
          # 现场 render 的 .env 下发（600 落盘；值不打印，键名见上一 render 步骤）
          scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/ci_key /tmp/ci-dotenv root@$NODE:${{ inputs.remote_dir }}/.env
          ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE "chmod 600 ${{ inputs.remote_dir }}/.env && echo dotenv-written"
          # tar+ssh 管道（目标机 .bashrc 回显杀死 scp，见试用演练）
          tar -czf - -C "${{ inputs.stack_dir }}" ${{ inputs.tar_files }} | \
            ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE \
            "mkdir -p ${{ inputs.remote_dir }} && tar -xzf - -C ${{ inputs.remote_dir }} && echo synced"
          # verify 经临时文件下发：先写 verify_cmd，替换 __UNIFIED_KEY__ 占位符，再 SSH 发送
          cat > /tmp/verify_cmd.sh <<'VERIFY_EOF'
          ${{ inputs.verify_cmd }}
          VERIFY_EOF
          if [ -n "$UNIFIED_KEY" ]; then
            sed -i "s|__UNIFIED_KEY__|$UNIFIED_KEY|g" /tmp/verify_cmd.sh
          fi
          ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE bash -s < /tmp/verify_cmd.sh
          rm -f /tmp/verify_cmd.sh /tmp/ci-dotenv
