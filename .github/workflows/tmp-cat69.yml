name: tmp-cat69
# 一次性：读三 server 的 traefik 期望文件（定位用）。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-cat69
  cancel-in-progress: false
jobs:
  cat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
    steps:
      - name: 进网＋读文件
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || exit 1
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-cat69-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=no -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key"
          for H in 100.93.119.21 100.100.246.95 100.73.182.4; do
            echo "===== $H ====="
            ssh $SOPT "root@$H" 'ls -la /var/lib/rancher/k3s/server/manifests/ | grep -i traefik; echo ---; grep -c allowExternalNameServices /var/lib/rancher/k3s/server/manifests/k3s-traefik-config.yaml 2>/dev/null || echo NOKEY' 2>&1 | head -6
          done
          shred -u ~/.ssh/ci_key
          echo CAT-DONE
