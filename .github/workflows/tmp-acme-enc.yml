name: tmp-acme-enc
# 一次性：mint CF DNS token＋SOPS 加密 acme-cf → infra PR。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-acme-enc
  cancel-in-progress: false
jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
      AGENT_GH: ${{ secrets.AGENT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: mint＋加密＋开 PR
        run: |
          set -euo pipefail
          CF_TOKEN_SAN="$(printf '%s' "$CF_PARENT_TOKEN" | tr -d '\r\n ')"
          [ -n "$CF_TOKEN_SAN" ] || { echo "FAIL: CF_PARENT_TOKEN missing"; exit 1; }
          echo "::add-mask::$CF_TOKEN_SAN"
          SOPS_VER=v3.13.3
          curl -fsSL --retry 3 -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VER}/sops-${SOPS_VER}.linux.amd64"
          chmod +x /tmp/sops
          CF_CHILD="$(CF_PARENT_TOKEN_SANITIZED="$CF_TOKEN_SAN" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 scripts/cf-mint-child.py | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
          [ -n "$CF_CHILD" ] || { echo "FAIL: CF mint"; exit 1; }
          echo "::add-mask::$CF_CHILD"
          MINT_DAY="$(date -u +%F)"
          python3 - "$CF_CHILD" "$MINT_DAY" <<'PYEOF'
          import sys, yaml
          tok, day = sys.argv[1], sys.argv[2]
          doc = {"apiVersion": "v1", "kind": "Secret",
                 "metadata": {"name": "acme-cf", "namespace": "kube-system",
                              "annotations": {"sops-cutover": day, "cf-minted-at": day}},
                 "type": "Opaque", "stringData": {"CF_DNS_API_TOKEN": tok}}
          head = "# SOPS 密文（Traefik ACME DNS-01 用；90 天随 CF 轮换）：仅 Flux 解密，明文只活加密当次 runner 内存。\n"
          open("/tmp/out.yaml", "w").write(head + yaml.safe_dump(doc, sort_keys=False))
          PYEOF
          /tmp/sops --encrypt --age "age1xa3yp8xdquu3v0wlg3n2gmlmah7z60uz8m9e0py7xx30ct4vlu8sjhd87z" \
            --encrypted-regex '^(data|stringData)$' --output /tmp/enc.yaml /tmp/out.yaml
          shred -u /tmp/out.yaml /tmp/sops
          python3 -c "import yaml,re; d=yaml.safe_load(open('/tmp/enc.yaml')); sd=d['stringData']; assert all(re.fullmatch(r'ENC\[AES256_GCM.*', v) for v in sd.values()); print('ENC-OK', sorted(sd))"
          rm -rf /tmp/ir && git clone --depth 1 --branch main "https://x-access-token:${AGENT_GH}@github.com/link-seek/infra.git" /tmp/ir
          cp /tmp/enc.yaml /tmp/ir/k8s/traefik-edge/acme-cf.enc.yaml
          cd /tmp/ir && git checkout -b chore/acme-cf-enc && git add k8s/traefik-edge/acme-cf.enc.yaml && git -c user.name=opencode-bot -c user.email=opencode-bot@users.noreply.github.com commit -m "chore(traefik): ACME CF token 密文（$MINT_DAY）" && git push origin chore/acme-cf-enc
          gh pr create --repo link-seek/infra --base main --head chore/acme-cf-enc --title "chore(traefik): ACME CF token 密文" --body "密文-only。用完 tmp 即删。" 2>&1 | tail -1
          echo ENC-DONE
