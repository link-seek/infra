name: _sops-reencrypt-core
# 共用 core（reusable）：只实现固定机制（读配方→组装→加密→PR），不认识任何具体 app。
# 加 app：dimgs 加 k8s/<dir>/sops-secrets.yaml＋一个薄触发器（默认走生产 age recipient）。
# 非生产密文（如 preflight test）：触发器传 age_recipient＋配方用 LITERAL: 值，core 不动逻辑只走参。
# 别直接 dispatch 本文件。
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      dir:
        required: true
        type: string
      reason:
        required: false
        type: string
        default: key-updated
      age_recipient:
        required: false
        type: string
        default: age1xa3yp8xdquu3v0wlg3n2gmlmah7z60uz8m9e0py7xx30ct4vlu8sjhd87z
    secrets:
      OPENCODE_API_KEY: { required: true }
      PROD_GH_TOKEN: { required: true }
      PROD_OPENCODE_SERVER_PASSWORD: { required: true }
      PROD_HCLOUD_AK: { required: true }
      PROD_HCLOUD_SK: { required: true }
      PROD_SMTP_PASS: { required: true }
      CF_PARENT_TOKEN: { required: true }
      PROD_BROWSERLESS_TOKEN: { required: false }
      MAAS_KEY: { required: false }
      ALI_AK: { required: false }
      ALI_SK: { required: false }
      OCI_API_PRIVATE_KEY: { required: false }
      AGENT_GITHUB_TOKEN: { required: true }
      TS_API_KEY: { required: true }
      CI_KUBE_CA: { required: true }
      CI_KUBE_TOKEN: { required: true }
permissions:
  contents: read
concurrency:
  group: sops-reencrypt-${{ inputs.app }}
  cancel-in-progress: true
jobs:
  reencrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      PROD_GH_TOKEN: ${{ secrets.PROD_GH_TOKEN }}
      PROD_OPENCODE_SERVER_PASSWORD: ${{ secrets.PROD_OPENCODE_SERVER_PASSWORD }}
      PROD_HCLOUD_AK: ${{ secrets.PROD_HCLOUD_AK }}
      PROD_HCLOUD_SK: ${{ secrets.PROD_HCLOUD_SK }}
      PROD_SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
      CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
      PROD_BROWSERLESS_TOKEN: ${{ secrets.PROD_BROWSERLESS_TOKEN }}
      MAAS_KEY: ${{ secrets.MAAS_KEY }}
      ALI_AK: ${{ secrets.ALI_AK }}
      ALI_SK: ${{ secrets.ALI_SK }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 取配方（dimgs，只读）
        uses: actions/checkout@v4
        with:
          repository: link-seek/docker-images
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ref: main
          path: recipe-src
          sparse-checkout: |
            k8s/${{ inputs.dir }}/sops-secrets.yaml
          sparse-checkout-cone-mode: false
      - name: 组装＋加密（明文只活 runner 内存）
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"; DIR="${{ inputs.dir }}"
          RECIPE="recipe-src/k8s/$DIR/sops-secrets.yaml"
          [ -f "$RECIPE" ] || { echo "FAIL: 配方缺失 $RECIPE（先合配方 PR）"; exit 1; }
          python3 -c "import yaml; d=yaml.safe_load(open('$RECIPE')); print('recipe:', d['secretName'], d['namespace'], len(d['keys']), 'keys')"
          SOPS_VER=v3.13.3
          curl -fsSL --retry 3 -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VER}/sops-${SOPS_VER}.linux.amd64"
          chmod +x /tmp/sops && /tmp/sops --version
          if grep -q "CF_MINTED" "$RECIPE"; then
            CF_TOKEN_SAN="$(printf '%s' "$CF_PARENT_TOKEN" | tr -d '\r\n ')"
            [ -n "$CF_TOKEN_SAN" ] || { echo "FAIL: CF_PARENT_TOKEN missing"; exit 1; }
            echo "::add-mask::$CF_TOKEN_SAN"
            export CF_CHILD="$(CF_PARENT_TOKEN_SANITIZED="$CF_TOKEN_SAN" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-child.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
            export CF_AI="$(CF_PARENT_TOKEN_SANITIZED="$CF_TOKEN_SAN" CF_ACCOUNT_ID="47ce24ced58f17c9fb15351adcbe67d4" python3 "$GITHUB_WORKSPACE/scripts/cf-mint-ai.py" | grep '^CF_MINTED_VALUE=' | cut -d= -f2-)"
            [ -n "$CF_CHILD" ] && [ -n "$CF_AI" ] || { echo "FAIL: CF mint"; exit 1; }
            echo "::add-mask::$CF_CHILD"; echo "::add-mask::$CF_AI"
          fi
          for v in OPENCODE_API_KEY PROD_GH_TOKEN PROD_OPENCODE_SERVER_PASSWORD PROD_HCLOUD_AK PROD_HCLOUD_SK PROD_SMTP_PASS CF_PARENT_TOKEN PROD_BROWSERLESS_TOKEN MAAS_KEY ALI_AK ALI_SK OCI_API_PRIVATE_KEY; do
            [ -n "${!v:-}" ] && echo "::add-mask::${!v}" || true
          done
          MINT_DAY="$(date -u +%F)"
          export MINT_DAY RUN_ID="$GITHUB_RUN_ID" APP DIR RECIPE AGE_RECIPIENT="${{ inputs.age_recipient }}"
          python3 <<'EOF'
          import os, re
          import yaml
          r = yaml.safe_load(open(os.environ["RECIPE"]))
          def resolve(src, key):
              if src.startswith("CF_MINTED:"):
                  kind = src.split(":", 1)[1]
                  assert kind in ("child", "ai"), "unknown mint verb %s" % src
                  v = os.environ["CF_CHILD" if kind == "child" else "CF_AI"]
                  assert v, "minted value missing for %s" % key
                  return v
              if src.startswith("LITERAL:"):
                  v = src.split(":", 1)[1]
                  assert v, "empty literal for %s" % key
                  return v
              assert re.fullmatch(r"[A-Z0-9_]+", src), "bad source %r" % src
              v = os.environ.get(src, "")
              assert v, "empty source %s for %s" % (src, key)
              return v
          def build(name, ns, keymap):
              vals = {k: resolve(s, k) for k, s in keymap.items()}
              return {"apiVersion": "v1", "kind": "Secret",
                      "metadata": {"name": name, "namespace": ns,
                                   "annotations": {"sops-cutover": os.environ["MINT_DAY"],
                                                   "cf-minted-at": os.environ["MINT_DAY"]}},
                      "type": "Opaque", "stringData": vals}
          main = build(r["secretName"], r["namespace"], r["keys"])
          docs = {"%s.env.yaml" % r["secretName"]: main}
          for extra in r.get("extraSecrets", []) or []:
              docs["%s.env.yaml" % extra["name"]] = build(extra["name"], r["namespace"], extra["keys"])
          assert docs, "no secrets"
          head = ("# SOPS 密文（配方见 dimgs k8s/%s/sops-secrets.yaml）：仅 Flux 解密，明文只活加密当次 runner 内存。\n"
                  "# 生成源：sops-reencrypt run %s。\n" % (os.environ["DIR"], os.environ["RUN_ID"]))
          for fn, doc in docs.items():
              open("/tmp/out-%s" % fn, "w").write(head + yaml.safe_dump(doc, sort_keys=False))
          print("assembled files=%s" % sorted(docs))
          open("/tmp/out-list.txt", "w").write("\n".join(sorted(docs)))
          EOF
          # 只加密 data|stringData（kind/metadata 明文 Flux 才认）。
          for f in $(cat /tmp/out-list.txt); do
            /tmp/sops --encrypt --age "$AGE_RECIPIENT" \
              --encrypted-regex '^(data|stringData)$' \
              --output "/tmp/enc-$f" "/tmp/out-$f"
            shred -u "/tmp/out-$f"
            python3 - "$f" <<'EOF'
          import re, sys
          import yaml
          fn = sys.argv[1]
          d = yaml.safe_load(open("/tmp/enc-" + fn))
          assert d["kind"] == "Secret", fn
          sd = d.get("stringData", {})
          assert sd and all(re.fullmatch(r"ENC\[AES256_GCM,data:[A-Za-z0-9+/=]+,.*", v) for v in sd.values()), "non-ciphertext in %s" % fn
          assert [x.get("recipient") for x in d["sops"]["age"]] == [os.environ["AGE_RECIPIENT"]]
          print("ENC-OK %s keys=%s" % (fn, sorted(sd)))
          EOF
          done
          shred -u /tmp/sops
          {
            echo "MINT_DAY=$MINT_DAY"
            echo "SECRET_NAME=$(python3 -c "import yaml,os; print(yaml.safe_load(open(os.environ['RECIPE']))['secretName'])")"
            echo "NS=$(python3 -c "import yaml,os; print(yaml.safe_load(open(os.environ['RECIPE']))['namespace'])")"
            echo "APPDIR=$DIR"
          } >> "$GITHUB_ENV"
          echo "encrypt done (ciphertext only, plaintext shredded)"
      - name: 向 dimgs 开密文 PR（只碰目标 app）
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "opencode-sops-reencrypt"
          git config --global user.email "opencode-sops-reencrypt@local"
          rm -rf /tmp/dimgs && git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/link-seek/docker-images.git" /tmp/dimgs
          EXTRA_FILES=()
          for f in $(cat /tmp/out-list.txt); do
            base="${f%.env.yaml}"
            cp "/tmp/enc-$f" "/tmp/dimgs/k8s/$APPDIR/$base.enc.yaml"
            EXTRA_FILES+=("k8s/$APPDIR/$base.enc.yaml")
          done
          cd /tmp/dimgs
          if [ -z "$(git status --porcelain -- "${EXTRA_FILES[@]}")" ]; then echo "NO-CHANGE: 密文无变化，不开 PR"; exit 0; fi
          BR="chore/$APPDIR-reencrypt-$(date -u +%F)-$GITHUB_RUN_ID"
          git checkout -b "$BR"
          git add "${EXTRA_FILES[@]}"
          git commit -m "chore($APPDIR): 重加密主 Secret（${{ inputs.reason }}，cf-minted-at $MINT_DAY）"
          git push -u origin "$BR"
          SHA="$(sha256sum "k8s/$APPDIR/$SECRET_NAME.enc.yaml" | cut -d' ' -f1)"
          URL="$(gh pr create --repo link-seek/docker-images --base main --head "$BR" \
            --title "chore($APPDIR): 重加密主 Secret（${{ inputs.reason }}）" \
            --body "由 sops-reencrypt run $GITHUB_RUN_ID 生成（app=${{ inputs.app }}，配方 k8s/$APPDIR/sops-secrets.yaml）。密文-only，明文未进仓。sha256=$SHA，cf-minted-at=$MINT_DAY。合后 Flux ≤5m 同步＋Reloader 重启。只碰 $APPDIR。")"
          echo "PR=$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PR opened: $URL"
