name: deliver-caddy
# 快递线（deliver）：只管送达到目标机；镜像内容由商家（docker-images bake-*）负责，不管内容。

# Caddy 配置变更 → 自动部署到入口机，全程留痕。
# 触发：只手动 workflow_dispatch（改仓不自动发；生产变更永远人手点火）。

on:
  workflow_dispatch:
    inputs:
      node_ip:
        description: "目标节点 tailnet IP（默认 mesh-ali-gz：100.85.128.116）"
        required: false
        default: "100.85.128.116"
      node_dir:
        description: "edge/caddy/<dir>/Caddyfile 对应目录（默认 mesh-ali-gz）"
        required: false
        default: "mesh-ali-gz"

concurrency:
  group: deliver-caddy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: secret 预检（只验长度+前缀，不打值）
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          SSHKEY: ${{ secrets.CADDY_SSH_KEY }}
          CFTOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          K="$(printf '%s' "$TS_API_KEY" | tr -d '\r\n ')"
          echo "tsapikey_len=${#K}"
          S="$(printf '%s' "$SSHKEY" | tr -d '\r\n ')"
          C="$(printf '%s' "$CFTOK" | tr -d '\r\n ')"
          echo "sshkey_len=${#S} cftoken_len=${#C}"
          if [ -z "$K" ]; then echo TSAPIKEY_EMPTY; exit 1; fi
          if [ "${#K}" -lt 20 ]; then echo TSAPIKEY_TOO_SHORT; exit 1; fi

      - name: Caddyfile 一致性检查
        run: |
          docker run --rm -v "$PWD/edge/caddy:/c" caddy:2 caddy fmt --overwrite /c/${{ inputs.node_dir || 'mesh-ali-gz' }}/Caddyfile
          git diff --exit-code -- edge/caddy/ || { echo 'caddy fmt 有改动，请本地 fmt 后再提交'; exit 1; }

      - name: 加入 tailnet（一次性节点，用完即焚）
        # 注：tailscale/github-action v2/v3 均已强制 OAuth（authkey 不可用），
        # 此处直调 CLI：up 用 TS_API_KEY 现场 mint 的 tag:ci 临时 key，结尾 logout 焚毁节点。
        # OAuth 迁移（MIGRATE-TS-OAUTH）仍有效，待 Tailscale 侧建 OAuth client 后切回 action。
        timeout-minutes: 6
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          echo "::add-mask::$TSKEY"
          MINTED=""
          MINT_BODY='{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}},"expirySeconds":21600}'
          MINT_RESP="$(mktemp)"
          MINT_CODE="$(curl -sS -m 30 -o "$MINT_RESP" -w '%{http_code}' -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' -d "$MINT_BODY" https://api.tailscale.com/api/v2/tailnet/-/keys 2>/tmp/mint.err || true)"
          if [ "$MINT_CODE" = "200" ] || [ "$MINT_CODE" = "201" ]; then
            echo "mint-bearer: HTTP $MINT_CODE"
            MINTED="$(python3 -c "import json; print(json.load(open('$MINT_RESP')).get('key',''))" || true)"
            [ -n "$MINTED" ] && echo "::add-mask::$MINTED"
          else
            echo "mint-bearer: HTTP $MINT_CODE body: $(head -c 400 "$MINT_RESP")"
          fi
          if [ -z "$MINTED" ]; then
            MINT_CODE2="$(curl -sS -m 30 -o "$MINT_RESP" -w '%{http_code}' -X POST -u "$TSKEY:" -H 'Content-Type: application/json' -d "$MINT_BODY" https://api.tailscale.com/api/v2/tailnet/-/keys 2>/tmp/mint.err || true)"
            if [ "$MINT_CODE2" = "200" ] || [ "$MINT_CODE2" = "201" ]; then
              echo "mint-basic: HTTP $MINT_CODE2"
              MINTED="$(python3 -c "import json; print(json.load(open('$MINT_RESP')).get('key',''))" || true)"
              [ -n "$MINTED" ] && echo "::add-mask::$MINTED"
            else
              echo "mint-basic: HTTP $MINT_CODE2 body: $(head -c 400 "$MINT_RESP")"
            fi
          fi
          rm -f "$MINT_RESP"
          if [ -n "$MINTED" ]; then
            echo "ephemeral key minted（tag:ci，有效期 21600s）"
          else
            echo "FAIL: 现场 mint 未成功（无 TS_API_KEY 或 Bearer/Basic 双试皆拒）；本线 mint-only，不回退任何直连 key（含已退役的 TAILSCALE_AUTH_KEY_PROD）"
            exit 1
          fi
          TS_AUTHKEY="$(printf '%s' "$MINTED" | tr -d '\r\n ')"
          timeout 120 sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ci-infra-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          tailscale ip -4
          timeout 90 tailscale ping --timeout=30s --c=2 ${{ inputs.node_ip || '100.85.128.116' }}  # 目标节点（默认 mesh-ali-gz，权威值见 docs/topology.md）

      - name: 下发 + reload + 验证（经 tailnet，不走公网）
        timeout-minutes: 8
        env:
          SSH_KEY: ${{ secrets.CADDY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          NODE="${{ inputs.node_ip || '100.85.128.116' }}"  # 目标节点（默认 mesh-ali-gz，权威值见 docs/topology.md）
          NODE_DIR="${{ inputs.node_dir || 'mesh-ali-gz' }}"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/ci_key \
            "edge/caddy/$NODE_DIR/Caddyfile" "root@$NODE:/etc/caddy/Caddyfile"
          # 确保 tailnet MagicDNS 首选，保证反代到容器 MagicDNS 名可解析；保留原有 fallback（只动 ali-gz 本机）
          ssh -o BatchMode=yes -i ~/.ssh/ci_key root@$NODE \
            "grep -q '^nameserver 100.100.100.100' /etc/resolv.conf || sed -i '1i nameserver 100.100.100.100' /etc/resolv.conf"
          ssh -o BatchMode=yes -i ~/.ssh/ci_key root@$NODE \
            'caddy reload --config /etc/caddy/Caddyfile && sleep 3 && caddy list-modules >/dev/null && echo RELOAD-OK'
          curl -s -m 15 -o /dev/null -w 'hw21-opencode http=%{http_code}\n' https://hw21-opencode.xieyucheng.top/
          # 新域名证书签发+解析可能延迟，重试 5 分钟；超时则失败（排查 DNS/80 端口）
          for i in $(seq 1 10); do
            CODE=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://opencode.xieyucheng.top/ || true)
            echo "opencode try$i http=$CODE"
            [ "$CODE" = '200' ] && break
            sleep 30
          done
          [ "$CODE" = '200' ] || { echo OPENCODE-DOMAIN-NOT-READY; exit 1; }
          # 新域名（mesh-ali-gz 本机栈）证书签发+解析可能延迟，重试 5 分钟
          for i in $(seq 1 10); do
            CODE2=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://opencode.yingxin.net.cn/ || true)
            echo "yingxin try$i http=$CODE2"
            [ "$CODE2" = '200' ] && break
            sleep 30
          done
          [ "$CODE2" = '200' ] || { echo OPENCODE-YINGXIN-NOT-READY; exit 1; }
          rm -f ~/.ssh/ci_key

      - name: 部署摘要
        run: |
          echo "## deliver-caddy ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 变更文件：$(git diff --name-only HEAD~1 HEAD -- edge/caddy/ | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - name: 退出 tailnet（焚毁节点）
        if: always()
        run: sudo tailscale logout || true
