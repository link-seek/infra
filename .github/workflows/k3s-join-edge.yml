name: k3s-join-edge
# 统一固定入簇链：OCI / ali-gz / 新节点全走这一条（inputs 化）。
# 旧 bespoke 链（k3s-join-oci-proxy / 21 / 41 / ali-gz）已标 DEPRECATED，转调完成前保留可跑，之后删除。
# 装机段唯一正本：.github/actions/edge-join（入）＋ edge-leave（出）；本文件只排 jobs，不写装机逻辑。
# mode：join=入（远机跳装）｜leave=出（drain/delete/uninstall，需 confirm_hostname）｜
#   selfjoin=本机闭环回归（装→金丝雀→拆，always 摘，不留垃圾）。
# 触发分级：join/leave/selfjoin 均需手动 dispatch＋全程盯（admin 事项，非 HW 需活人值守）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "join=入簇；leave=弃节点；selfjoin=本机闭环回归"
        required: false
        default: "selfjoin"
        type: choice
        options: [join, leave, selfjoin]
      node_hostname:
        description: "目标节点 hostname（join 钉死＋Ready 门；leave=要摘的节点，可摘任意垃圾）"
        required: true
        type: string
      agent_ip:
        description: "目标机器 tailnet IP（远机 join/leave 跳装用；selfjoin 不用）"
        required: false
        default: ""
        type: string
      server_tail:
        description: "取号＋kubectl 视角 server（默认 .69；VIP 上线后填 VIP，见 #612）"
        required: false
        default: "100.93.119.21"
        type: string
      confirm_hostname:
        description: "leave 二次确认（必须与 node_hostname 一致才执行）"
        required: false
        default: ""
        type: string
      k3s_bin_url:
        description: "k3s 二进制国内中转 URL（url2hc download-to-obs 预签名，过期重转）"
        required: false
        default: "https://xieyucheng.obs.cn-north-9.myhuaweicloud.com/%E4%B8%8B%E8%BD%BD/k3s/v1.37.2%2Bk3s1/k3s?Expires=1795504324&AccessKeyId=HPUAIBICHVRQWFEP6HXC&Signature=az4IutRXGVzhonWH8vfNMUgtTds%3D"
        type: string
      k3s_sha_url:
        description: "k3s sha256 国内中转 URL（同上）"
        required: false
        default: "https://xieyucheng.obs.cn-north-9.myhuaweicloud.com/%E4%B8%8B%E8%BD%BD/k3s/v1.37.2%2Bk3s1/sha256sum-amd64.txt?Expires=1795504328&AccessKeyId=HPUAIBICHVRQWFEP6HXC&Signature=hs0Y3DheEzxIHYUWv2fk%3D"
        type: string
      pause_image:
        description: "agent pause 镜像（SWR 常驻，国内可拉）"
        required: false
        default: "swr.cn-north-9.myhuaweicloud.com/link-seek/edge-pause:3.10.2"
        type: string

  workflow_call:
    inputs:
      mode:
        required: false
        default: "selfjoin"
        type: string
      node_hostname:
        required: true
        type: string
      agent_ip:
        required: false
        default: ""
        type: string
      server_tail:
        required: false
        default: "100.93.119.21"
        type: string
      confirm_hostname:
        required: false
        default: ""
        type: string
      k3s_bin_url:
        required: false
        default: "https://xieyucheng.obs.cn-north-9.myhuaweicloud.com/%E4%B8%8B%E8%BD%BD/k3s/v1.37.2%2Bk3s1/k3s?Expires=1795504324&AccessKeyId=HPUAIBICHVRQWFEP6HXC&Signature=hs0Y3DheEzxIHYUWv2fk%3D"
        type: string
      k3s_sha_url:
        required: false
        default: "https://xieyucheng.obs.cn-north-9.myhuaweicloud.com/%E4%B8%8B%E8%BD%BD/k3s/v1.37.2%2Bk3s1/sha256sum-amd64.txt?Expires=1795504328&AccessKeyId=HPUAIBICHVRQWFEP6HXC&Signature=hs0Y3DheEzxIHYUWv2fk%3D"
        type: string
      pause_image:
        required: false
        default: "swr.cn-north-9.myhuaweicloud.com/link-seek/edge-pause:3.10.2"
        type: string
    secrets:
      TS_API_KEY:
        required: false
      CADDY_SSH_KEY:
        required: false
      SWR_LOGIN_USER:
        required: false
      SWR_LOGIN_PASS:
        required: false

concurrency:
  group: k3s-join-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # —— join：远机入簇（经跳板跳装；幂等，已 Ready 直接跳过） ——
  join:
    if: inputs.mode == 'join'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 幂等门（已 Ready 直接跳过）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"; [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:github"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: user key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-edge-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          unset MINTED
          if sudo tailscale ssh root@"${{ inputs.server_tail }}" "kubectl get node ${{ inputs.node_hostname }} --no-headers 2>/dev/null" | grep -q ' Ready'; then
            echo "JOIN-SKIPPED-ALREADY-READY ${{ inputs.node_hostname }}"
            echo "SKIP_JOIN=true" >> "$GITHUB_ENV"
          fi
      - name: 远机装机（edge-join action，remote=true）
        if: env.SKIP_JOIN != 'true'
        uses: ./.github/actions/edge-join
        with:
          remote: "true"
          node_name: ${{ inputs.node_hostname }}
          node_ip: ${{ inputs.agent_ip }}
          server_tail: ${{ inputs.server_tail }}
          ssh_key: ${{ secrets.CADDY_SSH_KEY }}
          k3s_bin_url: ${{ inputs.k3s_bin_url }}
          k3s_sha_url: ${{ inputs.k3s_sha_url }}
          pause_image: ${{ inputs.pause_image }}
          ts_api_key: ${{ secrets.TS_API_KEY }}
      - name: 焚毁（跳板钥匙＋runner 身份）
        if: always()
        run: |
          sudo tailscale ssh root@"${{ inputs.server_tail }}" 'shred -u /tmp/ci-edge.key 2>/dev/null; echo KEY-BURNED' || true
          sudo tailscale logout || true

  # —— leave：弃节点（远机/垃圾均可摘，需 confirm_hostname 二次确认） ——
  leave:
    if: inputs.mode == 'leave'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 二次确认＋进网
        timeout-minutes: 8
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm_hostname }}" = "${{ inputs.node_hostname }}" ] || { echo "FAIL: confirm_hostname 与 node_hostname 不一致，拒绝执行"; exit 1; }
          [ -n "${{ inputs.agent_ip }}" ] || { echo "FAIL: 远机 leave 缺 agent_ip"; exit 1; }
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"; [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          echo "::add-mask::$TSKEY"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:github"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: user key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-edge-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          printf '%s\n' "${{ secrets.CADDY_SSH_KEY }}" | sudo tailscale ssh root@"${{ inputs.server_tail }}" 'cat > /tmp/ci-edge.key && chmod 600 /tmp/ci-edge.key && echo KEY-SHIPPED'
          unset MINTED
          echo NETMAP-OK
      - name: 弃节点（edge-leave action，remote=true）
        uses: ./.github/actions/edge-leave
        with:
          remote: "true"
          node_name: ${{ inputs.node_hostname }}
          node_ip: ${{ inputs.agent_ip }}
          server_tail: ${{ inputs.server_tail }}
      - name: 焚毁（跳板钥匙＋runner 身份）
        if: always()
        run: |
          sudo tailscale ssh root@"${{ inputs.server_tail }}" 'shred -u /tmp/ci-edge.key 2>/dev/null; echo KEY-BURNED' || true
          sudo tailscale logout || true

  # —— selfjoin：本机闭环回归（装→金丝雀→拆，always 摘） ——
  selfjoin:
    if: inputs.mode == 'selfjoin'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      HN: ci-edge-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: 本机装机（edge-join action，remote=false）
        uses: ./.github/actions/edge-join
        with:
          remote: "false"
          node_name: ci-edge-${{ github.run_id }}
          node_ip: "SELF（本机分支自动取 tailscale ip，忽略此值）"
          server_tail: ${{ inputs.server_tail }}
          k3s_bin_url: ${{ inputs.k3s_bin_url }}
          k3s_sha_url: ${{ inputs.k3s_sha_url }}
          pause_image: ${{ inputs.pause_image }}
          ts_api_key: ${{ secrets.TS_API_KEY }}
      - name: 金丝雀（钉到本机，overlay 双向证明）
        run: |
          set -euo pipefail
          S69() { sudo tailscale ssh root@"${{ inputs.server_tail }}" "$@"; }
          TSIP="$(sudo tailscale ip -4)"; [ -n "$TSIP" ] || { echo "FAIL: 取不到本机 tailnet IP"; exit 1; }
          S69 'kubectl delete pod canary-edge-self --wait=false --ignore-not-found 2>&1 | head -1'
          S69 "kubectl run canary-edge-self --image=swr.cn-north-9.myhuaweicloud.com/link-seek/edge-busybox:1.36 --overrides='{\"spec\":{\"nodeName\":\"$HN\",\"tolerations\":[{\"key\":\"dedicated\",\"operator\":\"Equal\",\"value\":\"edge\",\"effect\":\"NoSchedule\"}]}}' -- sleep 3600 2>&1 | head -2"
          S69 "kubectl wait --for=condition=Ready pod/canary-edge-self --timeout=300s 2>&1 | tail -1"
          OPODIP=$(S69 "kubectl get pod -n opencode -o jsonpath='{.items[0].status.podIP}'")
          echo "opencode pod IP（脱敏）: ${OPODIP%.*.*}.x.x"
          CPODIP=$(S69 "kubectl get pod canary-edge-self -o jsonpath='{.status.podIP}'")
          echo "canary pod IP（脱敏）: ${CPODIP%.*.*}.x.x"
          S69 "kubectl exec canary-edge-self -- ping -c2 $OPODIP 2>&1 | tail -2"
          S69 "kubectl exec canary-edge-self -- wget -q -O- http://$OPODIP:4097/ 2>&1 | head -c 120; echo"
          S69 'kubectl delete pod canary-edge-self --wait=false 2>&1 | head -1 || true'
          echo OVERLAY-L7-OK
      - name: 拆（edge-leave action，remote=false，always）
        if: always()
        uses: ./.github/actions/edge-leave
        with:
          remote: "false"
          node_name: ci-edge-${{ github.run_id }}
          server_tail: ${{ inputs.server_tail }}
      - name: 焚毁（runner 身份）
        if: always()
        run: |
          sudo tailscale logout || true
