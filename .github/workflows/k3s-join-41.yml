name: k3s-join-41
# 41 以 k3s server 入簇（同 VPC，etcd 高可用第一步）。
# 顺序（任一步失败即停）：
#  1) 41 切 cgroupv2（grub + reboot + 验）。
#  2) .69 开 --cluster-init（sqlite→etcd 迁移，控制面重启 1~2 分钟；数据面 Pod 不受影响，不要在 E2E 窗口跑）。
#  3) 41 装同版本 k3s 二进制（从 .69 内网 scp，不走公网）并以 server 加入，验 2 节点 + etcd 2 成员。
# 注意：2 server 是 quorum 降级窗口（坏一台即写停摆），21 入簇成 3 节点才完整。窗口期只做观察，不做变更。
on:
  workflow_dispatch:
concurrency:
  group: k3s-join-41
  cancel-in-progress: false
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - name: runner 进 tailnet（ephemeral CI 身份）
        timeout-minutes: 6
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${{ secrets.TS_API_KEY }}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:guest"]}}},"expirySeconds":21600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: CI key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-join41-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
      - name: 41 切 cgroupv2 并重启验证
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          OUT=$(ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          R="ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.41"
          if $R test -f /sys/fs/cgroup/cgroup.controllers; then echo "V2-READY"; exit 0; fi
          echo "当前 v1，切 v2（grubby 改 BLS + 重生成 BIOS grub.cfg，两步缺一不可）..."
          $R "grubby --update-kernel=ALL --args=systemd.unified_cgroup_hierarchy=1 && grub2-mkconfig -o /boot/grub2/grub.cfg 2>&1 | tail -1 && grep -q unified_cgroup_hierarchy /boot/grub2/grub.cfg && echo GRUB-OK"
          echo "发重启（前台 reboot，ssh 断开是正常的，掉线证明随后）..."
          $R "systemctl reboot" || true
          echo "REBOOTED"
          EOF
          )
          echo "$OUT"
          if echo "$OUT" | grep -q V2-READY; then
            echo "v2 已就绪，跳过重启证明"
          else
          echo "验掉线（fail-closed：22 不掉=没重启，直接失败）..."
          DROPPED=no
          for i in $(seq 1 18); do
            sleep 10
            R=$(ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 "timeout 8 bash -c 'echo > /dev/tcp/192.168.1.41/22'" 2>/dev/null && echo OPEN || echo WAIT)
            echo "22:$R"; [ "$R" = WAIT ] && { DROPPED=yes; break; }
          done
          [ "$DROPPED" = yes ] || { echo "FAIL: 22 没掉过，reboot 未执行"; exit 1; }
          echo "等 41 回来..."
          for i in $(seq 1 20); do
            sleep 20
            R=$(ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 "timeout 8 bash -c 'echo > /dev/tcp/192.168.1.41/22'" 2>/dev/null && echo OPEN || echo WAIT)
            echo "22:$R"; [ "$R" = OPEN ] && break
          done
          [ "$R" = OPEN ] || { echo "FAIL: 41 重启后未回来"; exit 1; }
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 \
            "ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.41 'test -f /sys/fs/cgroup/cgroup.controllers && echo CGROUPV2-OK'" \
            | grep -q CGROUPV2-OK || { echo "FAIL: 仍是 v1"; exit 1; }
          fi
      - name: .69 开 cluster-init（sqlite→etcd，控制面闪断）
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          R69="ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69"
          if $R69 "grep -q '^cluster-init: true' /etc/rancher/k3s/config.yaml 2>/dev/null"; then echo "cluster-init 已开，跳过"; exit 0; fi
          echo "备份 db..."
          $R69 "cp /var/lib/rancher/k3s/server/db/state.db /var/lib/rancher/k3s/server/db/state.db.pre-etcd-$(date +%Y%m%d%H%M) && ls /var/lib/rancher/k3s/server/db/state.db*"
          echo "开 cluster-init（config 文件，不动 unit；控制面闪断 1~2 分钟，Pod 不受影响）..."
          $R69 "printf 'cluster-init: true\n' > /etc/rancher/k3s/config.yaml && cat /etc/rancher/k3s/config.yaml"
          $R69 "systemctl restart k3s"
          echo "等 API 回来..."
          for i in $(seq 1 20); do
            sleep 15
            $R69 "kubectl get nodes >/dev/null 2>&1" && break
            [ "$i" = 20 ] && { echo "FAIL: API 未回来"; exit 1; }
          done
          $R69 "kubectl get nodes; k3s etcd-snapshot list 2>/dev/null | head -3 || true"
          EOF
      - name: 41 以 server 加入并验 quorum
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          R69="ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69"
          R41="ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.41"
          VER="$($R69 k3s --version | head -1 | awk '{print $3}')"
          echo "k3s 版本: $VER"
          TOKEN="$($R69 'cat /var/lib/rancher/k3s/server/node-token')"
          [ -n "$TOKEN" ] || { echo "FAIL: 取不到 token"; exit 1; }
          echo "传二进制（内网 .69→HW21→41，不走公网）..."
          scp -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69:/usr/local/bin/k3s /tmp/k3s-41
          scp -o BatchMode=yes -o StrictHostKeyChecking=no /tmp/k3s-41 root@192.168.1.41:/usr/local/bin/k3s
          shred -u /tmp/k3s-41
          $R41 "chmod +x /usr/local/bin/k3s && k3s --version | head -1"
          echo "写 unit（最小）+ config（server+token），并加入..."
          $R41 "printf '%s\n' '[Unit]' 'Description=Lightweight Kubernetes' 'Documentation=https://k3s.io' 'Wants=network-online.target' 'After=network-online.target' '[Install]' 'WantedBy=multi-user.target' '[Service]' 'Type=notify' 'KillMode=process' 'Delegate=yes' 'User=root' 'ExecStartPre=-/sbin/modprobe br_netfilter' 'ExecStartPre=-/sbin/modprobe overlay' 'ExecStart=/usr/local/bin/k3s server' 'Restart=always' 'RestartSec=5s' > /etc/systemd/system/k3s.service && systemctl daemon-reload && systemctl enable k3s"
          $R41 "mkdir -p /etc/rancher/k3s && printf 'server: https://192.168.1.69:6443\ntoken: %s\n' \"$TOKEN\" > /etc/rancher/k3s/config.yaml && chmod 600 /etc/rancher/k3s/config.yaml && systemctl start k3s"
          echo "等 41 Ready..."
          for i in $(seq 1 24); do
            sleep 15
            NODES="$($R69 'kubectl get nodes --no-headers 2>/dev/null' | wc -l)"
            [ "$NODES" = 2 ] && break
            [ "$i" = 24 ] && { echo "FAIL: 41 未入簇"; $R69 'kubectl get nodes'; exit 1; }
          done
          $R69 "kubectl get nodes -o wide; kubectl -n kube-system get pods -o wide 2>/dev/null | head -8"
          echo "=== quorum 现状（2 server 降级窗口，等 21 入簇成 3）==="
          EOF
