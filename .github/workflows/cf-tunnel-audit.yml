name: cf-tunnel-audit
# 只读：列账户下所有 CF 隧道状态/连接/ingress + DNS CNAME→tunnel 映射。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
    steps:
      - name: audit tunnels
        run: |
          set -euo pipefail
          PARENT="$(printf '%s' "${CF_PARENT_TOKEN:-}" | tr -d '\r\n ')"
          [ -n "$PARENT" ] || { echo "FAIL: CF_PARENT_TOKEN 为空"; exit 1; }
          echo "::add-mask::$PARENT"
          CF_PARENT_TOKEN_SANITIZED="$PARENT" python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          BASE="https://api.cloudflare.com/client/v4"
          PARENT=os.environ["CF_PARENT_TOKEN_SANITIZED"]; print("::add-mask::%s"%PARENT)
          ACCOUNT="47ce24ced58f17c9fb15351adcbe67d4"
          def call(method,path,body=None,tok=PARENT):
              h={"Authorization":"Bearer "+tok}; data=None
              if body is not None: h["Content-Type"]="application/json"; data=json.dumps(body).encode()
              req=urllib.request.Request(BASE+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try: return e.code,json.loads(e.read() or b"{}")
                  except Exception: return e.code,{}
              except Exception as e:
                  return 0,{"success":False,"errors":[{"message":str(e)[:200]}]}
          # account from zone
          st,r=call("GET","/zones?name="+urllib.parse.quote("xieyucheng.top"))
          if isinstance(r,dict) and r.get("success") and r.get("result"):
              ACCOUNT=(r["result"][0].get("account") or {}).get("id") or ACCOUNT
          print("account:",ACCOUNT)
          # mint read token (tunnel read + dns read + zone read)
          st,r=call("GET","/accounts/%s/tokens/permission_groups?per_page=100"%ACCOUNT)
          groups=r.get("result") if isinstance(r.get("result"),list) else []
          by={str(g.get("name","")).lower():g for g in groups}
          def alias(w): return [w,w.replace("cloudflare tunnel","argo tunnel"),w.replace("argo tunnel","cloudflare tunnel")]
          want=["zone read","dns read","cloudflare tunnel read"]
          zone_ids=[];acct_ids=[]
          for w in want:
              g=next((by[c] for c in alias(w) if c in by),None)
              if not g: print("FAIL 缺权限组:",w); raise SystemExit(1)
              sc=g.get("scopes") or []
              if any("account.zone" in str(s) for s in sc): zone_ids.append(str(g["id"]))
              elif any(str(s)=="com.cloudflare.api.account" for s in sc): acct_ids.append(str(g["id"]))
              else: zone_ids.append(str(g["id"]))
          pol=[]
          if zone_ids: pol.append({"effect":"allow","resources":{"com.cloudflare.api.account.%s"%ACCOUNT:{"com.cloudflare.api.account.zone.*":"*"}},"permission_groups":[{"id":i} for i in zone_ids]})
          if acct_ids: pol.append({"effect":"allow","resources":{"com.cloudflare.api.account.%s"%ACCOUNT:"*"},"permission_groups":[{"id":i} for i in acct_ids]})
          exp=(datetime.now(timezone.utc)+timedelta(hours=2)).strftime("%Y-%m-%dT%H:%M:%SZ")
          st,r=call("POST","/accounts/%s/tokens"%ACCOUNT,{"name":"cf-tunnel-audit","policies":pol,"expires_on":exp})
          if not (isinstance(r,dict) and r.get("success")): print("FAIL mint",st,r.get("errors")); raise SystemExit(1)
          TOK=str((r.get("result") or {}).get("value") or ""); print("::add-mask::%s"%TOK)
          print("===== TUNNELS =====")
          st,r=call("GET","/accounts/%s/cfd_tunnel?is_deleted=false&per_page=100"%ACCOUNT,tok=TOK)
          tuns=r.get("result") if isinstance(r.get("result"),list) else []
          for t in tuns:
              tid=t.get("id"); nm=t.get("name"); stt=t.get("status")
              st2,c=call("GET","/accounts/%s/cfd_tunnel/%s/connections"%(ACCOUNT,tid),tok=TOK)
              conns=c.get("result") if isinstance(c,dict) and isinstance(c.get("result"),list) else []
              st3,cfg=call("GET","/accounts/%s/cfd_tunnel/%s/configurations"%(ACCOUNT,tid),tok=TOK)
              ing=[]
              try: ing=(cfg["result"]["config"]["ingress"]) or []
              except Exception: pass
              hosts=[x.get("hostname","(catch-all)") for x in ing]
              print(f"TUNNEL {tid} name={nm} status={stt} conns={len(conns)} ingress({len(hosts)})={hosts}")
          print("===== DNS CNAME->cfargotunnel =====")
          st,z=call("GET","/zones?account.id=%s&per_page=50"%ACCOUNT,tok=TOK)
          zones=z.get("result") if isinstance(z.get("result"),list) else []
          for zn in zones:
              zid=zn["id"]; zname=zn["name"]
              st,recs=call("GET","/zones/%s/dns_records?type=CNAME&per_page=200"%zid,tok=TOK)
              for rec in (recs.get("result") or []):
                  ct=str(rec.get("content",""))
                  if "cfargotunnel.com" in ct:
                      print(f"DNS {rec['name']} -> {ct.split('.')[0]}")
          print("AUDIT DONE")
          PY
