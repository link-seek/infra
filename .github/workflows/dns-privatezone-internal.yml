name: dns-privatezone-internal
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover | apply"
        type: choice
        options: [discover, apply]
        default: discover
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: install hcloud (KooCLI)
        run: |
          set -e
          ok=0
          for u in \
            https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz \
            https://obs.cn-north-4.myhuaweicloud.com/koocli/cli/latest/huaweicloud-cli-linux-amd64.tar.gz ; do
            curl -fsSL --retry 4 --retry-delay 3 "$u" -o /tmp/hc.tgz && { ok=1; break; } || true
          done
          [ "$ok" = 1 ] || { echo "FAIL: KooCLI 下载失败"; exit 1; }
          mkdir -p /tmp/hc && tar xzf /tmp/hc.tgz -C /tmp/hc
          install -m755 "$(find /tmp/hc -type f -name hcloud | head -1)" /usr/local/bin/hcloud
          hcloud version
      - name: discover / apply
        run: |
          set +e
          hcloud configure set --cli-access-key="$AK" --cli-secret-key="$SK" --cli-region=cn-north-9 --cli-mode=AKSK --cli-agree-privacy-statement=true
          # 选 .69 所在 VPC：优先 ListVpcs/v3 里 cidr 匹配 192.168.x 的；否则用现有私有区的 router_id
          hcloud VPC ListVpcs/v3 --cli-region=cn-north-9 > /tmp/vpcs.json 2>/dev/null
          VID=$(python3 - <<'PY'
          import json
          vid=""
          try:
              d=json.load(open('/tmp/vpcs.json'))
              vs=d.get('vpcs') or []
              for v in vs: print("VPC",v.get('id'),v.get('name'),v.get('cidr'), file=__import__('sys').stderr)
              for v in vs:
                  c=v.get('cidr','')
                  if c.startswith('192.168.'): vid=v.get('id'); break
              if not vid and vs: vid=vs[0].get('id')
          except Exception as e:
              print("vpclist-skip",e, file=__import__('sys').stderr)
          print(vid)
          PY
          )
          [ -z "$VID" ] && VID="ab64784e-1fd6-49c8-a693-0b317169496c"
          echo "CHOSEN VID=$VID"
          # 现有私有区里是否已有 internal.linkseek.net.cn
          hcloud DNS ListPrivateZones --type=private --cli-region=cn-north-9 > /tmp/pz.json 2>/dev/null
          ZID=$(python3 -c "import json;d=json.load(open('/tmp/pz.json'));print(next((z['id'] for z in (d.get('zones') or []) if z.get('name','').rstrip('.')=='internal.linkseek.net.cn'),''))")
          echo "ZID(before)=$ZID"
          if [ "$MODE" != "apply" ]; then echo "DISCOVER-ONLY (VID/ZID above)"; exit 0; fi
          if [ -z "$ZID" ]; then
            printf '{"body":{"name":"internal.linkseek.net.cn","zone_type":"private","ttl":300,"vpc":{"vpc_id":"%s","region":"cn-north-9"},"proxy_pattern":"AUTHORITY"}}' "$VID" > /tmp/zone.json
            echo "--- CreatePrivateZone ---"
            hcloud DNS CreatePrivateZone --cli-jsonInput=/tmp/zone.json --cli-region=cn-north-9 2>&1 | head -c 700; echo
            hcloud DNS ListPrivateZones --type=private --cli-region=cn-north-9 > /tmp/pz.json 2>/dev/null
            ZID=$(python3 -c "import json;d=json.load(open('/tmp/pz.json'));print(next((z['id'] for z in (d.get('zones') or []) if z.get('name','').rstrip('.')=='internal.linkseek.net.cn'),''))")
          fi
          echo "ZID=$ZID"
          [ -n "$ZID" ] || { echo "FAIL: 私有区未建成"; exit 1; }
          # 记录
          hcloud DNS ListRecordSets --zone_id="$ZID" --cli-region=cn-north-9 > /tmp/rs.json 2>/dev/null
          if grep -q "team-agent.internal.linkseek.net.cn" /tmp/rs.json; then echo "record already exists"; else
            printf '{"path":{"zone_id":"%s"},"body":{"name":"team-agent.internal.linkseek.net.cn.","type":"A","ttl":300,"records":["192.168.1.69"]}}' "$ZID" > /tmp/rec.json
            echo "--- CreateRecordSet ---"
            hcloud DNS CreateRecordSet --cli-jsonInput=/tmp/rec.json --cli-region=cn-north-9 2>&1 | head -c 700; echo
          fi
          echo "=== final recordsets ==="
          hcloud DNS ListRecordSets --zone_id="$ZID" --cli-region=cn-north-9 2>/dev/null | head -c 900
