name: kyverno-policy-test

# CEL policy gate: compile + behavior-test every ValidatingPolicy with the
# pinned Kyverno CLI before it can reach the cluster. Catches the bug class
# that slipped through in #962-964 (a // comment inside a folded scalar broke
# CEL compilation; nothing pre-merge checked it and flux-apply went red).
on:
  pull_request:
    paths:
      - clusters/k3s/kyverno-*.yaml
      - tests/kyverno/**
      - .github/workflows/kyverno-policy-test.yml
  push:
    branches: [main]
    paths:
      - clusters/k3s/kyverno-*.yaml
      - tests/kyverno/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kyverno-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install kyverno CLI (pinned to cluster version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v1.20.0 -R kyverno/kyverno \
            -p kyverno-cli_v1.20.0_linux_x86_64.tar.gz -D /tmp/kc --clobber
          tar xzf /tmp/kc/kyverno-cli_v1.20.0_linux_x86_64.tar.gz -C /tmp/kc
          sudo install -m 0755 /tmp/kc/kyverno /usr/local/bin/kyverno
          kyverno version
      - name: run policy tests
        run: |
          set -euo pipefail
          for d in tests/kyverno/protect-base/*/; do
            echo "== $d"
            (cd "$d" && kyverno test .)
          done
