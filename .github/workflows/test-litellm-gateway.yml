name: test-litellm-gateway

# 网关收编栈的门：schema（秒级）+ masking 单元（秒级）+ e2e 全栈（分钟级）。
# 移植自 guard-rules（test-rules.yml + test-e2e.yml），路径换成 stacks/litellm-gateway。
# 全 dummy key，零真值；e2e 在 runner 起一次性容器，跑完即焚。
on:
  pull_request:
    paths:
      - stacks/litellm-gateway/**
      - .github/workflows/test-litellm-gateway.yml
  push:
    branches: [main]
    paths:
      - stacks/litellm-gateway/**
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Schema gate（digest pin＋无真值＋配置合法）
        run: |
          python3 - <<'EOF'
          import json, re, sys
          S = "stacks/litellm-gateway"
          bad = 0
          # 1. compose：单镜像必须 digest pin，禁 :latest（ollama 已退役）
          comp = open(f"{S}/compose.yml").read()
          imgs = re.findall(r"^\s*image:\s*(\S+)", comp, re.M)
          assert len(imgs) == 1, f"期望 1 个 image，实际 {imgs}"
          for img in imgs:
              if "@sha256:" not in img:
                  print(f"FAIL: {img} 不是 digest pin"); bad += 1
              else:
                  print(f"OK pin: {img[:60]}...")
              if re.search(r":latest(@|$|\s)", img):
                  print(f"FAIL: {img} 用了 latest"); bad += 1
          # 2. .env.example：占位符，无真值（sk-/ghp-/tskey- 出现即红）
          env = open(f"{S}/.env.example").read()
          for pat in (r"sk-[A-Za-z0-9\-_]{16,}", r"ghp_[A-Za-z0-9]+", r"tskey-[A-Za-z0-9_\-]+"):
              if re.search(pat, env):
                  print(f"FAIL: .env.example 命中真值模式 {pat}"); bad += 1
          if "GO_BACKEND_KEY=" not in env or "LITELLM_MASTER_KEY=" not in env:
              print("FAIL: .env.example 缺键位"); bad += 1
          else:
              print("OK: .env.example 键位齐且无真值")
          # 3. config：YAML 合法；无 <GO_BACKEND_KEY> 明文占位（必须走 os.environ）；
          #    无 "*" 通配；guard vault default_on；embedding 已退役（CF 直连，不经网关）
          import yaml
          d = yaml.safe_load(open(f"{S}/config/litellm_config.yaml"))
          raw = open(f"{S}/config/litellm_config.yaml").read()
          if "<GO_BACKEND_KEY>" in raw:
              print("FAIL: config 含 <GO_BACKEND_KEY> 明文占位，须走 os.environ"); bad += 1
          else:
              print("OK: config 无明文 key 占位")
          names = [m["model_name"] for m in d["model_list"]]
          if "*" in names:
              print("FAIL: config 含 * 通配"); bad += 1
          else:
              print(f"OK: models {len(names)} 条，无通配")
          if "nomic-embed-text" in names:
              print("FAIL: ollama embedding 条目未退役"); bad += 1
          else:
              print("OK: embedding 已退役（CF 直连，不经网关）")
          g = d.get("guardrails", [])
          if not any(x.get("guardrail_name") == "vault" and True in (x["litellm_params"].get("default_on"),) for x in g):
              print("FAIL: vault guardrail 缺失/default_on 非 true"); bad += 1
          else:
              print("OK: vault guardrail default_on")
          # 4. guard 三文件：md5 与 README 声明对齐（改了必须同步改 README，即漂移显性化）
          import hashlib
          decl = open(f"{S}/README.md").read()
          for f in ("guard/vault_guard.py", "guard/models-denied.json", "guard/rules.json"):
              h = hashlib.md5(open(f"{S}/{f}", "rb").read()).hexdigest()
              if h in decl:
                  print(f"OK md5 {f}: {h[:12]}...")
              else:
                  print(f"FAIL: {f} md5 {h} 与 README 声明不一致"); bad += 1
          denied = json.load(open(f"{S}/guard/models-denied.json"))
          assert isinstance(denied, list) and denied, "models-denied.json 必须是非空数组"
          print(f"OK: models-denied.json ({len(denied)} 条)")
          sys.exit(1 if bad else 0)
          EOF

  masking-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Masking 行为测试（vault_guard standalone，零依赖）
        run: |
          python3 - <<'EOF'
          import sys, types
          _lit = types.ModuleType("litellm")
          _inte = types.ModuleType("litellm.integrations")
          _cgm = types.ModuleType("litellm.integrations.custom_guardrail")
          class _CG:
              def __init__(self, **kwargs):
                  pass
          _cgm.CustomGuardrail = _CG
          _exc = types.ModuleType("litellm.exceptions")
          class _BRE(Exception):
              def __init__(self, message="", model="", llm_provider="", **kw):
                  super().__init__(message)
          _exc.BadRequestError = _BRE
          _lit.integrations = _inte
          _inte.custom_guardrail = _cgm
          _lit.exceptions = _exc
          sys.modules.update({"litellm": _lit, "litellm.integrations": _inte,
                              "litellm.integrations.custom_guardrail": _cgm,
                              "litellm.exceptions": _exc})
          sys.path.insert(0, "stacks/litellm-gateway/guard")
          import vault_guard
          print("OK: vault_guard import（standalone stub 模式）")
          # 黑名单 fail-closed：读不到文件即全拦的逻辑存在即可（行为由 e2e 覆盖）
          assert hasattr(vault_guard, "SecretVaultGuardrail"), "缺 SecretVaultGuardrail"
          print("OK: SecretVaultGuardrail 存在")
          EOF

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Render test config（生产 config 原样＋测试条目；单源头不手搓）
        run: |
          pip install pyyaml -q 2>/dev/null || true
          python3 - <<'EOF'
          import yaml
          S = "stacks/litellm-gateway"
          d = yaml.safe_load(open(f"{S}/config/litellm_config.yaml"))
          base_n = len(d["model_list"])
          # e2e 专用条目（不进生产 config）：免费档（零本地计算，ollama 已退役）
          for _name in ("test-chat", "test-chat-b",
                        "open-design-byok/test-chat", "open-design-byok/test-chat-b"):
              if _name not in [m["model_name"] for m in d["model_list"]]:
                  d["model_list"].append({"model_name": _name,
                      "litellm_params": {"model": "openai/deepseek-v4.1-flash-free",
                                       "api_base": "https://opencode.ai/inference/openai/v1",
                                       "api_key": "os.environ/GO_BACKEND_KEY", "timeout": 120}})
          open("/tmp/litellm-e2e.yaml", "w").write(yaml.safe_dump(d))
          print(f"test config OK: base={base_n} + test={len(d['model_list'])-base_n}")
          EOF
      # guard/*.py 已 bake 进镜像不挂载；models-denied.json 挂载保留热更新能力
      - name: Start litellm（pin 镜像＋挂载 config，port 4001）
        env:
          GO_BACKEND_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SWR_U: ${{ secrets.SWR_LOGIN_USER }}
          SWR_P: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          [ -n "$GO_BACKEND_KEY" ] || { echo "FAIL: OPENCODE_API_KEY 未配（org secret，free 档测试用）"; exit 1; }
          PIN="$(grep -oP '^\s*image:\s*\K\S+' stacks/litellm-gateway/compose.yml | head -n1)"
          echo "gateway pin: $PIN"
          if echo "$PIN" | grep -q "swr\."; then
            [ -n "$SWR_U" ] || { echo "FAIL: SWR 凭证未配（org secret）"; exit 1; }
            echo "$SWR_P" | docker login swr.cn-north-9.myhuaweicloud.com -u "$SWR_U" --password-stdin
          fi
          # 拉 pin 镜像（行为=digest：测的就是将上线的字节）；config 挂载覆盖（镜像内 config 只读不动）
          docker run -d --name litellm-e2e --network host \
            -v /tmp/litellm-e2e.yaml:/app/config.yaml:ro \
            -v $PWD/stacks/litellm-gateway/guard/models-denied.json:/app/models-denied.json:ro \
            -e GO_BACKEND_KEY="$GO_BACKEND_KEY" \
            -e LITELLM_MASTER_KEY="$GO_BACKEND_KEY" -e DISABLE_ADMIN_UI=True \
            -e RULES_FILE=/app/guard-rules.json \
            "$PIN" --config /app/config.yaml --port 4001
          for i in $(seq 1 24); do
            curl -sf --max-time 5 http://127.0.0.1:4001/v1/models -H "Authorization: Bearer $GO_BACKEND_KEY" >/dev/null 2>&1 && break
            sleep 5
          done
          curl -s --max-time 10 http://127.0.0.1:4001/v1/models -H "Authorization: Bearer $GO_BACKEND_KEY" | head -c 200; echo

      - name: Probes（模型表＋黑名单＋透传；embedding 已退役）
        env:
          GO_BACKEND_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error
          KEY = "test-only"
          REAL_KEY = os.environ.get("GO_BACKEND_KEY", "") or KEY
          failures = []
          def gw(path, payload=None, key=KEY):
              req = urllib.request.Request(
                  "http://127.0.0.1:4001" + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                  method="POST" if payload is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode())
                  except Exception:
                      return e.code, {}
              except Exception as e:
                  return -1, {"error": str(e)}
          # 1. 无 key 应 401
          st, _ = gw("/v1/models", key="wrong-key")
          print(f"no-auth models: {st}")
          if st == 200:
              failures.append("无 key 竟能拉模型表")
          # 2. 模型表非空、无 * 展开噪音（真 key == master，直通）
          st, body = gw("/v1/models", key=REAL_KEY)
          ids = [m["id"] for m in body.get("data", [])]
          print(f"models: {st} count={len(ids)} sample={ids[:5]}")
          if st != 200 or not ids:
              failures.append("模型表空/失败")
          if any(i == "*" or len(ids) > 100 for i in ids):
              failures.append("模型表含通配展开噪音")
          # 3.（已退役：生产 config 无 embedding 条目，记忆走 CF 直连；此处只验透传不断言）
          # 4. 黑名单（models-denied.json 首条应 400；真 key 过鉴权，400 只能来自 guard 拦截）
          denied = json.load(open("stacks/litellm-gateway/guard/models-denied.json"))
          st, body = gw("/v1/chat/completions", {"model": denied[0], "messages": [{"role": "user", "content": "hi"}]}, key=REAL_KEY)
          print(f"denied({denied[0]}): {st}")
          if st != 400:
              failures.append(f"黑名单未拦: {denied[0]} -> {st}")
          # 5. 透传（glm-5.2 付费档＋真 key：curl 非客户端，免费档必被锁，只有付费档能证明 200 通路；花 1 token）
          st, body = gw("/v1/chat/completions", {"model": "glm-5.2", "messages": [{"role": "user", "content": "reply with exactly: GW-OK"}], "max_tokens": 5}, key=REAL_KEY)
          txt = json.dumps(body)[:120]
          print(f"passthrough-paid: {st} {txt}")
          if st != 200:
              failures.append(f"透传失败: {st}")
          # 5b. 免费档锁客户端（curl 直调必 403，与上游直调行为一致；真 200 通路由 OD CI 的真客户端覆盖）
          st, body = gw("/v1/chat/completions", {"model": "test-chat", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1})
          print(f"passthrough-free-lock: {st} (expect 403)")
          if st != 403:
              failures.append(f"免费锁异常: {st} (expect 403)")
          # 5b. 直调上游（隔离用；免费档锁 OpenCode 客户端，直调必 403，仅记录不判失败）
          try:
              import os
              ukey = os.environ.get("GO_BACKEND_KEY", "")
              ureq = urllib.request.Request(
                  "https://opencode.ai/inference/openai/v1/models",
                  headers={"Authorization": f"Bearer {ukey}"})
              with urllib.request.urlopen(ureq, timeout=30) as r:
                  ust, ubody = r.status, json.loads(r.read().decode())
              free_ids = [m.get("id", "") for m in ubody.get("data", []) if "free" in m.get("id", "")]
              print(f"direct-upstream models: {ust} total={len(ubody.get('data', []))} free={free_ids[:8]}")
          except urllib.error.HTTPError as e:
              try:
                  emsg = e.read().decode()[:200]
              except Exception:
                  emsg = ""
              print(f"direct-upstream models: {e.code} {emsg} (直调预期行为：免费档锁客户端，见 opencode-loop 真客户端测试)")
          except Exception as e:
              print(f"direct-upstream models: -1 {e}")
          # 6-8.（直调 API 测免费档已证伪，删除）上游免费档锁 OpenCode 客户端，直调/curl 必 403
          # （"free tier can only be used from within OpenCode"）。免费三件套改走真客户端，见 opencode-loop。
          if failures:
              print("FAILURES:"); [print(f" - {f}") for f in failures]; sys.exit(1)
          print("ALL PROBES OK")
          EOF

      - name: opencode-loop（成品镜像调网关＋mask/restore 断言）
        run: |
          # pin 取自生产栈 compose（部署仓消费打包仓工件，单源头；镜像换 pin 即换被测物）
          PIN="$(grep -oP '^\s*image:\s*\K\S+opencode-tools@\S+' stacks/opencode-prod/compose.yml | head -n1)"
          echo "opencode-tools pin: $PIN"
          docker pull -q "$PIN"
          mkdir -p /tmp/oc-cfg-gw
          cat > /tmp/oc-cfg-gw/opencode.jsonc <<'EOF'
          {"$schema": "https://opencode.ai/config.json",
           "permission": "allow",
           "model": "gw/test-chat",
           "provider": {"gw": {"options": {
             "baseURL": "http://127.0.0.1:4001/v1",
             "apiKey": "test-only"}}}}
          EOF
          docker run -d --name oc-gwtest --network host \
            -v /tmp/oc-cfg-gw/opencode.jsonc:/root/.config/opencode/opencode.jsonc:ro \
            -e OPENCODE_SERVER_PASSWORD=test-srv-pw \
            "$PIN" serve --port 4096 --hostname 127.0.0.1
          for i in $(seq 1 24); do
            curl -sf --max-time 5 http://127.0.0.1:4096/ >/dev/null 2>&1 && break
            sleep 5
          done
          OEX="docker exec -e OPENCODE_PASSWORD=test-srv-pw oc-gwtest opencode run --server http://127.0.0.1:4096"
          FAIL=""
          # 1. 连通门（3 轮，小模型偶发慢） — 区分网关故障与模型抖动
          OK1=""
          for attempt in 1 2 3; do
            timeout 280 $OEX "reply with exactly: GW-OK" > /tmp/gw-out.txt 2>&1 && \
            grep -q "GW-OK" /tmp/gw-out.txt && { OK1=1; echo "OK: opencode->gateway closure (attempt $attempt)"; break; }
            echo "--- closure attempt $attempt:"; tail -5 /tmp/gw-out.txt
          done
          [ -n "$OK1" ] || FAIL="opencode 调网关不通"
          # 2. mask/restore 门：合成密钥（零真值；example/test/xxx/fake/demo 等白名单词全避开，
          #    命中 generic-sk 规则。字面量拆写，卫生门不误报；运行时拼成完整 token）。
          PFX="sk-"; SFX="Q7mZ9vX2pL5nR8wZ4c6bD3eF1"; TOK="$PFX$SFX"
          OK2=""
          for attempt in 1 2 3; do
            timeout 280 $OEX "repeat exactly this token and nothing else: $TOK" > /tmp/mask-out.txt 2>&1 && \
            grep -q "$TOK" /tmp/mask-out.txt && { OK2=1; echo "OK: mask/restore round-trip (attempt $attempt)"; break; }
            echo "--- mask attempt $attempt:"; tail -8 /tmp/mask-out.txt
          done
          [ -n "$OK2" ] || FAIL="$FAIL; mask/restore 回包非原文"
          # 3. 免费档真客户端三件套（上游免费档锁 OpenCode 客户端，直调 403，只有真客户端能过；
          #    经网关 free-probe-a/b 条目→inference 端口。marker/数字全合成，无敏感）。
          #    注意：-m 传自定义模型会被客户端拒（provider.no-route，只认 models.dev），故按模型分
          #    config 文件、serve 重启切换（config 默认模型直通网关，已由 GW-OK 证实）。
          start_gw() { # $1 = a|b（config 后缀），$2 = 模型名
            mkdir -p "/tmp/oc-cfg-gw-$1"
            sed "s#gw/test-chat#gw/$2#" /tmp/oc-cfg-gw/opencode.jsonc > "/tmp/oc-cfg-gw-$1/opencode.jsonc"
            docker rm -f oc-gwtest >/dev/null 2>&1 || true
            sleep 3
            docker run -d --name oc-gwtest --network host \
              -v "/tmp/oc-cfg-gw-$1/opencode.jsonc:/root/.config/opencode/opencode.jsonc:ro" \
              -e OPENCODE_SERVER_PASSWORD=test-srv-pw \
              "$PIN" serve --port 4096 --hostname 127.0.0.1
            for i in $(seq 1 24); do
              curl -sf --max-time 5 http://127.0.0.1:4096/ >/dev/null 2>&1 && break
              sleep 5
            done
            curl -sf --max-time 10 http://127.0.0.1:4096/ >/dev/null || { echo "FAIL: serve ($2) 未起"; exit 1; }
            echo "serve ok: $2"
          }
          start_gw a free-probe-a
          OK3=""
          for attempt in 1 2 3; do
            timeout 280 $OEX "reply with exactly: FREE-CLIENT-OK" > /tmp/free1-out.txt 2>&1 && \
            grep -q "FREE-CLIENT-OK" /tmp/free1-out.txt && { OK3=1; echo "OK: free single (attempt $attempt)"; break; }
            echo "--- free single attempt $attempt:"; tail -5 /tmp/free1-out.txt
          done
          [ -n "$OK3" ] || FAIL="$FAIL; 免费单聊不通（free-probe-a）"
          # 4. 免费多轮（同 server 同 session：先记数，取 session id，再续问；--session/-s 见 CLI 文档）
          SID=""
          timeout 280 $OEX --format json "记住这个数字：7421，收到只回复：记住了" > /tmp/multi1-out.txt 2>&1 || true
          SID="$(python3 -c "
          import re
          t = open('/tmp/multi1-out.txt', errors='replace').read()
          m = re.findall(r'\"session[Ii][Dd]\"\s*:\s*\"([^\"]+)\"', t)
          print(m[0] if m else '')" 2>/dev/null)"
          if [ -z "$SID" ]; then
            SID="$(docker exec -e OPENCODE_PASSWORD=test-srv-pw oc-gwtest opencode session list --format json 2>/dev/null | python3 -c "
          import json,sys
          try:
              d = json.load(sys.stdin)
              items = d if isinstance(d, list) else d.get('sessions', d.get('data', []))
              print(items[0].get('id', items[0].get('sessionID', '')) if items else '')
          except Exception:
              print('')" 2>/dev/null)"
          fi
          echo "multi session: ${SID:0:12}..."
          OK5=""
          if [ -n "$SID" ] && grep -q "记住了" /tmp/multi1-out.txt; then
            for attempt in 1 2 3; do
              timeout 280 $OEX -s "$SID" "我让你记的数字是多少？只回复数字" > /tmp/multi2-out.txt 2>&1 && \
              grep -q "7421" /tmp/multi2-out.txt && { OK5=1; echo "OK: free multi-turn (attempt $attempt)"; break; }
              echo "--- free multi attempt $attempt:"; tail -5 /tmp/multi2-out.txt
            done
          else
            echo "--- multi turn1 output:"; tail -8 /tmp/multi1-out.txt
          fi
          [ -n "$OK5" ] || FAIL="$FAIL; 免费多轮未召回 7421"
          # 5. 免费切模型（config 默认切 free-probe-b，serve 重启；跨模型路由）
          start_gw b free-probe-b
          OK4=""
          for attempt in 1 2 3; do
            timeout 280 $OEX "reply with exactly: SWITCH-CLIENT-OK" > /tmp/free2-out.txt 2>&1 && \
            grep -q "SWITCH-CLIENT-OK" /tmp/free2-out.txt && { OK4=1; echo "OK: free switch (attempt $attempt)"; break; }
            echo "--- free switch attempt $attempt:"; tail -5 /tmp/free2-out.txt
          done
          [ -n "$OK4" ] || FAIL="$FAIL; 免费切模型不通（free-probe-b）"
          docker rm -f oc-gwtest >/dev/null 2>&1 || true
          [ -z "$FAIL" ] && echo "OPENCODE-LOOP OK" || { echo "FAIL: $FAIL"; exit 1; }
