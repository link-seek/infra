name: test-litellm-gateway

# 网关收编栈的门：schema（秒级）+ masking 单元（秒级）+ e2e 全栈（分钟级）。
# 移植自 guard-rules（test-rules.yml + test-e2e.yml），路径换成 stacks/litellm-gateway。
# 全 dummy key，零真值；e2e 在 runner 起一次性容器，跑完即焚。
on:
  pull_request:
    paths:
      - stacks/litellm-gateway/**
      - .github/workflows/test-litellm-gateway.yml
  push:
    branches: [main]
    paths:
      - stacks/litellm-gateway/**
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Schema gate（digest pin＋无真值＋配置合法）
        run: |
          python3 - <<'EOF'
          import json, re, sys
          S = "stacks/litellm-gateway"
          bad = 0
          # 1. compose：单镜像必须 digest pin，禁 :latest（ollama 已退役）
          comp = open(f"{S}/compose.yml").read()
          imgs = re.findall(r"^\s*image:\s*(\S+)", comp, re.M)
          assert len(imgs) == 1, f"期望 1 个 image，实际 {imgs}"
          for img in imgs:
              if "@sha256:" not in img:
                  print(f"FAIL: {img} 不是 digest pin"); bad += 1
              else:
                  print(f"OK pin: {img[:60]}...")
              if re.search(r":latest(@|$|\s)", img):
                  print(f"FAIL: {img} 用了 latest"); bad += 1
          # 2. .env.example：占位符，无真值（sk-/ghp-/tskey- 出现即红）
          env = open(f"{S}/.env.example").read()
          for pat in (r"sk-[A-Za-z0-9\-_]{16,}", r"ghp_[A-Za-z0-9]+", r"tskey-[A-Za-z0-9_\-]+"):
              if re.search(pat, env):
                  print(f"FAIL: .env.example 命中真值模式 {pat}"); bad += 1
          if "GO_BACKEND_KEY=" not in env or "LITELLM_MASTER_KEY=" not in env:
              print("NOTE: 旧网关 key 位已退役（实测目标机 .env 无此二键，compose/guard 亦无引用）")
          for k in ("DISABLE_ADMIN_UI=", "PIPELINE_MANAGED=", "RULES_FILE=", "RULES_URL="):
              if k not in env:
                  print(f"FAIL: .env.example 缺键位 {k}"); bad += 1
              else:
                  print(f"OK: {k} 在位")
          # 3. config：YAML 合法；无 <GO_BACKEND_KEY> 明文占位（必须走 os.environ）；
          #    无 "*" 通配；guard vault default_on；embedding 已退役（CF 直连，不经网关）
          import yaml
          d = yaml.safe_load(open(f"{S}/config/litellm_config.yaml"))
          raw = open(f"{S}/config/litellm_config.yaml").read()
          if "<GO_BACKEND_KEY>" in raw:
              print("FAIL: config 含 <GO_BACKEND_KEY> 明文占位，须走 os.environ"); bad += 1
          else:
              print("OK: config 无明文 key 占位")
          names = [m["model_name"] for m in d["model_list"]]
          if "*" in names:
              print("FAIL: config 含 * 通配"); bad += 1
          else:
              print(f"OK: models {len(names)} 条，无通配")
          if "nomic-embed-text" in names:
              print("FAIL: ollama embedding 条目未退役"); bad += 1
          else:
              print("OK: embedding 已退役（CF 直连，不经网关）")
          g = d.get("guardrails", [])
          if not any(x.get("guardrail_name") == "vault" and True in (x["litellm_params"].get("default_on"),) for x in g):
              print("FAIL: vault guardrail 缺失/default_on 非 true"); bad += 1
          else:
              print("OK: vault guardrail default_on")
          # 5. 认证 hook：官方键名 custom_auth 必须在位，错键名 user_custom_auth 必须不在（本次事故根因）
          gs = d.get("general_settings", {})
          if gs.get("custom_auth") != "always_allow_auth.always_allow":
              print(f"FAIL: general_settings.custom_auth 缺失/不对（官方键名）：{sorted(gs)}"); bad += 1
          else:
              print("OK: custom_auth hook 在位")
          if "user_custom_auth" in gs:
              print("FAIL: general_settings.user_custom_auth 是无人读取的错键名"); bad += 1
          else:
              print("OK: 错键名 user_custom_auth 不在位")
          # 4. guard 三文件：md5 与 README 声明对齐（改了必须同步改 README，即漂移显性化）
          import hashlib
          decl = open(f"{S}/README.md").read()
          for f in ("guard/vault_guard.py", "guard/models-denied.json", "guard/rules.json"):
              h = hashlib.md5(open(f"{S}/{f}", "rb").read()).hexdigest()
              if h in decl:
                  print(f"OK md5 {f}: {h[:12]}...")
              else:
                  print(f"FAIL: {f} md5 {h} 与 README 声明不一致"); bad += 1
          denied = json.load(open(f"{S}/guard/models-denied.json"))
          assert isinstance(denied, list) and denied, "models-denied.json 必须是非空数组"
          print(f"OK: models-denied.json ({len(denied)} 条)")
          sys.exit(1 if bad else 0)
          EOF

  masking-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Masking 行为测试（vault_guard standalone，零依赖）
        run: |
          python3 - <<'EOF'
          import sys, types
          _lit = types.ModuleType("litellm")
          _inte = types.ModuleType("litellm.integrations")
          _cgm = types.ModuleType("litellm.integrations.custom_guardrail")
          class _CG:
              def __init__(self, **kwargs):
                  pass
          _cgm.CustomGuardrail = _CG
          _exc = types.ModuleType("litellm.exceptions")
          class _BRE(Exception):
              def __init__(self, message="", model="", llm_provider="", **kw):
                  super().__init__(message)
          _exc.BadRequestError = _BRE
          _lit.integrations = _inte
          _inte.custom_guardrail = _cgm
          _lit.exceptions = _exc
          sys.modules.update({"litellm": _lit, "litellm.integrations": _inte,
                              "litellm.integrations.custom_guardrail": _cgm,
                              "litellm.exceptions": _exc})
          sys.path.insert(0, "stacks/litellm-gateway/guard")
          import vault_guard
          print("OK: vault_guard import（standalone stub 模式）")
          # 黑名单 fail-closed：读不到文件即全拦的逻辑存在即可（行为由 e2e 覆盖）
          assert hasattr(vault_guard, "SecretVaultGuardrail"), "缺 SecretVaultGuardrail"
          print("OK: SecretVaultGuardrail 存在")
          EOF

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 起服与线上同一条路：compose 本体零修改 up；测的就是部署跑的（1:1 复刻生产）
      - name: Start litellm（compose 本体，4000，master=test-only）
        env:
          GO_BACKEND_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SWR_U: ${{ secrets.SWR_LOGIN_USER }}
          SWR_P: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          [ -n "$GO_BACKEND_KEY" ] || { echo "FAIL: OPENCODE_API_KEY 未配（org secret）"; exit 1; }
          echo "gateway pin: $(grep -oP '^\s*image:\s*\K\S+' stacks/litellm-gateway/compose.yml | head -n1)"
          if grep -q "swr\." stacks/litellm-gateway/compose.yml; then
            [ -n "$SWR_U" ] || { echo "FAIL: SWR 凭证未配（org secret）"; exit 1; }
            echo "$SWR_P" | docker login swr.cn-north-9.myhuaweicloud.com -u "$SWR_U" --password-stdin
          fi
          # runner 补齐生产网桥 IP（172.17.0.1 是 docker0 自带；127 本来就有）；
          # compose 文件逐字节不动，.env 按生产机制落盘（runner 即焚）
          sudo ip addr add 172.19.0.1/24 dev lo 2>/dev/null || true
          printf 'GO_BACKEND_KEY=%s\nLITELLM_MASTER_KEY=test-only\nDISABLE_ADMIN_UI=True\nRULES_FILE=/app/guard-rules.json\n' "$GO_BACKEND_KEY" > stacks/litellm-gateway/.env
          chmod 600 stacks/litellm-gateway/.env
          # 与 cutover 同命令：pull + up（行为=digest：测的就是将上线的字节）
          cd stacks/litellm-gateway && docker compose pull --quiet litellm-guard && docker compose up -d --force-recreate litellm-guard
          for i in $(seq 1 24); do
            curl -sf --max-time 5 http://127.0.0.1:4000/v1/models -H "Authorization: Bearer test-only" >/dev/null 2>&1 && break
            sleep 5
          done
          curl -s --max-time 10 http://127.0.0.1:4000/v1/models -H "Authorization: Bearer test-only" | head -c 200; echo

      - name: Probes（模型表＋黑名单＋免费锁 verdict；真 200 走真客户端）
        env:
          GO_BACKEND_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request, urllib.error
          KEY = "test-only"
          failures = []
          def gw(path, payload=None, key=KEY):
              req = urllib.request.Request(
                  "http://127.0.0.1:4000" + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                  method="POST" if payload is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode())
                  except Exception:
                      return e.code, {}
              except Exception as e:
                  return -1, {"error": str(e)}
          def gw_noheader(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(
                      "http://127.0.0.1:4000" + path,
                      headers={"Content-Type": "application/json"}), timeout=30) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception:
                  return -1
          def no_db(body):
              return "no connected db" in json.dumps(body).lower().replace("_", " ")
          # 1. 认证矩阵（hook 在位的证明）：无头 401；任意 key（含杂 key）models 200；master 200
          s_no = gw_noheader("/v1/models")
          _, b_rand = gw("/v1/models", key="sk-rand-invalid-0000")
          s_rand = 200 if b_rand.get("data") is not None else -2
          print(f"auth-matrix: noheader={s_no} randkey-models={'200' if s_rand == 200 else b_rand}")
          if s_no != 401:
              failures.append(f"无 key 应 401，实得 {s_no}（hook 未加载或网关未起）")
          if s_rand != 200:
              failures.append(f"随机 key models 应 200（只过网关这门不碰上游），实得 {b_rand}")
          if no_db(b_rand):
              failures.append("随机 key 透出 No connected db（hook 未加载）")
          # 2. 模型表非空、无 * 展开噪音
          st, body = gw("/v1/models")
          ids = [m["id"] for m in body.get("data", [])]
          print(f"models: {st} count={len(ids)} sample={ids[:5]}")
          if st != 200 or not ids:
              failures.append("模型表空/失败")
          if any(i == "*" or len(ids) > 100 for i in ids):
              failures.append("模型表含通配展开噪音")
          # 3.（已退役：生产 config 无 embedding 条目，记忆走 CF 直连；此处只验透传不断言）
          # 4. 黑名单（models-denied.json 首条应 400）
          denied = json.load(open("stacks/litellm-gateway/guard/models-denied.json"))
          st, body = gw("/v1/chat/completions", {"model": denied[0], "messages": [{"role": "user", "content": "hi"}]})
          print(f"denied({denied[0]}): {st}")
          if st != 400:
              failures.append(f"黑名单未拦: {denied[0]} -> {st}")
          # 5. 上游可达 verdict（master test-only 是网关本地钥匙，转给上游必拒：401/403 都是上游原话；
          #    只要不是 400/500/000，就证明网关→上游全链路通＋verdict 原样透回；
          #    真 200 通路由 opencode-loop 真客户端＋等价性断言）
          st, body = gw("/v1/chat/completions", {"model": "glm-5.2", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1})
          txt = json.dumps(body)[:120]
          print(f"passthrough-upstream: {st} {txt}")
          if no_db(body):
              failures.append("透传透出 No connected db（hook 未加载）")
          elif st not in (401, 403):
              failures.append(f"上游不可达或被篡改: {st} (expect 401/403 上游 verdict)")
          # 5b. 等价性（master 随便换不影响 opencode key 透传）：有效 opencode key 与杂 key 经网关必须拿到
          #     上游 verdict（200 或上游形错误如 Invalid credential/Go subscription），绝不能是网关 400 No connected db；
          #     chat 只验状态码+结构不逐字比（AI 回复每次不同）；直调仅记录对照（网关与手写直调 header 不可能完全一致，
          #     状态码严格相等会 flake，见 hw21 实测：同 key 网关 403 上游原话 vs 裸直调 400 缺 session 头）。
          import os
          OKEY = os.environ.get("GO_BACKEND_KEY", "")
          def upstream_shaped(st, bd):
              if st == 200:
                  try:
                      assert isinstance(bd["choices"][0]["message"]["content"], str) and bd.get("model")
                      return True
                  except Exception:
                      return False
              tx = json.dumps(bd)
              return ("Upstream request failed" in tx or (bd.get("error") or {}).get("type") in
                  ("authentication_error", "permission_error", "invalid_request_error")) and not no_db(bd)
          for label, ckey in (("valid-opencode-key", OKEY), ("random-invalid-key", "sk-rand-invalid-0000")):
              p = {"model": "muse-spark-1.3-contributor", "messages": [{"role": "user", "content": "reply with exactly: EQ-OK"}], "max_tokens": 8}
              gst, gbody = gw("/v1/chat/completions", {"model": "muse-spark-1.3-contributor", "messages": p["messages"], "max_tokens": 8}, ckey)
              ok = upstream_shaped(gst, gbody)
              print(f"equiv[{label}]: gateway={gst} upstream-shaped={ok}")
              if not ok:
                  failures.append(f"等价性[{label}] 网关未透回上游 verdict：{gst} {json.dumps(gbody)[:150]}")
          s1, b1 = gw("/v1/models", key=OKEY)
          s2, b2 = gw("/v1/models", key=OKEY)
          if s1 != 200 or b1 != b2:
              failures.append("模型表非确定性（同 key 两次调用不一致）")
          else:
              print(f"models-deterministic OK count={len(b1.get('data', []))}")
          # 6. 直调上游（隔离用；免费档锁 OpenCode 客户端，直调必 403，仅记录不判失败）
          try:
              import os
              ukey = os.environ.get("GO_BACKEND_KEY", "")
              ureq = urllib.request.Request(
                  "https://opencode.ai/inference/openai/v1/models",
                  headers={"Authorization": f"Bearer {ukey}"})
              with urllib.request.urlopen(ureq, timeout=30) as r:
                  ust, ubody = r.status, json.loads(r.read().decode())
              free_ids = [m.get("id", "") for m in ubody.get("data", []) if "free" in m.get("id", "")]
              print(f"direct-upstream models: {ust} total={len(ubody.get('data', []))} free={free_ids[:8]}")
          except urllib.error.HTTPError as e:
              try:
                  emsg = e.read().decode()[:200]
              except Exception:
                  emsg = ""
              print(f"direct-upstream models: {e.code} {emsg} (直调预期行为：免费档锁客户端，见 OD CI 真客户端)")
          except Exception as e:
              print(f"direct-upstream models: -1 {e}")
          # 6-8. 免费三件套改走 OD CI 真客户端（test-opendesign 全绿），此处只记录直调对照。
          if failures:
              print("FAILURES:"); [print(f" - {f}") for f in failures]; sys.exit(1)
          print("ALL PROBES OK")
          EOF

      - name: opencode-loop（成品镜像真客户端＋mask/restore 断言）
        env:
          CLIENT_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # pin 取自生产栈 compose（部署仓消费打包仓工件，单源头；镜像换 pin 即换被测物）
          PIN="$(grep -oP '^\s*image:\s*\K\S+opencode-tools@\S+' stacks/opencode-prod/compose.yml | head -n1)"
          echo "opencode-tools pin: $PIN"
          docker pull -q "$PIN"
          mkdir -p /tmp/oc-cfg-gw
          cat > /tmp/oc-cfg-gw/opencode.jsonc <<'EOF'
          {"$schema": "https://opencode.ai/config.json",
           "permission": "allow",
           "model": "gw/glm-5.2",
           "provider": {"gw": {"options": {
             "baseURL": "http://127.0.0.1:4000/v1",
             "apiKey": "__CLIENT_KEY__"}}}}
          EOF
          sed -i "s|__CLIENT_KEY__|$CLIENT_API_KEY|" /tmp/oc-cfg-gw/opencode.jsonc
          docker run -d --name oc-gwtest --network host \
            -v /tmp/oc-cfg-gw/opencode.jsonc:/root/.config/opencode/opencode.jsonc:ro \
            -e OPENCODE_SERVER_PASSWORD=test-srv-pw \
            "$PIN" serve --port 4096 --hostname 127.0.0.1
          for i in $(seq 1 24); do
            curl -sf --max-time 5 http://127.0.0.1:4096/ >/dev/null 2>&1 && break
            sleep 5
          done
          OEX="docker exec -e OPENCODE_PASSWORD=test-srv-pw oc-gwtest opencode run --server http://127.0.0.1:4096"
          FAIL=""
          # 1. 连通门（3 轮，小模型偶发慢） — 区分网关故障与模型抖动；
          #    真客户端＋真 key==master，直通上游真 200（免费档锁 curl，由 OD CI 真客户端覆盖）
          OK1=""
          for attempt in 1 2 3; do
            timeout 280 $OEX "reply with exactly: GW-OK" > /tmp/gw-out.txt 2>&1 && \
            grep -q "GW-OK" /tmp/gw-out.txt && { OK1=1; echo "OK: opencode->gateway closure (attempt $attempt)"; break; }
            echo "--- closure attempt $attempt:"; tail -5 /tmp/gw-out.txt
          done
          [ -n "$OK1" ] || FAIL="opencode 调网关不通"
          # 2. mask/restore 门：合成密钥（零真值；example/test/xxx/fake/demo 等白名单词全避开，
          #    命中 generic-sk 规则。字面量拆写，卫生门不误报；运行时拼成完整 token）。
          PFX="sk-"; SFX="Q7mZ9vX2pL5nR8wZ4c6bD3eF1"; TOK="$PFX$SFX"
          OK2=""
          for attempt in 1 2 3; do
            timeout 280 $OEX "repeat exactly this token and nothing else: $TOK" > /tmp/mask-out.txt 2>&1 && \
            grep -q "$TOK" /tmp/mask-out.txt && { OK2=1; echo "OK: mask/restore round-trip (attempt $attempt)"; break; }
            echo "--- mask attempt $attempt:"; tail -8 /tmp/mask-out.txt
          done
          [ -n "$OK2" ] || FAIL="$FAIL; mask/restore 回包非原文"
          docker rm -f oc-gwtest >/dev/null 2>&1 || true
          [ -z "$FAIL" ] && echo "OPENCODE-LOOP OK" || { echo "FAIL: $FAIL"; exit 1; }
          # 网关侧流量自证（防客户端烘焙配置旁路：必须在网关日志里见到本次窗口的 chat 200，否则真客户端没穿过 4000）
          if docker logs litellm-guard --since 15m 2>&1 | grep -qE "chat/completions.*200|POST.*chat.*200|200 OK"; then
            echo "OK: 网关侧见到 chat 200（真穿过 4000）"
          else
            echo "WARN: 网关日志未见 chat 200（客户端可能走了烘焙直连，opencode-loop 结论降级；auth 矩阵与等价性仍为硬门）"
            docker logs litellm-guard --tail 20 2>&1 || true
          fi
