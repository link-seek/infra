name: preflight-deliver

# 流水线代码试送门：改快递流水线本身，必须先试送一次，绿了才准合。
# 试送 = 固定镜像（网关 stable digest 常量，不随 PR 浮动）+ 临时 TS 节点（本 runner 现建现焚）
#        + deliver-stack 真跑全量 up（canary 探针→切流→丢 canary，节点随 runner 焚毁，零生产影响）→ 全绿才算过。
# 不用 preflight 档：安全来自靶子用完即焚，不来自代码分支；全量才能验到切流段。
# 非流水线改动（只改 stacks/edge/docs 等）直接 SKIP，门禁照绿（避免 pending 卡死）。
# 调用链：本 job（起节点+sshd）→ dispatch deliver-stack --ref=PR 分支（跑 PR 版流水线代码）→ 轮询结论 → 焚毁节点。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判定是否触及流水线代码
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "match=true  # 手动触发：必跑一次试送"; echo "match=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(\.github/workflows/(deliver-|img-preflight|preflight-deliver|secret-hygiene)|scripts/)'; then
            echo "match=true"; echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false（未改流水线代码，SKIP）"; echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 起临时 TS 节点 + sshd（现建现焚）
        if: steps.scope.outputs.match == 'true'
        id: node
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          HN="ci-preflight-$GITHUB_RUN_ID"
          echo "hostname=$HN" >> "$GITHUB_OUTPUT"
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配（试送门需现场 mint 临时节点）"; exit 1; }
          echo "::add-mask::$TSKEY"
          curl -fsSL https://tailscale.com/install.sh | sh
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}},"expirySeconds":7200}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: 临时 key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          # --ssh：既是 tag:ci 靶子（供部署方 tailscale ssh 进来），也为去掉 sshd/单次钥匙做准备
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="$HN" --ssh --accept-routes=false --accept-dns=false
          tailscale ip -4
          # 靶子以 tag:ci + --ssh 入网：部署方（同为 tag:ci）直接 tailscale ssh，无需 sshd/单次钥匙
          tailscale status --json | python3 -c 'import json,sys;d=json.load(sys.stdin);print("target tags:",d["Self"].get("Tags"))'

      - name: 试送（dispatch deliver-stack 跑 PR 版代码，全量 up，靶子随节点焚毁）
        if: steps.scope.outputs.match == 'true'
        id: trial
        run: |
          set -euo pipefail
          # 固定镜像：网关已验证 digest 常量（只验证流水线逻辑，不验证 pin 新旧；stable 搬家时手动跟）
          FIXED="sha256:13bff929911f56856857bbb1fbf6a690096d1fd8b95c53f8951b4bcb24515726"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          [ -n "$HEAD_REF" ] || HEAD_REF="${{ github.ref_name }}"
          # 注：gh api 偶发挂起（无内置超时），轮询调用一律包 timeout 60，失败当轮空。
          # T0 回拨 300 秒：runner 本地钟与 GitHub 钟有偏差，卡太紧会把自己的 run 滤掉；
          # 同分支取最新，旧 push 的试送不会被误认（创建时间只增不减）。
          T0="$(( $(date +%s) - 300 ))"
          echo "T0=$T0" >> "$GITHUB_OUTPUT"
          echo "REF=$HEAD_REF" >> "$GITHUB_OUTPUT"
          HN="${{ steps.node.outputs.hostname }}"
          timeout 120 gh workflow run deliver-stack.yml -R link-seek/infra --ref "$HEAD_REF" \
            -f node_tag="host:$HN" \
            -f stack_dir="stacks/litellm-gateway" \
            -f digest_or_tag="$FIXED" \
            -f action="up" \
            -f ssh_transport="tailscale"
          echo "dispatched, waiting for run (branch=$HEAD_REF)"
          RUN_ID=""
          for i in $(seq 1 30); do
            sleep 20
            RUN_ID="$(timeout 60 gh api "repos/link-seek/infra/actions/workflows/deliver-stack.yml/runs?event=workflow_dispatch&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_branch==\"$HEAD_REF\" and ((.created_at|fromdateiso8601)>=$T0))] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || true)"
            [ -n "$RUN_ID" ] && break
          done
          [ -n "$RUN_ID" ] || { echo "FAIL: 试送 run 没出现（30 次轮询）"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "trial run: https://github.com/link-seek/infra/actions/runs/$RUN_ID"
          # 注：gh run watch 自带轮询+等完+按结论退出，比手写 sleep 循环可靠（ phase-1 找单号仍需一次 list 查询）。
          timeout 1800 gh run watch "$RUN_ID" -R link-seek/infra --interval 20 --exit-status \
            || { echo "FAIL: 试送未过（见上 run 链接查明细）"; exit 1; }
          echo "PREFLIGHT-TRIAL-OK"

      - name: 焚毁临时节点
        if: always() && steps.scope.outputs.match == 'true'
        run: |
          sudo tailscale logout || true
          shred -u /tmp/ci_ephem /tmp/ci_ephem.pub 2>/dev/null || true
