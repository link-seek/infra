name: opencode

# 评论/指派触发 opencode 改文件开 PR，只动文本，不碰构建密钥。
# 身份：jennifer95929-svgs 长期 PAT（org secret AGENT_GITHUB_TOKEN，classic repo+workflow）。
# App 路线已废（见 master#65）：App 不能被指派，一律真人号。
# 指派即开工：assignee 在 AI_ASSIGNEES 变量名单里（逗号分隔）；/oc 评论触发保留，
# 评论门只认 OWNER/MEMBER（组织外 collaborator 喊不动）。
# 注：issues.assigned 发起人调 API 时平台已要求 push 权限，故不验 sender association。
# 构建流水线全是 schedule/手动触发，合 PR 不会自动打镜像。
# 前提：repo settings 需有 OPENCODE_API_KEY（Go 订阅 key）。
# 现使用 link-seek/opencode-github-bot@v0.2.2（OpenCode v2 自包含 plugin）。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

jobs:
  opencode:
    # 非交互 CI：等人点允许会挂到 6h 默认超时（#108 run 40542549692 实锤）。
    # 一次性 runner，操作面全放（permission allow 含 external_directory），40 分钟硬超时；
    # secret 面保持最小（只 OPENCODE_API_KEY/GITHUB_TOKEN，绝不加料），毒代码由 PR 人审拦。
    timeout-minutes: 40
    if: |
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'assigned' &&
       contains(format(',{0},', vars.AI_ASSIGNEES), format(',{0},', github.event.assignee.login)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Run OpenCode (PR review / comment)
        if: github.event_name != 'issues'
        uses: link-seek/opencode-github-bot@v0.2.2
        with:
          model: ${{ vars.OPENCODE_REVIEW_MODEL }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.OPENCODE_API_KEY }}
          mode: review
          pr-number: ${{ github.event.issue.number || github.event.pull_request.number }}
          require-evidence: "false"
          require-pinned-actions: "true"
          collect-feedback: "true"

      - name: Run OpenCode (issue fix)
        if: github.event_name == 'issues'
        uses: link-seek/opencode-github-bot@v0.2.2
        with:
          model: ${{ vars.OPENCODE_REVIEW_MODEL }}
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.OPENCODE_API_KEY }}
          mode: fix-issue
          issue-number: ${{ github.event.issue.number }}