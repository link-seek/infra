name: k3s-egress-ali-gz
# 广州出海（SNI 路由，k8s 版 app connector）：hostNetwork DaemonSet 钉 mesh-ali-gz，
# TLS 端到端透传。网关 pod 用 hostAliases 指中继 tailnet IP（零网关配置变更）。
# 与东京链（k3s-egress.yml → vm-proxy）完全独立：文件、deploy、verify 各自点火，互不触发。
# 用法：dispatch mode=deploy（下发 ali-gz 中继＋验证）；之后 verify 只验广州。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy=下发+验证；verify=只验广州中继"
        required: false
        default: "deploy"
        type: choice
        options: [deploy, verify]

concurrency:
  group: k3s-egress-ali-gz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  egress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: runner 进 tailnet（user 身份，直达 .69，不经跳板）
        timeout-minutes: 6
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":21600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: user key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-egress-ali-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          tailscale status --self | head -2

      - name: 下发（namespace+conf+ali-gz DaemonSet，东京不动）
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          SSH69="sudo tailscale ssh root@100.93.119.21"
          tar czf /tmp/egress.tgz k8s/egress/namespace.yaml k8s/egress/nginx-conf.yaml k8s/egress/daemonset-ali-gz.yaml
          $SSH69 "cat > /tmp/egress-ali.tgz" < /tmp/egress.tgz
          $SSH69 "set -e; rm -rf /tmp/egress-ali && mkdir -p /tmp/egress-ali && tar xzf /tmp/egress-ali.tgz -C /tmp/egress-ali && cd /tmp/egress-ali && kubectl apply -f k8s/egress/namespace.yaml && kubectl apply -f k8s/egress/nginx-conf.yaml && kubectl apply -f k8s/egress/daemonset-ali-gz.yaml"
          echo "== 等 ali-gz relay Ready（只看自家 DS，不碰东京） =="
          for i in $(seq 1 20); do
            sleep 15
            READY="$($SSH69 "kubectl get daemonset -n egress sni-egress-ali-gz -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}' 2>/dev/null" || true)"
            echo "ali relay ready=$READY ($i/20)"
            [ "$READY" = "1/1" ] && break
            [ "$i" = 20 ] && { echo "FAIL: ali-gz relay 未 Ready"; $SSH69 'kubectl -n egress get pods -o wide | grep ali'; exit 1; }
          done
          echo ALI-APPLY-OK

      - name: 验（.69 直测广州中转 + 网关 pod 解析回正）
        run: |
          set -euo pipefail
          SSH69="sudo tailscale ssh root@100.93.119.21"
          echo "== .69 直测广州中转 14443（SNI=opencode.ai） =="
          CODE="$($SSH69 "curl -s -m 20 -o /dev/null -w '%{http_code}' --resolve opencode.ai:14443:100.85.128.116 https://opencode.ai:14443/")"
          echo "ali relay https opencode.ai => http=$CODE"
          [ "$CODE" = "200" ] || { echo "FAIL: 广州中转不通（want 200）"; exit 1; }
          echo "== 网关 pod 解析回正（应为公网 IP） =="
          GOT="$($SSH69 "kubectl exec -n opencode deploy/opencode -c opencode -- python3 -c \"import socket;print(socket.gethostbyname('opencode.ai'))\" 2>/dev/null | tail -1")"
          echo "pod resolves opencode.ai => $GOT"
          case "$GOT" in 10.43.*) echo "FAIL: rewrite 还在"; exit 1;; esac
          echo ALI-VERIFY-DONE

      - name: 退出 tailnet（焚毁节点）
        if: always()
        run: sudo tailscale logout || true
