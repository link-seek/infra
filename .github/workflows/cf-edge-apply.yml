name: cf-edge-apply（边缘配置对账）

# cf/*-edge.json 是唯一真相：WAF 托管包动作、速率限制、Bot 开关。
# 只手动 dispatch（admin 事项：必须活人点火＋全程盯，禁自动触发）。
# dry_run=true（默认）：只打计划；=false：真下发。

on:
  workflow_dispatch:
    inputs:
      zone_override:
        description: 覆盖 state 里的 zone（只读发现用，如 xieyucheng.top）
        required: false
        default: ''
      discover:
        description: 仅发现模式（列 account rulesets 找托管包 ID，不改任何东西）
        required: false
        default: 'false'
      dry_run:
        description: 只打印计划不执行（true/false）
        required: false
        default: 'true'
      state_file:
        description: 状态声明文件
        required: false
        default: cf/linkseek-edge.json

concurrency:
  group: cf-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      STATE_FILE: ${{ inputs.state_file || 'cf/linkseek-edge.json' }}
      DRY_RUN: ${{ inputs.dry_run || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: CF token（组织 token 直用＋mask；fail-closed）
        run: |
          set -euo pipefail
          PARENT="$(printf '%s' "$CF_PARENT_TOKEN" | tr -d '\r\n ')"
          [ -n "$PARENT" ] || { echo "FAIL: CF_PARENT_TOKEN 为空"; exit 1; }
          echo "::add-mask::$PARENT"
          echo "CF_TOKEN=$PARENT" >> "$GITHUB_ENV"
          echo "CF token 就绪（组织 token 直用，mask＋审计）"

      - name: 加入 tailnet（admin 身份标记；本线只调公网 CF API，不碰内网）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          echo "::add-mask::$TSKEY"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:admin"]}}},"expirySeconds":21600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))" || true)"
          [ -n "$MINTED" ] || { echo "FAIL: admin key 现签失败"; exit 1; }
          echo "::add-mask::$MINTED"
          echo "admin key minted（一次性节点，用完即焚）"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-cfedge-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          tailscale ip -4

      - name: 边缘对账（声明即执行预览/落地）
        env:
          ZONE_OVERRIDE: ${{ inputs.zone_override }}
          CF_DISCOVER: ${{ inputs.discover }}
        run: |
          set -euo pipefail
          STATE_FILE="$STATE_FILE" DRY_RUN="$DRY_RUN" python3 scripts/cf-edge-apply.py

      - name: 公网验证（隧道＋WAF 穿透冒烟）
        if: inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            CODE="$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://litellm.linkseek.net.cn/v1/models -H 'Authorization: Bearer ci-probe' || echo 000)"
            echo "litellm try$i http=$CODE"
            [ "$CODE" = "200" ] && break
            sleep 30
          done
          [ "$CODE" = "200" ] || { echo LITELM-NOT-READY; exit 1; }

      - name: 退出 tailnet（焚毁节点）
        if: always()
        run: sudo tailscale logout || true
