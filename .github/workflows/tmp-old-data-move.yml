name: tmp-old-data-move
# 一次性写操作（已授权）：备份新盘 → 老盘迁入 yingxin（data 全镜，work 叠加＋.git 换老护新）。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-old-data-move
  cancel-in-progress: false
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 进 tailnet（user 身份）
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: 备份＋搬家（.69 主机）
        run: |
          set -euo pipefail
          SSH69="sudo tailscale ssh root@100.93.119.21"
          TS="$(date -u +%F-%H%M)"
          OLD_WORK="$($SSH69 "ls -d /var/lib/rancher/k3s/storage/*_opencode_prod-work" | head -1)"
          OLD_DATA="$($SSH69 "ls -d /var/lib/rancher/k3s/storage/*_opencode_prod-data" | head -1)"
          [ -n "$OLD_WORK" ] && [ -n "$OLD_DATA" ] || { echo "FAIL: 老盘目录没找到"; exit 1; }
          echo "old_work=$OLD_WORK old_data=$OLD_DATA"
          echo "== 1. 备份新盘 =="
          $SSH69 "tar czf /tmp/yingxin-backup-$TS.tgz -C /var/lib opencode-yingxin && ls -la /tmp/yingxin-backup-$TS.tgz"
          echo "== 2. data 全镜（老为准） =="
          $SSH69 "rsync -a --delete '$OLD_DATA/' /var/lib/opencode-yingxin/data/ && du -sh /var/lib/opencode-yingxin/data"
          echo "== 3. work 叠加（不删）＋.git 换老护新 =="
          $SSH69 "if [ -d '$OLD_WORK/.git' ]; then [ -d /var/lib/opencode-yingxin/work/.git ] && mv /var/lib/opencode-yingxin/work/.git /var/lib/opencode-yingxin/work/.git-new-backup-$TS || true; rsync -a '$OLD_WORK/.git/' /var/lib/opencode-yingxin/work/.git/; echo git-swapped; else echo no-old-git-keep-new; fi"
          $SSH69 "rsync -a --exclude=.git '$OLD_WORK/' /var/lib/opencode-yingxin/work/ && du -sh /var/lib/opencode-yingxin/work"
          echo MOVE-DONE backup=/tmp/yingxin-backup-$TS.tgz
      - name: 重启新 pod 吃新状态＋验活
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          kubectl -n opencode-yingxin rollout restart deploy/opencode-yingxin
          kubectl -n opencode-yingxin rollout status deploy/opencode-yingxin --timeout=600s
          kubectl -n opencode-yingxin get pods -o jsonpath='{range .items[*]}{.metadata.name} ready={.status.conditions[?(@.type=="Ready")].status} start={.status.startTime}{"\n"}{end}'
          for i in 1 2 3; do curl -sS -m 15 -o /dev/null -w "try$i http=%{http_code}\n" https://opencode.yingxin.net.cn/; sleep 3; done
          echo RELOAD-VERIFY-OK
