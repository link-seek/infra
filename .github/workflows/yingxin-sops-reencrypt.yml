name: yingxin-sops-reencrypt
# 薄触发器：yingxin。逻辑在 _sops-reencrypt-core（别改这里，加能力改 core）。
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "key-updated=org 换 key 后同步；rotation-90d=定期轮换"
        required: false
        default: "key-updated"
        type: choice
        options: [key-updated, rotation-90d, other]
permissions:
  contents: read
jobs:
  call:
    uses: ./.github/workflows/_sops-reencrypt-core.yml
    with:
      app: yingxin
      dir: opencode-yingxin
      reason: ${{ inputs.reason }}
    secrets: inherit
