name: ts-cleanup（tailnet 僵尸节点清理，手动单次）

# 手动清理离线临时节点（ci-infra-*/img-*）。默认 dry-run 只列清单；
# confirm=yes 才真删。mesh 系列/个人设备/opencode-prod 写死永不删。
# key 只活 CI：优先 org TS_OAUTH_CREDENTIALS 配对（换 1h token），缺失回落 TS_API_KEY；容器不持 tailnet-admin。

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: "hostname 正则白名单（默认只含临机前缀）"
        required: false
        default: "^(ci-infra-|img-)"
      days_offline:
        description: "离线超过多少天才删"
        required: false
        default: "3"
      confirm:
        description: "填 yes 才真删，否则只列清单"
        required: false
        default: ""

concurrency:
  group: ts-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      TS_OAUTH_CREDENTIALS: ${{ secrets.TS_OAUTH_CREDENTIALS }}
    steps:
      - name: 列候选 + dry-run（删前必看）
        env:
          PATTERN: ${{ inputs.pattern }}
          DAYS: ${{ inputs.days_offline }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          # 取 token 顺序：OAuth 配对（1h access token，现换）> 直连 TS_API_KEY（旧）。
          TSKEY=""
          OAUTH_JSON="$(printf '%s' "${TS_OAUTH_CREDENTIALS:-}")"
          if [ -n "$OAUTH_JSON" ]; then
            TSKEY="$(TS_OAUTH_JSON="$OAUTH_JSON" python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          try:
              cred = json.loads(os.environ["TS_OAUTH_JSON"])
              cid, csec = cred["client_id"], cred["client_secret"]
          except Exception:
              print("FAIL: TS_OAUTH_CREDENTIALS 不是合法 JSON{client_id,client_secret}", file=sys.stderr)
              raise SystemExit(1)
          data = urllib.parse.urlencode(
              {"client_id": cid, "client_secret": csec, "grant_type": "client_credentials"}).encode()
          req = urllib.request.Request("https://api.tailscale.com/api/v2/oauth/token", data=data, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  r = json.loads(resp.read() or b"{}")
          except urllib.error.HTTPError as exc:
              print("FAIL: OAuth 换 token status=%s" % exc.code, file=sys.stderr)
              raise SystemExit(1)
          tok = str(r.get("access_token") or "")
          if not tok:
              print("FAIL: OAuth 无 access_token", file=sys.stderr)
              raise SystemExit(1)
          print(tok)
          PY
          )"
          fi
          if [ -z "$TSKEY" ]; then
            TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          fi
          [ -n "$TSKEY" ] || { echo "FAIL: 无可用 TS 凭证（OAuth 配对与 TS_API_KEY 都空）"; exit 1; }
          echo "::add-mask::$TSKEY"
          export TSKEY PATTERN DAYS CONFIRM
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          BASE = "https://api.tailscale.com/api/v2"
          TOKEN = os.environ["TSKEY"]
          # 永不删（精确 hostname，pattern 对上也不删）
          NEVER = {
              "mesh-hw-21", "mesh-hw-41", "mesh-ali-gz", "mesh-oci-vpn",
              "mesh-xyc-pc", "mesh-yx-mac", "opencode-prod", "opencode-prod-canary",
          }
          try:
              days = int(os.environ.get("DAYS", "3"))
          except ValueError:
              print("FAIL: days_offline 非法")
              raise SystemExit(1)
          pattern = os.environ.get("PATTERN", "")


          def call(method, path):
              req = urllib.request.Request(
                  BASE + path, headers={"Authorization": "Bearer " + TOKEN},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  try:
                      return exc.code, json.loads(exc.read() or b"{}")
                  except Exception:
                      return exc.code, {}


          st, r = call("GET", "/tailnet/-/devices")
          if st != 200:
              print("FAIL: 列设备 status=%s" % st)
              raise SystemExit(1)
          devices = r.get("devices") or []
          now = datetime.now(timezone.utc)
          print("tailnet 设备总数=%d pattern=%s days>=%d" % (len(devices), pattern, days))
          victims = []
          for d in devices:
              name = str(d.get("hostname") or "")
              node_id = str(d.get("id") or "")  # DELETE 只认数字 id；nodeId 会 404
              last = str(d.get("lastSeen") or "")
              try:
                  seen = datetime.fromisoformat(last.replace("Z", "+00:00"))
                  offline_days = (now - seen).days
              except Exception:
                  offline_days = -1
              tag = []
              if name in NEVER:
                  tag.append("NEVER-keep")
              elif not re.match(pattern, name):
                  tag.append("pattern-mismatch")
              elif offline_days < 0:
                  tag.append("lastSeen-unknown")
              elif offline_days < days:
                  tag.append("online-recent(%dd)" % offline_days)
              else:
                  tag.append("CANDIDATE(%dd)" % offline_days)
                  victims.append((node_id, name, offline_days))
              print("  %-28s lastSeen=%s %s" % (name, last[:16], ",".join(tag)))
          print("候选=%d（NEVER/pattern 不符/在线的都没进）" % len(victims))
          if os.environ.get("CONFIRM", "") != "yes":
              print("dry-run 结束（confirm 非 yes，不删）。要删重跑并填 confirm=yes。")
              sys.exit(0)
          for node_id, name, offline_days in victims:
              # 官方路径：DELETE /device/{deviceId}（顶级；列表路径无 DELETE，必 404）。
              st, _ = call("DELETE", "/device/%s" % node_id)
              print("delete %s (%s, %dd) -> %s" % (name, node_id[:8], offline_days, st))
              if st not in (200, 204):
                  print("FAIL: 删 %s 失败" % name)
                  raise SystemExit(1)
              st, _ = call("GET", "/device/%s" % node_id)
              if st != 404:
                  print("FAIL: %s 删除后仍在（GET=%s）" % (name, st))
                  raise SystemExit(1)
          print("删除完成，共 %d 台；请到控制台复核设备表" % len(victims))
          PY
