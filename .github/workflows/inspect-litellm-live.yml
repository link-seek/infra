name: inspect-litellm-live

# 一次性只读取证：把 HW21 现网网关的真实形态打捞出来，与 stacks/litellm-gateway 对账。
# 用完即删，不进常驻。密钥类一律只验存在/打码，永不打印真值。
on:
  workflow_dispatch:

concurrency:
  group: inspect-litellm-live
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 加入 tailnet
        timeout-minutes: 6
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_PROD }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TS_AUTHKEY="$(printf '%s' "$TS_AUTHKEY" | tr -d '\r\n ')"
          timeout 120 sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ci-inspect-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          timeout 15 bash -c "</dev/tcp/100.91.222.51/2244"

      - name: 只读取证（禁 cat 密钥文件原文）
        timeout-minutes: 5
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -p 2244 -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          echo "===== 容器 ====="
          docker ps --format '{{.Names}} | {{.Image}} | {{.Ports}}'
          echo "===== 网关容器 image（含 digest） ====="
          docker inspect litellm-guard --format '{{.Config.Image}}' 2>/dev/null || echo "无 litellm-guard 容器（容器名假设错误）"
          docker inspect litellm-guard --format '{{.Image}}' 2>/dev/null || true
          echo "===== 网关容器 env 名（只列名，不打值） ====="
          docker inspect litellm-guard --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | sed 's/=.*/=<redacted>/' || true
          echo "===== 网关挂载 ====="
          docker inspect litellm-guard --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}' 2>/dev/null || true
          echo "===== 线上文件清单＋md5（/root/litellm-guard） ====="
          ls -la /root/litellm-guard/ 2>/dev/null || echo "无此目录"
          md5sum /root/litellm-guard/* 2>/dev/null || true
          echo "===== 线上 config 结构（api_key 打码） ====="
          sed -E 's/(api_key:).*/\1 <redacted>/' /root/litellm-guard/litellm_config.yaml 2>/dev/null | head -80 || echo "无此文件"
          echo "===== 模型条数 ====="
          grep -c "model_name:" /root/litellm-guard/litellm_config.yaml 2>/dev/null || true
          echo "===== ollama 容器 ====="
          docker ps --format '{{.Names}} | {{.Image}}' | grep -i ollama || echo "无 ollama 容器"
          echo "===== tailscale serve ====="
          tailscale serve status 2>/dev/null || echo "serve 未配置/命令失败"
          echo "===== cloudflared 痕迹（只列文件存在性） ====="
          ls -la /root/.cloudflared/ /etc/cloudflared/ 2>/dev/null || echo "无 cloudflared 目录"
          systemctl list-units --type=service --state=running 2>/dev/null | grep -i -E "cloudflared|litellm|ollama" || echo "无相关 service"
          echo "===== stacks 新目录 ====="
          ls -la /root/stacks/litellm-gateway/ /root/stacks/litellm-gateway/guard/ /root/stacks/litellm-gateway/config/ 2>/dev/null || true
          EOF
