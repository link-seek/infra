name: k3s-node-config

# 声明式节点配置（k3s over TS underlay），覆盖全部 5 节点（3 server + 2 edge agent）。
#   verify（默认）：只读核对 config.yaml/unit 关键项 + flannel.1 运行时（local/dev/mtu）+ public-ip，
#                   + flannel 数据面（远端路由数/形状、邻居、FDB、TX/tx_dropped、tailscale ip rule）
#                   + L7 网关可用性（egress-proxy→opencode.ai；并打印集群 DNS ClusterIP 供参考）。
#                   unit 关键项改用 `systemctl show -p ExecStart --value` 的“实际解析结果”比对，
#                   避免旧实现 tr 拼行把「续行符丢失、后续 flag 被 systemd 丢弃」这种漂移掩盖成 NODE-OK。
#                   任一漂移即 fail；失败自动开/追加 issue（drift 告警闭环，见文件末尾）。
#   apply：仅对 server 写入缺失/不符的 config 行（备份），restart=yes 才重启对应服务（重启后请再跑 verify）。
#          agent 的参数在 systemd unit 的 ExecStart（--node-ip/--flannel-iface），本链只 verify，不 sed unit。
#          修复 agent 走 k3s-edge-repair（幂等重装），禁止手改 ExecStart。
# 定时 verify 作为漂移巡检。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify | apply"
        type: choice
        options: [verify, apply]
        default: verify
        required: true
      restart:
        description: "apply 后是否重启（配置有变化时）"
        type: choice
        options: ["no", "yes"]
        default: "no"
        required: true
  schedule:
    - cron: "17 1 * * *"   # 每天 01:17 UTC 巡检

permissions:
  contents: read
  issues: write

concurrency:
  group: k3s-node-config
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      MODE: ${{ inputs.mode }}
      RESTART: ${{ inputs.restart }}
    steps:
      - uses: actions/checkout@v4

      - name: join tailnet (tag:github)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:github"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: mint key"; exit 1; }
          echo "::add-mask::$MINTED"
          sudo tailscale up --authkey="$MINTED" --hostname="ci-nodecfg-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          tailscale status --self | head -2 || true

      - name: reconcile（5 节点）
        run: |
          set -uo pipefail
          MODE="${MODE:-verify}"; RESTART="${RESTART:-no}"
          echo "MODE=$MODE RESTART=$RESTART"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          SOPT="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/ci_key"
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml || { echo "FAIL: pyyaml 不可用"; exit 1; }
          python3 - <<'PY' > /tmp/hosts.tsv
          import yaml
          hosts = yaml.safe_load(open('node/node-config.yaml'))['hosts']
          peers = len(hosts) - 1
          for h in hosts:
              print('|'.join([
                  h['name'], h['ssh'], h.get('role','server'), h.get('service','k3s'),
                  h['node_ip'], h.get('node_external_ip','') or '', h['flannel_iface'],
                  str(h['expect_flannel_mtu']), str(peers),
              ]))
          PY
          [ -s /tmp/hosts.tsv ] || { echo "FAIL: hosts.tsv 为空（node-config.yaml 解析失败？）"; exit 1; }
          echo "hosts: $(wc -l < /tmp/hosts.tsv)"
          FAIL=0
          { echo "# k3s-node-config drift report"; echo "时间: $(date -u +%FT%TZ)"; echo; } > drift-report.md
          while IFS='|' read -r NAME SSH ROLE SVC NIP EIP IFACE MTU PEERS; do
            [ -n "$NAME" ] || continue
            echo "===== $NAME ($SSH) role=$ROLE svc=$SVC ====="
            OUT=$(ssh $SOPT root@$SSH "MODE=$MODE RESTART=$RESTART ROLE=$ROLE SVC=$SVC NIP=$NIP EIP=$EIP IFACE=$IFACE MTU=$MTU PEERS=$PEERS bash -s" <<'REMOTE' || true
          set -uo pipefail
          CFG=/etc/rancher/k3s/config.yaml
          SVC="${SVC:-k3s}"
          # 用 systemd 真正解析出的 ExecStart（续行符丢失时后续 flag 会缺失）来比对，避免 tr 拼行掩盖漂移。
          # 注意：不能 `tr -d '\\'` 拼行——那会把「丢了续行符、systemd 实际没解析到 flag」的坏 unit 判成 OK。
          PARSED_EXEC="$(systemctl show "$SVC" -p ExecStart --value 2>/dev/null || true)"
          drift=0
          has_kv() { # $1=key $2=val: config.yaml "key: val" 或 systemd 解析后的 ExecStart "--key val"/"--key=val"
            local k="$1" v="$2" vre
            vre="$(printf '%s' "$v" | sed 's/\./\\./g')"
            grep -qE "^[[:space:]]*${k}:[[:space:]]*\"?${vre}\"?[[:space:]]*$" "$CFG" 2>/dev/null && return 0
            printf '%s' "$PARSED_EXEC" | grep -qE -- "--${k}[=[:space:]]+${vre}([[:space:];]|$)" && return 0
            return 1
          }
          echo "--- config.yaml/unit 关键项 ---"
          { grep -E "node-ip|node-external-ip|flannel-iface" "$CFG" 2>/dev/null || true; printf '%s\n' "$PARSED_EXEC" | grep -oE -- "--(node-ip|node-external-ip|flannel-iface)[=[:space:]]+[0-9a-zA-Z./]+" || true; } | head
          for kv in "node-ip $NIP" "flannel-iface $IFACE"; do
            set -- $kv; has_kv "$1" "$2" || { echo "DRIFT-MISSING $1=$2"; drift=1; }
          done
          if [ -n "${EIP:-}" ]; then has_kv node-external-ip "$EIP" || { echo "DRIFT-MISSING node-external-ip=$EIP"; drift=1; }; fi
          EXPECT_LOCAL="${EIP:-$NIP}"
          rt=$(ip -d link show flannel.1 2>/dev/null | grep -o "local [0-9.]* dev [a-z0-9.]*" || true)
          mtu=$(cat /sys/class/net/flannel.1/mtu 2>/dev/null || echo '?')
          echo "runtime: $rt mtu=$mtu expect_local=$EXPECT_LOCAL"
          [ "$rt" = "local $EXPECT_LOCAL dev $IFACE" ] || { echo "DRIFT-FLANNEL [$rt]"; drift=1; }
          [ "$mtu" = "$MTU" ] || { echo "DRIFT-MTU $mtu"; drift=1; }
          if [ -n "${EIP:-}" ]; then
            pub=$(KUBECONFIG=/etc/rancher/k3s/k3s.yaml k3s kubectl get node "$(hostname)" -o jsonpath='{.metadata.annotations.flannel\.alpha\.coreos\.com/public-ip}' 2>/dev/null || true)
            echo "public-ip=$pub"; [ "$pub" = "$EIP" ] || { echo "DRIFT-PUB [$pub]"; drift=1; }
          fi
          # ---- flannel 数据面：接口重建后路由/邻居/FDB 可能全丢而节点仍 Ready（k3s#12436/#14142）----
          echo "--- flannel 数据面 ---"
          peers="${PEERS:-0}"
          routes=$(ip route show dev flannel.1 2>/dev/null | grep -c ' onlink' || true)
          echo "routes=$routes expect=$peers"
          [ "$routes" -eq "$peers" ] || { echo "DRIFT-ROUTE-COUNT $routes != $peers"; drift=1; }
          bad_rt=$(ip route show dev flannel.1 2>/dev/null | awk '/ onlink/ {t=$1; sub(/\/.*/,"",t); if ($3 != t) print}')
          [ -z "$bad_rt" ] || { echo "DRIFT-ROUTE-SHAPE"; printf '%s\n' "$bad_rt"; drift=1; }
          neigh_ok=$(ip neigh show dev flannel.1 2>/dev/null | grep -cE ' (PERMANENT|REACHABLE)( |$)' || true)
          neigh_bad=$(ip neigh show dev flannel.1 2>/dev/null | grep -cE ' (INCOMPLETE|FAILED)' || true)
          echo "neigh-ok=$neigh_ok expect=$peers neigh-bad=$neigh_bad"
          { [ "$neigh_ok" -eq "$peers" ] && [ "$neigh_bad" -eq 0 ]; } || { echo "DRIFT-NEIGH"; ip neigh show dev flannel.1 2>/dev/null; drift=1; }
          fdb=$(bridge fdb show dev flannel.1 2>/dev/null | grep -c ' dst .* self permanent' || true)
          echo "fdb=$fdb expect=$peers"
          [ "$fdb" -eq "$peers" ] || { echo "DRIFT-FDB $fdb != $peers"; bridge fdb show dev flannel.1 2>/dev/null; drift=1; }
          st=/sys/class/net/flannel.1/statistics
          t0=$(cat "$st/tx_packets" 2>/dev/null || echo 0); d0=$(cat "$st/tx_dropped" 2>/dev/null || echo 0)
          sleep 5
          t1=$(cat "$st/tx_packets" 2>/dev/null || echo 0); d1=$(cat "$st/tx_dropped" 2>/dev/null || echo 0)
          sleep 5
          d2=$(cat "$st/tx_dropped" 2>/dev/null || echo 0)
          echo "tx_packets=$t1 tx_dropped=$d0->$d1->$d2"
          [ "$t1" -gt 0 ] || { echo "DRIFT-TX-ZERO"; drift=1; }
          # 连续两个采样窗口都在增长 => 持续丢包（单次抖动不判失败）
          { [ "$d1" -gt "$d0" ] && [ "$d2" -gt "$d1" ]; } && { echo "DRIFT-TX-DROPPED growing"; drift=1; }
          if [ "$IFACE" = tailscale0 ]; then
            rules=$(ip rule show 2>/dev/null)
            for r in 5210 5230 5250 5270; do
              printf '%s\n' "$rules" | grep -q "^$r:" || { echo "DRIFT-IPRULE missing $r"; drift=1; }
            done
          fi
          if [ "${MODE:-verify}" = apply ] && [ "$drift" = 1 ]; then
            if [ "${ROLE}" != server ]; then
              echo "SKIP-APPLY role=${ROLE}（agent 参数在 unit ExecStart，改配置走 k3s-join-edge 重装）"
            else
              cp -a "$CFG" "$CFG.bak-$(date +%s)"
              for kv in "node-ip: $NIP" "flannel-iface: $IFACE"; do
                k=${kv%%:*}
                if grep -qE "^[[:space:]]*$k:" "$CFG"; then sed -i "s#^[[:space:]]*$k:.*#$kv#" "$CFG"; else printf '%s\n' "$kv" >> "$CFG"; fi
              done
              if [ -n "${EIP:-}" ]; then
                k=node-external-ip; kv="node-external-ip: $EIP"
                if grep -qE "^[[:space:]]*$k:" "$CFG"; then sed -i "s#^[[:space:]]*$k:.*#$kv#" "$CFG"; else printf '%s\n' "$kv" >> "$CFG"; fi
              fi
              echo APPLIED; cat "$CFG"
              if [ "${RESTART:-no}" = yes ]; then
                if systemctl restart "$SVC"; then echo RESTARTED; else echo RESTART-FAILED; drift=1; fi
              fi
            fi
          fi
          [ "$drift" = 0 ] && echo NODE-OK || echo NODE-DRIFT
          REMOTE
            )
            echo "$OUT"
            { echo "### $NAME ($SSH) role=$ROLE"; echo '```'; echo "$OUT"; echo '```'; echo; } >> drift-report.md
            echo "$OUT" | grep -q NODE-OK || FAIL=1
          done < /tmp/hosts.tsv
          # ---- L7 网关可用性探针（egress-proxy→opencode.ai；节点 host 不解析 .svc，用 ClusterIP）----
          echo "===== egress L7 探针 ====="
          EG_SSH=$(awk -F'|' '$3=="server"{print $2; exit}' /tmp/hosts.tsv)
          EG_SVCIP=$(ssh $SOPT root@$EG_SSH "KUBECONFIG=/etc/rancher/k3s/k3s.yaml k3s kubectl -n egress get svc egress-proxy -o jsonpath='{.spec.clusterIP}'" 2>/dev/null || true)
          echo "egress-proxy clusterIP=$EG_SVCIP"
          EG_CODE=000
          [ -n "$EG_SVCIP" ] && EG_CODE=$(ssh $SOPT root@$EG_SSH "curl -sS -m 20 -x http://$EG_SVCIP:3128 -o /dev/null -w '%{http_code}' https://opencode.ai" 2>/dev/null || echo 000)
          echo "egress squid->opencode.ai http=$EG_CODE (expect 200)"
          if [ "$EG_CODE" != "200" ]; then echo "DRIFT-EGRESS squid->opencode.ai http=$EG_CODE"; echo "### L7 egress squid->opencode.ai http=$EG_CODE" >> drift-report.md; FAIL=1; fi
          DNSIP=$(ssh $SOPT root@$EG_SSH "KUBECONFIG=/etc/rancher/k3s/k3s.yaml k3s kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'" 2>/dev/null || true)
          echo "cluster dns ip=$DNSIP"
          shred -u ~/.ssh/ci_key 2>/dev/null || true
          if [ "$FAIL" != 0 ]; then echo "RESULT: FAIL（mode=$MODE）"; exit 1; fi
          if [ "$MODE" = apply ]; then echo "APPLY 完成（restart=$RESTART；请再跑一次 verify）"; else echo "RESULT: 全节点无漂移"; fi

      - name: 失败自动开/追加 issue（drift 告警闭环）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -s drift-report.md ]; then echo "无 drift-report.md，跳过"; exit 0; fi
          TITLE="[drift] k3s-node-config 巡检失败"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY="$(printf '模式: %s\n运行: %s\n\n%s\n' "${MODE:-verify}" "$RUN_URL" "$(cat drift-report.md)")"
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "[drift] k3s-node-config"' --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY" || echo "追加 issue 失败（权限？）"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" || echo "开 issue 失败（权限？）"
          fi
