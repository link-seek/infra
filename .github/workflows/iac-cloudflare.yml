name: iac-cloudflare

# Cloudflare DNS（Terraform）：
#   plan  = 只读差异对账（不改线上、不改 state）
#   adopt = 首次接管：临时生成 import 块 + apply（仅把现有记录 import 进 state；plan 已证 0 变更）
#   apply = 应用 dns.tf 的配置变更（人工 confirm 后）
# state 存 OBS（backend.tf），凭据 PROD_HCLOUD_AK/SK；CF token 用 CF_PARENT_TOKEN。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan=只读；adopt=首次import；apply=应用变更"
        required: true
        default: plan
        type: choice
        options: [plan, adopt, apply]
      confirm:
        description: "非 plan 模式必须输入 yes 才执行"
        required: false
        default: "no"

permissions:
  contents: read

concurrency:
  group: iac-cloudflare
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_HCLOUD_AK }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_HCLOUD_SK }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_PARENT_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: v1.17.2
          terraform_wrapper: false

      - name: 危险模式需 confirm=yes
        if: inputs.mode != 'plan'
        run: |
          [ "${{ inputs.confirm }}" = "yes" ] || { echo "拒绝：mode=${{ inputs.mode }} 需要 confirm=yes"; exit 1; }

      - name: terraform init（OBS S3 backend）
        working-directory: iac/terraform/cloudflare
        run: terraform init -input=false

      - name: 按 dns.tf 资源精确配对 → import 块（仅 adopt）
        if: inputs.mode == 'adopt'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, re, urllib.request
          token = os.environ["CF_API_TOKEN"]
          zones = ["xieyucheng.top", "linkseek.net.cn", "yingxin.net.cn"]
          def api(path):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                                           headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          # 1) 解析 dns.tf：把 (zone_id, name, type) 映射到资源本地名 + 声明的 content（用于漂移校验）
          hcl = open("iac/terraform/cloudflare/dns.tf").read()
          blocks = re.findall(r'resource\s+"cloudflare_dns_record"\s+"([^"]+)"\s*\{(.*?)\n\}', hcl, re.S)
          def field(body, k):
              m = re.search(rf'^\s*{k}\s*=\s*"([^"]*)"', body, re.M)
              return m.group(1) if m else None
          idx = {}
          for rname, body in blocks:
              key = (field(body, "zone_id"), field(body, "name"), field(body, "type"))
              if key in idx:
                  print("FATAL: dns.tf 内 (zone,name,type) 重复:", key); raise SystemExit(1)
              idx[key] = (rname, field(body, "content"))
          print("dns.tf 资源块:", len(blocks))
          # 2) 枚举实况，按属性精确配对（配不上 / content 漂移 → 中止，绝不盲导/改错 DNS）
          lines, used = [], set()
          for z in zones:
              zr = api(f"/zones?name={z}")
              if not zr.get("result"): print("no zone", z); continue
              zid = zr["result"][0]["id"]
              page = 1
              while True:
                  d = api(f"/zones/{zid}/dns_records?per_page=100&page={page}")
                  for r in d.get("result") or []:
                      key = (zid, r["name"], r["type"])
                      if key not in idx:
                          print("FATAL: 实况记录在 dns.tf 中无对应:", key); raise SystemExit(1)
                      rname, tf_content = idx[key]
                      if rname in used:
                          print("FATAL: dns.tf 资源被多条实况命中:", rname); raise SystemExit(1)
                      if (tf_content or "") != (r.get("content") or ""):
                          print(f"FATAL: content 漂移 {rname}: tf=[{tf_content}] live=[{r.get('content')}]"); raise SystemExit(1)
                      used.add(rname)
                      lines.append(f'import {{\n  to = cloudflare_dns_record.{rname}\n  id = "{zid}/{r["id"]}"\n}}\n')
                  if page >= ((d.get("result_info") or {}).get("total_pages") or 1): break
                  page += 1
          if len(used) != len(blocks):
              print(f"FATAL: 仅配对 {len(used)}/{len(blocks)} 个 dns.tf 资源"); raise SystemExit(1)
          open("iac/terraform/cloudflare/imports.auto.tf", "w").write("\n".join(lines))
          print("import blocks:", len(lines), "（全部精确配对）")
          PY

      - name: plan
        working-directory: iac/terraform/cloudflare
        run: |
          set +e
          if [ "${{ inputs.mode }}" = "apply" ]; then
            terraform plan -input=false -out=tfplan
          else
            terraform plan -input=false
          fi
          echo "PLAN_EXIT=$?"

      - name: adopt（import 现有记录进 state）
        if: inputs.mode == 'adopt'
        working-directory: iac/terraform/cloudflare
        run: |
          set -euo pipefail
          terraform apply -auto-approve -input=false
          rm -f imports.auto.tf
          echo "adopt done, import blocks removed"

      - name: apply（应用配置变更）
        if: inputs.mode == 'apply'
        working-directory: iac/terraform/cloudflare
        run: terraform apply -auto-approve -input=false tfplan

      - name: 收尾 plan（adopt/apply 后确认无漂移）
        if: inputs.mode != 'plan'
        working-directory: iac/terraform/cloudflare
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -no-color | tail -30
          rc=${PIPESTATUS[0]}
          echo "POST_PLAN_EXIT=$rc (0=无差异, 2=有差异)"
          rm -f imports.auto.tf tfplan
