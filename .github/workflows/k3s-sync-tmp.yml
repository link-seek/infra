name: k3s-sync-tmp
# 一次性：HW21 谢钰程卷 → k3s opencode-xieyucheng pod。用完即删（swr-probe 同款惯例）。
# 只搬 prod-work/prod-data；tailscale-state 不搬（新身份已 up，搬了就撞车）。
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: join tailnet (user, mint-only)
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          CODE="$(curl -sS -m 30 -o /tmp/mint.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":3600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys)"
          echo "mint http=$CODE"
          MINTED="$(python3 -c "import json; print(json.load(open('/tmp/mint.json')).get('key',''))")"
          [ "$CODE" = 200 ] || { echo "mint body:"; head -c 300 /tmp/mint.json; echo; exit 1; }
          [ -n "$MINTED" ] || { echo "FAIL: CI key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-sync-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          tailscale ip -4
      - name: sync HW21 volumes to k3s pod
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          H21="ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key -o StrictHostKeyChecking=no root@100.91.222.51"
          S69="sudo tailscale ssh root@100.93.119.21"
          NS=opencode-xieyucheng
          echo "== HW21 -> runner (1.2G 级别，一次性） =="
          $H21 "tar czf - -C /opt/docker/volumes opencode-prod_prod-work/_data opencode-prod_prod-data/_data" > /tmp/xyc.tgz
          ls -la /tmp/xyc.tgz
          echo "== runner -> .69 =="
          $S69 "cat > /tmp/xyc.tgz" < /tmp/xyc.tgz
          echo "== .69 -> pod =="
          POD="$($S69 "kubectl -n $NS get pod -l app=opencode -o jsonpath='{.items[0].metadata.name}'")"
          [ -n "$POD" ] || { echo "FAIL: pod not found"; exit 1; }
          echo "pod=$POD"
          $S69 "kubectl -n $NS cp /tmp/xyc.tgz $POD:/tmp/xyc.tgz -c opencode"
          $S69 "kubectl -n $NS exec deploy/opencode -c opencode -- sh -c 'tar xzf /tmp/xyc.tgz --strip-components=2 -C /workspace opencode-prod_prod-work/_data && tar xzf /tmp/xyc.tgz --strip-components=2 -C /root/.local/share/opencode opencode-prod_prod-data/_data && rm -f /tmp/xyc.tgz && du -sh /workspace /root/.local/share/opencode'"
          echo "== 清理 =="
          rm -f /tmp/xyc.tgz
          $S69 "rm -f /tmp/xyc.tgz" || true
          echo SYNC-DONE
