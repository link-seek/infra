name: test-opendesign

# OD 收编栈的门：schema（秒级）+ boot e2e（分钟级）+ OD 对话三件套（建 project→run→轮询：单聊＋切模型＋多轮＋免费档）。
# 全程在 runner（dummy 密钥＋org 真 key 仅免费档），不碰生产。Pin 精确字节由 deploy pull 锁定。
on:
  pull_request:
    paths:
      - stacks/opendesign/**
      - .github/workflows/test-opendesign.yml
  push:
    branches: [main]
    paths:
      - stacks/opendesign/**
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Schema gate（digest pin＋无真值＋watchtower 已摘）
        run: |
          python3 - <<'EOF'
          import re, sys
          S = "stacks/opendesign"
          bad = 0
          comp = open(f"{S}/compose.yml").read()
          imgs = re.findall(r"^\s*image:\s*(\S+)", comp, re.M)
          assert len(imgs) == 1, f"期望 1 个 image，实际 {imgs}"
          img = imgs[0]
          if "@sha256:" not in img:
              print(f"FAIL: {img} 不是 digest pin"); bad += 1
          else:
              print(f"OK pin: {img[:70]}...")
          if re.search(r":latest(@|$|\s)", img):
              print("FAIL: 用了 latest"); bad += 1
          if "watchtower.enable" in comp.lower():
              print("FAIL: watchtower label 未摘"); bad += 1
          else:
              print("OK: watchtower 已摘")
          if re.search(r"OD_API_TOKEN=(?!\$\{)", comp) or re.search(r"LITELLM_API_KEY=(?!\$\{)", comp):
              print("FAIL: compose 含明文 key 赋值"); bad += 1
          else:
              print("OK: compose 无明文 key（全 ${VAR} 引用）")
          env = open(f"{S}/.env.example").read()
          for k in ("OD_API_TOKEN=", "OD_ALLOWED_ORIGINS=", "OD_ALLOWED_INTERNAL_HOSTS=",
                    "LITELLM_BASE_URL=", "LITELLM_API_KEY="):
              if k not in env:
                  print(f"FAIL: .env.example 缺 {k}"); bad += 1
          for pat in (r"sk-[A-Za-z0-9\-_]{16,}", r"ghp_[A-Za-z0-9]+", r"tskey-[A-Za-z0-9_\-]+"):
              if re.search(pat, env):
                  print(f"FAIL: .env.example 命中真值模式 {pat}"); bad += 1
          print("OK: .env.example 键位齐且无真值")
          # 卷复用声明必须在（丢卷=丢 OD 全量数据）
          if "name: opendesign_od-data" not in comp:
              print("FAIL: 卷未显式同名复用"); bad += 1
          else:
              print("OK: 卷显式复用现网卷")
          sys.exit(1 if bad else 0)
          EOF

      - name: compose config 合法性（不拉镜像，只渲染）
        run: |
          cd stacks/opendesign
          sed -e 's#^ *- /root/opendesign/home:.*#      - /tmp/odtest-home:/home/open-design#' compose.yml > /tmp/odtest-compose.yml
          mkdir -p /tmp/odtest-home
          printf 'OD_API_TOKEN=dummy\nOD_ALLOWED_ORIGINS=https://example.invalid\nOD_ALLOWED_INTERNAL_HOSTS=127.0.0.1\nLITELLM_BASE_URL=http://127.0.0.1:4000\nLITELLM_API_KEY=dummy\n' > /tmp/odtest.env
          # env_file 指令按 project 目录（/tmp）解析，需同名文件存在：
          cp /tmp/odtest.env /tmp/.env
          docker compose -f /tmp/odtest-compose.yml --env-file /tmp/odtest.env config >/dev/null && echo "OK: compose config 合法"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Boot 验证（GHCR 同版构建，dummy 密钥，存活＋应答即活）
        run: |
          # 同 tag 在 GHCR/SWR 是两次构建（digest 不同，run 38830435447 实证），线上跑的是 SWR 那份
          #（生产本身即该字节的存活证明）；此处用 GHCR 版验证 compose/env/启动逻辑，精确字节由 deploy pull 锁定。
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u xieyucheng123 --password-stdin
          IMG="ghcr.io/link-seek/opendesign:0.24.1-oc2.0.6"
          docker pull -q "$IMG"
          # agent 要写 home(/home/open-design)与工作区(/app/.od)：CI 用 /tmp 绑定＋777（一次性，跑完即焚；生产是具名卷＋固定属主）
          mkdir -p /tmp/odtest-home /tmp/odtest-od && chmod 777 /tmp/odtest-home /tmp/odtest-od
          docker run -d --name od-e2e --network host \
            -v /tmp/odtest-home:/home/open-design -v /tmp/odtest-od:/app/.od \
            -e OD_API_TOKEN=dummy-token -e OD_ALLOWED_ORIGINS=https://example.invalid \
            -e OD_ALLOWED_INTERNAL_HOSTS=127.0.0.1 \
            -e LITELLM_BASE_URL=http://127.0.0.1:4000 -e LITELLM_API_KEY=dummy \
            -e OD_BIND_HOST=0.0.0.0 -e OD_PORT=7457 \
            "$IMG"
          PASS=0
          for i in $(seq 1 18); do
            CODE="$(curl -s -m 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:7457/ || echo 000)"
            echo "boot-probe#$i -> $CODE"
            # 存活即过：GHCR 重构建版 / 回 200（UI），线上 SWR 版回 401（认证门）——构建不同行为不同；
            # 部署物（SWR）的 401 语义由 deploy-opendesign 在线上验。此处只证明 compose/env/启动链全通。
            case "$CODE" in 200|401|403|404) PASS=1; break;; esac
            sleep 10
          done
          echo "===== / 响应体采样（脱敏，供行为对账） ====="
          curl -s -m 8 http://127.0.0.1:7457/ | sed -E -e 's/(sk-[A-Za-z0-9\-_]{6})[A-Za-z0-9\-_]+/\1<redacted>/g' | head -c 400; echo
          docker logs od-e2e --tail 8 || true
          # 容器必须还活着（非 crashloop）；不删，留给后面对话三件套用，最后统一清理
          docker ps --filter name=od-e2e --format '{{.Status}}' | grep -q "Up" && echo "OK: 容器存活" || { echo "FAIL: 容器已死"; PASS=""; }
          [ -n "$PASS" ] && echo "E2E OK: 应用应答＋存活（dummy key）" || { echo "FAIL: 3 分钟无 HTTP 应答或已死"; exit 1; }

      - name: Start backend（ollama＋litellm，OD 的 byok 后端）
        env:
          GO_BACKEND_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          docker run -d --name ollama --network host \
            -v ollama-data:/root/.ollama -e OLLAMA_HOST=0.0.0.0:11434 \
            ollama/ollama:0.40.3
          for i in $(seq 1 30); do
            curl -sf --max-time 5 http://127.0.0.1:11434/ >/dev/null && break
            sleep 5
          done
          docker exec ollama ollama pull qwen3:8b
          pip install pyyaml -q 2>/dev/null || true
          # CI 网关 = 生产 config 原样复用＋测试条目（口径唯一，不另起影子配置）
          # 生产 6 条（透明代理）＋ test-chat/test-chat-b（ollama 本地零花钱）＋ free-probe-a（真 key 免费档）
          python3 - <<'EOF'
          import yaml
          d = yaml.safe_load(open("stacks/litellm-gateway/config/litellm_config.yaml"))
          gs = d.get("general_settings", {})
          gs.pop("user_custom_auth", None)
          gs.pop("dangerously_permit_weak_or_unset_master_key", None)
          d.get("litellm_settings", {}).pop("callbacks", None)
          test_entries = [
              {"model_name": "test-chat",
               "litellm_params": {"model": "ollama/qwen3:8b",
                                  "api_base": "http://127.0.0.1:11434", "timeout": 180}},
              {"model_name": "test-chat-b",
               "litellm_params": {"model": "ollama/qwen3:8b",
                                  "api_base": "http://127.0.0.1:11434", "timeout": 180}},
              # OD 会给部分 byok 模型加 open-design-byok/ 前缀（run 38850031800 实证），网关侧同上游双注册
              {"model_name": "open-design-byok/test-chat",
               "litellm_params": {"model": "ollama/qwen3:8b",
                                  "api_base": "http://127.0.0.1:11434", "timeout": 180}},
              {"model_name": "open-design-byok/test-chat-b",
               "litellm_params": {"model": "ollama/qwen3:8b",
                                  "api_base": "http://127.0.0.1:11434", "timeout": 180}},
              {"model_name": "free-probe-a",
               "litellm_params": {"model": "openai/deepseek-v4.1-flash-free",
                                  "api_base": "https://opencode.ai/inference/openai/v1",
                                  "api_key": "os.environ/GO_BACKEND_KEY", "timeout": 120}},
              {"model_name": "open-design-byok/free-probe-a",
               "litellm_params": {"model": "openai/deepseek-v4.1-flash-free",
                                  "api_base": "https://opencode.ai/inference/openai/v1",
                                  "api_key": "os.environ/GO_BACKEND_KEY", "timeout": 120}}]
          have = {m["model_name"] for m in d["model_list"]}
          d["model_list"].extend([e for e in test_entries if e["model_name"] not in have])
          open("/tmp/litellm-od.yaml", "w").write(yaml.safe_dump(d))
          print(f"backend render OK: base={len(d['model_list'])-len(test_entries)} + test={len(test_entries)}")
          print("===== 渲染产物核验（key 打码） =====")
          import re as _re
          _txt = open("/tmp/litellm-od.yaml").read()
          _txt = _re.sub(r'(api_key:\s*)\S+', r'\\1<redacted>', _txt)
          print(_txt[:2500])
          print("===== 渲染产物校验（形态门） =====")
          assert "user_custom_auth" in _txt, "缺 user_custom_auth"
          assert "passthrough" in _txt, "缺 passthrough callback"
          print("config 形态 OK")
          EOF
          PIN="$(grep -oP '^\s*image:\s*\K\S+litellm@\S+' stacks/litellm-gateway/compose.yml | head -n1)"
          # 与生产一字不差的启动路径：不用手拼 docker run，直接用仓里 compose（project 名隔离避免卷名冲突）
          mkdir -p /tmp/odstack/config /tmp/odstack/guard
          cp /tmp/litellm-od.yaml /tmp/odstack/config/litellm_config.yaml
          cp $PWD/stacks/litellm-gateway/guard/*.py $PWD/stacks/litellm-gateway/guard/*.json /tmp/odstack/guard/ 2>/dev/null || true
          ls /tmp/odstack/guard/
          cat > /tmp/odstack/.env <<ENVEOF
          GO_BACKEND_KEY=$GO_BACKEND_KEY
          LITELLM_MASTER_KEY=test-only
          DISABLE_ADMIN_UI=True
          RULES_FILE=/app/guard-rules.json
          ENVEOF
          sed -e 's#\./config/litellm_config.yaml#/tmp/odstack/config/litellm_config.yaml#' \
              -e 's#\./guard/#/tmp/odstack/guard/#g' \
              -e 's#container_name: litellm-guard#container_name: litellm-od#' \
              -e 's#name: litellm-gateway#name: litellm-odtest#' \
              -e 's#litellm-guard_default#litellm-odtest_default#' \
              -e 's#- "172\.17\.0\.1:4000:4000"#- "127.0.0.1:4000:4000"#' \
              -e 's#- "172\.19\.0\.1:4000:4000"##' \
              stacks/litellm-gateway/compose.yml > /tmp/odstack/compose.yml
          # CI runner 无 HW21 的 docker 网桥 IP（172.17/19.0.1）：生產三绑改单绑 127.0.0.1，生产 compose 不动
          # ollama 服务 CI 另起，这里只留 litellm-guard
          python3 -c "import yaml; d=yaml.safe_load(open('/tmp/odstack/compose.yml')); d['services']={'litellm-guard':d['services']['litellm-guard']}; yaml.safe_dump(d, open('/tmp/odstack/compose.yml','w'))"
          cd /tmp/odstack && docker compose up -d
          for i in $(seq 1 24); do
            curl -sf --max-time 5 http://127.0.0.1:4001/v1/models -H "Authorization: Bearer test-only" >/dev/null 2>&1 && break
            sleep 5
          done
          echo "OK: backend 就绪（ollama＋litellm:4001，compose 启动＝生产同路径）"
          echo "===== litellm-od 启动日志头80行（callback/guard load 实证） ====="
          docker logs litellm-od 2>&1 | head -80
          echo "===== 启动日志结束 ====="

      - name: OD 对话三件套（建 project→run→轮询→断言：单聊＋切模型＋多轮）
        env:
          GO_BACKEND_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -u
          OD="http://127.0.0.1:7457"; AUTH="Authorization: Bearer dummy-token"
          FAIL=""
          # 建 project（每个模型独立 project = 独立默认 conversation；OD 疑似按 conversation 缓存 provider 配置，
          # 同会话换模型会被拒 no-route（run 38852669994 事件流实证）；多轮靠默认会话延续不显式传 conversationId）
          mkproject() {
            local _pid="od-ci-$GITHUB_RUN_ID-$1"
            local _pc
            _pc="$(curl -s -m 15 -o /dev/null -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"id\":\"$_pid\",\"name\":\"CI conv $_pid\"}" "$OD/api/projects" || echo 000)"
            echo "$_pc" >&2; echo "$_pid"
          }
          tstat() { # $1=runId $2=marker：解码转录本；设 TSTAT_TEXT/TSTAT_MARK 全局量并打印（json 转义中文故须解码后找）
            local _out
            _out="$(docker exec od-e2e sh -c "cat /app/.od/runs/$1/events.jsonl 2>/dev/null" | python3 -c "
          import json,sys
          tl=0; mk=0; want=sys.argv[1]
          for line in sys.stdin:
              try: o=json.loads(line)
              except: continue
              st=[o]
              while st:
                  x=st.pop()
                  if isinstance(x,dict): st.extend(x.values())
                  elif isinstance(x,list): st.extend(x)
                  elif isinstance(x,str):
                      t=x.strip()
                      if len(t)>20: tl+=len(t)
                      if want and want in t: mk=1
          print(f'textlen={tl} marker={mk}')" "$2" 2>/dev/null || echo "textlen=-1 marker=0")"
            TSTAT_TEXT="$(echo "$_out" | grep -oP 'textlen=\K-?\d+')"
            TSTAT_MARK="$(echo "$_out" | grep -oP 'marker=\K[01]')"
            echo "transcript: textlen=$TSTAT_TEXT marker=$TSTAT_MARK"
          }
          PID="$(mkproject base)"
          echo "project: $PID (mkproject http code above)"
          do_run() {
            local _pj="$1" _model="$2" _msg="$3"
            local _rid="req-$(cat /proc/sys/kernel/random/uuid)"
            curl -s -m 15 -H "$AUTH" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg p "$_pj" --arg r "$_rid" --arg m "$_msg" --arg mo "$_model" \
                '{projectId:$p, clientRequestId:$r, message:$m, agentId:"byok-opencode", model:$mo,
                  byokProvider:{protocol:"openai", apiKey:"test-only", baseUrl:"http://127.0.0.1:4001/v1", model:$mo}}')" \
              "$OD/api/runs" || echo '{"error":"CURLFAIL"}'
          }
          poll_run() {
            local _rid="$1" _st="?"
            for i in $(seq 1 30); do
              sleep 10
              curl -s -m 15 -H "$AUTH" "$OD/api/runs/$_rid" > /tmp/odrun.json 2>/dev/null || continue
              _st="$(python3 -c "import json; print(json.load(open('/tmp/odrun.json')).get('status','?'))" 2>/dev/null || echo ?)"
              echo "poll#$i -> $_st" >&2
              case "$_st" in succeeded|failed|canceled) break;; esac
            done
            echo "$_st"
          }
          redact() { sed -E -e 's/(sk-[A-Za-z0-9\-_]{6})[A-Za-z0-9\-_]+/\1<redacted>/g' -e 's/(Bearer )[A-Za-z0-9\-_\.]+/\1<redacted>/g'; }
          dump_run() { # $1=label：全量 run JSON＋agent 事件尾（脱敏，定位用）
            echo "===== $1 run JSON（截断脱敏） ====="
            python3 -c "import json; d=json.load(open('/tmp/odrun.json')); print(json.dumps({k:d.get(k) for k in ('id','status','error','errorCode','conversationId','assistantMessageId','deliverableValid','deliverableEntryFile','model','agentId')}, ensure_ascii=False)[:800])" 2>/dev/null || echo "(parse fail)"
            echo "===== $1 agent 事件头（脱敏，看发给 CLI 的精确模型串） ====="
            _rid="$(python3 -c "import json; print(json.load(open('/tmp/odrun.json')).get('id',''))" 2>/dev/null)"
            if [ -n "$_rid" ]; then
              docker exec od-e2e sh -c "head -c 2000 /app/.od/runs/$_rid/events.jsonl 2>/dev/null || echo '(无 events 文件)'" | redact | head -c 2000; echo
              echo "===== $1 agent 事件尾（脱敏） ====="
              docker exec od-e2e sh -c "tail -c 2000 /app/.od/runs/$_rid/events.jsonl 2>/dev/null || echo '(无 events 文件)'" | redact | head -c 2000; echo
              echo "===== $1 transcript 统计（解码后） ====="
              docker exec od-e2e sh -c "cat /app/.od/runs/$_rid/events.jsonl 2>/dev/null" | python3 -c "
          import json,sys,re
          tl=0; hits={}
          for line in sys.stdin:
              try: o=json.loads(line)
              except: continue
              st=[o]
              while st:
                  x=st.pop()
                  if isinstance(x,dict): st.extend(x.values())
                  elif isinstance(x,list): st.extend(x)
                  elif isinstance(x,str):
                      t=x.strip()
                      if len(t)>20: tl+=len(t)
                      for m in re.findall(r'OD-[A-Z-]+|7421', t): hits[m]=hits.get(m,0)+1
          print(f'textlen={tl} markers={hits}')" 2>/dev/null || echo "(transcript 统计失败)"
            fi
          }
          restart_od() { # 全新 daemon＋全新数据目录（provider 目录缓存在磁盘 /app/.od，重启不丢；首模型写死，后续 no-route，见 run 38855641126＋CLI ModelResolver 源码）
            rm -rf /tmp/odtest-home /tmp/odtest-od && mkdir -p /tmp/odtest-home /tmp/odtest-od && chmod 777 /tmp/odtest-home /tmp/odtest-od
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u xieyucheng123 --password-stdin 2>&1 | tail -1
            IMG_OD="ghcr.io/link-seek/opendesign:0.24.1-oc2.0.6"
            docker rm -f od-e2e >/dev/null 2>&1 || true
            sleep 3
            docker run -d --name od-e2e --network host \
              -v /tmp/odtest-home:/home/open-design -v /tmp/odtest-od:/app/.od \
              -e OD_API_TOKEN=dummy-token -e OD_ALLOWED_ORIGINS=https://example.invalid \
              -e OD_ALLOWED_INTERNAL_HOSTS=127.0.0.1 \
              -e LITELLM_BASE_URL=http://127.0.0.1:4000 -e LITELLM_API_KEY=dummy \
              -e OD_BIND_HOST=0.0.0.0 -e OD_PORT=7457 \
              "$IMG_OD"
            for i in $(seq 1 24); do
              curl -sf --max-time 5 http://127.0.0.1:7457/ >/dev/null 2>&1 && break
              sleep 5
            done
            echo "od restarted: $(docker inspect od-e2e --format '{{.Created}} {{.Image}}' | cut -c1-60)"
          }
          # Phase A 单聊（boot daemon，test-chat；门=成功＋实质文本，marker 仅记录）
          R1="$(do_run "$PID" test-chat "reply with exactly: OD-CONV-OK")"
          RID1="$(echo "$R1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('runId',''))" 2>/dev/null)"
          echo "run1: ${RID1:0:12}..."
          if [ -n "$RID1" ]; then
            ST1="$(poll_run "$RID1")"
            tstat "$RID1" "OD-CONV-OK"
            echo "### OD 单聊: status=$ST1 textlen=$TSTAT_TEXT marker=$TSTAT_MARK"
            if [ "$ST1" = "succeeded" ] && [ "${TSTAT_TEXT:--1}" -ge 200 ]; then
              echo "OK: OD 单聊（test-chat，事件流有实质文本）"
            else
              echo "FAIL: 单聊 status=$ST1"; dump_run 单聊; FAIL="$FAIL; OD 单聊失败($ST1)"
            fi
          else
            echo "FAIL: run1 未返回 runId"; FAIL="$FAIL; 单聊未受理"
          fi
          # Phase B 切模型（全新 daemon＋新 project；provider 疑似按 daemon 缓存首个模型）
          restart_od
          PID2="$(mkproject switch)"
          echo "project2: $PID2"
          R2="$(do_run "$PID2" test-chat-b "reply with exactly: OD-SWITCH-OK")"
          RID2="$(echo "$R2" | python3 -c "import json,sys; print(json.load(sys.stdin).get('runId',''))" 2>/dev/null)"
          echo "run2: ${RID2:0:12}..."
          if [ -n "$RID2" ]; then
            ST2="$(poll_run "$RID2")"
            tstat "$RID2" "OD-SWITCH-OK"
            echo "### OD 切模型: status=$ST2 textlen=$TSTAT_TEXT marker=$TSTAT_MARK"
            if [ "$ST2" = "succeeded" ] && [ "${TSTAT_TEXT:--1}" -ge 200 ]; then
              echo "OK: OD 切模型（test-chat-b，新 daemon，实质文本回环）"
            else
              echo "FAIL: 切模型 status=$ST2"; dump_run 切模型; FAIL="$FAIL; OD 切模型失败($ST2)"
            fi
          else
            echo "FAIL: run2 未返回 runId"; FAIL="$FAIL; 切模型未受理"
          fi
          # Phase D 多轮（全新 daemon＋新 project；turn2 必须原样召回 7421）
          restart_od
          PIDM="$(mkproject multi)"
          echo "project-multi: $PIDM"
          R3="$(do_run "$PIDM" test-chat "记住这个数字：7421，收到只回复：记住了")"
          RID3="$(echo "$R3" | python3 -c "import json,sys; print(json.load(sys.stdin).get('runId',''))" 2>/dev/null)"
          ST3="skip"; [ -n "$RID3" ] && ST3="$(poll_run "$RID3")"
          echo "turn1: $ST3"
          R4="$(do_run "$PIDM" test-chat "我让你记的数字是多少？只回复数字")"
          RID4="$(echo "$R4" | python3 -c "import json,sys; print(json.load(sys.stdin).get('runId',''))" 2>/dev/null)"
          ST4="skip"; [ -n "$RID4" ] && ST4="$(poll_run "$RID4")"
          if [ -n "$RID4" ]; then
            tstat "$RID4" "7421"
            echo "### OD 多轮 turn2: status=$ST4 textlen=$TSTAT_TEXT marker=$TSTAT_MARK"
          fi
          if [ "$ST4" = "succeeded" ] && [ "$TSTAT_MARK" = "1" ]; then
            echo "OK: OD 多轮（同 project 默认会话，7421 召回）"
          else
            echo "FAIL: 多轮 turn2 status=$ST4"; dump_run 多轮; FAIL="$FAIL; OD 多轮失败($ST4)"
          fi
          # Phase C 免费档（全新 daemon＋新 project；flash 模型要求 marker 精确命中）
          if [ -n "$GO_BACKEND_KEY" ]; then
            restart_od
            PIDF="$(mkproject free)"
            echo "project-free: $PIDF"
            RF="$(curl -s -m 15 -H "$AUTH" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg p "$PIDF" --arg r "req-$(cat /proc/sys/kernel/random/uuid)" \
                --arg k "$GO_BACKEND_KEY" \
                '{projectId:$p, clientRequestId:$r, message:"reply with exactly: OD-FREE-OK",
                  agentId:"byok-opencode", model:"free-probe-a",
                  byokProvider:{protocol:"openai", apiKey:$k, baseUrl:"http://127.0.0.1:4001/v1", model:"free-probe-a"}}')" \
              "$OD/api/runs" | python3 -c "import json,sys; print(json.load(sys.stdin).get('runId',''))" 2>/dev/null)"
            echo "run-free: ${RF:0:12}..."
            if [ -n "$RF" ]; then
              STF="$(poll_run "$RF")"
              tstat "$RF" "OD-FREE-OK"
              echo "### OD 免费档: status=$STF textlen=$TSTAT_TEXT marker=$TSTAT_MARK"
              if [ "$STF" = "succeeded" ] && [ "$TSTAT_MARK" = "1" ]; then
                echo "OK: OD 免费档（free-probe-a 真 key，marker 精确命中）"
              else
                echo "FAIL: 免费档 status=$STF"; dump_run 免费档; FAIL="$FAIL; OD 免费档失败($STF)"
              fi
            else
              FAIL="$FAIL; 免费档未受理"
            fi
          else
            echo "SKIP: OPENCODE_API_KEY 未配，免费档跳过"
          fi

      - name: 网关透传验证（透明代理语义：无 key 200＋有效 key 200＋无效 key 上游 401）
        env:
          UNIFIED_API_KEY: ${{ secrets.UNIFIED_API_KEY }}
        run: |
          PASS=1
          C2="$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:4001/v1/models || echo 000)"
          echo "gw-no-key: $C2 (expect 200)"; [ "$C2" = "200" ] || PASS=0
          CC="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $UNIFIED_API_KEY" -H 'Content-Type: application/json' -d '{"model":"test-chat","messages":[{"role":"user","content":"hi"}],"max_tokens":5}' http://127.0.0.1:4001/v1/chat/completions || echo 000)"
          echo "gw-chat-valid: $CC (expect 200)"; [ "$CC" = "200" ] || PASS=0
          IC="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer sk-invalid-test" -H 'Content-Type: application/json' -d '{"model":"test-chat","messages":[{"role":"user","content":"hi"}],"max_tokens":5}' http://127.0.0.1:4001/v1/chat/completions || echo 000)"
          echo "gw-chat-invalid: $IC (expect 401 from upstream)"; [ "$IC" = "401" ] || PASS=0
          [ "$PASS" = "1" ] && echo "GW-PASSTHROUGH OK" || { echo "FAIL: 网关透传语义不对"; exit 1; }

      - name: 清理（成功失败都删）
        if: always()
        run: |
          docker rm -f od-e2e litellm-od ollama >/dev/null 2>&1 || true
          echo "cleanup done"

      - name: Pin 可拉取性（需 SWR 凭证；缺则跳过）
        env:
          SWR_U: ${{ secrets.SWR_LOGIN_USER }}
          SWR_P: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          if [ -z "$SWR_U" ] || [ -z "$SWR_P" ]; then
            echo "SKIP: SWR 凭证未配（P1 欠账）；pin 精确字节生产正在跑（存活证明），deploy pull 失败即停（fail-fast 兜底）"
            exit 0
          fi
          echo "$SWR_P" | docker login swr.cn-north-9.myhuaweicloud.com -u "$SWR_U" --password-stdin
          PIN="$(grep -oP '^\s*image:\s*\K\S+opendesign@\S+' stacks/opendesign/compose.yml | head -n1)"
          docker pull -q "$PIN" && echo "OK: pin 精确可拉取"
