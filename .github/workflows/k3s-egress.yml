name: k3s-egress
# 东京出海（SNI 路由，k8s 版 app connector）：hostNetwork DaemonSet 钉 vm-proxy，
# TLS 端到端透传。网关 pod 用 hostAliases 指中继 tailnet IP（零网关配置变更）。
# 用法：dispatch 一次 mode=deploy（下发+验证+清旧中转）；之后每天只 verify。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy=下发+验证+清旧中转；verify=只验"
        required: false
        default: "deploy"
  schedule:
    - cron: "17 2 * * *"
concurrency:
  group: k3s-egress
  cancel-in-progress: false
jobs:
  egress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: runner 进 tailnet（ephemeral CI 身份）
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:guest"]}}},"expirySeconds":21600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))")"
          [ -n "$MINTED" ] || { echo "FAIL: CI key mint 失败"; exit 1; }
          echo "::add-mask::$MINTED"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-egress-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
      - name: 下发（namespace+conf+DaemonSet）
        if: inputs.mode == 'deploy'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          tar czf /tmp/egress.tgz k8s/egress
          scp -P 2244 -i ~/.ssh/ci_key /tmp/egress.tgz root@100.91.222.51:/tmp/egress.tgz < /dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          echo STAGE-fwd
          scp -o BatchMode=yes -o StrictHostKeyChecking=no /tmp/egress.tgz root@192.168.1.69:/tmp/egress.tgz < /dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69 bash -s <<'INNEREOF'
          set -euo pipefail
          rm -rf /tmp/egress && mkdir -p /tmp/egress && tar xzf /tmp/egress.tgz -C /tmp/egress && cd /tmp/egress
          echo STAGE-apply
          kubectl apply -f k8s/egress/namespace.yaml
          kubectl apply -f k8s/egress/nginx-conf.yaml
          kubectl apply -f k8s/egress/daemonset.yaml
          echo STAGE-wait-relay
          for i in $(seq 1 20); do
            sleep 15
            READY="$(kubectl get daemonset -n egress sni-egress -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}' 2>/dev/null || true)"
            echo "relay ready=$READY"
            [ "$READY" = "1/1" ] && break
            [ "$i" = 20 ] && { echo "FAIL: relay pod 未 Ready"; kubectl get pods -n egress -o wide; exit 1; }
          done
          echo EGRESS-APPLY-OK
          INNEREOF
          EOF
      - name: 清旧簇内中转 + coredns 回滚（rewrite 会黑洞，必须拆）
        if: inputs.mode == 'deploy'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          K69="ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69"
          $K69 "kubectl delete deploy -n egress sni-egress --ignore-not-found; kubectl delete svc -n egress sni-egress --ignore-not-found; kubectl delete configmap -n kube-system coredns-custom --ignore-not-found; kubectl delete pod -n default hostpeek hostpeek2 hostpeek3 hostpeek4 hostpeek5 hostpeek6 hostpeek7 hostkill hostverify tokyo-egress-test tokyo-egress-test2 tokyo-egress-test3 tokyo-egress-test4 nginxtest dbgpy dbgpy2 dbgpy3 dbgpod dbgref --force --grace-period=0 2>/dev/null || true; echo OLD-RELAY-REMOVED"
          # coredns 配了 custom 卷，删 key 后必须换 pod 才生效；.41 拉不到镜像，cordon 后删
          $K69 "kubectl cordon ecs-ies-euleros-jmupervm-xieyucheng-langfuse-33b4 && POD=\$(kubectl get pods -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[0].metadata.name}') && kubectl delete pod -n kube-system \$POD --wait=true --timeout=120s && kubectl wait --for=condition=Ready -n kube-system pod -l k8s-app=kube-dns --timeout=180s; kubectl uncordon ecs-ies-euleros-jmupervm-xieyucheng-langfuse-33b4; kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide --no-headers"
          echo COREDNS-RESTORED
          EOF
      - name: 验（宿主机直测中转 + 网关 pod 解析回正）
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -H 100.91.222.51 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2244 -i ~/.ssh/ci_key root@100.91.222.51 bash -s <<'EOF'
          set -euo pipefail
          K69="ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no root@192.168.1.69"
          echo "== 宿主机经 tailnet IP 直测中转 14443（SNI=opencode.ai，之前直连 403） =="
          CODE="$($K69 "curl -s -m 20 -o /dev/null -w '%{http_code}' --resolve opencode.ai:14443:100.73.221.121 https://opencode.ai:14443/")"
          echo "relay https opencode.ai => http=$CODE"
          [ "$CODE" = "200" ] || { echo "FAIL: 中转不通（want 200）"; exit 1; }
          echo "== coredns 回滚确认（pod 应解析到公网 IP，不再是 ClusterIP） =="
          GOT="$($K69 "kubectl exec -n opencode deploy/opencode -c opencode -- python3 -c \"import socket;print(socket.gethostbyname('opencode.ai'))\" 2>/dev/null | tail -1")"
          echo "pod resolves opencode.ai => $GOT"
          case "$GOT" in 10.43.*) echo "FAIL: rewrite 还在"; exit 1;; esac
          echo EGRESS-VERIFY-DONE
          EOF
