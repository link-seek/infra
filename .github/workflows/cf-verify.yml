name: cf-verify（CF_PARENT_TOKEN 一次性验证）

# 一次性验证，不常驻、不注入 agent workflow。
# 只验：account/user 两路 permission_groups 可列性、试签 account/user-owned token、
# DELETE 测试 token、Workers AI 作用域是否存在。
# 铁律：token 值不落盘、不回显；日志只出 status / count / id 前缀。
# 验证完即删本文件（见 issue）。

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "已知 account ID（公开标识，默认镜像配置里那个），提供则跳过自动发现"
        required: false
        default: "47ce24ced58f17c9fb15351adcbe67d4"
      zone_id:
        description: "zone ID（可选；不提供则测试 policy 用账号下全 zone 通配）"
        required: false
        default: ""

concurrency:
  group: cf-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
    steps:
      - name: Mask parent token
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "${CF_PARENT_TOKEN:-}" | tr -d '\r\n ')"
          echo "::add-mask::$TOKEN"
          if [ -z "$TOKEN" ]; then
            echo "PARENT_TOKEN_MISSING"
            exit 1
          fi
          echo "parent_token_present=true"

      - name: Verify permission groups / sign / delete / Workers AI scope
        env:
          ACCOUNT_ID_OVERRIDE: ${{ inputs.account_id }}
          ZONE_ID_OVERRIDE: ${{ inputs.zone_id }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "${CF_PARENT_TOKEN:-}" | tr -d '\r\n ')"
          CF_PARENT_TOKEN_SANITIZED="$TOKEN" ACCOUNT_ID_OVERRIDE="${ACCOUNT_ID_OVERRIDE:-}" ZONE_ID_OVERRIDE="${ZONE_ID_OVERRIDE:-}" python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          BASE = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ["CF_PARENT_TOKEN_SANITIZED"]
          ZONE_NAME = "xieyucheng.top"
          ACCOUNT_ID_OVERRIDE = os.environ.get("ACCOUNT_ID_OVERRIDE", "").strip()
          ZONE_ID_OVERRIDE = os.environ.get("ZONE_ID_OVERRIDE", "").strip()
          RESOURCES = {}


          def call(method, path, body=None):
              headers = {"Authorization": "Bearer " + TOKEN}
              data = None
              if body is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(body).encode()
              req = urllib.request.Request(
                  BASE + path, data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status = resp.status
                      raw = resp.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read()
              except Exception as exc:
                  return 0, {
                      "success": False,
                      "errors": [{"code": "transport", "message": type(exc).__name__}],
                  }
              if not raw:
                  parsed = {}
              else:
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {
                          "success": False,
                          "errors": [{"code": "non_json", "message": ""}],
                      }
              return status, parsed


          def brief(resp):
              errs = resp.get("errors") or []
              if not errs:
                  return ""
              err = errs[0] or {}
              return " code=%s" % (err.get("code", "?"),)


          def result_list(resp):
              result = resp.get("result")
              return result if isinstance(result, list) else []


          def pfx(value, width=8):
              return str(value or "")[:width]


          def get_groups(path):
              all_groups = []
              page = 1
              last_status = 0
              last_resp = {}
              while True:
                  sep = "&" if "?" in path else "?"
                  status, resp = call(
                      "GET", path + sep + "per_page=50&page=" + str(page)
                  )
                  last_status, last_resp = status, resp
                  groups = result_list(resp)
                  all_groups.extend(groups)
                  info = resp.get("result_info") or {}
                  total_pages = info.get("total_pages")
                  total_count = info.get("total_count")
                  if total_pages is not None:
                      more = page < int(total_pages)
                  elif total_count is not None:
                      more = len(all_groups) < int(total_count)
                  else:
                      more = False
                  if not more or not groups or page >= 50:
                      break
                  page += 1
              return last_status, last_resp, all_groups


          def find_group(groups, wanted):
              for group in groups:
                  if str(group.get("name", "")).strip().lower() == wanted.lower():
                      return group
              return None


          def sign(scope, groups):
              if not RESOURCES:
                  return 0, " code=missing_scope", ""
              dns = find_group(groups, "DNS Read")
              zone = find_group(groups, "Zone Read")
              if not dns or not zone:
                  return 0, " code=missing_group msg=dns=%s zone=%s" % (
                      bool(dns),
                      bool(zone),
                  ), ""
              body = {
                  "name": "cf-verify-" + os.environ.get("GITHUB_RUN_ID", "local"),
                  "policies": [
                      {
                          "effect": "allow",
                          "resources": RESOURCES,
                          "permission_groups": [
                              {"id": dns.get("id")},
                              {"id": zone.get("id")},
                          ],
                      }
                  ],
                  "expires_on": (
                      datetime.now(timezone.utc) + timedelta(hours=1)
                  ).strftime("%Y-%m-%dT%H:%M:%SZ"),
              }
              path = (
                  "/accounts/%s/tokens" % account_id
                  if scope == "account"
                  else "/user/tokens"
              )
              status, resp = call("POST", path, body)
              if resp.get("success"):
                  token_id = str((resp.get("result") or {}).get("id") or "")
                  return status, "", token_id
              return status, brief(resp), ""


          def main():
              global account_id, zone_id, RESOURCES

              print("== a. account / zone ==")
              if ACCOUNT_ID_OVERRIDE:
                  print("discovery=skipped (override)")
                  account_id = ACCOUNT_ID_OVERRIDE
                  zone_id = ZONE_ID_OVERRIDE
                  accounts = []
                  print(
                      "account_id_prefix=%s zone_given=%s"
                      % (pfx(account_id), str(bool(zone_id)).lower())
                  )
              else:
                  st_acc, r_acc = call("GET", "/accounts")
                  accounts = result_list(r_acc)
                  print(
                      "GET /accounts status=%s count=%d%s"
                      % (st_acc, len(accounts), brief(r_acc))
                  )

                  st_zone, r_zone = call("GET", "/zones?name=" + ZONE_NAME)
                  zones = result_list(r_zone)
                  zone = zones[0] if zones else {}
                  zone_id = str(zone.get("id") or "")
                  zone_account = str((zone.get("account") or {}).get("id") or "")
                  print(
                      "GET /zones?name=%s status=%s count=%d zone_id_prefix=%s "
                      "zone_account_prefix=%s%s"
                      % (
                          ZONE_NAME,
                          st_zone,
                          len(zones),
                          pfx(zone_id),
                          pfx(zone_account),
                          brief(r_zone),
                      )
                  )

                  account_id = zone_account
                  if not account_id and len(accounts) == 1:
                      account_id = str(accounts[0].get("id") or "")
                      print("account_source=accounts[0] (zone account unavailable)")
                  if not account_id:
                      print("FAIL: cannot resolve account_id")
                      return 1
                  in_list = any(a.get("id") == account_id for a in accounts)
                  print(
                      "account_in_accounts_list=%s account_id_prefix=%s"
                      % (str(in_list).lower(), pfx(account_id))
                  )
                  if not in_list:
                      print("WARN: zone account not in /accounts result")

              if zone_id:
                  RESOURCES = {"com.cloudflare.api.account.zone." + zone_id: "*"}
                  print("test_policy_scope=single_zone")
              else:
                  RESOURCES = {
                      "com.cloudflare.api.account.%s" % account_id: {
                          "com.cloudflare.api.account.zone.*": "*"
                      }
                  }
                  print("test_policy_scope=account_zone_wildcard")

              print("== b. permission_groups ==")
              st_apg, r_apg, apg = get_groups(
                  "/accounts/%s/tokens/permission_groups" % account_id
              )
              account_pg_ok = st_apg == 200 and bool(r_apg.get("success"))
              print(
                  "account permission_groups status=%s count=%d%s"
                  % (st_apg, len(apg), brief(r_apg))
              )

              st_upg, r_upg, upg = get_groups("/user/tokens/permission_groups")
              user_pg_ok = st_upg == 200 and bool(r_upg.get("success"))
              print(
                  "user permission_groups status=%s count=%d%s"
                  % (st_upg, len(upg), brief(r_upg))
              )

              print("== c. test token sign ==")
              # Fallback：官方文档公开的 group ID（DNS/Zone Read）。若 parent 只有
              # Edit 没 Read（列不出但能签），用它再试一次，避免误判。
              FALLBACK_GROUPS = [
                  {"id": "c8fed203ed3043cba015a93ad1616f1f", "name": "DNS Read"},
                  {"id": "82e64a83756745bbbb1c9c2701bf816b", "name": "Zone Read"},
              ]
              apg_eff = apg if apg else FALLBACK_GROUPS
              upg_eff = upg if upg else FALLBACK_GROUPS
              if not apg:
                  print("note=account_pg_list_denied, sign tries docs-known IDs")
              if not upg:
                  print("note=user_pg_list_denied, sign tries docs-known IDs")
              used = ""
              token_id = ""
              sign_status = 0
              delete_status = 0
              try:
                  if True:
                      sign_status, err, token_id = sign("account", apg_eff)
                      if token_id:
                          used = "account"
                          print(
                              "sign path=account-owned status=%s token_id_prefix=%s"
                              % (sign_status, pfx(token_id))
                          )
                      else:
                          print(
                              "sign path=account-owned status=%s%s"
                              % (sign_status, err)
                          )
                          if not token_id:
                              sign_status, err, token_id = sign("user", upg_eff)
                              if token_id:
                                  used = "user"
                                  print(
                                      "sign path=user-owned status=%s token_id_prefix=%s"
                                      % (sign_status, pfx(token_id))
                                  )
                              else:
                                  print(
                                      "sign path=user-owned status=%s%s"
                                      % (sign_status, err)
                                  )
                          else:
                              print("sign path=user-owned skipped")
                  else:
                      print(
                          "sign path=account-owned skipped (no account permission_groups)"
                      )
                      if upg_eff:
                          sign_status, err, token_id = sign("user", upg_eff)
                          if token_id:
                              used = "user"
                              print(
                                  "sign path=user-owned status=%s token_id_prefix=%s"
                                  % (sign_status, pfx(token_id))
                              )
                          else:
                              print(
                                  "sign path=user-owned status=%s%s"
                                  % (sign_status, err)
                              )
                      else:
                          print("sign path=user-owned skipped (no user permission_groups)")
              finally:
                  print("== d. delete test token ==")
                  if used and token_id:
                      path = (
                          "/accounts/%s/tokens/%s" % (account_id, token_id)
                          if used == "account"
                          else "/user/tokens/%s" % token_id
                      )
                      delete_status, r_del = call("DELETE", path)
                      print(
                          "delete path=%s-owned status=%s%s"
                          % (used, delete_status, brief(r_del))
                      )
                      st_verify, r_verify = call("GET", path)
                      print(
                          "verify_after_delete status=%s%s"
                          % (st_verify, brief(r_verify))
                      )
                  else:
                      print("delete skipped (no token signed)")

              print("== e. Workers AI scope ==")
              found = []
              for source, groups in (("account", apg), ("user", upg)):
                  for group in groups:
                      name = str(group.get("name", ""))
                      if re.search(r"workers\s*ai", name, re.I):
                          found.append((name, str(group.get("id") or ""), source))
              if not found:
                  print("workers_ai_scope=absent")
              else:
                  seen = set()
                  for name, group_id, _source in found:
                      key = (name, group_id)
                      if key in seen:
                          continue
                      seen.add(key)
                      sources = sorted(
                          {
                              src
                              for n, gid, src in found
                              if (n, gid) == key
                          }
                      )
                      print(
                          "workers_ai_scope=present name=%s id_prefix=%s sources=%s"
                          % (name, pfx(group_id), ",".join(sources))
                      )

              print("== summary ==")
              print(
                  "account_pg_listable=%s count=%d"
                  % (str(account_pg_ok).lower(), len(apg))
              )
              print(
                  "user_pg_listable=%s count=%d"
                  % (str(user_pg_ok).lower(), len(upg))
              )
              print("sign_path=%s sign_status=%s" % (used or "none", sign_status))
              print(
                  "delete_status=%s delete_ok=%s"
                  % (
                      delete_status,
                      str(bool(used and 200 <= delete_status < 300)).lower(),
                  )
              )
              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except Exception as exc:
                  print("FAIL: %s" % type(exc).__name__)
                  sys.exit(1)
          PY
