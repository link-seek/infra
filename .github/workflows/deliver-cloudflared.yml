name: deliver-cloudflared
# 快递线（deliver）：只管送达到目标机；镜像内容由商家（docker-images bake-*）负责，不管内容。

# 隧道即代码：只手动 dispatch（备份→只换 ingress 段→restart→验证→失败回滚）。
# 手动点火即闪断窗口（restart 时隧道内现网域名 opendesign 闪断十几秒），挑空闲时间点。
# UUID/credentials 永不进仓：线上 tunnel: 行是锚点，records.json 的 CNAME 目标必须与之一致（fail-closed）。
# 2026-11-04：llm/llm-trial 已下线（ingress/DNS 均摘），锚点仍读 records.json 里保留的 llm-trial 记录。

on:
  workflow_dispatch:

concurrency:
  group: deliver-cloudflared
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 加入 tailnet（一次性节点，用完即焚）
        timeout-minutes: 6
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          TSKEY="$(printf '%s' "${TS_API_KEY:-}" | tr -d '\r\n ')"
          [ -n "$TSKEY" ] || { echo "FAIL: TS_API_KEY 未配"; exit 1; }
          echo "::add-mask::$TSKEY"
          MINT_BODY='{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:user"]}}},"expirySeconds":21600}'
          MINTED="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' -d "$MINT_BODY" https://api.tailscale.com/api/v2/tailnet/-/keys | python3 -c "import json,sys; print(json.load(sys.stdin).get('key',''))" || true)"
          [ -n "$MINTED" ] || { echo "FAIL: 现场 mint 未成功"; exit 1; }
          echo "::add-mask::$MINTED"
          echo "ephemeral key minted（tag:user）"
          timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="ci-tunnel-$GITHUB_RUN_ID" --accept-routes=false --accept-dns=false
          timeout 15 bash -c "</dev/tcp/100.91.222.51/2244" || { echo "target unreachable"; exit 1; }
          echo "target reachable"
          # 注：旧 containment 探针（trial/entry 2244 不可达）已删——trial/entry 角色 S1 即退役；
          # 且旧探针成立的前提是 runner 无任何放行（死 key），身份正常化后恒误杀。真安全靠锚点校验＋备份回滚。

      - name: ingress 上机（备份→合并→restart→验证→失败回滚）
        timeout-minutes: 14
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          NODE="100.91.222.51"; PORT="2244"
          ssh-keyscan -p "$PORT" -H "$NODE" >> ~/.ssh/known_hosts 2>/dev/null
          # 期望的 CNAME 目标（records.json 声明，llm-trial 记录下线后保留作锚点）发上机，线上比对 tunnel: 锚点（fail-closed）
          python3 -c "import json; print([r['content'] for r in json.load(open('dns/records.json'))['records'] if r['name']=='llm-trial.xieyucheng.top'][0])" > /tmp/expect_cname.txt
          cat /tmp/expect_cname.txt
          scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/ci_key \
            edge/cloudflared/hw21-opencode/ingress.yaml \
            "root@$NODE:/tmp/ci-tunnel-ingress.yaml"
          scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/ci_key \
            /tmp/expect_cname.txt \
            "root@$NODE:/tmp/ci-tunnel-expect.txt"
          ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/ci_key root@$NODE bash -s <<'APPLY_EOF'
          set -euo pipefail
          # 隧道上游含 MagicDNS 名（网关独立身份）：保证本机首选 100.100.100.100（deliver-caddy 同款）。
          grep -q '^nameserver 100.100.100.100' /etc/resolv.conf || sed -i '1i nameserver 100.100.100.100' /etc/resolv.conf
          CFG=/etc/cloudflared/config.yml
          cp "$CFG" "$CFG.prev-$(date -u +%Y%m%dT%H%M%SZ)" && echo "backup-ok"
          # 锚点校验：records.json 的 CNAME 目标必须就是线上 tunnel UUID（错隧道即 abort，不动线上）
          LIVE_UUID="$(grep -oP '^tunnel:\s*\K\S+' "$CFG" | head -n1)"
          EXPECT_HOST="$(cat /tmp/ci-tunnel-expect.txt | tr -d '\r\n ')"
          [ "$EXPECT_HOST" = "$LIVE_UUID.cfargotunnel.com" ] || { echo "ABORT: CNAME 目标 $EXPECT_HOST 与线上隧道 $LIVE_UUID 不一致"; exit 1; }
          echo "anchor-ok: tunnel $LIVE_UUID"
          # 只换 ingress 段（UUID/credentials 行原样保留），结构校验
          # 2026-11-03：hw21→LAX QUIC 丢包致公网抖动/涓流（journal: dial timeout/stream canceled），
          # 切 protocol http2（TCP 经得起 UDP 丢包）。cloudflared 支持 protocol: quic/http2/h2mux/auto。
          python3 - "$CFG" "/tmp/ci-tunnel-ingress.yaml" <<'PYEOF'
          import sys, yaml
          cfg_path, ingress_path = sys.argv[1], sys.argv[2]
          cfg = yaml.safe_load(open(cfg_path))
          want = yaml.safe_load(open(ingress_path))["ingress"]
          # 末条允许无 hostname（Cloudflare catch-all 规范）；其余必须 hostname+service 双全
          assert isinstance(want, list) and all("service" in r for r in want), "ingress 声明格式错"
          assert all("hostname" in r for r in want[:-1]), "ingress 声明格式错（末条外缺 hostname）"
          cfg["ingress"] = want
          cfg["protocol"] = "http2"
          open(cfg_path, "w").write(yaml.safe_dump(cfg, default_flow_style=False))
          print(f"ingress-merged: {len(want)} 条，protocol=http2")
          PYEOF
          systemctl restart cloudflared && echo "restarted"
          sleep 20
          # 验证：主域/opencode 回温＋网关入口 200；已下线域名确认不再路由（warn-only，远端 PUT/边缘传播有延迟）
          PASS=1
          # 主域硬门：opencode 必须回温（隧道健康探针；hw21-opencode 已下线）
          for i in $(seq 1 10); do
            CODE="$(curl -s -m 10 -o /dev/null -w '%{http_code}' "https://opencode.xieyucheng.top/" || echo 000)"
            [ "$CODE" = "200" ] && break
            sleep 15
          done
          echo "main-domain opencode -> $CODE"
          [ "$CODE" = "200" ] || PASS=0
          # 网关公网入口硬门：litellm 必须 200（灰云直连 ali-gz Caddy→tailnet→网关；ci-probe key 探活）
          LCODE="000"
          for i in $(seq 1 10); do
            LCODE="$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://litellm.linkseek.net.cn/v1/models -H 'Authorization: Bearer ci-probe' || echo 000)"
            echo "litellm probe#$i -> $LCODE"
            [ "$LCODE" = "200" ] && break
            sleep 15
          done
          echo "gateway-domain litellm -> $LCODE"
          [ "$LCODE" = "200" ] || PASS=0
          # 已下线域名确认（warn-only）：llm-trial 不应再路由到网关。
          # 时序注意：远端 PUT（tunnel-route-register apply=true）应先于本次 dispatch 生效，边缘传播最长数分钟；未收敛只警告，不断言失败。
          for i in $(seq 1 6); do
            TCODE="$(curl -s -m 10 -o /dev/null -w '%{http_code}' https://llm-trial.xieyucheng.top/v1/models || echo 000)"
            echo "retired-domain probe#$i -> $TCODE"
            [ "$TCODE" = "401" ] && { echo "WARN: llm-trial 仍在路由（远端 PUT/边缘未收敛或 DNS 未删）"; sleep 15; continue; }
            TBODY="$(curl -s -m 10 https://llm-trial.xieyucheng.top/v1/models || echo CURLFAIL)"
            echo "$TBODY" | grep -q '"data"' && { echo "WARN: llm-trial 仍透出模型列表（远端未收敛）"; sleep 15; continue; }
            echo "RETIRED OK: llm-trial 已不再路由（$TCODE）"; break
          done
          ODCODE="$(curl -s -m 10 -o /dev/null -w '%{http_code}' "https://opendesign.xieyucheng.top/" || echo 000)"
          echo "old-domain opendesign -> $ODCODE (warn-only, 旧疾另修)" 
          if [ "$PASS" = "1" ]; then
            echo "VERIFY OK"
          else
            echo "VERIFY FAIL: 恢复备份再 restart"
            LATEST="$(ls -t $CFG.prev-* | head -n1)"
            cp "$LATEST" "$CFG" && systemctl restart cloudflared && echo "rolled-back"
            exit 1
          fi
          rm -f /tmp/ci-tunnel-ingress.yaml /tmp/ci-tunnel-expect.txt
          APPLY_EOF
