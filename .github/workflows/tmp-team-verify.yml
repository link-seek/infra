name: tmp-team-verify
# 一次性只读：team 双 pod 重启＋Secret 落地＋域名。用完即删。
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmp-team-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 标准进网＋组 kubeconfig
        id: net
        uses: ./.github/actions/runner-net
        with:
          ts_api_key: ${{ secrets.TS_API_KEY }}
          kube_ca_data: ${{ secrets.CI_KUBE_CA }}
          kube_token: ${{ secrets.CI_KUBE_TOKEN }}
      - name: 只读验收
        env:
          KUBECONFIG: ${{ steps.net.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          echo "== Secret 注解（Flux 已下发即有） =="
          kubectl -n opencode-team get secret opencode-team-env -o json | python3 -c "import json,sys; d=json.load(sys.stdin); print('annotations=%r' % d['metadata'].get('annotations')); print('keys=%s' % sorted(d['data'].keys()))"
          kubectl -n opencode-team get secret browserless-env -o json | python3 -c "import json,sys; d=json.load(sys.stdin); print('annotations=%r' % d['metadata'].get('annotations')); print('keys=%s' % sorted(d['data'].keys()))"
          echo "== 双 pod（startTime 应为本次切换之后） =="
          kubectl -n opencode-team get pods -o jsonpath='{range .items[*]}{.metadata.name} ready={.status.conditions[?(@.type=="Ready")].status} start={.status.startTime}{"\n"}{end}'
          echo "== 域名 =="
          for i in 1 2 3; do curl -sS -m 15 -o /dev/null -w "try$i http=%{http_code}\n" https://team-agent.xieyucheng.top/; sleep 2; done
          echo TEAM-VERIFY-DONE
