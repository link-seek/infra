name: cf-mint-wrangler（按需签 wrangler 月抛 key）

# 常驻按需按钮，不自动续。owner/机器人在 key 到期或有人喊时手动 dispatch。
# 用 CF_PARENT_TOKEN 现场签 short-TTL 子 key（DNS Read + Zone Read，只读 DNS/zone），
# 写入 org secret PROD_CLOUDFLARE_API_TOKEN（容器 wrangler 用），旧值在控制台废掉。
# 铁律：parent 与子 key 的值不落盘、不回显；日志只出 status / count / id 前缀。
# 子 key 是正式 30 天 key（非测试），不删除；到期没人喊=没人用，直接销号。

on:
  workflow_dispatch:
    inputs:
      ttl_days:
        description: "子 key 有效天数（默认 30）"
        required: false
        default: "30"
      reason:
        description: "签发原因（必填非空）"
        required: true

concurrency:
  group: cf-mint-wrangler
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CF_PARENT_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
      AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
    steps:
      - name: 校验输入 + Mask parent
        env:
          TTL_DAYS: ${{ inputs.ttl_days }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          echo "$TTL_DAYS" | grep -Eq '^[0-9]{1,3}$' || { echo "FAIL: ttl_days 非法"; exit 1; }
          [ "$TTL_DAYS" -ge 1 ] && [ "$TTL_DAYS" -le 90 ] || { echo "FAIL: ttl_days 只许 1-90"; exit 1; }
          [ -n "${REASON//[[:space:]]/}" ] || { echo "FAIL: reason 必填"; exit 1; }
          TOKEN="$(printf '%s' "${CF_PARENT_TOKEN:-}" | tr -d '\r\n ')"
          echo "::add-mask::$TOKEN"
          [ -n "$TOKEN" ] || { echo "PARENT_TOKEN_MISSING"; exit 1; }
          [ -n "${AGENT_GITHUB_TOKEN//[[:space:]]/}" ] || { echo "FAIL: AGENT_GITHUB_TOKEN 未注入（写 secret 用）"; exit 1; }
          echo "parent_token_present=true ttl_days=$TTL_DAYS"

      - name: 签发子 key + 自验 + 写 secret
        env:
          TTL_DAYS: ${{ inputs.ttl_days }}
          REASON: ${{ inputs.reason }}
          ACCOUNT_ID: 47ce24ced58f17c9fb15351adcbe67d4
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "${CF_PARENT_TOKEN:-}" | tr -d '\r\n ')"
          CF_PARENT_TOKEN_SANITIZED="$TOKEN" ACCOUNT_ID_FIXED="${ACCOUNT_ID:?}" TTL_DAYS_FIXED="${TTL_DAYS:?}" python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          BASE = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ["CF_PARENT_TOKEN_SANITIZED"]
          ACCOUNT_ID = os.environ["ACCOUNT_ID_FIXED"]
          TTL_DAYS = int(os.environ["TTL_DAYS_FIXED"])


          def call(token, method, path, body=None):
              headers = {"Authorization": "Bearer " + token}
              data = None
              if body is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(body).encode()
              req = urllib.request.Request(
                  BASE + path, data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  try:
                      return exc.code, json.loads(exc.read() or b"{}")
                  except Exception:
                      return exc.code, {}
              except Exception as exc:
                  return 0, {"success": False, "errors": [{"code": type(exc).__name__}]}


          def brief(resp):
              errs = resp.get("errors") or []
              return "" if not errs else " code=%s" % ((errs[0] or {}).get("code", "?"),)


          # 1. 取 group ID（parent 已验证可列；列不出则用文档公开 ID）
          st, r = call(
              TOKEN, "GET",
              "/accounts/%s/tokens/permission_groups?per_page=50" % ACCOUNT_ID,
          )
          groups = r.get("result") if isinstance(r.get("result"), list) else []
          by_name = {str(g.get("name", "")).lower(): str(g.get("id") or "") for g in groups}
          dns_id = by_name.get("dns read", "c8fed203ed3043cba015a93ad1616f1f")
          zone_id = by_name.get("zone read", "82e64a83756745bbbb1c9c2701bf816b")
          print("permission_groups status=%s count=%d%s" % (st, len(groups), brief(r)))

          # 2. 签发（account-owned，账号下全 zone 通配只读，TTL 见输入）
          expires = (datetime.now(timezone.utc) + timedelta(days=TTL_DAYS)).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )
          st, r = call(
              TOKEN, "POST", "/accounts/%s/tokens" % ACCOUNT_ID,
              {
                  "name": "wrangler-monthly-%s" % datetime.now(timezone.utc).strftime("%Y%m%d"),
                  "policies": [
                      {
                          "effect": "allow",
                          "resources": {
                              ("com.cloudflare.api.account.%s" % ACCOUNT_ID): {
                                  "com.cloudflare.api.account.zone.*": "*"
                              }
                          },
                          "permission_groups": [{"id": dns_id}, {"id": zone_id}],
                      }
                  ],
                  "expires_on": expires,
              },
          )
          if not r.get("success"):
              print("FAIL: sign status=%s%s" % (st, brief(r)))
              raise SystemExit(1)
          child_id = str((r.get("result") or {}).get("id") or "")
          child_value = str((r.get("result") or {}).get("value") or "")
          if not child_id or not child_value:
              print("FAIL: sign 返回缺 id/value")
              raise SystemExit(1)
          print("sign status=%s child_id_prefix=%s expires=%s" % (st, child_id[:8], expires))
          print("::add-mask::%s" % child_value)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("child_id=%s\n" % child_id)

          # 3. 自验：子 key 读 /zones（Zone Read 应 200）
          st, r = call(child_value, "GET", "/zones?per_page=1")
          if st != 200 or not r.get("success"):
              print("FAIL: child 自验 status=%s%s" % (st, brief(r)))
              raise SystemExit(1)
          print("child self-check status=200 OK")

          # 4. 落盘给下一步（值已 mask，输出显示为 ***）
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("CHILD_VALUE=%s\n" % child_value)
          PY

      - name: 更新 org secret（PROD_CLOUDFLARE_API_TOKEN）
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${CHILD_VALUE:-}" ] || { echo "FAIL: 上一步没产出子 key"; exit 1; }
          printf '%s' "$CHILD_VALUE" | gh secret set PROD_CLOUDFLARE_API_TOKEN --org link-seek --body - \
            || { echo "FAIL: org secret 写入失败（AGENT_GITHUB_TOKEN 缺 admin:org？改 owner 手填）"; exit 1; }
          echo "secret updated: PROD_CLOUDFLARE_API_TOKEN（旧值请在控制台废掉）"
          echo "下一步：批量发生产时生效；发完验证容器内 wrangler 可用"
