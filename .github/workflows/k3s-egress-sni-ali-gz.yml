name: k3s-egress-sni-ali-gz
# 广州 mesh-ali-gz 薄触发层：只 preset 参数，逻辑全在 _sni-egress-node。
# 与东京两条（tokyo-vm-proxy / tokyo-edge）完全独立：文件、deploy、verify 各自点火，互不触发。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy=下发+验证；verify=只验广州中继"
        required: false
        default: "deploy"
        type: choice
        options: [deploy, verify]

concurrency:
  group: k3s-egress-sni-ali-gz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  node:
    uses: ./.github/workflows/_sni-egress-node.yml
    with:
      node_hostname: mesh-ali-gz
      ds_file: k8s/egress/daemonset-ali-gz.yaml
      ds_name: sni-egress-ali-gz
      mode: ${{ inputs.mode || 'deploy' }}
    secrets: inherit
