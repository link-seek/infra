name: swr-probe
# 一次性：验证 SWR_LOGIN_USER/PASS 是否有效（只读 inspect，不写 tag）。用完即删。
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: login + inspect（只读）
        env:
          SWR_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        run: |
          set -euo pipefail
          [ -n "${SWR_USER:-}" ] && [ -n "${SWR_PASS:-}" ] || { echo "FAIL: secrets 缺"; exit 1; }
          echo "$SWR_PASS" | docker login swr.cn-north-9.myhuaweicloud.com -u "$SWR_USER" --password-stdin
          echo LOGIN-OK
          docker buildx imagetools inspect swr.cn-north-9.myhuaweicloud.com/linkseed/opencode-tools:stable 2>&1 | head -8
          echo INSPECT-OK
