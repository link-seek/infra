---
# 只读基线巡检：采集主机现状用于漂移对账。
# 所有 command 任务 check_mode: false（--check 下也执行，因为只读 command 不改系统），
# changed_when: false（永不报 changed）。不写任何文件、不改服务。
- name: host baseline (read-only)
  hosts: all
  gather_facts: true
  ignore_unreachable: true
  tasks:
    - name: /data 挂载（源/类型/大小）
      ansible.builtin.command: findmnt -no SOURCE,FSTYPE,SIZE /data
      register: data_mnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: k3s 版本
      ansible.builtin.command: k3s --version
      register: k3s_ver
      changed_when: false
      failed_when: false
      check_mode: false

    - name: k3s systemd 单元状态（server 或 agent）
      ansible.builtin.shell: |
        for u in k3s k3s-agent; do
          if systemctl cat "$u" >/dev/null 2>&1; then
            echo "$u enabled=$(systemctl is-enabled "$u" 2>/dev/null) active=$(systemctl is-active "$u" 2>/dev/null)"
          fi
        done
      register: k3s_unit
      changed_when: false
      failed_when: false
      check_mode: false

    - name: 关键配置文件是否存在
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/rancher/k3s/config.yaml
        - /etc/cloudflared/config.yml
        - /etc/resolv.conf
      register: cfg_stat

    - name: tailscale 状态（若装）
      ansible.builtin.command: tailscale status --self=false --peers=false
      register: ts_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: 磁盘占用（根与 /data）
      ansible.builtin.command: df -h /
      register: df_root
      changed_when: false
      failed_when: false
      check_mode: false

    - name: /data 磁盘占用（有才采）
      ansible.builtin.command: df -h /data
      register: df_data
      changed_when: false
      failed_when: false
      check_mode: false

    - name: 报告配置文件存在性
      ansible.builtin.debug:
        msg: "{{ item.item }} exists={{ item.stat.exists | default(false) }}"
      loop: "{{ cfg_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: 报告
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution | default('?') }} {{ ansible_distribution_version | default('') }}"
          kernel: "{{ ansible_kernel | default('?') }}"
          data_mount: "{{ data_mnt.stdout | default('') | trim }}"
          k3s_version: "{{ (k3s_ver.stdout_lines | default([]) | first) | default('NONE') }}"
          k3s_unit: "{{ k3s_unit.stdout | default('') | trim }}"
          tailscale_ok: "{{ (ts_status.rc | default(1)) == 0 }}"
          root_disk: "{{ df_root.stdout_lines | default([]) }}"
          data_disk: "{{ df_data.stdout_lines | default([]) }}"
