# Kamal spike v1:只验证 net-ssh(TSSH)通道 + SWR 登录, hypotheses in #277.
# Zero deploy. Runner self-target via Tailscale SSH (no keys).
service: cfos-spike
image: cfos-spike
servers:
  - SERVER_PLACEHOLDER

# Tailscale SSH 经 tailscaled 管道，不依赖 22 端口劫持、不需要 key。
# runner 等临时节点劫持常不生效，此路最稳（tailscale 官方描述的用法）。
ssh:
  proxy_command: "tailscale nc %h %p"

registry:
  server: swr.cn-north-9.myhuaweicloud.com
  username:
    - KAMAL_REGISTRY_USER
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch:
    - amd64
  dockerfile: kamal/cfos-spike/Dockerfile.cfos-spike
  dockerfile: Dockerfile.cfos-spike

# run-local 要 PIPELINE_MANAGED；远端 binding 要 CF token（secret 经 .kamal/secrets）。
env:
  clear:
    PIPELINE_MANAGED: "true"
  secret:
    - CLOUDFLARE_API_TOKEN

# run-local 冷启动数分钟，健康检查按 8788 转发口打。
healthcheck:
  path: /
  port: 8788
  interval: 15
  timeout: 10
  attempts: 40
