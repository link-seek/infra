# 代理钉节点 A（41）：与 ha-b 各守一台，单节点挂了不断流。
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: ha-a
spec:
  statefulSet:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [ecs-ies-euleros-jmupervm-xieyucheng-langfuse-33b4]
