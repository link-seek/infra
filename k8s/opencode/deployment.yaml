# k8s/opencode 主 Deployment（翻译自 stacks/opencode/hw41/compose.yml）。
# digest pin 即行为版本（tools bb7c1087…/chrome 4ffc5390…，与 HW41 现跑一致）。
# resources 是 HW41 事故教训的硬化（limits 必填）：.69 为 4C15G。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本+本地卷：滚动无意义，重建即切换（切流由 Caddy 做）。
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      imagePullSecrets:
        - name: swr-pull
      initContainers:
        - name: init-dirs
          image: swr.cn-north-9.myhuaweicloud.com/linkseed/opencode-tools@sha256:bb7c1087742175ba93df3745e748cfef852de3879de98140bdc05d845038da01
          command: [sh, -c, "mkdir -p /workspace /root/.local/share/opencode && chown -R root:root /workspace /root/.local/share/opencode || true"]
          volumeMounts:
            - {name: prod-work, mountPath: /workspace}
            - {name: prod-data, mountPath: /root/.local/share/opencode}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: opencode
          image: swr.cn-north-9.myhuaweicloud.com/linkseed/opencode-tools@sha256:bb7c1087742175ba93df3745e748cfef852de3879de98140bdc05d845038da01
          command: ["/bin/sh", "/entrypoint/entrypoint.sh"]
          args: ["serve", "--port", "4097", "--hostname", "0.0.0.0"]
          ports:
            - {name: http, containerPort: 4097}
          env:
            - {name: PIPELINE_MANAGED, value: "true"}
            - {name: TS_HOSTNAME, value: opencode-k3s}
            # 网关=HW41 式直连 HW21 宿主 :4000（公网域名后端身份不存在，#181 欠账，今天不动）。
            # pod 经 TUN 出，需 opencode→.51:4000 grant（policy 内）。
            - {name: LITELLM_BASE_URL, value: "http://100.91.222.51:4000"}
            - {name: SSH_TARGETS, value: "mesh-hw-21 mesh-hw-41"}
            - {name: SMTP_HOST, value: smtp.163.com}
            - {name: SMTP_PORT, value: "465"}
            - {name: SMTP_USER, value: 122306789@163.com}
            - {name: SMTP_FROM, value: 122306789@163.com}
            - {name: MAIL_DEFAULT_TO, value: xieyucheng@outlook.com}
            - {name: BROWSER_CDP_URL, value: "http://127.0.0.1:9222"}
            - name: LITELLM_API_KEY
              valueFrom: {secretKeyRef: {name: opencode-env, key: LITELLM_API_KEY}}
            - name: GH_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-env, key: GH_TOKEN}}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom: {secretKeyRef: {name: opencode-env, key: OPENCODE_SERVER_PASSWORD}}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-env, key: CLOUDFLARE_API_TOKEN}}
            - name: CF_AI_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-env, key: CF_AI_TOKEN}}
            - name: HCLOUD_AK
              valueFrom: {secretKeyRef: {name: opencode-env, key: HCLOUD_AK}}
            - name: HCLOUD_SK
              valueFrom: {secretKeyRef: {name: opencode-env, key: HCLOUD_SK}}
            - name: TS_JOIN_KEY
              valueFrom: {secretKeyRef: {name: opencode-env, key: TS_JOIN_KEY}}
            - name: SMTP_PASS
              valueFrom: {secretKeyRef: {name: opencode-env, key: SMTP_PASS}}
          volumeMounts:
            - {name: prod-work, mountPath: /workspace}
            - {name: prod-data, mountPath: /root/.local/share/opencode}
            - {name: ts-state, mountPath: /var/lib/tailscale}
            - {name: entrypoint, mountPath: /entrypoint}
            - {name: tun, mountPath: /dev/net/tun}
          # TUN 出网必需（NET_ADMIN + /dev/net/tun）；单租户节点可接受。
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          readinessProbe:
            httpGet: {path: /, port: 4097}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 4097}
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 3000m, memory: 8Gi}
        - name: browser
          image: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/chrome-cjk@sha256:4ffc5390fc0df74b80ca44d688b8e5a26dd5da648afd796a0e9a6a57e3a64a27
          ports:
            - {name: cdp, containerPort: 9222}
          readinessProbe:
            httpGet: {path: /json/version, port: 9222}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: 500m, memory: 2Gi}
      volumes:
        - name: prod-work
          persistentVolumeClaim: {claimName: prod-work}
        - name: prod-data
          persistentVolumeClaim: {claimName: prod-data}
        - name: ts-state
          persistentVolumeClaim: {claimName: ts-state}
        - name: entrypoint
          configMap: {name: opencode-entrypoint, defaultMode: 0755}
        - name: tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode
spec:
  selector: {app: opencode}
  ports:
    - {name: http, port: 4097, targetPort: 4097}
