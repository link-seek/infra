# k8s/opencode entrypoint（由 stacks/opencode/hw41/compose.yml entrypoint 逐行翻译）。
# 差异仅三处（注释标 K8S）：BROWSER 不用管（同 Pod 自带）；TS state 走 emptyDir；
# /old-workspace 不挂（trial 不带）。其余语义与旧线一致（含 PIPELINE_MANAGED 防手滑、
# 已 Running 则跳 up、unset TS_JOIN_KEY）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-entrypoint
  namespace: opencode
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    if [ "${PIPELINE_MANAGED:-}" != "true" ]; then
      echo 'FATAL: .env not pipeline-managed (PIPELINE_MANAGED!=true). Refusing to start.' >&2
      exit 1
    fi
    yes | hcloud configure set --cli-access-key="${HCLOUD_AK}" --cli-secret-key="${HCLOUD_SK}" --cli-region=cn-north-4 >/dev/null 2>&1 || true
    sed -i 's/"agreePrivacy": "false"/"agreePrivacy": "true"/' /root/.hcloud/config.json 2>/dev/null || true
    mkdir -p /var/lib/tailscale /var/run/tailscale
    # TUN 模式（出网必备；userspace 只管进不管出）。需 NET_ADMIN + /dev/net/tun（见 deployment）。
    tailscaled --tun=tailscale0 --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock >/var/log/tailscaled.log 2>&1 &
    i=0
    while [ ! -S /var/run/tailscale/tailscaled.sock ] && [ "$i" -lt 30 ]; do
      i=$((i+1))
      sleep 1
    done
    if [ ! -S /var/run/tailscale/tailscaled.sock ]; then
      echo "FATAL: tailscaled did not start" >&2
      tail -n 50 /var/log/tailscaled.log >&2 || true
      exit 1
    fi
    ts_status="$(tailscale --socket=/var/run/tailscale/tailscaled.sock status --json 2>/dev/null || true)"
    ts_ip="$(tailscale --socket=/var/run/tailscale/tailscaled.sock ip -4 2>/dev/null | head -n 1 || true)"
    if printf '%s' "$ts_status" | grep -q '"BackendState"[[:space:]]*:[[:space:]]*"Running"' && [ -n "$ts_ip" ]; then
      echo "tailscale already Running ($ts_ip), skip up"
    else
      if [ -z "${TS_JOIN_KEY:-}" ]; then
        echo "FATAL: TS_JOIN_KEY missing (rendered by k3s-apply line)." >&2
        exit 1
      fi
      if ! timeout 120 tailscale --socket=/var/run/tailscale/tailscaled.sock up --authkey="$TS_JOIN_KEY" --hostname="${TS_HOSTNAME:-opencode-k3s}" --ssh --accept-routes=false --accept-dns=false; then
        echo "FATAL: tailscale up failed" >&2
        tail -n 50 /var/log/tailscaled.log >&2 || true
        exit 1
      fi
      echo "tailscale up: $(tailscale --socket=/var/run/tailscale/tailscaled.sock ip -4 2>/dev/null || echo no-ip)"
    fi
    unset TS_JOIN_KEY
    if [ ! -d /workspace/.git ]; then
      git init -b main /workspace >/dev/null 2>&1
      git -C /workspace config user.name opencode-prod
      git -C /workspace config user.email opencode-prod@local
      git -C /workspace commit --allow-empty -m init >/dev/null 2>&1
    fi
    exec opencode "$@"
