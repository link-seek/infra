  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: secrets-operator
    app.kubernetes.io/instance: infisical-operator
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
---
# Source: secrets-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-opera-controller-manager
  labels:
    control-plane: controller-manager
    helm.sh/chart: secrets-operator-v0.11.18
    app.kubernetes.io/name: secrets-operator
    app.kubernetes.io/instance: infisical-operator
    app.kubernetes.io/version: "v0.11.18"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: secrets-operator
      app.kubernetes.io/instance: infisical-operator
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: secrets-operator
        app.kubernetes.io/instance: infisical-operator
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: "cluster.local"
        - name: INFISICAL_HOST_API
          value: "https://app.infisical.com/api"
        - name: INFISICAL_LOG_WRITER
          value: "stderr"
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: swr.cn-north-9.myhuaweicloud.com/link-seek/kubernetes-operator:v0.11.18
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: infisical-opera-controller-manager
      imagePullSecrets:
        - name: swr-pull
      terminationGracePeriodSeconds: 10
      nodeSelector: 
        {}
      tolerations: 
        []
