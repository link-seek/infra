# etcd S3 备份钥匙刷新（agency 临时钥匙 → Secret），k3s 原生快照读此 Secret。
# 链路：CronJob（6h）→ metadata 取 24h 钥匙 → PATCH Secret → k3s 定时快照自带走。
# 无 HW21，无宿主机 cron，无落盘钥匙。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-s3-refresher
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etcd-s3-refresher
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["k3s-etcd-snapshot-s3-config"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcd-s3-refresher
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: etcd-s3-refresher
    namespace: kube-system
roleRef:
  kind: Role
  name: etcd-s3-refresher
  apiGroup: rbac.authorization.k8s.io
