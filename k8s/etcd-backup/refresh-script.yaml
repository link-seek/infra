# 刷新脚本：metadata 临时钥匙 → k8s Secret（PATCH，不存在则 POST 创建）。
# 钥匙 24h 有效，CronJob 6h 跑一次；全程内存，不落盘。
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-s3-refresh-script
  namespace: kube-system
data:
  refresh.py: |
    import base64, json, os, ssl, urllib.request

    META = "http://169.254.169.254/openstack/latest/securitykey"
    API = "https://kubernetes.default.svc"
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    SECRET = "k3s-etcd-snapshot-s3-config"
    NS = "kube-system"

    def api(method, path, body=None):
        token = open(os.path.join(SA_DIR, "token")).read().strip()
        ctx = ssl.create_default_context(cafile=os.path.join(SA_DIR, "ca.crt"))
        req = urllib.request.Request(
            API + path,
            data=json.dumps(body).encode() if body is not None else None,
            headers={"Authorization": "Bearer " + token, "Content-Type": "application/merge-patch+json"},
            method=method)
        try:
            with urllib.request.urlopen(req, timeout=15, context=ctx) as r:
                return r.status, r.read()
        except urllib.error.HTTPError as e:
            return e.code, e.read()

    def main():
        import datetime
        md = json.load(urllib.request.urlopen(META, timeout=10))
        c = md.get("credential", md)
        for k in ("access", "secret", "securitytoken"):
            assert c.get(k), "empty temp cred field: " + k
        print("expires_at=" + str(md.get("credential", {}).get("expires_at", "?")))
        strdata = {
            "etcd-s3-endpoint": "obs.cn-north-9.myhuaweicloud.com",
            "etcd-s3-region": "cn-north-9",
            "etcd-s3-bucket": "linkseek-k3s-etcd",
            "etcd-s3-folder": "etcd-auto",
            "etcd-s3-access-key": c["access"],
            "etcd-s3-secret-key": c["secret"],
            "etcd-s3-session-token": c["securitytoken"],
            "etcd-s3-skip-ssl-verify": "false",
            "etcd-s3-insecure": "false",
            "etcd-s3-timeout": "5m",
            "etcd-s3-endpoint-ca": "",
            "etcd-s3-endpoint-ca-name": "",
            "etcd-s3-bucket-lookup-type": "",
            "etcd-s3-proxy": "",
        }
        data = {k: base64.b64encode(v.encode()).decode() for k, v in strdata.items()}
        st, _ = api("GET", f"/api/v1/namespaces/{NS}/secrets/{SECRET}")
        if st == 404:
            body = {"apiVersion": "v1", "kind": "Secret",
                    "metadata": {"name": SECRET, "namespace": NS,
                                 "annotations": {"refreshed-at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")}},
                    "type": "etcd.k3s.cattle.io/s3-config-secret", "data": data}
            st, _ = api("POST", f"/api/v1/namespaces/{NS}/secrets", body)
            assert st in (200, 201), f"create secret failed: {st}"
            print("created secret")
        else:
            assert st == 200, f"get secret failed: {st}"
            st, _ = api("PATCH", f"/api/v1/namespaces/{NS}/secrets/{SECRET}", {
                "metadata": {"annotations": {"refreshed-at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")}},
                "data": data})
            assert st == 200, f"patch secret failed: {st}"
            print("patched secret")
        print("REFRESH-OK")

    main()
