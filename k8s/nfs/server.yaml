# NFS server（自打镜像 docker-images/docker/nfs-server，NFSv4-only，单 export /exports）。
# 用途：nfs-provisioner 的后端；首个消费者是 Omnara memory-data（api/worker/maintenance 共挂 RWX）。
# 钉主节点 hostname：local-path 卷不跟人走，单副本 server 必须和盘在同一台；主节点 16核/62G，20G 盘微不足道。
# edge 节点（东京/广州）靠 dedicated=edge:NoSchedule taint 天然排除，本清单不加任何 edge toleration。
# 备份：/exports 整体定时同步到 OBS（待办，见 README）；节点挂掉=丢自上次备份的增量。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nfs-server
  namespace: nfs
  labels:
    app: nfs-server
spec:
  serviceName: nfs-server
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      imagePullSecrets:
        - name: swr-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [ecs-ies-euleros-jmupervm-xieyucheng]
      containers:
        - name: nfs-server
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/nfs-server@sha256:57fb2cd29d19b4b6b57f11b0c33beac923bfcf42d541e94ef27f029dbfb32a66 # 1.2（挂 nfsd + -N 3；man7 确认 v2 已不支持；bake 45308466007 转正）
          ports:
            - {name: nfs, containerPort: 2049}
          securityContext:
            privileged: true # 内核 nfsd 必需；仅监听 cluster 内网 2049，无公网暴露
          volumeMounts:
            - {name: exports, mountPath: /exports}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 2000m, memory: 2Gi}
  volumeClaimTemplates:
    - metadata:
        name: exports
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: nfs
  labels:
    app: nfs-server
spec:
  # 固定 ClusterIP：kubelet 在宿主机 mount，不认 cluster.local 域名，只能用 IP（上游官方示例也是 IP）。
  # 10.43.200.0/24 经查全段空闲，取 .200；集群 service CIDR 默认 10.43.0.0/16。
  selector:
    app: nfs-server
  ports:
    - {name: nfs, port: 2049}
