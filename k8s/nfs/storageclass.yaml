# StorageClass nfs-omnara：集群内唯一的 RWX 源（local-path 只给 RWO）。
# reclaimPolicy Retain：删 PVC 不删 server 端子目录（Omnara 记忆丢不起；空间满了手动清）。
# 非默认 SC：显式 storageClassName: nfs-omnara 才用得上，不影响现有 local-path 负载。
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-omnara
provisioner: link-seek/nfs-omnara
parameters:
  archiveOnDelete: "false"
reclaimPolicy: Retain
volumeBindingMode: Immediate
# 官方 nfs-subdir-external-provisioner 示例：NFSv4 显式版本，避免客户端协商异常。
mountOptions:
  - nfsvers=4.1
