# Traefik 终态（L2）：在公网入口节点 mesh-ali-gz hostNetwork 直接接管 80/443，宿主 Caddy 退役。
# 证书存静态 PV（hostPath /var/lib/traefik-data，acme.json le-prod）；ACME Cloudflare DNS-01。
# 由 Flux kustomization traefik-edge 从本目录同步。
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      dnsPolicy: ClusterFirstWithHostNet
      # opencode.ai 经东京 SNI 中继出海：hostAliases 指 vm-proxy tailnet IP。
      hostAliases:
        - ip: "100.73.221.121"
          hostnames:
            - "opencode.ai"
    # L2 终态：Traefik 在公网入口节点 hostNetwork 直接接管 80/443，宿主 Caddy 退役。
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: mesh-ali-gz
    # mesh-ali-gz 带污点 dedicated=edge:NoSchedule；并保留 base chart 的 addon/control-plane toleration（列表覆盖语义，需全量列出）。
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: dedicated
        operator: Equal
        value: edge
        effect: NoSchedule
    service:
      spec:
        type: ClusterIP
    ports:
      web:
        port: 80
      websecure:
        port: 443
      traefik:
        port: 18080
    providers:
      kubernetesIngress:
        allowExternalNameServices: true
      kubernetesCRD:
        allowExternalNameServices: true
    # ACME（Cloudflare DNS-01）：production resolver；证书落在持久卷 /data/acme.json。
    certificatesResolvers:
      le-staging:
        acme:
          email: 1223067890@qq.com
          storage: /data/acme-staging.json
          caServer: https://acme-staging-v02.api.letsencrypt.org/directory
          dnsChallenge:
            provider: cloudflare
            delayBeforeCheck: 30s
      le-prod:
        acme:
          email: 1223067890@qq.com
          storage: /data/acme.json
          dnsChallenge:
            provider: cloudflare
            delayBeforeCheck: 30s
    env:
      - name: CLOUDFLARE_DNS_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: acme-cf
            key: CF_DNS_API_TOKEN
            optional: true
    # 证书持久化：用静态 PV（hostPath /var/lib/traefik-data on mesh-ali-gz，已预置 acme.json），
    # 避免 local-path 默认 PVC 的节点亲和把 pod 钉在旧节点、以及重复签发。
    persistence:
      enabled: true
      existingClaim: traefik-data
      path: /data
