# Traefik 期望态声明（阶段一：影子 ClusterIP，不占 80/443，内网验路由）。
# 切流时改 service.spec.type=LoadBalancer + 縮池標籤（另議，不在本文件混）。
# allowExternalNameServices：models 路由直透上游（ExternalName），Ingress 经 PR 评审。
# 由 k3s-server-component workflow 下发到三 server manifests 目录。
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      # opencode.ai 经东京 SNI 中继出海：hostAliases 指 vm-proxy tailnet IP（抄网关作业）。
      # pod 内无 MagicDNS，此处硬编码 IP（与网关同水位；relay 迁移时同步改）。
      hostAliases:
        - ip: "100.73.221.121"
          hostnames:
            - "opencode.ai"
    service:
      spec:
        type: ClusterIP
    providers:
      kubernetesIngress:
        allowExternalNameServices: true
