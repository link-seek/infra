# Traefik 期望态：ClusterIP 影子 verified；ACME 双 resolver（staging→prod）；切流时再加 hostNetwork/钉点。
# 切流时改 service.spec.type=LoadBalancer + 縮池標籤（另議，不在本文件混）。
# allowExternalNameServices：models 路由直透上游（ExternalName），Ingress 经 PR 评审。
# 由 k3s-server-component workflow 下发到三 server manifests 目录。
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      # opencode.ai 经东京 SNI 中继出海：hostAliases 指 vm-proxy tailnet IP（抄网关作业）。
      # pod 内无 MagicDNS，此处硬编码 IP（与网关同水位；relay 迁移时同步改）。
      hostAliases:
        - ip: "100.73.221.121"
          hostnames:
            - "opencode.ai"
    service:
      spec:
        type: ClusterIP
    providers:
      kubernetesIngress:
        allowExternalNameServices: true
      # litellm IngressRoute 后端是 ExternalName（opencode-ai），CRD provider 也要显式放行（与上面同因）。
      kubernetesCRD:
        allowExternalNameServices: true
    # ACME（Cloudflare DNS-01）：staging 先验，production 随后。token 经 SOPS（acme-cf），envFrom optional 保证 secret 未到前 pod 照起。
    certificatesResolvers:
      le-staging:
        acme:
          email: 1223067890@qq.com
          storage: /data/acme-staging.json
          caServer: https://acme-staging-v02.api.letsencrypt.org/directory
          dnsChallenge:
            provider: cloudflare
            delayBeforeCheck: 30s
      le-prod:
        acme:
          email: 1223067890@qq.com
          storage: /data/acme.json
          dnsChallenge:
            provider: cloudflare
            delayBeforeCheck: 30s
    # secret key 叫 CF_DNS_API_TOKEN（90 天轮换时正名为 CLOUDFLARE_DNS_API_TOKEN），此处显式映射到 lego 要的变量名。
    env:
      - name: CLOUDFLARE_DNS_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: acme-cf
            key: CF_DNS_API_TOKEN
            optional: true
    persistence:
      enabled: true
      size: 128Mi
      path: /data
