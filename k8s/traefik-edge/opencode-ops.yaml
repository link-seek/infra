# opencode-ops 公网入口：Host → Aliyun edge(mesh-ali-gz:443) Traefik → tailnet HW21:4097。
# 同款先例见同目录 home-oc.yaml（home PC 的 opencode）。
# 认证：只用应用层 OPENCODE_SERVER_PASSWORD（单层，与 opencode/home-oc 一致）；
#   如需更强门禁，后续上 Cloudflare Access（proxied=true + Zero Trust），不要在 Traefik 再叠一层口令。
apiVersion: v1
kind: Service
metadata:
  name: opencode-ops-backend
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: traefik-edge}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 4097
      targetPort: 4097
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: opencode-ops-backend
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: traefik-edge}
subsets:
  - addresses:
      - ip: 100.100.246.95
    ports:
      - name: http
        port: 4097
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opencode-ops
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: traefik-edge}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`opencode-ops.xieyucheng.top`)
      kind: Rule
      services:
        - name: opencode-ops-backend
          port: 4097
  tls:
    certResolver: le-prod
