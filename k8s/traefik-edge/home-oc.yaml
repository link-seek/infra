apiVersion: v1
kind: Service
metadata:
  name: home-oc-backend
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: traefik-edge}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 4096
      targetPort: 4096
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: home-oc-backend
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: traefik-edge}
subsets:
  - addresses:
      - ip: 100.69.220.112
    ports:
      - name: http
        port: 4096
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-oc
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: traefik-edge}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`home-oc.xieyucheng.top`)
      kind: Rule
      services:
        - name: home-oc-backend
          port: 4096
  tls:
    certResolver: le-prod
