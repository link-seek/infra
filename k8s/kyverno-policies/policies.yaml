# Kyverno v1.20 起移除 legacy kyverno.io/v1 ClusterPolicy，改用 policies.kyverno.io/v1 ValidatingPolicy（CEL）。
# validationActions: Deny = Enforce；作用域=受管 app 命名空间。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: managed-namespaces
      expression: "object.metadata.namespace in ['opencode-team','opencode-xieyucheng','opencode-yingxin','litellm','erpnext','cognee-trial','nfs','reloader']"
  validations:
    - expression: "object.spec.containers.all(c, !c.image.endsWith(':latest'))"
      message: "禁止 :latest，必须固定版本或 digest"
    - expression: "!has(object.spec.initContainers) || object.spec.initContainers.all(c, !c.image.endsWith(':latest'))"
      message: "initContainers 禁止 :latest"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-registry-swr
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: managed-namespaces
      expression: "object.metadata.namespace in ['opencode-team','opencode-xieyucheng','opencode-yingxin','litellm','erpnext','cognee-trial','nfs','reloader']"
  validations:
    - expression: "object.spec.containers.all(c, c.image.startsWith('swr.cn-north-9.myhuaweicloud.com/'))"
      message: "镜像必须来自 swr.cn-north-9.myhuaweicloud.com"
    - expression: "!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.startsWith('swr.cn-north-9.myhuaweicloud.com/'))"
      message: "initContainers 镜像必须来自 SWR"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: managed-namespaces
      expression: "object.metadata.namespace in ['opencode-team','opencode-xieyucheng','opencode-yingxin','litellm','erpnext','cognee-trial','nfs','reloader']"
  validations:
    - expression: "object.spec.containers.all(c, c.image.contains('@sha256:'))"
      message: "镜像必须 @sha256 digest pin"
    - expression: "!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.contains('@sha256:'))"
      message: "initContainers 镜像必须 @sha256 digest pin"
