apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow :latest
    policies.kyverno.io/description: "#317 item7：受管 app 命名空间禁止 :latest，必须固定版本/digest。"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-latest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [opencode-team, opencode-xieyucheng, opencode-yingxin, litellm, erpnext, cognee-trial, nfs, reloader]
      validate:
        cel:
          expressions:
            - expression: "object.spec.containers.all(c, !c.image.endsWith(':latest'))"
              message: "禁止 :latest，必须固定版本或 digest"
            - expression: "!has(object.spec.initContainers) || object.spec.initContainers.all(c, !c.image.endsWith(':latest'))"
              message: "initContainers 禁止 :latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-registry-swr
  annotations:
    policies.kyverno.io/title: SWR-only
    policies.kyverno.io/description: "#317 item7：受管 app 命名空间镜像必须来自 SWR。"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: swr-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [opencode-team, opencode-xieyucheng, opencode-yingxin, litellm, erpnext, cognee-trial, nfs, reloader]
      validate:
        cel:
          expressions:
            - expression: "object.spec.containers.all(c, c.image.startsWith('swr.cn-north-9.myhuaweicloud.com/'))"
              message: "镜像必须来自 swr.cn-north-9.myhuaweicloud.com"
            - expression: "!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.startsWith('swr.cn-north-9.myhuaweicloud.com/'))"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Digest-pinned
    policies.kyverno.io/description: "#317 item7：受管 app 命名空间镜像必须 @sha256 digest pin。"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-digest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [opencode-team, opencode-xieyucheng, opencode-yingxin, litellm, erpnext, cognee-trial, nfs, reloader]
      validate:
        cel:
          expressions:
            - expression: "object.spec.containers.all(c, c.image.contains('@sha256:'))"
              message: "镜像必须 @sha256 digest pin"
            - expression: "!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.contains('@sha256:'))"
