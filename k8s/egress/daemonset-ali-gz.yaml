# SNI 出海中转（hostNetwork DaemonSet，钉 mesh-ali-gz，广州出）。
# 与 daemonset.yaml（vm-proxy/东京）同模同 conf，只差两处：
# node 钉 mesh-ali-gz；镜像走 SWR 常驻（广州直拉 docker.io 不通，见 edge-images-seed）。
# 两边独立滚动，互不影响（2026-11-17 合并滚动曾拖垮东京中继，教训）。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sni-egress-ali-gz
  namespace: egress
  labels:
    app: sni-egress-ali-gz
spec:
  selector:
    matchLabels:
      app: sni-egress-ali-gz
  template:
    metadata:
      labels:
        app: sni-egress-ali-gz
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: mesh-ali-gz
      tolerations:
        - key: dedicated
          operator: Equal
          value: edge
          effect: NoSchedule
      initContainers:
        - name: conf-test
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/edge-nginx-relay@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-t", "-c", "/etc/nginx/nginx.conf"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      containers:
        - name: relay
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/edge-nginx-relay@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 14443
              hostPort: 14443
              protocol: TCP
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: conf
          configMap:
            name: sni-egress-conf
            defaultMode: 0444
