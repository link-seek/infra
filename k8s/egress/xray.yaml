# xray：REALITY/VLESS 多出口代理，运行在 k3s（hostNetwork+privileged，钉 vm-proxy）。
# 2026-11-22 从 vm-proxy host systemd 迁入。配置含 UUID/私钥：不入 git，用集群内 egress/xray-config Secret。
#
# ⚠️ 两个迁移血泪点（勿改）：
# 1) 镜像版本必须锁定 26.3.27（= 主机现网原版）。曾用 latest(26.11.9) → REALITY 握手失败、手机 TLS handshake timeout。
# 2) dnsPolicy 必须 Default（= 节点自身 resolv.conf/systemd-resolved）。用 ClusterFirstWithHostNet 会走集群 DNS，
#    实测把部分域名（如 www.gstatic.com）解析成错误/污染 IP（北京 114.250.x），导致隧道出口 dial 死连、握手后卡超时。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray
  namespace: egress
  labels:
    app: xray
spec:
  replicas: 1
  # hostNetwork 绑节点 443 等端口：必须 Recreate，避免滚动时端口冲突卡 Pending。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xray
  template:
    metadata:
      labels:
        app: xray
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: vm-proxy
      tolerations:
        - key: dedicated
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: xray
          image: ghcr.io/xtls/xray-core@sha256:592ec4d11f656db95598d01e76dbcc6e002d67360b96a5436500a938230f52c7
          # 显式指定配置文件，避免叠加镜像内置默认配置。
          args: ["run", "-c", "/config/config.json"]
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: cfg
              mountPath: /config
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          # xray 启动要加载 geoip/geosite(~15s) 后才监听端口，就绪探针给足时间。
          readinessProbe:
            tcpSocket: {port: 443}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: cfg
          secret:
            secretName: xray-config
