# SNI 路由表：只放行 opencode.ai，其余 SNI 直接断（allowlist 即访问控制）。
# 日志带 SNI，可审计谁走了东京。
apiVersion: v1
kind: ConfigMap
metadata:
  name: sni-egress-conf
  namespace: egress
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr info;
    events { worker_connections 512; }
    stream {
      log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name up=$upstream_addr bytes=$bytes_sent/$bytes_received time=$session_time';
      access_log /dev/stdout sni;
      resolver 119.29.29.29 8.8.8.8 valid=60s;
      resolver_timeout 5s;
      map $ssl_preread_server_name $upstream {
        opencode.ai opencode.ai:443;
        default "";
      }
      server {
        listen 8443;
        ssl_preread on;
        proxy_pass $upstream;
        proxy_connect_timeout 5s;
      }
    }
