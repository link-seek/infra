# SNI 出海中转（hostNetwork DaemonSet，钉边缘节点）。
# 为什么不用普通 Deployment：edge agent 的 pod 网络是断的（flannel 到不了 edge）；
# hostNetwork 绕开 flannel，直走宿主机出海（东京 IP）。TLS 端到端透传，不解密。
# 调度按 dedicated=edge label 走：vm-proxy / mesh-ali-gz 及未来 edge agent 自动覆盖，不再逐机写 hostname。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sni-egress
  namespace: egress
  labels:
    app: sni-egress
spec:
  selector:
    matchLabels:
      app: sni-egress
  template:
    metadata:
      labels:
        app: sni-egress
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dedicated
                    operator: In
                    values: [edge]
      tolerations:
        - key: dedicated
          operator: Equal
          value: edge
          effect: NoSchedule
      initContainers:
        - name: conf-test
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/edge-nginx-relay@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-t", "-c", "/etc/nginx/nginx.conf"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      containers:
        - name: relay
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/edge-nginx-relay@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 14443
              hostPort: 14443
              protocol: TCP
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: conf
          configMap:
            name: sni-egress-conf
            defaultMode: 0444
