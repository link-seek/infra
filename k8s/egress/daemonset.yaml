# SNI 出海中转（hostNetwork DaemonSet，钉边缘节点）。
# 为什么不用普通 Deployment：edge agent 的 pod 网络是断的（flannel 到不了 edge）；
# hostNetwork 绕开 flannel，直走宿主机出海（东京 IP）。TLS 端到端透传，不解密。
# 未来阿里节点：同一 DaemonSet 用 nodeAffinity 再加 selector 即可横向扩展。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sni-egress
  namespace: egress
  labels:
    app: sni-egress
spec:
  selector:
    matchLabels:
      app: sni-egress
  template:
    metadata:
      labels:
        app: sni-egress
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: vm-proxy
      tolerations:
        - key: dedicated
          operator: Equal
          value: edge
          effect: NoSchedule
      initContainers:
        - name: conf-test
          image: docker.io/library/nginx@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-t", "-c", "/etc/nginx/nginx.conf"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      containers:
        - name: relay
          image: docker.io/library/nginx@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: conf
          configMap:
            name: sni-egress-conf
            defaultMode: 0444
