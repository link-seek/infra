# SNI 出海中转（hostNetwork DaemonSet，钉 mesh-oci-edge，东京第二节点）。
# 与 daemonset.yaml（vm-proxy/东京首节点）同模同 conf，只差 nodeSelector＋对象名；
# 两对象独立滚动，互不影响（2026-11-17 合并滚动曾拖垮东京中继，教训）。
# 东京直拉 docker.io 最快，不跟 SWR。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sni-egress-tokyo-edge
  namespace: egress
  labels:
    app: sni-egress-tokyo-edge
spec:
  selector:
    matchLabels:
      app: sni-egress-tokyo-edge
  template:
    metadata:
      labels:
        app: sni-egress-tokyo-edge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: mesh-oci-edge
      tolerations:
        - key: dedicated
          operator: Equal
          value: edge
          effect: NoSchedule
      initContainers:
        - name: conf-test
          image: docker.io/library/nginx@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-t", "-c", "/etc/nginx/nginx.conf"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      containers:
        - name: relay
          image: docker.io/library/nginx@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 14443
              hostPort: 14443
              protocol: TCP
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: conf
          configMap:
            name: sni-egress-conf
            defaultMode: 0444
