# 长效 token 骨架（type kubernetes.io/service-account-token，k8s 自动填 token，不进仓）。
# 取 token：kubectl -n omnara-machines get secret omnara-machines-token -o jsonpath='{.data.token}' | base64 -d
# 存到 Omnara 侧 org secret；连接检查报过期/非法见 provider 文档页。
apiVersion: v1
kind: Secret
metadata:
  name: omnara-machines-token
  namespace: omnara-machines
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/name: omnara-machines
  annotations:
    kubernetes.io/service-account.name: omnara-machines
type: kubernetes.io/service-account-token
