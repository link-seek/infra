apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: opencode-yingxin-secrets, namespace: opencode-yingxin}
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080/api
  syncConfig: {resyncInterval: 30s, instantUpdates: false}
  authentication:
    universalAuth:
      credentialsRef: {secretName: opencode-yingxin-ua, secretNamespace: opencode-yingxin}
      secretsScope: {projectSlug: opencode-yingxin, envSlug: prod, secretsPath: /, recursive: false}
  managedSecretReference: {secretName: opencode-yingxin-env, secretNamespace: opencode-yingxin, creationPolicy: Orphan}
