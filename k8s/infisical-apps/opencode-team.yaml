apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: opencode-team-secrets, namespace: opencode-team}
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080/api
  syncConfig: {resyncInterval: 30s, instantUpdates: false}
  authentication:
    universalAuth:
      credentialsRef: {secretName: opencode-team-ua, secretNamespace: opencode-team}
      secretsScope: {projectSlug: opencode-team, envSlug: prod, secretsPath: /, recursive: false}
  managedSecretReference: {secretName: opencode-team-env, secretNamespace: opencode-team, creationPolicy: Orphan}
