apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: traefik-edge-secrets, namespace: kube-system}
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080/api
  syncConfig: {resyncInterval: 30s, instantUpdates: false}
  authentication:
    universalAuth:
      credentialsRef: {secretName: traefik-ua, secretNamespace: kube-system}
      secretsScope: {projectSlug: traefik-edge, envSlug: prod, secretsPath: /, recursive: false}
  managedSecretReference: {secretName: acme-cf, secretNamespace: kube-system, creationPolicy: Orphan}
