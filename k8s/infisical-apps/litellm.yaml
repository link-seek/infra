apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata: {name: litellm-secrets, namespace: litellm}
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080/api
  syncConfig: {resyncInterval: 30s, instantUpdates: false}
  authentication:
    universalAuth:
      credentialsRef: {secretName: litellm-ua, secretNamespace: litellm}
      secretsScope: {projectSlug: litellm, envSlug: prod, secretsPath: /, recursive: false}
  managedSecretReference: {secretName: litellm-env, secretNamespace: litellm, creationPolicy: Orphan}
