# reloader Deployment（Secret 变更自动 rollout）。
# 镜像 digest pin 即版本（bake-reloader run 44236180947 转正，tag 1.4.24）。
# resources limits 必填（HW41 事故教训）；swr-pull 随集群 bootstrap 建。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader
  namespace: reloader
  labels:
    app: reloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reloader
  template:
    metadata:
      labels:
        app: reloader
    spec:
      serviceAccountName: reloader
      imagePullSecrets:
        - name: swr-pull
      containers:
        - name: reloader
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/reloader@sha256:5d43f4892d43fbc6fcce46584dabace3abe178f51d4b48c23e374c7e2a5098eb # v1.4.24
          args:
            - --reload-strategy=annotations
            - --log-level=info
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
