# reloader Deployment（SOPS 终局自动 rollout）。
# 镜像 digest pin 即版本（bake-reloader 转正 digest 回填，此处先 tag 占位，合前必 pin）。
# resources limits 必填（HW41 事故教训）；swr-pull 由 sops-age bootstrap workflow 同建。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader
  namespace: reloader
  labels:
    app: reloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reloader
  template:
    metadata:
      labels:
        app: reloader
    spec:
      serviceAccountName: reloader
      imagePullSecrets:
        - name: swr-pull
      containers:
        - name: reloader
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/reloader:v1.4.24 # TODO: bake 转正后 pin digest
          args:
            - --reload-strategy=annotations
            - --log-level=info
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
