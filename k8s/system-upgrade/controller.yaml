# system-upgrade-controller 控制面（SA + ConfigMap + Deployment）。
# 镜像走 SWR（需先 img-to-swr 镜像，见同目录 README.md）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: system-upgrade
  namespace: system-upgrade
imagePullSecrets:
  - name: swr-pull   # SWR 私有仓凭据（与其它 ns 同源；AK/SK 过期时走 registry 凭据）
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-controller-env
  namespace: system-upgrade
data:
  SYSTEM_UPGRADE_CONTROLLER_DEBUG: 'false'
  SYSTEM_UPGRADE_CONTROLLER_THREADS: '2'
  SYSTEM_UPGRADE_CONTROLLER_LEADER_ELECT: 'true'
  SYSTEM_UPGRADE_JOB_ACTIVE_DEADLINE_SECONDS: '900'
  SYSTEM_UPGRADE_JOB_BACKOFF_LIMIT: '99'
  SYSTEM_UPGRADE_JOB_IMAGE_PULL_POLICY: Always
  SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE: swr.cn-north-9.myhuaweicloud.com/link-seek/kubectl:v1.30.3
  SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE_WINDOWS: ''
  SYSTEM_UPGRADE_JOB_PRIVILEGED: 'true'
  SYSTEM_UPGRADE_JOB_TTL_SECONDS_AFTER_FINISH: '900'
  SYSTEM_UPGRADE_PLAN_POLLING_INTERVAL: 15m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-upgrade-controller
  namespace: system-upgrade
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      upgrade.cattle.io/controller: system-upgrade-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: system-upgrade-controller
        upgrade.cattle.io/controller: system-upgrade-controller
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - system-upgrade-controller
      serviceAccountName: system-upgrade
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/controlplane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/etcd
        operator: Exists
        effect: NoExecute
      containers:
      - name: system-upgrade-controller
        image: swr.cn-north-9.myhuaweicloud.com/link-seek/system-upgrade-controller:v0.20.1
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: default-controller-env
        env:
        - name: SYSTEM_UPGRADE_CONTROLLER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['upgrade.cattle.io/controller']
        - name: SYSTEM_UPGRADE_CONTROLLER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SYSTEM_UPGRADE_CONTROLLER_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: etc-ssl
          mountPath: /etc/ssl
          readOnly: true
        - name: etc-pki
          mountPath: /etc/pki
          readOnly: true
        - name: etc-ca-certificates
          mountPath: /etc/ca-certificates
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: etc-ssl
        hostPath:
          path: /etc/ssl
          type: DirectoryOrCreate
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: DirectoryOrCreate
      - name: etc-ca-certificates
        hostPath:
          path: /etc/ca-certificates
          type: DirectoryOrCreate
      - name: tmp
        emptyDir: {}
