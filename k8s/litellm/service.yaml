# litellm 网关的簇内入口（之前只靠 pod 自带 tailnet 身份对外服务，无 Service）。
# yingxin opencode 经此直连网关：http://litellm-gateway.litellm:4000
apiVersion: v1
kind: Service
metadata:
  name: litellm-gateway
  namespace: litellm
  labels:
    app: litellm-gateway
spec:
  selector:
    app: litellm-gateway
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
