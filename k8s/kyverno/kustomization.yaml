apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - install.yaml
# 镜像为 SWR 私有 → Kyverno ns 需 swr-pull（见 README）。
patches:
  - target:
      kind: Deployment
      namespace: kyverno
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: swr-pull
